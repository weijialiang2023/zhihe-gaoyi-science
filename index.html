tyTier":"exam","examStyle":"2020 · （新课标ⅲ） · 高考真题","stem":"对于下列实验，能正确描述其反应的离子方程式是（）","options":[{"key":"A","text":"用 Na₂ SO₃ 溶液吸收少量 Cl₂: 3 SO₃ ⁻+Cl₂+H₂ O=2 HSO₃ ⁻+2 Cl⁻+SO₄ ²"},{"key":"B","text":"向 CaCl₂ 溶液中通人 CO₂: Ca²⁺+H₂ O+CO₂=CaCO₃ ↓+2 H⁺"},{"key":"C","text":"向 H₂ O₂ 溶液中滴加少量 FeCl₃: 2 Fe³⁺+H₂ O₂=O₂ ↑+2 H⁺+2 Fe²⁺"},{"key":"D","text":"同浓度同体积 NH₄ HSO₄ 溶液与 NaOH 溶液混合: NH₄ ⁺+OH⁻=NH₃ · H₂ O"}],"answer":"A","optionNotes":{"A":"正确。本题应选 A；原题对照：用 Na₂ SO₃ 溶液吸收少量 Cl₂: 3 SO₃ ²⁻+Cl₂+H₂ O=2 HSO₃ ⁻+2 Cl⁻+SO₄ ⁻⁻, 符合电荷守恒，物料守恒，强制弱规律，故 A 正确;","B":"错误。本题不应选 B；原题对照：弱酸不能制强酸，向 CaCl₂ 溶液中通人 CO₂ 不反应，故 B 错误;","C":"错误。本题不应选 C；原题对照：向 H₂ O₂ 溶液中滴加少量 FeCl₃, FeCl₃ 做催化剂, 促进双氧水的分解, 氧气的氧化性 大于三价铁离子，弱氧化剂不能制强氧化剂，故 C 错误;","D":"错误。本题不应选 D；原题对照：不符合客观事实, 氢氧根优先与酸性更强的氢离子反应, 正确的离子方程式: H⁺+OH =H₂ O ，故 D 错误； 故选：A。"},"analysis":"A. 用 Na₂ SO₃ 溶液吸收少量 Cl₂: 3 SO₃ ²⁻+Cl₂+H₂ O=2 HSO₃ ⁻+2 Cl⁻+SO₄ ⁻⁻, 符合电荷守恒，物料守恒，强制弱规律，故 A 正确; B. 弱酸不能制强酸，向 CaCl₂ 溶液中通人 CO₂ 不反应，故 B 错误; C. 向 H₂ O₂ 溶液中滴加少量 FeCl₃, FeCl₃ 做催化剂, 促进双氧水的分解, 氧气的氧化性 大于三价铁离子，弱氧化剂不能制强氧化剂，故 C 错误; D. 不符合客观事实, 氢氧根优先与酸性更强的氢离子反应, 正确的离子方程式: H⁺+OH =H₂ O ，故 D 错误； 故选：A。","steps":["先圈出题干中的限定条件、实验现象和设问方向。","逐项核对学科规律、守恒关系或结构功能关系，排除条件不符的结论。","公开答案选择 A，再回看完整解析确认判断链条。"],"tip":"真题的难点常在条件组合：先排除绝对化表述，再验证正确项能否解释全部现象。","examSource":{"title":"2020 （新课标ⅲ） 高考选择题","year":"2020","region":"全国","examType":"高考选择题","url":"https://github.com/OpenLMLab/GAOKAO-Bench","dataset":"GAOKAO-Bench","license":"Apache-2.0"}},{"id":"bench-chemistry-2021-111","subject":"chemistry","topicId":"chem-ion","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2021 · （新课标ⅰ） · 高考真题","stem":"下列过程中的化学反应, 相应的离子方程式正确的是","options":[{"key":"A","text":"用碳酸钠溶液处理水垢中的硫酸铂: CO₃²⁻+CaSO₄=CaCO₃+SO₄²⁻"},{"key":"B","text":"过量铁粉加人稀硝酸中: Fe+4 H⁺+NO₃⁻=Fe³⁺+NO ↑+2 H₂ O"},{"key":"C","text":"硫酸铝溶液中滴加少量氢氧化钾溶液: Al³⁺+4 OH⁻=AlO₂⁻+2 H₂ O"},{"key":"D","text":"氯化铜溶液中通人硫化氢: Cu²⁺+S²⁻=CuS ↓"}],"answer":"A","optionNotes":{"A":"正确。本题应选 A；原题对照：硫酸钘微溶, 用碳酸钠溶液处理水垢中的硫酸锠转化为难溶的碳酸钘, 离子方程 式为: CO₃²⁻+CaSO₄=CaCO₃+SO₄²⁻ ，故 A 正确;","B":"错误。本题不应选 B；原题对照：过量的铁粉与稀硝酸反应生成硝酸亚铁、一氧化氮和水, 离子方程式应为: 3 Fe+8 H⁺+2 NO₃⁻=3 Fe²⁺+2 NO ↑+4 H₂ O, 故 B 错误;","C":"错误。本题不应选 C；原题对照：硫酸铝溶液与少量氢氧化钾溶液反应生成氢氧化铝沉淀和硫酸钾, 离子方程式应为: Al³⁺+3 OH⁻=Al(OH)₃ ↓, 故 C 错误;","D":"错误。本题不应选 D；原题对照：硫化氢为弱电解质, 书写离子方程式时不能拆, 离子方程式应为: Cu²⁺+H₂ ~S=CuS ↓+2 H⁺, 故 D 错误; 答案选 A。"},"analysis":"A. 硫酸钘微溶, 用碳酸钠溶液处理水垢中的硫酸锠转化为难溶的碳酸钘, 离子方程 式为: CO₃²⁻+CaSO₄=CaCO₃+SO₄²⁻ ，故 A 正确; B. 过量的铁粉与稀硝酸反应生成硝酸亚铁、一氧化氮和水, 离子方程式应为: 3 Fe+8 H⁺+2 NO₃⁻=3 Fe²⁺+2 NO ↑+4 H₂ O, 故 B 错误; C. 硫酸铝溶液与少量氢氧化钾溶液反应生成氢氧化铝沉淀和硫酸钾, 离子方程式应为: Al³⁺+3 OH⁻=Al(OH)₃ ↓, 故 C 错误; D. 硫化氢为弱电解质, 书写离子方程式时不能拆, 离子方程式应为: Cu²⁺+H₂ ~S=CuS ↓+2 H⁺, 故 D 错误; 答案选 A。","steps":["先圈出题干中的限定条件、实验现象和设问方向。","逐项核对学科规律、守恒关系或结构功能关系，排除条件不符的结论。","公开答案选择 A，再回看完整解析确认判断链条。"],"tip":"真题的难点常在条件组合：先排除绝对化表述，再验证正确项能否解释全部现象。","examSource":{"title":"2021 （新课标ⅰ） 高考选择题","year":"2021","region":"全国","examType":"高考选择题","url":"https://github.com/OpenLMLab/GAOKAO-Bench","dataset":"GAOKAO-Bench","license":"Apache-2.0"}},{"id":"bench-chemistry-2022-117","subject":"chemistry","topicId":"chem-chlorine","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2022 · （全国乙卷） · 高考真题","stem":"某白色粉末样品, 可能含有 Na₂ SO₄ 、 Na₂ SO₃ 、 Na₂ ~S₂ O₃ 和 Na₂ CO₃ 。取少量样品进 行如下实验: (1)溶于水, 得到无色透明溶液 (2)向(1)的溶液中滴加过量稀盐酸, 溶液变浑浊, 有刺激性气体逸出。离心分离。 (3)取(2)的上层清液, 向其中滴加 BaCl₂ 溶液有沉淀生成。 该样品中确定存在的是","options":[{"key":"A","text":"Na₂ SO₄, Na₂ ~S₂ O₃"},{"key":"B","text":"Na₂ SO₃, Na₂ ~S₂ O₃"},{"key":"C","text":"Na₂ SO₄, Na₂ CO₅₃"},{"key":"D","text":"DNa₂ SO₃, Na₂ CO₃"}],"answer":"A","optionNotes":{"A":"正确。本题应选 A，本项符合题干条件与公开答案。完整推理见上方解析。","B":"错误。本题应选 A；本项与题干限定条件或学科规律不符，完整依据见上方解析。","C":"错误。本题应选 A；本项与题干限定条件或学科规律不符，完整依据见上方解析。","D":"错误。本题应选 A；本项与题干限定条件或学科规律不符，完整依据见上方解析。"},"analysis":"由题意可知, (1)取少量样品溶于水得到无色透明溶液, 说明固体溶于水且相互之间 能共存, (2)向(1)的溶液中滴加过量稀盐酸, 溶液变浑浊, 有刺激性气体放出, 说明固体中存 在 Na₂ ~S₂ O₃, 发生反应 S₂ O₃²⁻+2 H⁺=S ↓+H₂ O+SO₂ ↑, 离心分离, (3)取(2)的上层清液, 向其中滴 加 BaCl₂ 溶液, 有沉淀生成, 则沉淀为 BaSO₄, 说明固体中存在 Na₂ SO₄, 不能确定是否有 Na₂ SO₃ 和 Na₂ CO₃, Na₂ SO₃ 与过量盐酸反应生成二氧化硫, Na₂ CO₃ 与过量盐酸反应生成二 氧化碳, 而这些现象可以被 Na₂ ~S₂ O₃ 与过量盐酸反应的现象覆盖掉, 综上分析, 该样品中确 定存在的是: Na₂ SO₄ 、 Na₂ ~S₂ O₃, 答案选 A。","steps":["先圈出题干中的限定条件、实验现象和设问方向。","逐项核对学科规律、守恒关系或结构功能关系，排除条件不符的结论。","公开答案选择 A，再回看完整解析确认判断链条。"],"tip":"真题的难点常在条件组合：先排除绝对化表述，再验证正确项能否解释全部现象。","examSource":{"title":"2022 （全国乙卷） 高考选择题","year":"2022","region":"全国","examType":"高考选择题","url":"https://github.com/OpenLMLab/GAOKAO-Bench","dataset":"GAOKAO-Bench","license":"Apache-2.0"}},{"id":"bench-chemistry-2022-120","subject":"chemistry","topicId":"chem-ion","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2022 · （全国甲卷） · 高考真题","stem":"能正确表示下列反应的离子方程式为","options":[{"key":"A","text":"硫化钠溶液和硝酸混合: S²⁻⁺+2 H⁺=H₂ ~S ↑"},{"key":"B","text":"明矾溶液与过量氨水湿合: Al³⁺+4 NH₃+2 H₂ O=AlO₂⁻+4 NH₄⁺"},{"key":"C","text":"硅酸钠溶液中通人二氧化碳: SiO₃²⁻+CO₂+H₂ O=HSiO₃⁻+HCO₃⁻"},{"key":"D","text":"将等物质的量浓度的 Ba(OH)₂ 和 NH₄ HSO₄ 溶液以体积比 1: 2 混合: Ba²⁺+2 OH⁻+2 H⁺+SO₄²⁻=BaSO₄ ↓+2 H₂ O"}],"answer":"D","optionNotes":{"A":"错误。本题不应选 A；原题对照：硝酸具有强氧化性, 可以将 S²⁻ 氧化为 S 单质, 自身根据其浓度大小还原为 NO 或 NO₂, 反应 的离子方程式为 4 H⁺+2 NO₃⁻+S²⁻=S ↓+2 NO₂ ↑+2 H₂ O (浓)或 8 H⁺+2 NO₃⁻+3 ~S²⁻=3 ~S ↓+2 NO+4 H₂ O (稀), A 错误;","B":"错误。本题不应选 B；原题对照：明矾在水中可以电离出 Al³⁺, 可以与氨水中电离出的 OH⁻发生反应生成 Al(OH)₃, 但由于氨水的碱性较 弱，生成的 Al(OH)₃ 不能继续与弱碱发生反应，故反应的离子方程式为 Al³⁺+3 NH₃ · H₂ O=Al(OH)₃ ↓+3 NH₄⁺, B 错误;","C":"错误。本题不应选 C；原题对照：硅酸的酸性小于碳酸, 向硅酸钠溶液中通人二氧化碳时, 生成硅酸沉淀, 二氧化碳则根据其通人的量的 多少反应为碳酸根或碳酸氢根, 反应的离子方程式为 SiO₃²⁻+H₂ O+CO₂=H₂ SiO₃ ↓+CO₃²⁻(CO₂. 少量) 或 SiO₃²⁻+2 H₂ O+2 CO₂=H₂ SiO₃ ↓+2 HCO₃⁻(CO₂. 过量 ), C 错误;","D":"正确。本题应选 D；原题对照：将等物质的量浓度的 Ba(OH)₂ 与 NH₄ HSO₄ 溶液以体积比 1: 2 混合, Ba(OH)₂ 电离出的 OH⁻与 NH₄ HSO₄ 电离出的 H+ 反应生成水, Ba(OH)₂ 电离出的 Ba²⁺ 与 NH₄ HSO₄ 电离出的 SO₄²⁻ 反应生成 BaSO₄ 沉淀, 反应的 离子方程为为 Ba²⁺+2 OH⁻+2 H⁺+SO₄²⁻=BaSO₄ ↓+2 H₂ O, D 正确; 故答案选 D。"},"analysis":"A. 硝酸具有强氧化性, 可以将 S²⁻ 氧化为 S 单质, 自身根据其浓度大小还原为 NO 或 NO₂, 反应 的离子方程式为 4 H⁺+2 NO₃⁻+S²⁻=S ↓+2 NO₂ ↑+2 H₂ O (浓)或 8 H⁺+2 NO₃⁻+3 ~S²⁻=3 ~S ↓+2 NO+4 H₂ O (稀), A 错误; B. 明矾在水中可以电离出 Al³⁺, 可以与氨水中电离出的 OH⁻发生反应生成 Al(OH)₃, 但由于氨水的碱性较 弱，生成的 Al(OH)₃ 不能继续与弱碱发生反应，故反应的离子方程式为 Al³⁺+3 NH₃ · H₂ O=Al(OH)₃ ↓+3 NH₄⁺, B 错误; C. 硅酸的酸性小于碳酸, 向硅酸钠溶液中通人二氧化碳时, 生成硅酸沉淀, 二氧化碳则根据其通人的量的 多少反应为碳酸根或碳酸氢根, 反应的离子方程式为 SiO₃²⁻+H₂ O+CO₂=H₂ SiO₃ ↓+CO₃²⁻(CO₂. 少量) 或 SiO₃²⁻+2 H₂ O+2 CO₂=H₂ SiO₃ ↓+2 HCO₃⁻(CO₂. 过量 ), C 错误; D. 将等物质的量浓度的 Ba(OH)₂ 与 NH₄ HSO₄ 溶液以体积比 1: 2 混合, Ba(OH)₂ 电离出的 OH⁻与 NH₄ HSO₄ 电离出的 H+ 反应生成水, Ba(OH)₂ 电离出的 Ba²⁺ 与 NH₄ HSO₄ 电离出的 SO₄²⁻ 反应生成 BaSO₄ 沉淀, 反应的 离子方程为为 Ba²⁺+2 OH⁻+2 H⁺+SO₄²⁻=BaSO₄ ↓+2 H₂ O, D 正确; 故答案选 D。","steps":["先圈出题干中的限定条件、实验现象和设问方向。","逐项核对学科规律、守恒关系或结构功能关系，排除条件不符的结论。","公开答案选择 D，再回看完整解析确认判断链条。"],"tip":"真题的难点常在条件组合：先排除绝对化表述，再验证正确项能否解释全部现象。","examSource":{"title":"2022 （全国甲卷） 高考选择题","year":"2022","region":"全国","examType":"高考选择题","url":"https://github.com/OpenLMLab/GAOKAO-Bench","dataset":"GAOKAO-Bench","license":"Apache-2.0"}},{"id":"bench-chemistry-2022-121","subject":"chemistry","topicId":"chem-mole","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2022 · （全国甲卷） · 高考真题","stem":"Nₐ 为阿伏加德罗常数的值, 下列说法正确的是","options":[{"key":"A","text":"25^ C, 101 kPa 下, 28 ~L 氢气中质子的数目为 2.5 ~Nₐ"},{"key":"B","text":"2.0 ~L 1.0 ~mol · L⁻¹ AlCl₃ 溶液中, Al³⁺ 的数目为 2.0 ~Nₐ"},{"key":"C","text":"0.20 ~mol 苯甲酸完全燃烧, 生成 CO₂ 的数目为 1.4 ~Nₐ"},{"key":"D","text":"电解熔融 CuCl₂, 阴极增重 6.4 ~g, 外电路中通过电子的数目为 0.10 ~Nₐ"}],"answer":"C","optionNotes":{"A":"错误。本题不应选 A；原题对照：25^","B":"错误。本题不应选 B；原题对照：Al³⁺ 在溶液中会发生水解生成 Al(OH)₃, 因此 2.0 ~L 1.0 ~mol / L 的 AlCl₃ 溶液中 Al³⁺ 数目小于 2.0 ~Nₐ, 故 B 错误;","C":"正确。本题应选 C；原题对照：苯甲酸燃烧的化学方程式为 C₆ H₅ COOH+(15)/(2) O₂ 点燃 = 7 CO₂+3 H₂ O, 1 ~mol 苯甲酸燃烧生成 7 molCO₂, 则 0.2 ~mol 苯甲酸完全燃烧生成 1.4 molCO₂, 数目为 1.4 ~Nₐ, 故 C 正确;","D":"错误。本题不应选 D；原题对照：电解熔融 CuCl₂ 时, 阳极反应为 2 Cl⁻-2 e⁻=Cl₂ ↑, 阴极反应为 Cu²⁺+2 e⁻=Cu, 阴极增加的重量为 Cu 的质量, 6.4 gCu 的物质的量为 0.1 ~mol, 根据阴极反应可知, 外电路中通过电子的物质的量为 0.2 ~mol, 数目 为 0.2 ~Nₐ, 故 D 错误; 答案选 C。"},"analysis":"A. 25^ C 、 101 kPa 不是标准状况, 不能用标况下的气体摩尔体积计算氢气的物质的量, 故 A 错误; B. Al³⁺ 在溶液中会发生水解生成 Al(OH)₃, 因此 2.0 ~L 1.0 ~mol / L 的 AlCl₃ 溶液中 Al³⁺ 数目小于 2.0 ~Nₐ, 故 B 错误; C. 苯甲酸燃烧的化学方程式为 C₆ H₅ COOH+(15)/(2) O₂ 点燃 = 7 CO₂+3 H₂ O, 1 ~mol 苯甲酸燃烧生成 7 molCO₂, 则 0.2 ~mol 苯甲酸完全燃烧生成 1.4 molCO₂, 数目为 1.4 ~Nₐ, 故 C 正确; D. 电解熔融 CuCl₂ 时, 阳极反应为 2 Cl⁻-2 e⁻=Cl₂ ↑, 阴极反应为 Cu²⁺+2 e⁻=Cu, 阴极增加的重量为 Cu 的质量, 6.4 gCu 的物质的量为 0.1 ~mol, 根据阴极反应可知, 外电路中通过电子的物质的量为 0.2 ~mol, 数目 为 0.2 ~Nₐ, 故 D 错误; 答案选 C。","steps":["先圈出题干中的限定条件、实验现象和设问方向。","逐项核对学科规律、守恒关系或结构功能关系，排除条件不符的结论。","公开答案选择 C，再回看完整解析确认判断链条。"],"tip":"真题的难点常在条件组合：先排除绝对化表述，再验证正确项能否解释全部现象。","examSource":{"title":"2022 （全国甲卷） 高考选择题","year":"2022","region":"全国","examType":"高考选择题","url":"https://github.com/OpenLMLab/GAOKAO-Bench","dataset":"GAOKAO-Bench","license":"Apache-2.0"}}]'),ep=[{id:"chem-c1-01",subject:"chemistry",topicId:"chem-classification",difficulty:1,stem:"下列物质中，属于纯净物的是",options:[{key:"A",text:"漂白粉"},{key:"B",text:"液氯"},{key:"C",text:"盐酸"},{key:"D",text:"空气"}],answer:"B",analysis:"液氯是液态的氯气，只含 Cl₂ 一种物质，属于纯净物；漂白粉、盐酸和空气都含有多种物质。",steps:["先判断物质组成是否唯一。","液氯没有发生化学分解，成分仍只有 Cl₂。"],tip:"“液”只表示状态，不改变物质组成。"},{id:"chem-c1-02",subject:"chemistry",topicId:"chem-classification",difficulty:1,stem:"胶体区别于其他分散系的本质特征是",options:[{key:"A",text:"能产生丁达尔效应"},{key:"B",text:"外观均一、透明"},{key:"C",text:"分散质粒子直径在 1～100 nm"},{key:"D",text:"能透过滤纸"}],answer:"C",analysis:"丁达尔效应是鉴别方法，不是本质特征。三类分散系的本质区别是分散质粒子直径大小。",steps:["溶液：小于 1 nm。","胶体：1～100 nm。","浊液：大于 100 nm。"],tip:"“本质特征”与“鉴别方法”不要混淆。"},{id:"chem-c1-03",subject:"chemistry",topicId:"chem-classification",difficulty:2,stem:"用激光笔分别从侧面照射 CuSO₄ 溶液和 Fe(OH)₃ 胶体，最可能观察到的现象是",options:[{key:"A",text:"两者都出现明显光路"},{key:"B",text:"两者都不出现光路"},{key:"C",text:"胶体中出现光路，溶液中没有明显光路"},{key:"D",text:"溶液中出现光路，胶体中没有明显光路"}],answer:"C",analysis:"胶体粒子可使光发生散射，从侧面可看到一条光亮“通路”，这就是丁达尔效应；溶液没有明显现象。",steps:["Fe(OH)₃ 胶体的分散质粒子大小为 1～100 nm。","散射明显，因此产生丁达尔效应。"],tip:"胶体不是“会发光”，而是使光发生散射。"},{id:"chem-c1-04",subject:"chemistry",topicId:"chem-classification",difficulty:3,stem:"下列推理正确的是",options:[{key:"A",text:"NaHSO₄ 能电离出 H⁺，所以它是酸"},{key:"B",text:"Na₂O₂ 与酸反应有盐和水生成，所以它是碱性氧化物"},{key:"C",text:"CO₂ 能与碱反应生成盐和水，所以它是酸性氧化物"},{key:"D",text:"能导电的物质一定是电解质"}],answer:"C",analysis:"CO₂ 与碱反应只生成盐和水，符合酸性氧化物的定义。NaHSO₄ 属于酸式盐；Na₂O₂ 与酸反应还会生成 O₂，不是碱性氧化物；铜能导电但不是化合物，不是电解质。",steps:["酸性氧化物：与碱反应只生成盐和水。","排除组成或产物不符合定义的选项。"],tip:"分类不仅看“能反应”，还要看生成物和物质类别。"},{id:"chem-c2-01",subject:"chemistry",topicId:"chem-ion",difficulty:1,stem:"FeCl₃ 溶液与 KOH 溶液反应的离子方程式是",options:[{key:"A",text:"Fe³⁺ + 3OH⁻ → Fe(OH)₃↓"},{key:"B",text:"FeCl₃ + 3OH⁻ → Fe(OH)₃↓ + 3Cl⁻"},{key:"C",text:"Fe³⁺ + 3KOH → Fe(OH)₃↓ + 3K⁺"},{key:"D",text:"Fe³⁺ + OH⁻ → Fe(OH)₃↓"}],answer:"A",analysis:"K⁺、Cl⁻ 在反应前后没有变化，应删去；Fe(OH)₃ 是沉淀，保留化学式；电荷与原子数均已守恒。",steps:["先写分子方程式。","把强电解质中实际参加反应的离子拆开。","删除旁观离子并检查守恒。"],tip:"离子方程式左、右两边电荷总数必须相等。"},{id:"chem-c2-02",subject:"chemistry",topicId:"chem-ion",difficulty:1,stem:"在无色酸性溶液中，下列各组离子能大量共存的是",options:[{key:"A",text:"Na⁺、K⁺、NO₃⁻、SO₄²⁻"},{key:"B",text:"Cu²⁺、Na⁺、Cl⁻、NO₃⁻"},{key:"C",text:"HCO₃⁻、Na⁺、Cl⁻、K⁺"},{key:"D",text:"Ba²⁺、Na⁺、SO₄²⁻、Cl⁻"}],answer:"A",analysis:"A 组离子彼此不反应且均无色。B 中 Cu²⁺ 呈蓝色；C 中 HCO₃⁻ 会与 H⁺ 反应；D 中 Ba²⁺ 与 SO₄²⁻ 生成沉淀。",steps:["看颜色：排除有色离子。","看酸性：排除能与 H⁺ 反应的离子。","看离子间是否生成沉淀、气体或弱电解质。"],tip:"题干中的“无色”“酸性”都是过滤条件。"},{id:"chem-c2-03",subject:"chemistry",topicId:"chem-ion",difficulty:2,stem:"Ba(OH)₂ 稀溶液与稀硫酸反应的离子方程式正确的是",options:[{key:"A",text:"H⁺ + OH⁻ → H₂O"},{key:"B",text:"Ba²⁺ + SO₄²⁻ → BaSO₄↓"},{key:"C",text:"Ba²⁺ + 2OH⁻ + 2H⁺ + SO₄²⁻ → BaSO₄↓ + 2H₂O"},{key:"D",text:"Ba²⁺ + OH⁻ + H⁺ + SO₄²⁻ → BaSO₄↓ + H₂O"}],answer:"C",analysis:"该反应同时生成 BaSO₄ 沉淀和水，两项都不能省略；按 Ba(OH)₂ 与 H₂SO₄ 的组成关系配平。",steps:["1 mol Ba(OH)₂ 提供 1 mol Ba²⁺ 和 2 mol OH⁻。","1 mol H₂SO₄ 提供 2 mol H⁺ 和 1 mol SO₄²⁻。","综合沉淀与中和两个过程。"],tip:"生成两种难电离或难溶产物时，不能只写其中一个。"},{id:"chem-c2-04",subject:"chemistry",topicId:"chem-ion",difficulty:3,stem:"向 Na₂CO₃ 溶液中逐滴加入稀盐酸，开始时的主要离子反应是",options:[{key:"A",text:"CO₃²⁻ + 2H⁺ → CO₂↑ + H₂O"},{key:"B",text:"CO₃²⁻ + H⁺ → HCO₃⁻"},{key:"C",text:"HCO₃⁻ + H⁺ → CO₂↑ + H₂O"},{key:"D",text:"2H⁺ + 2Cl⁻ → 2HCl"}],answer:"B",analysis:"逐滴加入盐酸时，H⁺ 相对少量，先与 CO₃²⁻ 反应生成 HCO₃⁻；盐酸继续增加时，HCO₃⁻ 再与 H⁺ 反应放出 CO₂。",steps:["第一阶段：H⁺ + CO₃²⁻ → HCO₃⁻。","第二阶段：H⁺ + HCO₃⁻ → H₂O + CO₂↑。","结论取决于滴加顺序和相对量。"],tip:"“逐滴加入”是在提示你先考虑少量 H⁺ 的反应。"},{id:"chem-c3-01",subject:"chemistry",topicId:"chem-redox",difficulty:1,stem:"反应 Fe + CuSO₄ → FeSO₄ + Cu 中，还原剂是",options:[{key:"A",text:"Fe"},{key:"B",text:"CuSO₄"},{key:"C",text:"FeSO₄"},{key:"D",text:"Cu"}],answer:"A",analysis:"Fe 的化合价由 0 升至 +2，失电子，被氧化，作还原剂；Cu²⁺ 得电子，被还原。",steps:["标出变价元素：Fe 与 Cu。","升失氧：Fe 失电子。","失电子者作还原剂。"],tip:"口诀“升失氧作还原剂”可快速判断。"},{id:"chem-c3-02",subject:"chemistry",topicId:"chem-redox",difficulty:1,stem:"KClO₃ 中氯元素的化合价是",options:[{key:"A",text:"-1"},{key:"B",text:"+1"},{key:"C",text:"+5"},{key:"D",text:"+7"}],answer:"C",analysis:"设 Cl 的化合价为 x。K 为 +1，O 为 -2，则 (+1) + x + 3×(-2) = 0，解得 x = +5。",steps:["化合物中各元素化合价代数和为 0。","1 + x - 6 = 0。","x = +5。"],tip:"考试中先标固定价元素，再列式求未知价。"},{id:"chem-c3-03",subject:"chemistry",topicId:"chem-redox",difficulty:2,stem:"反应 Cl₂ + 2NaOH → NaCl + NaClO + H₂O 中，1 mol Cl₂ 完全反应时转移电子的物质的量为",options:[{key:"A",text:"0.5 mol"},{key:"B",text:"1 mol"},{key:"C",text:"2 mol"},{key:"D",text:"4 mol"}],answer:"B",analysis:"1 mol Cl₂ 中，1 mol Cl 由 0 价降到 -1 价，得到 1 mol 电子；另 1 mol Cl 由 0 价升到 +1 价，失去 1 mol 电子。因此转移电子为 1 mol。",steps:["标价：0 → -1；0 → +1。","转移电子数取单方向，不把得失电子相加。","1 mol Cl₂ 对应 1 mol e⁻ 转移。"],tip:"同一元素既升价又降价，属于歧化反应。"},{id:"chem-c3-04",subject:"chemistry",topicId:"chem-redox",difficulty:3,stem:"KClO₃ + 6HCl(浓) → KCl + 3Cl₂↑ + 3H₂O。若有 1 mol KClO₃ 完全反应，被氧化的 HCl 的物质的量为",options:[{key:"A",text:"1 mol"},{key:"B",text:"3 mol"},{key:"C",text:"5 mol"},{key:"D",text:"6 mol"}],answer:"C",analysis:"KClO₃ 中 +5 价 Cl 降到 0 价，需得到 5 mol 电子；共 6 mol HCl 中，5 mol Cl⁻ 被氧化为 0 价，另 1 mol 形成 KCl，未被氧化。",steps:["确定 KClO₃ 中 Cl：+5 → 0，得 5e⁻。","每个被氧化的 Cl⁻：-1 → 0，失去 1e⁻。","由得失电子守恒，被氧化的 HCl 为 5 mol。"],tip:"参加反应的 HCl 不一定全部被氧化。"},{id:"chem-c4-01",subject:"chemistry",topicId:"chem-sodium",difficulty:1,stem:"Na₂O₂ 与水反应的产物是",options:[{key:"A",text:"NaOH 和 H₂"},{key:"B",text:"NaOH 和 O₂"},{key:"C",text:"Na₂CO₃ 和 H₂"},{key:"D",text:"Na₂O 和 O₂"}],answer:"B",analysis:"反应为 2Na₂O₂ + 2H₂O → 4NaOH + O₂↑。过氧化钠中 -1 价氧同时发生氧化和还原。",steps:["Na₂O₂ 遇水生成 NaOH。","另一产物为 O₂，不是 H₂。"],tip:"Na₂O 与水只生成 NaOH，Na₂O₂ 则会放出 O₂。"},{id:"chem-c4-02",subject:"chemistry",topicId:"chem-sodium",difficulty:1,stem:"下列固体加热时，能产生使澄清石灰水变浑浊气体的是",options:[{key:"A",text:"Na₂CO₃"},{key:"B",text:"NaHCO₃"},{key:"C",text:"NaCl"},{key:"D",text:"NaOH"}],answer:"B",analysis:"NaHCO₃ 受热分解生成 Na₂CO₃、H₂O 和 CO₂；CO₂ 可使澄清石灰水变浑浊。",steps:["2NaHCO₃ → Na₂CO₃ + H₂O + CO₂↑。","Na₂CO₃ 对热稳定。"],tip:"碳酸氢钠受热分解是鉴别 Na₂CO₃ 与 NaHCO₃ 的常用依据。"},{id:"chem-c4-03",subject:"chemistry",topicId:"chem-sodium",difficulty:2,stem:"NaHCO₃ 溶液与稀盐酸反应的离子方程式是",options:[{key:"A",text:"CO₃²⁻ + 2H⁺ → CO₂↑ + H₂O"},{key:"B",text:"HCO₃⁻ + H⁺ → CO₂↑ + H₂O"},{key:"C",text:"Na⁺ + Cl⁻ → NaCl"},{key:"D",text:"NaHCO₃ + H⁺ → Na⁺ + CO₂↑ + H₂O"}],answer:"B",analysis:"NaHCO₃ 可拆为 Na⁺ 和 HCO₃⁻；Na⁺ 是旁观离子，HCO₃⁻ 与 H⁺ 反应生成 CO₂ 和 H₂O。",steps:["NaHCO₃ 可溶于水并完全电离。","HCO₃⁻ 不能拆成 H⁺ 和 CO₃²⁻。","删去旁观离子 Na⁺。"],tip:"HCO₃⁻ 是一个整体，不能随意拆开。"},{id:"chem-c4-04",subject:"chemistry",topicId:"chem-sodium",difficulty:3,stem:"2Na₂O₂ + 2CO₂ → 2Na₂CO₃ + O₂ 中，若 1 mol Na₂O₂ 完全反应，转移电子的物质的量为",options:[{key:"A",text:"0.5 mol"},{key:"B",text:"1 mol"},{key:"C",text:"2 mol"},{key:"D",text:"4 mol"}],answer:"B",analysis:"Na₂O₂ 中 O 为 -1 价。-1 价氧一半降到 -2 价，一半升到 0 价。2 mol Na₂O₂ 参与反应时转移 2 mol 电子，因此 1 mol Na₂O₂ 转移 1 mol 电子。",steps:["先标氧的化合价：Na₂O₂ 中为 -1。","生成 Na₂CO₃ 中 O 为 -2，O₂ 中为 0。","按比例折算为 1 mol Na₂O₂。"],tip:"计算电子转移时，别把得到和失去的电子重复相加。"},{id:"chem-c5-01",subject:"chemistry",topicId:"chem-chlorine",difficulty:1,stem:"氯水中具有漂白作用的微粒主要是",options:[{key:"A",text:"Cl₂"},{key:"B",text:"H⁺"},{key:"C",text:"Cl⁻"},{key:"D",text:"HClO"}],answer:"D",analysis:"Cl₂ 与水反应生成 HCl 和 HClO，其中 HClO 具有强氧化性，能漂白有色物质。",steps:["写出 Cl₂ + H₂O ⇌ HCl + HClO。","HCl 无漂白性，HClO 有漂白性。"],tip:"真正起漂白作用的是次氯酸，不是氯气本身。"},{id:"chem-c5-02",subject:"chemistry",topicId:"chem-chlorine",difficulty:1,stem:"将干燥的有色布条分别放入干燥氯气和湿润氯气中，现象是",options:[{key:"A",text:"两者都褪色"},{key:"B",text:"两者都不褪色"},{key:"C",text:"干燥氯气中褪色，湿润氯气中不褪色"},{key:"D",text:"干燥氯气中不褪色，湿润氯气中褪色"}],answer:"D",analysis:"干燥氯气不能直接提供 HClO；湿润氯气中的水与 Cl₂ 反应生成 HClO，因此有色布条褪色。",steps:["漂白微粒是 HClO。","HClO 的生成需要 Cl₂ 与水共同存在。"],tip:"“干燥氯气无漂白性”是常考结论。"},{id:"chem-c5-03",subject:"chemistry",topicId:"chem-chlorine",difficulty:2,stem:"工业上用氯气与氢氧化钠溶液制取漂白液，下列判断正确的是",options:[{key:"A",text:"反应中 Cl₂ 只被氧化"},{key:"B",text:"反应中 Cl₂ 只被还原"},{key:"C",text:"Cl₂ 既被氧化又被还原"},{key:"D",text:"该反应不是氧化还原反应"}],answer:"C",analysis:"Cl₂ + 2NaOH → NaCl + NaClO + H₂O。Cl 从 0 价分别变到 -1 价和 +1 价，因此既被还原又被氧化。",steps:["标出反应前后 Cl 的化合价。","一种元素同时升价、降价，属于歧化反应。"],tip:"漂白液的有效成分是 NaClO。"},{id:"chem-c5-04",subject:"chemistry",topicId:"chem-chlorine",difficulty:3,stem:"标准状况下，11.2 L Cl₂ 与足量铁反应，最多生成 FeCl₃ 的物质的量为",options:[{key:"A",text:"1/6 mol"},{key:"B",text:"1/3 mol"},{key:"C",text:"1/2 mol"},{key:"D",text:"2/3 mol"}],answer:"B",analysis:"n(Cl₂) = 11.2 L ÷ 22.4 L·mol⁻¹ = 0.5 mol。由 2Fe + 3Cl₂ → 2FeCl₃ 可知，3 mol Cl₂ 生成 2 mol FeCl₃，故 0.5 mol Cl₂ 生成 1/3 mol FeCl₃。",steps:["标准状况下先把体积换算成物质的量。","用方程式系数比：n(FeCl₃) = 2/3 × n(Cl₂)。","0.5 × 2/3 = 1/3 mol。"],tip:"跨章节题目先算 n，再按方程式比例。"},{id:"chem-c6-01",subject:"chemistry",topicId:"chem-mole",difficulty:1,stem:"1 mol O₂ 中含有的氧原子物质的量为",options:[{key:"A",text:"0.5 mol"},{key:"B",text:"1 mol"},{key:"C",text:"2 mol"},{key:"D",text:"4 mol"}],answer:"C",analysis:"每个 O₂ 分子含 2 个氧原子，所以 1 mol O₂ 含 2 mol 氧原子。",steps:["看清微粒种类：O₂ 分子还是 O 原子。","1 mol O₂ → 2 mol O。"],tip:"题目问原子、分子还是离子，结论可能不同。"},{id:"chem-c6-02",subject:"chemistry",topicId:"chem-mole",difficulty:1,stem:"18 g H₂O 的物质的量约为",options:[{key:"A",text:"0.5 mol"},{key:"B",text:"1 mol"},{key:"C",text:"2 mol"},{key:"D",text:"18 mol"}],answer:"B",analysis:"H₂O 的摩尔质量为 18 g·mol⁻¹，所以 n = m/M = 18 g ÷ 18 g·mol⁻¹ = 1 mol。",steps:["写出 M(H₂O) = 18 g·mol⁻¹。","使用 n = m/M。"],tip:"质量换算成物质的量时，单位要与摩尔质量匹配。"},{id:"chem-c6-03",subject:"chemistry",topicId:"chem-mole",difficulty:2,stem:"0.5 mol Na₂SO₄ 中含有的 Na⁺ 数目约为",options:[{key:"A",text:"3.01×10²³"},{key:"B",text:"6.02×10²³"},{key:"C",text:"1.204×10²⁴"},{key:"D",text:"2.408×10²⁴"}],answer:"B",analysis:"1 mol Na₂SO₄ 含 2 mol Na⁺，所以 0.5 mol Na₂SO₄ 含 1 mol Na⁺，约 6.02×10²³ 个。",steps:["从化学式判断微粒比例：Na₂SO₄ : Na⁺ = 1 : 2。","n(Na⁺) = 0.5 × 2 = 1 mol。","微粒数 = n × Nₐ。"],tip:"先找化学式中的下标，再乘以外面的物质的量。"},{id:"chem-c6-04",subject:"chemistry",topicId:"chem-mole",difficulty:3,stem:"若 a g O₂ 中含有 b 个 O₂ 分子，则 c g O₃ 中含有的 O₃ 分子数为",options:[{key:"A",text:"bc/a"},{key:"B",text:"2bc/(3a)"},{key:"C",text:"3bc/(2a)"},{key:"D",text:"ac/b"}],answer:"B",analysis:"b 个 O₂ 分子对应 a g 氧气，因此阿伏加德罗常数的表达式可消去。每个 O₃ 分子质量为 48/Nₐ，O₂ 分子质量为 32/Nₐ，两者比为 3:2，所以相同质量下 O₃ 的分子数是 O₂ 的 2/3。c g O₃ 的分子数为 2bc/(3a)。",steps:["先把“个数”转换成“质量与单个分子质量”的关系。","O₂ 与 O₃ 单个分子质量之比为 32:48 = 2:3。","同质量时分子数之比为 3:2，取 c/a 进行比例缩放。"],tip:"高难比例题先找相同量，再比较不同量。"},{id:"chem-c7-01",subject:"chemistry",topicId:"chem-gas",difficulty:1,stem:"在标准状况下，1 mol 任何气体所占的体积约为",options:[{key:"A",text:"1 L"},{key:"B",text:"22.4 L"},{key:"C",text:"24.5 L"},{key:"D",text:"无法确定"}],answer:"B",analysis:"标准状况下气体摩尔体积约为 22.4 L·mol⁻¹，因此 1 mol 气体体积约为 22.4 L。",steps:["条件：标准状况。","对象：气体。","V = nVₘ ≈ 1 × 22.4 = 22.4 L。"],tip:"使用 22.4 L·mol⁻¹ 前必须核对温度和压强。"},{id:"chem-c7-02",subject:"chemistry",topicId:"chem-gas",difficulty:1,stem:"标准状况下，11.2 L CO₂ 的质量约为",options:[{key:"A",text:"11 g"},{key:"B",text:"22 g"},{key:"C",text:"44 g"},{key:"D",text:"88 g"}],answer:"B",analysis:"n(CO₂) = 11.2 ÷ 22.4 = 0.5 mol；m = nM = 0.5 × 44 = 22 g。",steps:["体积 → 物质的量：n = V/22.4。","物质的量 → 质量：m = nM。","0.5 × 44 = 22 g。"],tip:"体积、物质的量、质量之间的换算链要完整。"},{id:"chem-c7-03",subject:"chemistry",topicId:"chem-gas",difficulty:2,stem:"同温同压下，体积相同的两种气体一定具有相同的",options:[{key:"A",text:"质量"},{key:"B",text:"摩尔质量"},{key:"C",text:"分子数"},{key:"D",text:"原子数"}],answer:"C",analysis:"同温同压下，气体摩尔体积相同。体积相同意味着物质的量相同，因此分子数相同；不同气体摩尔质量可不同，分子内原子数也可能不同。",steps:["由阿伏加德罗定律：同温同压、同体积 → 同物质的量。","物质的量相同 → 分子数相同。","质量与原子数还取决于摩尔质量和分子组成。"],tip:"“相同体积”优先对应“相同物质的量”，不要直接推断质量相同。"},{id:"chem-c7-04",subject:"chemistry",topicId:"chem-gas",difficulty:3,stem:"标准状况下，6.72 L H₂ 和 CO 的混合气体质量为 5.8 g，则混合气体中 H₂ 与 CO 的体积比为",options:[{key:"A",text:"1 : 1"},{key:"B",text:"1 : 2"},{key:"C",text:"2 : 1"},{key:"D",text:"3 : 2"}],answer:"B",analysis:"混合气体总物质的量为 6.72 ÷ 22.4 = 0.3 mol。设 CO 为 x mol，则 H₂ 为 (0.3-x) mol。由 28x + 2(0.3-x) = 5.8，得 x = 0.2 mol，H₂ 为 0.1 mol，因此体积比 H₂ : CO = 1 : 2。",steps:["先算总物质的量：0.3 mol。","设 CO 为 x mol，利用总质量列方程。","解得 n(H₂)=0.1 mol，n(CO)=0.2 mol。","同温同压下，体积比等于物质的量比。"],tip:"混合气体题先建立“总物质的量”和“总质量”两个方程。"},{id:"bio-b1-01",subject:"biology",topicId:"bio-cell-intro",difficulty:1,stem:"下列关于病毒的说法，正确的是",options:[{key:"A",text:"病毒具有细胞结构"},{key:"B",text:"病毒可以独立完成全部生命活动"},{key:"C",text:"病毒必须寄生在活细胞内才能增殖"},{key:"D",text:"病毒属于原核生物"}],answer:"C",analysis:"病毒没有细胞结构，不能独立进行代谢和增殖，必须依赖宿主活细胞；它既不属于原核生物，也不属于真核生物。",steps:["病毒由核酸和蛋白质等组成。","没有完整的酶系统和代谢机构。","只能在宿主活细胞中复制增殖。"],tip:"病毒不是原核生物，这是常错点。"},{id:"bio-b1-02",subject:"biology",topicId:"bio-cell-intro",difficulty:1,stem:"细胞学说建立的重要依据是",options:[{key:"A",text:"所有生物都由多个细胞构成"},{key:"B",text:"细胞通过分裂产生新细胞"},{key:"C",text:"所有细胞都有细胞核"},{key:"D",text:"细胞都能独立完成光合作用"}],answer:"B",analysis:"细胞学说认为细胞是一个相对独立的单位，新细胞可以由老细胞分裂产生。并非所有生物都是多细胞，原核细胞也没有核膜包被的细胞核。",steps:["细胞学说强调细胞是结构和功能单位。","关注“新细胞来自已存在的细胞”。"],tip:"“所有”类绝对表述要警惕。"},{id:"bio-b1-03",subject:"biology",topicId:"bio-cell-intro",difficulty:2,stem:"蓝细菌能够进行光合作用，其原因主要是",options:[{key:"A",text:"具有叶绿体"},{key:"B",text:"具有核膜"},{key:"C",text:"含有藻蓝素和叶绿素等光合色素"},{key:"D",text:"属于真核生物"}],answer:"C",analysis:"蓝细菌是原核生物，没有叶绿体，也没有核膜包被的细胞核，但含有藻蓝素和叶绿素，能进行光合作用。",steps:["蓝细菌属于原核生物。","原核细胞没有叶绿体等膜性细胞器。","光合作用依赖其含有的光合色素。"],tip:"“能光合作用”不等于“一定有叶绿体”。"},{id:"bio-b1-04",subject:"biology",topicId:"bio-cell-intro",difficulty:3,stem:"某池塘水样中观察到甲、乙两种单细胞生物：甲有成形的细胞核，乙有拟核和光合色素，但没有叶绿体。下列判断正确的是",options:[{key:"A",text:"甲一定是植物细胞"},{key:"B",text:"乙可能是蓝细菌"},{key:"C",text:"甲、乙都一定具有细胞壁"},{key:"D",text:"甲、乙都以染色体作为唯一遗传物质"}],answer:"B",analysis:"乙有拟核且没有叶绿体，却含有光合色素，符合蓝细菌的特征。甲有真正的细胞核，只能确定为真核细胞，不能仅凭这一点确定是植物细胞；动物细胞没有细胞壁，遗传物质是 DNA，不能说“染色体作为唯一遗传物质”。",steps:["先按“有无核膜包被的细胞核”区分真核细胞和原核细胞。","乙具拟核，可锁定为原核生物；再结合光合色素进一步判断为蓝细菌。","甲只确定为真核细胞，植物、动物、真菌都有可能。"],tip:"先定大类，再用结构特征缩小范围，避免一步跳到结论。"},{id:"bio-b2-01",subject:"biology",topicId:"bio-elements",difficulty:1,stem:"活细胞中含量最多的化合物是",options:[{key:"A",text:"蛋白质"},{key:"B",text:"水"},{key:"C",text:"糖类"},{key:"D",text:"核酸"}],answer:"B",analysis:"水是活细胞中含量最多的化合物；蛋白质通常是含量最多的有机物。",steps:["区分“无机物/有机物”。","含量最多的化合物是水，含量最多的有机物通常是蛋白质。"],tip:"注意题干问的是化合物还是有机物。"},{id:"bio-b2-02",subject:"biology",topicId:"bio-elements",difficulty:1,stem:"被称为“生命活动的主要能源物质”的是",options:[{key:"A",text:"糖类"},{key:"B",text:"蛋白质"},{key:"C",text:"脂质"},{key:"D",text:"核酸"}],answer:"A",analysis:"糖类是生命活动的主要能源物质。脂肪是重要的储能物质，蛋白质承担多种结构和功能。",steps:["糖类：主要能源物质。","脂肪：主要储能物质。","ATP：直接能源物质。"],tip:"“主要能源物质”“直接能源物质”表述不同。"},{id:"bio-b2-03",subject:"biology",topicId:"bio-elements",difficulty:2,stem:"蛋白质结构具有多样性的直接原因不包括",options:[{key:"A",text:"氨基酸的种类不同"},{key:"B",text:"氨基酸的数目不同"},{key:"C",text:"氨基酸的排列顺序不同"},{key:"D",text:"所有蛋白质都由相同数量的氨基酸组成"}],answer:"D",analysis:"蛋白质多样性来自氨基酸种类、数目、排列顺序以及肽链盘曲、折叠形成的空间结构。若所有蛋白质氨基酸数量都相同，会削弱多样性。",steps:["从一级结构看：种类、数目、顺序。","从高级结构看：肽链的数量和空间结构。"],tip:"题目问“不包括”，先圈出否定词。"},{id:"bio-b2-04",subject:"biology",topicId:"bio-elements",difficulty:3,stem:"某植物在干旱条件下细胞内结合水与自由水的比值升高。下列推断最合理的是",options:[{key:"A",text:"细胞代谢强度一定增强"},{key:"B",text:"细胞的抗逆性可能增强"},{key:"C",text:"细胞已经失去全部自由水"},{key:"D",text:"结合水不再参与细胞结构组成"}],answer:"B",analysis:"结合水比例升高通常有利于降低代谢、提高对不良环境的耐受性。它不表示自由水完全消失，也不能据此认定代谢一定增强。",steps:["自由水多通常代谢旺盛。","结合水比例增加通常抗逆性增强。","比值升高不等于自由水含量一定为零。"],tip:"高难题常把相关关系写成绝对因果关系，要谨慎。"},{id:"bio-b3-01",subject:"biology",topicId:"bio-organelles",difficulty:1,stem:"下列细胞器中，具有双层膜结构的是",options:[{key:"A",text:"核糖体"},{key:"B",text:"高尔基体"},{key:"C",text:"线粒体"},{key:"D",text:"内质网"}],answer:"C",analysis:"线粒体具有双层膜；核糖体无膜，高尔基体和内质网具有单层膜。",steps:["双层膜：线粒体、叶绿体、细胞核。","单层膜：内质网、高尔基体、溶酶体、液泡。"],tip:"细胞核不是细胞器，但具有双层膜结构。"},{id:"bio-b3-02",subject:"biology",topicId:"bio-organelles",difficulty:1,stem:"蛋白质合成的场所是",options:[{key:"A",text:"核糖体"},{key:"B",text:"中心体"},{key:"C",text:"溶酶体"},{key:"D",text:"细胞膜"}],answer:"A",analysis:"核糖体是蛋白质合成的场所，是无膜结构的细胞器。",steps:["核糖体由 rRNA 和蛋白质组成。","负责把氨基酸连接成肽链。"],tip:"核糖体无膜，却不是所有细胞都没有；原核细胞也有核糖体。"},{id:"bio-b3-03",subject:"biology",topicId:"bio-organelles",difficulty:2,stem:"分泌蛋白从合成到分泌到细胞外，经过的结构顺序是",options:[{key:"A",text:"核糖体 → 内质网 → 高尔基体 → 细胞膜"},{key:"B",text:"内质网 → 核糖体 → 高尔基体 → 细胞膜"},{key:"C",text:"高尔基体 → 内质网 → 核糖体 → 细胞膜"},{key:"D",text:"核糖体 → 高尔基体 → 线粒体 → 细胞膜"}],answer:"A",analysis:"分泌蛋白在附着于内质网的核糖体上合成，进入内质网加工，再由高尔基体进一步修饰、分类并通过囊泡运输至细胞膜。",steps:["合成：核糖体。","初步加工：内质网。","进一步加工与包装：高尔基体。","分泌：囊泡与细胞膜融合。"],tip:"线粒体供能，但不是分泌蛋白经过的结构。"},{id:"bio-b3-04",subject:"biology",topicId:"bio-organelles",difficulty:3,stem:"关于生物膜系统，下列说法正确的是",options:[{key:"A",text:"生物膜系统只包括细胞膜"},{key:"B",text:"不同生物膜上的蛋白质种类和数量可能不同"},{key:"C",text:"所有生物膜都以完全相同的方式排列磷脂"},{key:"D",text:"核糖体属于生物膜系统的一部分"}],answer:"B",analysis:"生物膜系统包括细胞膜、细胞器膜和核膜等。不同膜执行的功能不同，蛋白质种类和数量会有差异；核糖体没有膜，不属于生物膜系统。",steps:["生物膜系统强调膜结构之间的组成与联系。","蛋白质承担运输、识别、催化等功能，因此不同膜蛋白有差异。","排除无膜细胞器。"],tip:"“生物膜系统”不是“所有细胞器膜的总和”。"},{id:"bio-b4-01",subject:"biology",topicId:"bio-nucleus",difficulty:1,stem:"细胞核的主要功能是",options:[{key:"A",text:"合成全部蛋白质"},{key:"B",text:"进行有氧呼吸的主要场所"},{key:"C",text:"遗传信息库和细胞代谢、遗传的控制中心"},{key:"D",text:"控制物质进出细胞"}],answer:"C",analysis:"细胞核是遗传信息库，是细胞代谢和遗传的控制中心。蛋白质合成主要在核糖体，有氧呼吸主要在线粒体，控制物质进出是细胞膜的功能。",steps:["先区分细胞核、核糖体、线粒体、细胞膜的功能。","细胞核储存遗传信息，并调控代谢与遗传。"],tip:"细胞核是控制中心，不等于所有化学反应都在核内发生。"},{id:"bio-b4-02",subject:"biology",topicId:"bio-nucleus",difficulty:1,stem:"染色质的主要成分是",options:[{key:"A",text:"DNA 和蛋白质"},{key:"B",text:"RNA 和糖类"},{key:"C",text:"脂质和蛋白质"},{key:"D",text:"水和无机盐"}],answer:"A",analysis:"染色质主要由 DNA 和蛋白质组成；在细胞分裂期，染色质高度螺旋化、缩短变粗，成为染色体。",steps:["染色体和染色质是同一物质在不同时期的两种形态。","两者都主要由 DNA 和蛋白质组成。"],tip:"染色质与染色体不是两种不同物质。"},{id:"bio-b4-03",subject:"biology",topicId:"bio-nucleus",difficulty:3,stem:"下列关于细胞核结构的叙述，正确的是",options:[{key:"A",text:"核膜是单层膜，允许所有分子自由通过"},{key:"B",text:"核仁与核糖体的形成有关"},{key:"C",text:"核孔只允许 DNA 进出细胞核"},{key:"D",text:"染色质在细胞核外合成"}],answer:"B",analysis:"核仁与核糖体的形成有关。核膜为双层膜；核孔具有选择性，通常 DNA 不通过核孔进入细胞质；染色质存在于细胞核内。",steps:["核膜：双层膜。","核孔：选择性通道，mRNA 和蛋白质等可通过。","核仁：参与核糖体形成。"],tip:"“核孔是通道”不代表“什么都能自由通过”。"},{id:"cn-c1-01",type:"fill",subject:"chinese",topicId:"cn-poetry-early",difficulty:1,stem:"面对壮阔的秋景，毛泽东以设问收束上阕，发出对国家命运和时代主宰者的追问：____。",answer:"怅寥廓，问苍茫大地，谁主沉浮？",analysis:"“怅寥廓”点出面对宇宙万物时的深沉思索，“问苍茫大地，谁主沉浮”由写景转入对国家命运和时代主宰者的追问，是全词的关键设问。",steps:["题干关键词是“设问”和“谁主宰命运”。","对应《沁园春·长沙》上阕结尾。"],tip:"易错字：“寥廓”。"},{id:"cn-c1-02",type:"fill",subject:"chinese",topicId:"cn-poetry-early",difficulty:2,stem:"曹操用山海作比，并以周公自比，表达广纳贤才、统一天下的政治抱负：____。",answer:"山不厌高，海不厌深。周公吐哺，天下归心。",analysis:"“山不厌高，海不厌深”比喻招纳贤才唯恐不足；“周公吐哺”用周公礼贤下士的典故，表现作者希望天下归心的抱负。",steps:["先定位“山海作比”的两句。","再由“周公”典故定位最后两句。"],tip:"易错字：“哺”不要写成“辅”。"},{id:"cn-c1-03",type:"fill",subject:"chinese",topicId:"cn-poetry-early",difficulty:3,stem:"《归园田居（其一）》中，以飞鸟和池鱼作比，表达厌倦官场、渴望回归田园的诗句是：____。",answer:"羁鸟恋旧林，池鱼思故渊。",analysis:"诗人以“羁鸟”和“池鱼”自比，用“旧林”“故渊”象征自由田园，表达摆脱官场束缚、回归自然的强烈愿望。",steps:["题干给出两个核心意象：“飞鸟”“池鱼”。","把意象与“旧林”“故渊”对应起来。"],tip:"易错字：“羁”“渊”。"},{id:"cn-c2-01",type:"fill",subject:"chinese",topicId:"cn-tang",difficulty:1,stem:"杜甫《登高》中，从空间广阔和时间久远着笔，集中写漂泊异乡、年老多病的诗句是：____。",answer:"万里悲秋常作客，百年多病独登台。",analysis:"“万里”写漂泊空间之远，“百年”写人生晚境；“悲秋”“作客”“多病”“独登台”层层叠加，集中表现诗人的孤苦与身世之悲。",steps:["抓住“漂泊异乡”和“年老多病”两个提示。","对应颈联“万里悲秋常作客，百年多病独登台”。"],tip:"“作客”指客居他乡，不写作“做客”。"},{id:"cn-c2-02",type:"fill",subject:"chinese",topicId:"cn-tang",difficulty:2,stem:"《梦游天姥吟留别》结尾，李白直抒对权贵的蔑视和对人格自由的追求：____。",answer:"安能摧眉折腰事权贵，使我不得开心颜？",analysis:"“摧眉折腰”形象写出对权贵低声下气的屈辱姿态。诗人用反问坚决拒绝这种生活，突出对独立人格和精神自由的追求。",steps:["题干关键词是“蔑视权贵”“人格自由”。","定位全诗结尾的反问句。"],tip:"易错字：“摧眉”不是“催眉”。"},{id:"cn-c2-03",type:"fill",subject:"chinese",topicId:"cn-tang",difficulty:3,stem:"《琵琶行（并序）》中，诗人由琵琶女的身世联想到自己的贬谪处境，产生命运共鸣：____。",answer:"同是天涯沦落人，相逢何必曾相识！",analysis:"诗人与琵琶女身份、经历不同，却同样漂泊失意。“同是天涯沦落人”把两人的命运连在一起，构成全诗情感转折和共鸣的核心。",steps:["题干提示“命运共鸣”。","对应诗中由琵琶女身世转向诗人自述的过渡句。"],tip:"“沦落”指流落、失意，注意“沦”字。"},{id:"cn-c3-01",type:"fill",subject:"chinese",topicId:"cn-song",difficulty:1,stem:"苏轼《念奴娇·赤壁怀古》中，用夸张和比喻描绘赤壁险峻山势与汹涌波涛：____。",answer:"乱石穿空，惊涛拍岸，卷起千堆雪。",analysis:"“穿空”写山石高峻，“拍岸”写波涛冲击，“千堆雪”比喻浪花。三句从视觉和听觉写出赤壁景象的雄奇壮阔。",steps:["先找“夸张写山势”。","再找“比喻写浪花”，组成完整三句。"],tip:"“涛”不要写成“滔”。"},{id:"cn-c3-02",type:"fill",subject:"chinese",topicId:"cn-song",difficulty:2,stem:"辛弃疾《永遇乐·京口北固亭怀古》开篇，由眼前江山想到历史英雄孙权，表达英雄难觅的感慨：____。",answer:"千古江山，英雄无觅，孙仲谋处。",analysis:"词人登临北固亭，面对千古江山，寻找孙权那样的英雄却已无处可觅。开篇为全词怀古和现实感慨定下基调。",steps:["题干出现“开篇”和“孙权”。","孙权字仲谋，据此定位。"],tip:"“无觅”是寻找不到，注意“觅”字。"},{id:"cn-c3-03",type:"fill",subject:"chinese",topicId:"cn-song",difficulty:3,stem:"李清照《声声慢》开头连用七组叠字，从动作、环境一路写到凄苦心境：____。",answer:"寻寻觅觅，冷冷清清，凄凄惨惨戚戚。",analysis:"“寻寻觅觅”写若有所失的动作，“冷冷清清”写环境，“凄凄惨惨戚戚”写内心感受。叠字层层推进，节奏低沉，强化孤独凄凉。",steps:["七组叠字分为三层：动作、环境、心境。","逐字检查“凄”“惨”“戚”的字形。"],tip:"完整默写七组叠字，不要漏掉“戚戚”。"},{id:"cn-c4-01",type:"fill",subject:"chinese",topicId:"cn-prose",difficulty:1,stem:"《劝学》中，用木材和金属的变化作比，说明学习、自省能够使人智慧明达、行为无过：____。",answer:"故木受绳则直，金就砺则利，君子博学而日参省乎己，则知明而行无过矣。",analysis:"木材经墨线校正而直，金属在磨石上磨过而锋利。作者以此引出君子广泛学习、每日自省，才能智慧明达、少犯过错。",steps:["题干把“木材”“金属”“自省”连在一起。","按比喻、推论两层结构默写完整。"],tip:"“知明”中的“知”同“智”，不要误改为“智”。"},{id:"cn-c4-02",type:"fill",subject:"chinese",topicId:"cn-prose",difficulty:2,stem:"韩愈《师说》中提出从师标准，不论地位高低、年龄长少，道在哪里，老师就在哪里：____。",answer:"是故无贵无贱，无长无少，道之所存，师之所存也。",analysis:"这句话用排比和判断句式，把从师标准归结为“道之所存”，直接批判当时看重门第、年龄而不重从师学习的风气。",steps:["先写两组“无……”排除身份和年龄。","再落到“道”和“师”的对应关系。"],tip:"“无贵无贱”指不论贵贱，不是没有贵贱。"},{id:"cn-c4-03",type:"fill",subject:"chinese",topicId:"cn-prose",difficulty:3,stem:"《劝学》中，用骏马和劣马作对比，强调学习贵在坚持、不能半途而废：____。",answer:"骐骥一跃，不能十步；驽马十驾，功在不舍。",analysis:"骏马跳跃一次也不能达到十步，劣马拉车走十天却能走得很远，靠的是不停歇。作者借对比说明坚持的功效，论证学习必须积累。",steps:["骏马对应“骐骥”。“劣马”对应“驽马”。","找到对比后总结坚持的“不舍”。"],tip:"易错字：“骐骥”“驽马”。"},{id:"cn-c5-01",type:"fill",subject:"chinese",topicId:"cn-travel",difficulty:1,stem:"《赤壁赋》中，苏轼用蜉蝣和一粒粟米作比，感叹个人生命短暂、人在天地间渺小：____。",answer:"寄蜉蝣于天地，渺沧海之一粟。",analysis:"“蜉蝣”生命短暂，“一粟”极言渺小。两句写出个体相对于天地、沧海时的短暂与微不足道，也引出后文对变与不变的讨论。",steps:["由“蜉蝣”定位第一句。","由“粟米”和“沧海”定位第二句。"],tip:"易错字：“蜉蝣”“渺”“粟”。"},{id:"cn-c5-02",type:"fill",subject:"chinese",topicId:"cn-travel",difficulty:2,stem:"姚鼐《登泰山记》中，描写青山覆盖积雪、雪光照亮南面天空的景象：____。",answer:"苍山负雪，明烛天南。",analysis:"《登泰山记》写冬日泰山雪景：青山背负着积雪，雪光映照如烛，照亮南面天空。凝练的句子兼有色彩、力量和光感。",steps:["“青山覆盖积雪”对应“苍山负雪”。","“雪光照亮南面天空”对应“明烛天南”。"],tip:"“烛”在此是名词作动词，指像蜡烛一样照亮。"},{id:"cn-c5-03",type:"fill",subject:"chinese",topicId:"cn-travel",difficulty:3,stem:"《赤壁赋》中，苏轼从“变”与“不变”两个角度观察世界，说明事物和我都无穷无尽：____。",answer:"盖将自其变者而观之，则天地曾不能以一瞬；自其不变者而观之，则物与我皆无尽也，而又何羡乎！",analysis:"从变化角度看，天地万物瞬息万变；从不变角度看，物与我都可以延续无穷，因此不必羡慕长江的无穷。这里体现苏轼超越个体有限性的哲思。",steps:["先写“自其变者而观之”这一层。","再写“自其不变者而观之”这一层，注意结句“而又何羡乎”。"],tip:"长句按分号分成两个层次默写，特别注意“曾不能以一瞬”。"},{id:"cn-c6-01",type:"fill",subject:"chinese",topicId:"cn-recitation",difficulty:1,stem:"《静女》中，男子等待心上人，女子却故意躲藏，男子焦急徘徊：____。",answer:"爱而不见，搔首踟蹰。",analysis:"女子藏起来不肯露面，男子抓头徘徊，动作描写生动传神，写出等待中的焦急、笨拙和深情。",steps:["“故意躲藏”对应“爱而不见”。","“焦急徘徊”对应“搔首踟蹰”。"],tip:"“见”同“现”，这里仍按课文原字默写。"},{id:"cn-c6-02",type:"fill",subject:"chinese",topicId:"cn-recitation",difficulty:2,stem:"《涉江采芙蓉》中，写相爱的人却分居两地，只能在忧伤中度过一生：____。",answer:"同心而离居，忧伤以终老。",analysis:"“同心”说明彼此情深，“离居”点出分离现实，两者形成强烈反差，引出无法团聚的忧伤。",steps:["“相爱”对应“同心”。","“分居两地、忧伤终生”对应后一句。"],tip:"“离居”是分离而居，不是离开居所。"},{id:"cn-c6-03",type:"fill",subject:"chinese",topicId:"cn-recitation",difficulty:2,stem:"李煜《虞美人》中，以滔滔春水比喻无穷无尽的愁绪：____。",answer:"问君能有几多愁？恰似一江春水向东流。",analysis:"词人先用疑问把“愁”具体化，再以向东奔流的春水作比，把抽象愁绪写成绵延无穷、无法阻断的形象。",steps:["先定位“问君能有几多愁”的设问。","再写“一江春水”的比喻。"],tip:"“恰似”不要漏写；“向东流”不要写成“向东去”。"},{id:"cn-c6-04",type:"fill",subject:"chinese",topicId:"cn-recitation",difficulty:3,stem:"《鹊桥仙》中，秦观翻出爱情新境界，认为感情只要长久真挚，不必追求朝夕相守：____。",answer:"两情若是久长时，又岂在朝朝暮暮。",analysis:"这两句突破传统爱情词中对离别的哀怨，把真挚长久的感情放在朝夕相伴之上，境界开阔而积极。",steps:["“长久真挚”对应“久长时”。","“不必朝夕相守”对应反问“又岂在朝朝暮暮”。"],tip:"易错词：“久长时”“朝朝暮暮”。"}],tp={"chem-c1-03":{A:"错误。改正：溶液没有明显丁达尔效应，不会出现清晰光路。",B:"错误。改正：Fe(OH)₃胶体会使光发生明显散射，因此可出现光路。",C:"正确。胶体粒子直径在1～100 nm，可使光发生明显散射，形成丁达尔效应；溶液现象不明显。",D:"错误。改正：常见CuSO₄溶液不呈明显丁达尔效应，现象方向说反了。"},"chem-c1-04":{A:"错误。改正：NaHSO₄能电离出Na⁺、H⁺和SO₄²⁻，电离出的阳离子不全是H⁺，属于酸式盐。",B:"错误。改正：Na₂O₂与酸反应还会放出O₂，阴离子为O₂²⁻，属于过氧化物而非碱性氧化物。",C:"正确。CO₂与碱反应只生成盐和水，符合酸性氧化物的定义。",D:"错误。改正：铜能导电但属于单质，电解质首先必须是化合物。"},"chem-c2-03":{A:"错误。改正：该式遗漏了BaSO₄沉淀，不能表示Ba(OH)₂与H₂SO₄的完整反应。",B:"错误。改正：该式遗漏了H⁺与OH⁻生成水，仅写沉淀也不完整。",C:"正确。1 mol Ba²⁺、2 mol OH⁻分别与1 mol SO₄²⁻、2 mol H⁺反应，生成BaSO₄和2H₂O。",D:"错误。改正：离子数和电荷均未配平，1个Ba²⁺与2个OH⁻需对应2个H⁺和1个SO₄²⁻。"},"chem-c2-04":{A:"错误。改正：该式表示H⁺足量时的总反应，不是逐滴加入初期少量H⁺的主要反应。",B:"正确。开始时H⁺相对少量，先与CO₃²⁻反应生成HCO₃⁻。",C:"错误。改正：HCO₃⁻是第一阶段生成的中间物，随后才在H⁺继续增加时放出CO₂。",D:"错误。改正：H⁺和Cl⁻不是生成HCl，盐酸在此提供H⁺参与反应，Cl⁻是旁观离子。"},"chem-c3-03":{A:"错误。改正：1 mol Cl₂中发生1 mol Cl由0价降至-1价，转移1 mol电子，不是0.5 mol。",B:"正确。同一Cl₂中，一个Cl得1e⁻，另一个Cl失1e⁻，按单方向计为1 mol电子转移。",C:"错误。改正：2 mol是每个Cl价态变化绝对值之和，不能把得失电子重复相加。",D:"错误。改正：题干只有1 mol Cl₂，不可能转移4 mol电子。"},"chem-c3-04":{A:"错误。改正：KClO₃中+5价Cl降到0价需得到5 mol电子，不能只氧化1 mol HCl。",B:"错误。改正：3 mol只是产物Cl₂的物质的量，被氧化的HCl还需按电子守恒计算。",C:"正确。KClO₃中Cl得5e⁻，5 mol HCl中的Cl⁻失电子生成Cl₂，另1 mol HCl形成KCl未被氧化。",D:"错误。改正：6 mol是参加反应的HCl总量，其中只有5 mol被氧化。"},"chem-c4-03":{A:"错误。改正：NaHCO₃提供HCO₃⁻，不能拆成CO₃²⁻，该式对应碳酸盐与足量酸反应。",B:"正确。Na⁺为旁观离子，HCO₃⁻与H⁺反应生成CO₂和H₂O。",C:"错误。改正：Na⁺与Cl⁻没有生成难电离或难溶物质，不写成反应。",D:"错误。改正：NaHCO₃可溶，应拆为Na⁺和HCO₃⁻，不能保留整体化学式。"},"chem-c4-04":{A:"错误。改正：每个Na₂O₂中氧元素平均发生1个电子转移，1 mol Na₂O₂对应1 mol电子，不是0.5 mol。",B:"正确。2 mol Na₂O₂反应时转移2 mol电子，因此1 mol Na₂O₂转移1 mol电子。",C:"错误。改正：2 mol是把1 mol Na₂O₂中两分子氧都重复计算或未按反应系数折算。",D:"错误。改正：4 mol与题干物质的量和氧的价态变化均不匹配。"},"chem-c5-03":{A:"错误。改正：Cl₂中Cl由0价同时变为-1和+1价，不只被氧化。",B:"错误。改正：Cl₂同时被氧化、被还原，只被还原会遗漏ClO⁻的生成。",C:"正确。Cl₂中一部分Cl得电子生成NaCl，另一部分失电子生成NaClO，属于歧化反应。",D:"错误。改正：Cl元素化合价发生变化，该反应是氧化还原反应。"},"chem-c5-04":{A:"错误。改正：n(Cl₂)=0.5 mol，由2Fe+3Cl₂→2FeCl₃，n(FeCl₃)=0.5×2/3=1/3 mol。",B:"正确。Cl₂与FeCl₃的物质的量关系为3:2，0.5 mol Cl₂生成1/3 mol FeCl₃。",C:"错误。改正：0.5 mol是Cl₂的物质的量，不能直接当成FeCl₃的物质的量。",D:"错误。改正：2/3 mol没有按3 mol Cl₂对应2 mol FeCl₃的系数比缩放。"},"chem-c6-03":{A:"错误。改正：0.5 mol Na₂SO₄含1 mol Na⁺，约为6.02×10²³，不是3.01×10²³。",B:"正确。n(Na⁺)=0.5×2=1 mol，因此约含6.02×10²³个Na⁺。",C:"错误。改正：1.204×10²⁴对应2 mol Na⁺，是题干物质的量再次乘2后多算了一倍。",D:"错误。改正：2.408×10²⁴对应4 mol Na⁺，与Na₂SO₄组成不符。"},"chem-c6-04":{A:"错误。改正：O₂与O₃单个分子质量比为2:3，相同质量下分子数比应为3:2，不是直接bc/a。",B:"正确。O₂与O₃单个分子质量比为32:48=2:3，同质量时分子数比为3:2，因此c g O₃的分子数为2bc/(3a)。",C:"错误。改正：3bc/(2a)把O₂与O₃的分子数比写反。",D:"错误。改正：ac/b量纲和比例关系均不成立。"},"chem-c7-03":{A:"错误。改正：同温同压同体积只保证分子数相同，气体摩尔质量可能不同，质量不一定相同。",B:"错误。改正：不同气体的摩尔质量可以不同，题设不能保证摩尔质量相同。",C:"正确。由阿伏加德罗定律，同温同压同体积气体含有相同物质的量，因此分子数相同。",D:"错误。改正：分子数相同不代表分子内原子数相同，例如O₂和O₃的原子总数不同。"},"chem-c7-04":{A:"错误。改正：总物质的量为0.3 mol，若1:1则各0.15 mol，总质量为4.5 g，不是5.8 g。",B:"正确。n(H₂)=0.1 mol、n(CO)=0.2 mol，同温同压下体积比等于物质的量比1:2。",C:"错误。改正：2:1对应总质量约9.6 g，不符合5.8 g。",D:"错误。改正：3:2对应总质量约11.0 g，不符合题设。"},"bio-b1-03":{A:"错误。改正：蓝细菌是原核生物，没有叶绿体，不能把“能光合作用”等同于“有叶绿体”。",B:"错误。改正：蓝细菌没有核膜包被的细胞核，不能以此解释光合作用。",C:"正确。蓝细菌含藻蓝素和叶绿素等光合色素，可直接进行光合作用。",D:"错误。改正：蓝细菌属于原核生物，不是真核生物。"},"bio-b1-04":{A:"错误。改正：甲有成形细胞核只能确定为真核细胞，不能据此断定一定是植物细胞。",B:"正确。乙有拟核和光合色素、无叶绿体，符合蓝细菌特征。",C:"错误。改正：甲若是动物细胞则没有细胞壁，不能断言甲一定具有细胞壁。",D:"错误。改正：二者的遗传物质都是DNA，染色体不是遗传物质本身，且不能作“唯一遗传物质”表述。"},"bio-b2-03":{A:"错误。改正：氨基酸种类不同是蛋白质多样性的原因之一。",B:"错误。改正：氨基酸数目不同是蛋白质多样性的原因之一。",C:"错误。改正：氨基酸排列顺序不同是蛋白质多样性的原因之一。",D:"正确。若所有蛋白质都由相同数量氨基酸组成，会削弱多样性，不属于多样性原因。"},"bio-b2-04":{A:"错误。改正：结合水比例升高通常使代谢减弱，不能推出代谢一定增强。",B:"正确。结合水比例相对增加有利于维持结构稳定，提高抗逆性。",C:"错误。改正：比值升高不等于自由水完全消失。",D:"错误。改正：结合水是细胞结构的重要组成成分。"},"bio-b3-03":{A:"正确。附着在内质网上的核糖体先合成肽链，随后经内质网、高尔基体加工，再由囊泡运至细胞膜分泌。",B:"错误。改正：内质网不先于核糖体，蛋白质的合成起点是核糖体。",C:"错误。改正：该路径顺序完全颠倒，高尔基体应在内质网之后。",D:"错误。改正：线粒体主要供能，不是分泌蛋白加工运输依次经过的结构。"},"bio-b3-04":{A:"错误。改正：生物膜系统还包括细胞器膜和核膜，不只是细胞膜。",B:"正确。不同生物膜功能不同，蛋白质种类和数量可能有差异。",C:"错误。改正：不同生物膜的脂质组成、蛋白质和功能存在差异，不能断言完全相同。",D:"错误。改正：核糖体没有膜结构，不属于生物膜系统。"},"bio-b4-03":{A:"错误。改正：核膜是双层膜，且不是所有分子都能自由通过。",B:"正确。核仁与核糖体的形成有关。",C:"错误。改正：核孔具有选择性，通常不允许DNA自由进出，mRNA和某些蛋白质可通过。",D:"错误。改正：染色质在细胞核内，不是核外合成。"}},F0=[...ep.filter(u=>u.difficulty>2).map(u=>({...u,qualityTier:u.qualityTier||"curated",optionNotes:u.optionNotes||tp[u.id]})),...T1.map(u=>({...u,qualityTier:u.qualityTier||"curated"})),...J1,...$1,...P1,...W1],Ct=[...F0,...V1(F0,1800)],K0=(u="")=>u.normalize("NFKC").replace(/[\s，。！？；：、“”‘’《》（）,.!?;:'"()[\]—…-]/gu,"").trim(),q0=(u,C)=>{var A;if(u.type==="multi"){const H=Array.isArray(C)?[...C].sort():[],_=Array.isArray(u.answer)?[...u.answer].sort():[];return H.length===_.length&&H.every((k,v)=>k===_[v])}if(u.type!=="fill")return C===u.answer;const p=K0(C);return((A=u.acceptedAnswers)!=null&&A.length?u.acceptedAnswers:[u.answer]).some(H=>K0(H)===p)},An=u=>u.type==="fill"?u.answer:u.type==="multi"?`选项 ${u.answer.join("、")}`:`选项 ${u.answer}`,t2=({subject:u="all",difficulty:C="all",topicId:p="all"}={})=>Ct.filter(m=>(u==="all"||m.subject===u)&&(C==="all"||m.difficulty===Number(C))&&(p==="all"||m.topicId===p&&!m.crossChapter)),tl={chemistry:{id:"chemistry",name:"化学",short:"化",range:"必修第一册 · 全册",accent:"#d45a3f",soft:"#f5d8cf"},biology:{id:"biology",name:"生物",short:"生",range:"必修1 · 分子与细胞全册",accent:"#257266",soft:"#d6e9e3"},chinese:{id:"chinese",name:"语文",short:"语",range:"必修上册 · 理解性默写",accent:"#6651a8",soft:"#e5dff4"}},It=[{id:"chem-classification",subject:"chemistry",order:1,title:"物质的分类及转化",shortTitle:"物质分类",summary:"纯净物、混合物与分散系",points:["胶体的本质特征是分散质粒子直径在 1～100 nm。","丁达尔效应可用于区分胶体和溶液。","酸性、碱性氧化物要同时看组成与反应产物。"],formula:"分散系 = 分散质 + 分散剂"},{id:"chem-ion",subject:"chemistry",order:2,title:"离子反应",shortTitle:"离子反应",summary:"离子共存与离子方程式",points:["拆写顺序：强酸、强碱和可溶性盐写成离子。","沉淀、气体、弱电解质和水保留化学式。","判断离子共存时同时看颜色、酸碱性及是否发生反应。"],formula:"H⁺ + OH⁻ → H₂O"},{id:"chem-redox",subject:"chemistry",order:3,title:"氧化还原反应",shortTitle:"氧化还原",summary:"化合价、电子转移与守恒",points:["升失氧：化合价升高、失电子、被氧化。","降得还：化合价降低、得电子、被还原。","先找变价元素，再用得失电子守恒配平。"],formula:"失电子总数 = 得电子总数"},{id:"chem-sodium",subject:"chemistry",order:4,title:"钠及其化合物",shortTitle:"钠及其化合物",summary:"Na₂O₂、碳酸钠与碳酸氢钠",points:["钠在空气中燃烧生成淡黄色 Na₂O₂。","Na₂O₂ 中氧元素为 -1 价，遇水、CO₂ 均可放出 O₂。","NaHCO₃ 热稳定性弱于 Na₂CO₃，可用于鉴别。"],formula:"2Na₂O₂ + 2H₂O → 4NaOH + O₂↑"},{id:"chem-chlorine",subject:"chemistry",order:5,title:"氯及其化合物",shortTitle:"氯及其化合物",summary:"氯水、漂白液与氯离子检验",points:["Cl₂ 与水反应生成 HCl 和 HClO。","HClO 具有弱酸性和漂白性，见光易分解。","Cl⁻ 可用 AgNO₃ 溶液和稀硝酸检验。"],formula:"Cl₂ + H₂O ⇌ HCl + HClO"},{id:"chem-mole",subject:"chemistry",order:6,title:"物质的量与摩尔质量",shortTitle:"物质的量",summary:"微粒数、质量与摩尔质量",points:["物质的量描述的是粒子集合，单位是 mol。","以 g·mol⁻¹ 为单位时，摩尔质量在数值上等于相对分子质量。","计算先统一单位，再判断微粒种类和数目。"],formula:"n = m / M = N / Nₐ"},{id:"chem-gas",subject:"chemistry",order:7,title:"气体摩尔体积",shortTitle:"气体摩尔体积",summary:"标准状况、气体体积与混合气体",points:["标准状况下，气体摩尔体积约为 22.4 L·mol⁻¹。","22.4 L·mol⁻¹ 只适用于气体，不适用于水、酒精等液体。","同温同压下，相同体积的任何气体含有相同数目的分子。"],formula:"n = V / Vₘ（标准状况 Vₘ ≈ 22.4 L·mol⁻¹）"},{id:"chem-iron",subject:"chemistry",order:8,title:"铁及其化合物",shortTitle:"铁及其化合物",summary:"Fe、Fe²⁺、Fe³⁺、铁的氢氧化物与检验",points:["Fe²⁺具有还原性，易被Cl₂、H₂O₂、酸性KMnO₄等氧化为Fe³⁺。","Fe³⁺具有氧化性，可被Fe、Cu、I⁻等还原为Fe²⁺。","Fe(OH)₂在空气中会迅速被氧化，颜色由白色经灰绿色变为红褐色。"],formula:"2Fe²⁺ + Cl₂ → 2Fe³⁺ + 2Cl⁻"},{id:"chem-metals",subject:"chemistry",order:9,title:"金属材料",shortTitle:"金属材料",summary:"镁、铝、合金与金属材料应用",points:["铝表面氧化膜可保护内部金属，Al₂O₃和Al(OH)₃具有两性。","合金通常比成分金属熔点低、硬度大，性能可通过组成和工艺调控。","金属冶炼方法与金属活泼性有关，Al常用电解熔融Al₂O₃制取。"],formula:"Al₂O₃ + 2NaOH → 2NaAlO₂ + H₂O"},{id:"chem-atom",subject:"chemistry",order:10,title:"原子结构与元素周期表",shortTitle:"原子结构",summary:"质子、中子、电子、核素与周期表位置",points:["质子数决定元素种类，中子数不同可形成同位素。","核外电子排布遵循能量最低、每层最多容纳和稳定结构规律。","元素周期表按原子序数递增排列，周期序与电子层数相关。"],formula:"质子数 = 核电荷数 = 中性原子的核外电子数"},{id:"chem-periodic",subject:"chemistry",order:11,title:"元素周期律",shortTitle:"元素周期律",summary:"原子半径、金属性、非金属性与化合价递变",points:["同周期从左到右，原子半径总体减小，金属性减弱、非金属性增强。","同主族从上到下，原子半径增大，金属性增强、非金属性减弱。","元素推断题要同时满足电子层结构、最外层电子数、半径和性质条件。"],formula:"最高正价 + |最低负价| = 8（非金属主族元素常见关系）"},{id:"chem-bond",subject:"chemistry",order:12,title:"化学键",shortTitle:"化学键",summary:"离子键、共价键与物质构成",points:["离子键通常形成于活泼金属与活泼非金属之间。","共价键可分为极性键和非极性键，键的断裂与形成伴随能量变化。","物质中可能同时存在离子键和共价键，不能只凭组成元素机械判断。"],formula:"原子间通过共用电子对形成共价键"},{id:"bio-cell-intro",subject:"biology",order:1,title:"走近细胞",shortTitle:"走近细胞",summary:"细胞学说与原核、真核细胞",points:["细胞是生物体结构和功能的基本单位。","病毒没有细胞结构，必须依赖活细胞增殖。","原核细胞没有核膜包被的细胞核，但有拟核。"],formula:"生命活动离不开细胞"},{id:"bio-elements",subject:"biology",order:2,title:"细胞中的元素和化合物",shortTitle:"元素与化合物",summary:"水、无机盐、糖类、蛋白质与核酸",points:["水是活细胞中含量最多的化合物。","蛋白质多样性与氨基酸种类、数目、排列顺序及空间结构有关。","DNA 与 RNA 都由核苷酸组成，但五碳糖和碱基不完全相同。"],formula:"氨基酸 → 肽链 → 蛋白质"},{id:"bio-organelles",subject:"biology",order:3,title:"细胞膜与细胞器",shortTitle:"膜与细胞器",summary:"膜系统、分工合作与物质运输",points:["线粒体、叶绿体和细胞核都有双层膜。","核糖体没有膜结构，是蛋白质合成的场所。","分泌蛋白依次经过核糖体、内质网、高尔基体。"],formula:"核糖体 → 内质网 → 高尔基体 → 细胞膜"},{id:"bio-nucleus",subject:"biology",order:4,title:"细胞核",shortTitle:"细胞核",summary:"结构、功能与遗传信息控制",points:["细胞核是遗传信息库，是细胞代谢和遗传的控制中心。","染色质主要由 DNA 和蛋白质组成。","核孔实现核质之间频繁的物质交换和信息交流。"],formula:"染色质 ⇌ 染色体（同一物质，不同时期）"},{id:"bio-protein",subject:"biology",order:5,title:"蛋白质与核酸",shortTitle:"蛋白质与核酸",summary:"氨基酸、肽键、核酸组成与生物功能",points:["氨基酸通过脱水缩合形成肽键，肽键数通常等于脱水数。","蛋白质多样性取决于氨基酸种类、数目、排列顺序和空间结构。","DNA与RNA在五碳糖、碱基和功能上存在差异。"],formula:"氨基酸 — 脱水缩合 → 肽链 → 蛋白质"},{id:"bio-transport",subject:"biology",order:6,title:"物质的输入和输出",shortTitle:"跨膜运输",summary:"自由扩散、协助扩散、主动运输与膜泡运输",points:["自由扩散和协助扩散不消耗ATP，主动运输通常逆浓度梯度并消耗能量。","载体蛋白具有特异性，可发生构象变化；通道蛋白不与其运输的分子结合。","大分子和颗粒物质可经胞吞、胞吐完成跨膜运输。"],formula:"主动运输 = 载体 + 能量（通常）"},{id:"bio-enzyme",subject:"biology",order:7,title:"酶与ATP",shortTitle:"酶与ATP",summary:"酶促反应、影响因素与能量货币",points:["酶通过降低化学反应的活化能提高反应速率。","温度、pH、底物浓度和酶浓度都会影响酶促反应。","ATP水解释放能量，ADP与Pi可重新合成ATP。"],formula:"ATP ⇌ ADP + Pi + 能量"},{id:"bio-respiration",subject:"biology",order:8,title:"细胞呼吸",shortTitle:"细胞呼吸",summary:"有氧呼吸、无氧呼吸与实验分析",points:["有氧呼吸三个阶段分别发生在细胞质基质、线粒体基质和线粒体内膜。","无氧呼吸在细胞质基质中进行，不同生物可生成乳酸或乙醇和CO₂。","氧浓度、温度和水分等条件会影响细胞呼吸方式与强度。"],formula:"C₆H₁₂O₆ + 6O₂ + 6H₂O → 6CO₂ + 12H₂O + 能量"},{id:"bio-photosynthesis",subject:"biology",order:9,title:"光合作用",shortTitle:"光合作用",summary:"光反应、暗反应与影响光合作用的因素",points:["光反应发生在类囊体薄膜，水的光解产生O₂、NADPH和ATP。","暗反应发生在叶绿体基质，CO₂被固定并最终还原为糖类。","光照、CO₂浓度、温度和色素含量都会影响光合速率。"],formula:"6CO₂ + 12H₂O → C₆H₁₂O₆ + 6O₂ + 6H₂O"},{id:"bio-cell-cycle",subject:"biology",order:10,title:"细胞的增殖",shortTitle:"细胞增殖",summary:"细胞周期、有丝分裂与染色体变化",points:["有丝分裂保持亲子代细胞染色体数目稳定。","分裂间期完成DNA复制和有关蛋白质合成，细胞有适度生长。","染色体、染色单体和DNA分子数在分裂各期具有不同关系。"],formula:"染色体数 = 着丝粒数"},{id:"bio-differentiation",subject:"biology",order:11,title:"细胞的分化、衰老和死亡",shortTitle:"分化与生命历程",summary:"细胞分化、全能性、衰老、凋亡与癌变",points:["细胞分化的实质是基因的选择性表达，遗传物质通常不变。","细胞凋亡是程序性死亡，与细胞坏死在机制和环境影响上不同。","癌细胞具有无限增殖、形态改变和接触抑制丧失等特征。"],formula:"分化 = 基因选择性表达"},{id:"cn-poetry-early",subject:"chinese",order:1,title:"古诗词：从长沙到田园",shortTitle:"古诗词起步",summary:"《沁园春·长沙》《短歌行》《归园田居》",points:["先抓题干中的情感或手法提示，再定位对应句子。","注意“问”“山不厌高”“羁鸟恋旧林”等关键意象。","默写以字形准确为先，标点和空格不影响本站判分。"],formula:"问苍茫大地，谁主沉浮？"},{id:"cn-tang",subject:"chinese",order:2,title:"唐诗三首与人生感慨",shortTitle:"唐诗默写",summary:"《
