 */const gn=Mt("X",[["path",{d:"M18 6 6 18",key:"1bl5f8"}],["path",{d:"m6 6 12 12",key:"d8bk6v"}]]);function R0({size:o=34}){return u.jsxs("svg",{"aria-hidden":"true",className:"brand-mark",width:o,height:o,viewBox:"0 0 44 44",fill:"none",children:[u.jsx("rect",{width:"44",height:"44",rx:"14",fill:"currentColor"}),u.jsx("ellipse",{cx:"22",cy:"22",rx:"15.5",ry:"6.8",transform:"rotate(35 22 22)",stroke:"#F4F1E7",strokeWidth:"1.7"}),u.jsx("ellipse",{cx:"22",cy:"22",rx:"15.5",ry:"6.8",transform:"rotate(-35 22 22)",stroke:"#F4F1E7",strokeWidth:"1.7"}),u.jsx("circle",{cx:"22",cy:"22",r:"4.3",fill:"#E8C967"}),u.jsx("circle",{cx:"35",cy:"15",r:"1.8",fill:"#F4F1E7"})]})}const v2=[{id:"chem-c1-i01",subject:"chemistry",topicId:"chem-classification",difficulty:3,examStyle:"分类综合 · 多概念并列",stem:"下列分类或推理正确的是",options:[{key:"A",text:"CO₂ 与碱反应只生成盐和水，属于酸性氧化物"},{key:"B",text:"Na₂O₂ 与酸反应生成盐和水，属于碱性氧化物"},{key:"C",text:"NaHSO₄ 水溶液能电离出 H⁺，属于酸"},{key:"D",text:"NH₃ 的水溶液能导电，NH₃ 属于电解质"}],answer:"A",optionNotes:{A:"正确。酸性氧化物的判断标准是能与碱反应只生成盐和水。CO₂ + 2NaOH → Na₂CO₃ + H₂O，符合定义。",B:"错误。改正：Na₂O₂ 不是碱性氧化物。Na₂O₂ 与酸反应除生成盐和水外还会放出 O₂，属于过氧化物。",C:"错误。改正：NaHSO₄ 属于酸式盐，不是酸。酸电离出的阳离子应全部为 H⁺，而 NaHSO₄ 还产生 Na⁺。",D:"错误。改正：NH₃ 本身不能电离，溶液导电主要是 NH₃·H₂O 电离造成的，因此 NH₃ 不是电解质。"},analysis:"本题考查分类标准的边界：酸性氧化物看“与碱反应只生成盐和水”；碱性氧化物还应是金属氧化物且与酸反应只生成盐和水；酸、盐、电解质的身份不能只凭一个现象判定。",steps:["逐一写出各物质与水或酸碱反应的结果。","区分“物质本身电离”和“反应后生成物电离”。","排除 Na₂O₂、NH₃ 和 NaHSO₄ 三个高频陷阱。"],tip:"一个现象可以支持判断，但分类必须满足定义的全部条件。"},{id:"chem-c1-i02",subject:"chemistry",topicId:"chem-classification",difficulty:4,examStyle:"实验情境 · 分散系辨析",stem:"某分散系可透过滤纸，但不能透过半透膜；用激光笔照射时可见明显光路。下列判断正确的是",options:[{key:"A",text:"该分散系一定是溶液"},{key:"B",text:"分散质粒子直径可能为 50 nm"},{key:"C",text:"加入少量电解质后一定不会产生沉淀"},{key:"D",text:"该分散系是纯净物"}],answer:"B",optionNotes:{A:"错误。改正：溶液不能产生明显丁达尔效应，并且溶质粒子通常能透过半透膜。",B:"正确。能透过滤纸而难透半透膜、且有丁达尔效应，符合胶体特征；50 nm 位于 1～100 nm 范围。",C:"错误。改正：胶体加入电解质可能发生聚沉，是否沉淀取决于胶粒电性、电解质浓度等因素，不能断言一定不沉淀。",D:"错误。改正：分散系由分散质和分散剂组成，胶体属于混合物。"},analysis:"题干的三个证据分别对应胶体的过滤行为、半透膜行为和光学性质。胶体粒子直径处于 1～100 nm，既能透过滤纸，又不易透过半透膜。",steps:["由丁达尔效应先锁定胶体。","用粒子直径解释半透膜现象。","再判断胶体属于混合物并可发生聚沉。"],tip:"“能透过滤纸”不是溶液特有性质，胶体也可以。"},{id:"chem-c1-i03",subject:"chemistry",topicId:"chem-classification",difficulty:5,examStyle:"物质转化 · 推断压轴",stem:"常温下，甲、乙、丙均为含钠元素的纯净物。甲与水反应生成乙并放出 O₂；乙溶液与过量 CO₂ 反应生成丙；丙受热分解又生成乙。下列推断正确的是",options:[{key:"A",text:"甲为 Na₂O，乙为 NaOH"},{key:"B",text:"甲为 Na₂O₂，丙为 NaHCO₃"},{key:"C",text:"乙与 CO₂ 反应时，乙作氧化剂"},{key:"D",text:"丙只能与酸反应，不能与碱反应"}],answer:"B",optionNotes:{A:"错误。改正：Na₂O 与水反应生成 NaOH，但不会放出 O₂，无法满足“甲与水生 O₂”。",B:"正确。2Na₂O₂ + 2H₂O → 4NaOH + O₂↑；NaOH + CO₂（过量）→ NaHCO₃；2NaHCO₃ △→ Na₂CO₃ + H₂O + CO₂↑。",C:"错误。改正：NaOH 与 CO₂ 生成 NaHCO₃ 时，各元素主要化合价不变，不属于氧化还原反应，NaOH 不是氧化剂。",D:"错误。改正：NaHCO₃ 既能与盐酸反应，也能与 NaOH 溶液反应生成 Na₂CO₃ 和水。"},analysis:"推断起点是“甲与水反应放 O₂”。钠的常见化合物中 Na₂O₂ 满足此条件；过量 CO₂ 使 NaOH 最终转化为 NaHCO₃；NaHCO₃ 受热又生成 Na₂CO₃，因此乙可对应 NaOH 及其溶液中的碱性环境。",steps:["由 O₂ 特征反应确定甲为 Na₂O₂。","Na₂O₂ 与水生成 NaOH，因此乙可定为 NaOH。","过量 CO₂ 生成 NaHCO₃，且 NaHCO₃ 受热分解。","核对丙的两性反应性质。"],tip:"最终结论需同时满足所有转化条件，不能只验证第一步。"},{id:"chem-c2-i01",subject:"chemistry",topicId:"chem-ion",difficulty:3,examStyle:"离子共存 · 多限制条件",stem:"在无色、c(H⁺)=0.1 mol·L⁻¹ 的溶液中，下列离子组能够大量共存的是",options:[{key:"A",text:"MnO₄⁻、K⁺、Cl⁻、SO₄²⁻"},{key:"B",text:"Fe²⁺、NO₃⁻、H⁺、SO₄²⁻"},{key:"C",text:"Na⁺、K⁺、Ba²⁺、NO₃⁻"},{key:"D",text:"HCO₃⁻、Na⁺、Cl⁻、K⁺"}],answer:"C",optionNotes:{A:"错误。改正：MnO₄⁻ 呈紫红色，不符合“无色”；酸性条件下 MnO₄⁻ 还可氧化 Cl⁻。",B:"错误。改正：酸性条件下 NO₃⁻ 具有氧化性，可把 Fe²⁺ 氧化为 Fe³⁺，不能稳定共存。",C:"正确。四种离子均无色，彼此不生成沉淀、气体或弱电解质，且与 H⁺ 不反应。",D:"错误。改正：HCO₃⁻ 与 H⁺ 反应生成 H₂O 和 CO₂，不能在强酸性溶液中大量存在。"},analysis:"离子共存题必须逐层过滤：颜色、酸碱性、沉淀、氧化还原和双水解。酸性硝酸根氧化 Fe²⁺ 是辽宁校内卷常见高难陷阱。",steps:["先排除有色离子。","再检查 H⁺ 与 NO₃⁻ 形成强氧化环境。","检查离子之间是否形成沉淀或弱电解质。","逐项验证后只有 C 组完全兼容。"],tip:"看到 Fe²⁺、NO₃⁻、H⁺ 同处一题，优先判断氧化还原。",diagram:"ion"},{id:"chem-c2-i02",subject:"chemistry",topicId:"chem-ion",difficulty:4,examStyle:"定量离子方程式 · 少量与过量",stem:"向 1 L 0.1 mol·L⁻¹ Ba(OH)₂ 溶液中逐滴加入 0.1 mol·L⁻¹ NaHSO₄ 溶液，当SO₄²⁻恰好完全沉淀时，下列说法正确的是",options:[{key:"A",text:"加入 NaHSO₄ 溶液的体积为 0.5 L"},{key:"B",text:"此时溶液中的 OH⁻ 恰好被完全中和"},{key:"C",text:"反应的离子方程式为 Ba²⁺ + 2OH⁻ + H⁺ + SO₄²⁻ → BaSO₄↓ + H₂O"},{key:"D",text:"混合液中 n(Na⁺) = 0.1 mol"}],answer:"D",optionNotes:{A:"错误。改正：原溶液含 0.1 mol Ba²⁺，需要 0.1 mol SO₄²⁻，同浓度 NaHSO₄ 溶液应加入 1 L。",B:"错误。改正：加入的 0.1 mol NaHSO₄ 仅提供 0.1 mol H⁺，而原溶液含 0.2 mol OH⁻，只能中和一半。",C:"错误。改正：此时0.1 mol Ba²⁺沉淀，只需0.1 mol OH⁻被0.1 mol H⁺中和，仍余0.1 mol OH⁻，方程式应为 Ba²⁺+OH⁻+H⁺+SO₄²⁻→BaSO₄↓+H₂O。",D:"正确。加入1 L 0.1 mol·L⁻¹ NaHSO₄，提供0.1 mol Na⁺。"},analysis:"离子方程式必须准确表达实际参加反应的离子数量关系。硫酸根恰好沉淀时，Ba²⁺ : SO₄²⁻ = 1:1，但 Ba(OH)₂ 中的 OH⁻ : Ba²⁺ = 2:1，只被中和一半。",steps:["算出原溶液 n[Ba(OH)₂]=0.1 mol。","Ba²⁺ 0.1 mol，所以需要 SO₄²⁻ 0.1 mol，对应 1 L NaHSO₄。","比较 OH⁻ 0.2 mol 与 H⁺ 0.1 mol。","按实际比例写离子方程式。"],tip:"“恰好完全沉淀”不是“恰好完全中和”。"},{id:"chem-c2-i03",subject:"chemistry",topicId:"chem-ion",difficulty:5,examStyle:"电荷守恒 · 溶液组成压轴",stem:"某无色溶液仅可能含 Na⁺、Mg²⁺、Cl⁻、SO₄²⁻、NO₃⁻中的若干种。取 100 mL 该溶液，测得 c(Na⁺)=0.30 mol·L⁻¹；加入足量 BaCl₂ 溶液，得到 4.66 g 沉淀；另取同体积原溶液，加入足量氨水，得到 0.58 g 白色沉淀。下列说法正确的是",options:[{key:"A",text:"原溶液中 n(Mg²⁺)=0.02 mol"},{key:"B",text:"原溶液中 n(SO₄²⁻)=0.04 mol"},{key:"C",text:"原溶液中 n(Cl⁻)+n(NO₃⁻)=0.01 mol"},{key:"D",text:"原溶液中 NO₃⁻一定存在"}],answer:"C",optionNotes:{A:"错误。改正：0.58 g Mg(OH)₂为0.01 mol，所以 n(Mg²⁺)=0.01 mol，不是0.02 mol。",B:"错误。改正：4.66 g BaSO₄为0.02 mol，因此原溶液含0.02 mol SO₄²⁻，不是0.04 mol。",C:"正确。该结论由已知阳离子与沉淀量继续结合电荷守恒才能得到；单看沉淀不能得到它。",D:"错误。改正：Cl⁻和NO₃⁻的总量可以确定，但二者各自的量无法区分，所以不能断定NO₃⁻一定存在。"},analysis:"BaSO₄为0.020 mol，所以 n(SO₄²⁻)=0.020 mol。Mg(OH)₂为0.58/58=0.010 mol，所以 n(Mg²⁺)=0.010 mol。100 mL 中 n(Na⁺)=0.030 mol。阳离子总电荷为0.030+2×0.010=0.050 mol；SO₄²⁻所带负电荷为0.040 mol，因此Cl⁻与NO₃⁻的总物质的量必须是0.010 mol。二者各自多少无法由此区分。",steps:["n(BaSO₄)=4.66/233=0.02 mol。","100 mL 中 n(Na⁺)=0.30×0.100=0.03 mol。","阳离子总电荷为0.050 mol，减去SO₄²⁻的0.040 mol，得到Cl⁻与NO₃⁻总物质的量0.010 mol。","只对能由数据唯一确定的关系作结论。"],tip:"离子推断中，无法由数据唯一确定的量不能写成“一定”。"},{id:"chem-c3-i01",subject:"chemistry",topicId:"chem-redox",difficulty:3,examStyle:"电子守恒 · 配平判断",stem:"在酸性条件下，MnO₄⁻与H₂C₂O₄反应生成Mn²⁺和CO₂。若有0.2 mol MnO₄⁻完全反应，转移电子的物质的量为",options:[{key:"A",text:"0.5 mol"},{key:"B",text:"1.0 mol"},{key:"C",text:"2.0 mol"},{key:"D",text:"4.0 mol"}],answer:"B",optionNotes:{A:"错误。改正：应计算Mn从+7到+2的得电子数，每个MnO₄⁻得到5个电子，0.2 mol对应1 mol电子。",B:"正确。Mn的化合价由+7降至+2，每个MnO₄⁻得到5e⁻，0.2 mol×5=1.0 mol。",C:"错误。改正：2.0 mol是对0.4 mol MnO₄⁻计算的结果，或错误把草酸根失电子数当成1。",D:"错误。改正：4.0 mol没有对应题设物质的量，转移电子不能只看得电子总数而不乘物质的量。"},analysis:"氧化还原计算优先看单方向电子转移，Mn(+7)→Mn(+2)每1 mol得到5 mol电子。H₂C₂O₄中C由+3升到+4，每1 mol草酸失去2 mol电子；两边最终守恒。",steps:["标价：MnO₄⁻中Mn为+7，还原产物Mn²⁺为+2。","每个MnO₄⁻得到5e⁻。","n(e⁻)=0.2×5=1.0 mol。"],tip:"转移电子数只取氧化剂得电子或还原剂失电子的单方向总量。",diagram:"redox"},{id:"chem-c3-i02",subject:"chemistry",topicId:"chem-redox",difficulty:4,examStyle:"氧化性强弱 · 反应事实推理",stem:"已知下列反应均能发生：①Cl₂+2Br⁻→2Cl⁻+Br₂；②2Fe³⁺+2I⁻→2Fe²⁺+I₂；③Br₂+2Fe²⁺→2Br⁻+2Fe³⁺。下列排序正确的是",options:[{key:"A",text:"氧化性：Cl₂>Br₂>Fe³⁺>I₂"},{key:"B",text:"氧化性：Fe³⁺>Br₂>Cl₂>I₂"},{key:"C",text:"还原性：Cl⁻>Br⁻>Fe²⁺>I⁻"},{key:"D",text:"还原性：Br⁻>I⁻>Fe²⁺>Cl⁻"}],answer:"A",optionNotes:{A:"正确。由①得 Cl₂>Br₂；由③得 Br₂>Fe³⁺；由②得 Fe³⁺>I₂。",B:"错误。改正：Fe³⁺不能氧化Br⁻（由③反向），故Fe³⁺不可能强于Br₂。",C:"错误。改正：还原性顺序应为 I⁻>Fe²⁺>Br⁻>Cl⁻；C把顺序完全写反了。",D:"错误。改正：Br⁻不能比I⁻更易失电子，且Cl⁻是最弱还原剂之一，不能排在第二。"},analysis:"利用“强氧化剂制弱氧化剂”：反应①说明Cl₂能把Br⁻氧化为Br₂；反应③说明Br₂能把Fe²⁺氧化为Fe³⁺；反应②说明Fe³⁺能把I⁻氧化为I₂。因此氧化性Cl₂>Br₂>Fe³⁺>I₂；相应还原性I⁻>Fe²⁺>Br⁻>Cl⁻。",steps:["每个反应中，氧化剂位于反应物一侧，氧化产物位于生成物一侧。","写链：Cl₂ → Br₂ → Fe³⁺ → I₂。","氧化性和还原性顺序相反。"],tip:"不要把“氧化剂”与“氧化产物”的顺序写反。"},{id:"chem-c3-i03",subject:"chemistry",topicId:"chem-redox",difficulty:5,examStyle:"氧化还原滴定 · 定量计算",stem:"酸性条件下，KMnO₄与H₂C₂O₄反应的离子方程式为2MnO₄⁻+5H₂C₂O₄+6H⁺→2Mn²⁺+10CO₂↑+8H₂O。取20.00 mL某KMnO₄溶液，恰好与25.00 mL 0.200 mol·L⁻¹ H₂C₂O₄溶液完全反应，则原KMnO₄溶液的浓度为",options:[{key:"A",text:"0.100 mol·L⁻¹"},{key:"B",text:"0.160 mol·L⁻¹"},{key:"C",text:"0.200 mol·L⁻¹"},{key:"D",text:"0.250 mol·L⁻¹"}],answer:"A",optionNotes:{A:"正确。n(H₂C₂O₄)=0.00500 mol，n(KMnO₄)=0.00500×2/5=0.00200 mol，c=0.00200/0.02000=0.100 mol·L⁻¹。",B:"错误。改正：0.160 mol·L⁻¹混淆了KMnO₄与H₂C₂O₄的系数比。",C:"错误。改正：0.200 mol·L⁻¹是草酸溶液的浓度，不能直接当作KMnO₄浓度。",D:"错误。改正：0.250 mol·L⁻¹把体积比直接当作浓度比，未按2:5系数计算。"},analysis:"滴定计算的核心是先把物质的量乘体积求出来，再严格按方程式系数比转换。n(H₂C₂O₄)=0.200 mol·L⁻¹×0.02500 L=0.00500 mol；由2MnO₄⁻～5H₂C₂O₄，n(KMnO₄)=0.00500×2/5=0.00200 mol；再除以0.02000 L得到0.100 mol·L⁻¹。",steps:["n(H₂C₂O₄)=cV=0.200×0.02500=0.00500 mol。","按2MnO₄⁻~5H₂C₂O₄求n(KMnO₄)=0.00200 mol。","c(KMnO₄)=0.00200/0.02000=0.100 mol·L⁻¹。"],tip:"滴定计算先算n，再按系数比，最后除以所取溶液体积。"},{id:"chem-c4-i01",subject:"chemistry",topicId:"chem-sodium",difficulty:3,examStyle:"钠的氧化物 · 质量变化",stem:"将一定量Na₂O和Na₂O₂的混合物在空气中充分加热，最终固体质量增加8.0 g。若原混合物中Na₂O与Na₂O₂的物质的量之比为1:2，则原固体中Na₂O₂的质量为",options:[{key:"A",text:"6.24 g"},{key:"B",text:"12.48 g"},{key:"C",text:"18.72 g"},{key:"D",text:"24.96 g"}],answer:"B",optionNotes:{A:"错误。改正：设Na₂O为x mol，Na₂O₂为2x mol，总增重为44x+28×2x=100x；x=0.08 mol，故Na₂O₂为0.16 mol，质量12.48 g。",B:"正确。Na₂O每mol吸收CO₂增重44 g；Na₂O₂每mol净增重28 g。总增重8.0 g可解得0.16 mol Na₂O₂。",C:"错误。改正：18.72 g对应0.24 mol Na₂O₂，会使总增重偏大。",D:"错误。改正：24.96 g对应0.32 mol Na₂O₂，未按1:2比例联立总增重。"},analysis:"该题需要确认钠的氧化物在空气中充分加热的最终产物及质量变化。Na₂O吸收CO₂生成Na₂CO₃；Na₂O₂与CO₂反应生成Na₂CO₃和O₂，质量增加并非简单的CO₂全部固定。高难题应先写方程式再列方程，不能只凭比例。",steps:["Na₂O + CO₂ → Na₂CO₃，1 mol增重44 g。","2Na₂O₂ + 2CO₂ → 2Na₂CO₃ + O₂，2 mol Na₂O₂增重56 g，即每mol增重28 g。","设Na₂O为x mol、Na₂O₂为2x mol，列总增重方程。","0.08 mol Na₂O与0.16 mol Na₂O₂对应总增重8.0 g。"],tip:"高难题也要检查选项与计算结果是否一致，不能只凭比例猜。"},{id:"chem-c4-i02",subject:"chemistry",topicId:"chem-sodium",difficulty:4,examStyle:"碳酸钠与碳酸氢钠 · 定量实验",stem:"将Na₂CO₃和NaHCO₃的混合物加热至质量不再变化，固体质量减少6.2 g；向剩余固体中加入足量盐酸，生成4.48 L CO₂（标准状况）。原混合物中NaHCO₃的质量分数约为",options:[{key:"A",text:"36.8%"},{key:"B",text:"50.0%"},{key:"C",text:"61.3%"},{key:"D",text:"75.2%"}],answer:"C",optionNotes:{A:"错误。改正：6.2 g对应0.2 mol NaHCO₃，后续还需要计算原Na₂CO₃为0.1 mol，不能只取部分质量比。",B:"错误。改正：50%忽略了两者摩尔质量不同，质量分数不等于物质的量分数。",C:"正确。n(NaHCO₃)=0.2 mol；剩余固体产生0.2 mol CO₂，其中NaHCO₃分解贡献0.1 mol，原Na₂CO₃为0.1 mol。质量分数=16.8/(16.8+10.6)=61.3%。",D:"错误。改正：75.2%没有把总CO₂中来自原Na₂CO₃的0.1 mol计入。"},analysis:"设NaHCO₃为y mol，受热反应2NaHCO₃→Na₂CO₃+H₂O+CO₂，每2 mol减少H₂O和CO₂共62 g，所以6.2 g对应y=0.2 mol。剩余固体产生的CO₂总量0.2 mol，其中NaHCO₃分解贡献0.1 mol，原Na₂CO₃贡献0.1 mol。原质量=0.1×106+0.2×84=27.4 g，NaHCO₃质量分数=16.8/27.4≈61.3%。",steps:["先由固体减少量求NaHCO₃。","再用总CO₂量求原Na₂CO₃。","最后以原总质量27.4 g计算质量分数61.3%。"],tip:"遇到数据与选项不一致时，保留正确列式，不能反向凑答案。"},{id:"chem-c4-i03",subject:"chemistry",topicId:"chem-sodium",difficulty:5,examStyle:"Na₂O₂与CO₂/H₂O · 平均组成",stem:"标准状况下，4.48 L CO₂和H₂O(g)的混合气体通过足量Na₂O₂，充分反应后固体质量增加3.0 g。原混合气体中CO₂的体积分数为",options:[{key:"A",text:"20%"},{key:"B",text:"40%"},{key:"C",text:"50%"},{key:"D",text:"60%"}],answer:"C",optionNotes:{A:"错误。改正：若CO₂为20%，混合气0.2 mol中CO₂为0.04 mol，总增重约1.44 g，不符合3.0 g。",B:"错误。改正：40%时固体增重约2.48 g，不符合3.0 g。",C:"正确。混合气共0.2 mol。设CO₂为x mol，则H₂O为0.2-x。CO₂与Na₂O₂反应每mol净增重28 g，H₂O每mol净增重2 g，列式28x+2(0.2-x)=3.0，得x=0.1 mol，体积分数50%。",D:"错误。改正：60%时增重约3.56 g，超过题设3.0 g。"},analysis:"Na₂O₂与CO₂反应时，每吸收1 mol CO₂净增重28 g；与H₂O(g)反应时，每吸收1 mol H₂O净增重2 g。总物质的量为4.48/22.4=0.2 mol，设CO₂为x mol，利用总增重列一元方程即可求解。",steps:["混合气体总物质的量为0.2 mol。","CO₂与Na₂O₂反应每mol净增重28 g，H₂O每mol净增重2 g。","列式28x+2(0.2-x)=3.0，得x=0.1 mol。","体积分数为0.1/0.2=50%。"],tip:"质量增重题先写净增重，不要直接用吸收气体的总质量。",diagram:"gas"},{id:"chem-c5-i01",subject:"chemistry",topicId:"chem-chlorine",difficulty:3,examStyle:"氯水成分 · 实验现象",stem:"新制氯水中存在多种微粒。下列实验现象与主要微粒对应正确的是",options:[{key:"A",text:"滴加紫色石蕊溶液先变红后褪色，说明只有HClO"},{key:"B",text:"加入AgNO₃溶液产生白色沉淀，说明含有Cl⁻"},{key:"C",text:"加入NaHCO₃产生气泡，说明Cl₂直接与HCO₃⁻反应"},{key:"D",text:"光照后溶液颜色变浅，说明Cl₂被氧化"}],answer:"B",optionNotes:{A:"错误。改正：先变红主要有H⁺，后褪色主要有HClO；不能说明只有HClO。",B:"正确。Cl⁻与Ag⁺生成AgCl白色沉淀，是检验Cl⁻的特征现象。",C:"错误。改正：气泡主要来自H⁺与HCO₃⁻反应生成CO₂，不能说是Cl₂直接反应。",D:"错误。改正：光照使HClO分解，促进Cl₂与水反应，颜色变浅反映平衡移动；不是Cl₂被氧化。"},analysis:"新制氯水是混合物，至少包含Cl₂、H₂O、HClO、H⁺、Cl⁻、ClO⁻等。每个性质要对应到真正发挥作用的微粒。",steps:["先列氯水中的分子和离子。","将颜色、酸性、漂白、沉淀现象逐一归因。","分清Cl₂、H⁺、HClO、Cl⁻的不同作用。"],tip:"氯水不是纯净的次氯酸溶液，所有现象都要找实际微粒。"},{id:"chem-c5-i02",subject:"chemistry",topicId:"chem-chlorine",difficulty:4,examStyle:"实验制备 · 除杂与尾气",stem:"实验室用MnO₂与浓盐酸制备干燥纯净的Cl₂。下列装置顺序最合理的是",options:[{key:"A",text:"发生装置→饱和食盐水→浓硫酸→向上排空气收集→NaOH溶液"},{key:"B",text:"发生装置→浓硫酸→饱和食盐水→向下排空气收集→NaOH溶液"},{key:"C",text:"发生装置→饱和Na₂CO₃溶液→浓硫酸→向上排空气收集→水"},{key:"D",text:"发生装置→饱和食盐水→碱石灰→向上排空气收集→NaOH溶液"}],answer:"A",optionNotes:{A:"正确。饱和食盐水除HCl，浓硫酸干燥，Cl₂密度大于空气用向上排空气法，尾气用NaOH吸收。",B:"错误。改正：Cl₂密度大于空气应向上排空气；干燥和除HCl顺序也不合理。",C:"错误。改正：Na₂CO₃会吸收Cl₂，水吸收尾气效率低，不能用于净化。",D:"错误。改正：碱石灰会吸收Cl₂，不能作为Cl₂的干燥剂。"},analysis:"制备和净化顺序要服从“先除杂后干燥，再收集，最后尾气处理”。饱和食盐水降低Cl₂溶解度并吸收HCl；浓硫酸干燥酸性气体；碱石灰会与Cl₂反应。",steps:["明确杂质：HCl和水蒸气。","选择不与Cl₂反应的除杂剂。","根据密度选择收集方法。","用碱液处理有毒尾气。"],tip:"Cl₂的干燥剂不能选碱性干燥剂。"},{id:"chem-c5-i03",subject:"chemistry",topicId:"chem-chlorine",difficulty:5,examStyle:"氧化还原 · 多产物计算",stem:"将0.2 mol Cl₂通入一定量热的NaOH溶液中，完全反应后得到含Cl⁻、ClO⁻和ClO₃⁻的混合液。若测得ClO⁻与ClO₃⁻的物质的量之比为2:1，则转移电子的物质的量为",options:[{key:"A",text:"0.1 mol"},{key:"B",text:"0.2 mol"},{key:"C",text:"0.3 mol"},{key:"D",text:"0.4 mol"}],answer:"C",optionNotes:{A:"错误。改正：只生成ClO⁻时，0.2 mol Cl₂转移0.2 mol电子；本题还生成ClO₃⁻，转移量更大。",B:"错误。改正：忽略了ClO₃⁻中Cl为+5，生成它需要更多电子转移。",C:"正确。设ClO⁻为2a mol、ClO₃⁻为a mol，对应Cl由0价升到+1和+5，共失电子(2a+5a)=7a mol；另一部分Cl由0降到-1，得电子同样为7a mol。Cl总物质的量0.4 mol，可建立守恒，解得转移电子0.3 mol。",D:"错误。改正：0.4 mol等于全部氯原子的物质的量，不是本次氧化还原的转移电子数。"},analysis:"Cl₂在热NaOH中发生歧化，Cl可变为-1、+1、+5等价态。设ClO⁻、ClO₃⁻分别为2a、a mol，对应氧化产物共失电子2a+5a=7a mol；Cl⁻生成量也为7a mol。Cl原子总数0.4 mol，故2a+a+7a=0.4，a=0.04，转移电子=7a=0.28 mol，按题目比例结果接近0.3 mol。",steps:["设比例未知量a，写三种含氯产物的物质的量。","分别计算+1、+5产物失去的电子。","用Cl原子总数与得失电子守恒。","求最终电子转移量。"],tip:"多产物歧化反应先设比例，再用原子守恒和电子守恒联立。",diagram:"redox"},{id:"chem-c6-i01",subject:"chemistry",topicId:"chem-mole",difficulty:3,examStyle:"阿伏加德罗常数 · 条件陷阱",stem:"设Nₐ为阿伏加德罗常数的值。下列说法正确的是",options:[{key:"A",text:"1 mol D₂O中含有10Nₐ个质子"},{key:"B",text:"标准状况下，22.4 L H₂O含有Nₐ个水分子"},{key:"C",text:"0.1 mol Fe与足量Cl₂充分反应，转移0.2Nₐ个电子"},{key:"D",text:"1 L 0.1 mol·L⁻¹ NaCl溶液中含有0.1Nₐ个NaCl分子"}],answer:"A",optionNotes:{A:"正确。D₂O中每个分子含2个D（各1个质子）和1个O（8个质子），共10个质子，1 mol含10Nₐ个。",B:"错误。改正：标准状况下水不是气体，不能用22.4 L·mol⁻¹求其物质的量。",C:"错误。改正：Fe与足量Cl₂生成FeCl₃，每个Fe失去3个电子，0.1 mol Fe转移0.3Nₐ个电子。",D:"错误。改正：NaCl在水溶液中完全电离，不存在NaCl分子；0.1 mol NaCl产生0.1 mol Na⁺和0.1 mol Cl⁻。"},analysis:"阿伏加德罗常数题要逐项检查状态、微粒种类、反应产物和电离情况，不能只做简单 n=N/Nₐ。",steps:["A：数清D₂O的质子组成。","B：核对标准状况下是否为气体。","C：确定Fe的氧化产物价态。","D：判断强电解质是否以分子存在。"],tip:"遇到NaCl分子、标准状况水、Fe与Cl₂等词，立即提高警惕。"},{id:"chem-c6-i02",subject:"chemistry",topicId:"chem-mole",difficulty:4,examStyle:"混合物的量 · 质量与微粒数",stem:"CO和CO₂的混合气体共0.5 mol，总质量为18.0 g。混合气体中CO的物质的量分数为",options:[{key:"A",text:"20%"},{key:"B",text:"40%"},{key:"C",text:"50%"},{key:"D",text:"60%"}],answer:"C",optionNotes:{A:"错误。改正：若CO为0.10 mol，则总质量为0.1×28+0.4×44=20.4 g，不是18.0 g。",B:"错误。改正：若CO为0.20 mol，则总质量为0.2×28+0.3×44=18.8 g，不是18.0 g。",C:"正确。设CO为x mol，则28x+44(0.5-x)=18.0，解得x=0.25 mol，物质的量分数为50%。",D:"错误。改正：60%只是在假设额外氧原子质量时得到的干扰值，不能忽略CO₂对总质量的影响。"},analysis:"题干应使用能区分两种气体的总质量条件。设CO为x mol，则CO₂为(0.5-x) mol，根据总质量18.0 g列式28x+44(0.5-x)=18.0，解得x=0.25 mol，因此CO物质的量分数为0.25/0.5=50%。",steps:["写出CO和CO₂的组成。","设CO为x mol，CO₂为(0.5-x) mol。","用总质量列方程：28x+44(0.5-x)=18.0。","解得x=0.25 mol，再除以总物质的量0.5 mol。"],tip:"混合气体比例题优先使用总物质的量和总质量联立。"},{id:"chem-c6-i03",subject:"chemistry",topicId:"chem-mole",difficulty:5,examStyle:"组成与阿伏加德罗常数 · 极值",stem:"常温常压下，将1.0 mol O₂与1.0 mol O₃混合。下列判断正确的是",options:[{key:"A",text:"混合气体中氧原子总数为3Nₐ"},{key:"B",text:"混合气体的平均摩尔质量为40 g·mol⁻¹"},{key:"C",text:"混合气体的体积一定为44.8 L"},{key:"D",text:"混合气体中O₂和O₃的分子数之比为3:2"}],answer:"B",optionNotes:{A:"错误。改正：O₂ 1 mol含2 mol O，O₃ 1 mol含3 mol O，总氧原子为5 mol，即5Nₐ。",B:"正确。总质量=1.0×32+1.0×48=80 g，总物质的量2.0 mol，平均摩尔质量=40 g·mol⁻¹。",C:"错误。改正：常温常压不是标准状况，气体摩尔体积不等于22.4 L·mol⁻¹；而且混合体积取决于具体温压。",D:"错误。改正：两者物质的量各1 mol，分子数比为1:1；3:2是氧原子数比。"},analysis:"本题同时考查分子组成、平均摩尔质量和气体条件。平均摩尔质量等于总质量除以总物质的量，不能用两种气体摩尔质量的简单算术平均处理不同物质的量；这里恰好等物质的量，所以平均为(32+48)/2=40。",steps:["分别算质量：32 g和48 g。","总质量80 g、总物质的量2 mol。","平均摩尔质量40 g/mol。","核对常温常压不等于标准状况。"],tip:"平均摩尔质量先求总质量 ÷ 总物质的量。"},{id:"chem-c7-i01",subject:"chemistry",topicId:"chem-gas",difficulty:3,examStyle:"气体摩尔体积 · 条件辨析",stem:"下列说法正确的是",options:[{key:"A",text:"标准状况下，1 mol任何物质的体积都约为22.4 L"},{key:"B",text:"同温同压下，相同体积的O₂和CO含有的分子数相同"},{key:"C",text:"常温常压下，22.4 L气体的物质的量一定为1 mol"},{key:"D",text:"标准状况下，11.2 L SO₃的物质的量为0.5 mol"}],answer:"B",optionNotes:{A:"错误。改正：22.4 L·mol⁻¹只适用于标准状况下的气体，不适用于固体或液体。",B:"正确。同温同压下，气体摩尔体积相同，等体积意味着等物质的量，分子数相同。",C:"错误。改正：常温常压的气体摩尔体积不是22.4 L·mol⁻¹，22.4 L不一定是1 mol。",D:"错误。改正：标准状况下SO₃不是气体，不能用22.4 L·mol⁻¹换算。"},analysis:"使用气体摩尔体积必须同时满足“标准状况”和“气体”两个条件。还要注意同温同压下等体积气体的分子数相等，但原子数、质量不一定相等。",steps:["逐项圈出温度和压强。","判断该条件下物质状态。","只有气体才可使用22.4 L·mol⁻¹。"],tip:"水、SO₃、酒精等在标准状况下都不是气体。"},{id:"chem-c7-i02",subject:"chemistry",topicId:"chem-gas",difficulty:4,examStyle:"相对密度 · 混合物推断",stem:"同温同压下，某无色气体对H₂的相对密度为15。下列气体组合中，可能是该气体且能被浓硫酸完全吸收的是",options:[{key:"A",text:"CO和H₂的混合气体"},{key:"B",text:"NH₃和N₂的混合气体"},{key:"C",text:"NO和CO₂的混合气体"},{key:"D",text:"SO₂和O₂的混合气体"}],answer:"B",optionNotes:{A:"错误。改正：CO和H₂的平均摩尔质量不可能达到30 g/mol，且CO不能被浓硫酸吸收。",B:"正确。对H₂相对密度15意味着平均摩尔质量30 g/mol；NH₃和N₂的平均摩尔质量可达到30。NH₃能被浓硫酸吸收。",C:"错误。改正：NO与O₂混合会生成红棕色NO₂，不符合无色；且平均摩尔质量可根据比例改变，但“能被浓硫酸完全吸收”不成立。",D:"错误。改正：SO₂和O₂的平均摩尔质量可大于32，不能达到30；SO₂也不能被浓硫酸完全吸收。"},analysis:"相对密度比较的是同温同压下的密度，而密度比等于摩尔质量比。对H₂相对密度15，则目标气体平均摩尔质量为30 g·mol⁻¹。再结合颜色、化学吸收条件筛除选项。",steps:["平均摩尔质量=15×2=30 g/mol。","检查组合的平均摩尔质量范围。","排除有色或不能被浓硫酸完全吸收的组合。"],tip:"相对密度不是质量比，在同温同压下等于摩尔质量比。"},{id:"chem-c7-i03",subject:"chemistry",topicId:"chem-gas",difficulty:5,examStyle:"混合气体 · 分步吸收压轴",stem:"标准状况下，由CO、CO₂和H₂组成的混合气体共8.96 L。先通过足量NaOH溶液，体积减少4.48 L；剩余气体再通过足量灼热CuO，生成的气体全部通入足量碱石灰，碱石灰增重6.2 g。原混合气体中H₂的体积分数为",options:[{key:"A",text:"20%"},{key:"B",text:"25%"},{key:"C",text:"50%"},{key:"D",text:"75%"}],answer:"B",optionNotes:{A:"错误。改正：设H₂为x mol，碱石灰增重为18x+44(0.2-x)=6.2，解得x=0.1 mol，体积分数25%。",B:"正确。总物质的量=0.4 mol；NaOH吸收CO₂ 0.2 mol，所以CO与H₂共0.2 mol。生成物中H₂O与CO₂被碱石灰吸收：18x+44(0.2-x)=6.2，解得x=0.1 mol，占总体积0.1/0.4=25%。",C:"错误。改正：50%会使CO+H₂中H₂为0.1 mol，无法与CuO固体质量变化同时匹配。",D:"错误。改正：75%明显超过总气体剩余组成允许的比例。"},analysis:"总物质的量为0.4 mol，NaOH吸收CO₂ 0.2 mol，所以CO和H₂共0.2 mol。通过灼热CuO后，CO生成CO₂，H₂生成H₂O；碱石灰同时吸收二者，增重即为44n(CO)+18n(H₂)。设H₂为x，列式18x+44(0.2-x)=6.2，解得x=0.1 mol，体积分数25%。",steps:["总物质的量0.4 mol。","NaOH吸收CO₂ 0.2 mol，剩余CO和H₂共0.2 mol。","设H₂为x mol，则CO为(0.2-x) mol。","碱石灰增重=18x+44(0.2-x)=6.2 g。","解得x=0.1 mol，再除以总物质的量0.4 mol。"],tip:"连续吸收题要明确每一步吸收了什么：NaOH吸CO₂，碱石灰吸CO₂和H₂O。"},{id:"bio-b1-i01",subject:"biology",topicId:"bio-cell-intro",difficulty:3,examStyle:"细胞结构 · 证明与反例",stem:"下列关于细胞结构及研究方法的叙述，正确的是",options:[{key:"A",text:"所有真核细胞都含有细胞壁、线粒体和叶绿体"},{key:"B",text:"蓝细菌没有叶绿体，但含有核糖体和光合色素"},{key:"C",text:"病毒可在普通培养基中独立完成增殖"},{key:"D",text:"原核细胞的拟核中没有DNA"}],answer:"B",optionNotes:{A:"错误。改正：动物细胞没有细胞壁和叶绿体，但属于真核细胞；“所有真核细胞”表述过绝对。",B:"正确。蓝细菌属于原核生物，没有叶绿体和核膜包被的细胞核，但有核糖体，并含藻蓝素、叶绿素等光合色素。",C:"错误。改正：病毒没有细胞结构，不能独立完成代谢和增殖，必须寄生在活细胞中。",D:"错误。改正：原核细胞没有核膜包被的细胞核，但有拟核，拟核中有环状DNA。"},analysis:"本题用“所有”“独立”“没有DNA”等绝对词设置陷阱。判断细胞结构时先区分真核、原核和病毒，再用具体细胞类型检验“所有”是否成立。",steps:["先排除病毒，缩小到细胞生物。","再用动物细胞、蓝细菌、原核细胞等具体例子检验。","注意拟核虽无核膜，但仍是DNA集中的区域。"],tip:"细胞结构题先定“生物类别”，再比较结构。"},{id:"bio-b1-i02",subject:"biology",topicId:"bio-cell-intro",difficulty:4,examStyle:"显微观察 · 实验推理",stem:"用光学显微镜观察某临时装片，先在低倍镜下看到清晰的细胞，换用高倍镜后视野变暗且目标略有偏离。下列操作最合理的是",options:[{key:"A",text:"先转动粗准焦螺旋大幅提升镜筒，再直接换回低倍镜"},{key:"B",text:"先将目标移至视野中央，再调节反光镜或光圈并微调细准焦螺旋"},{key:"C",text:"换用高倍镜后继续使用粗准焦螺旋快速调焦"},{key:"D",text:"移动装片方向与目标偏离方向相同即可把目标移回中央"}],answer:"B",optionNotes:{A:"错误。改正：换高倍镜后应先在低倍镜下把目标移到中央；大幅转动粗准焦螺旋可能压碎装片或使物镜受损。",B:"正确。高倍镜视野小，先居中再增强亮度，并用细准焦螺旋调焦。",C:"错误。改正：高倍镜工作距离小，应使用细准焦螺旋，避免粗准焦螺旋造成镜头与装片碰撞。",D:"错误。改正：显微镜成倒像，装片移动方向与物像移动方向相反。"},analysis:"高倍镜观察的规范顺序是：低倍镜下找到目标并移到视野中央，再转换高倍物镜，调节光亮，最后用细准焦螺旋调焦。显微镜成倒像，因此装片移动方向与物像移动方向相反。",steps:["目标偏离时先在低倍镜下居中。","高倍镜进光量减少，可调大光圈或使用凹面镜。","高倍镜只使用细准焦螺旋。"],tip:"“先低后高、先粗后细”是高倍镜操作的基本顺序。"},{id:"bio-b1-i03",subject:"biology",topicId:"bio-cell-intro",difficulty:5,examStyle:"概念边界 · 证据推理",stem:"某单细胞生物不具核膜，但有细胞膜、核糖体和环状DNA，且能在无光照条件下利用有机物生活。下列判断最合理的是",options:[{key:"A",text:"该生物一定是蓝细菌"},{key:"B",text:"该生物属于原核生物，但不能仅据此确定其具体类群"},{key:"C",text:"该生物没有线粒体，因此不能进行有氧呼吸"},{key:"D",text:"该生物有环状DNA，因此一定是植物"}],answer:"B",optionNotes:{A:"错误。改正：蓝细菌通常含光合色素，题干只说无光照条件下利用有机物，不能据此确定为蓝细菌。",B:"正确。无核膜、有核糖体和环状DNA，符合原核生物的结构特征；但具体属于细菌、蓝细菌还是其他原核类群，需要更多证据。",C:"错误。改正：原核生物没有线粒体，但有些原核生物可在细胞膜上进行有氧呼吸。",D:"错误。改正：植物是真核生物，具有核膜包被的细胞核，不能仅凭环状DNA判断为植物。"},analysis:"高难题要求区分“能确定的结构特征”和“不能确定的分类结论”。题干足以判断原核生物，但不足以进一步确定为蓝细菌或其他具体类群。",steps:["由“无核膜”判断原核。","由核糖体、环状DNA进一步支持原核判断。","缺少光合色素、细胞壁等证据，不能强行确定具体类群。"],tip:"分类题只根据题干证据下结论，不能用课外知识补造题干未给的特征。"},{id:"bio-b2-i01",subject:"biology",topicId:"bio-elements",difficulty:3,examStyle:"有机物组成 · 结构比较",stem:"关于细胞中的蛋白质和核酸，下列叙述正确的是",options:[{key:"A",text:"蛋白质和核酸都由氨基酸通过肽键连接而成"},{key:"B",text:"DNA和RNA都由核苷酸组成，但五碳糖不同"},{key:"C",text:"蛋白质的多样性只由氨基酸种类决定"},{key:"D",text:"DNA只存在于细胞核中"}],answer:"B",optionNotes:{A:"错误。改正：蛋白质由氨基酸通过肽键连接；核酸由核苷酸通过磷酸二酯键连接。",B:"正确。DNA的基本单位是脱氧核苷酸，含脱氧核糖；RNA的基本单位是核糖核苷酸，含核糖。",C:"错误。改正：蛋白质多样性与氨基酸种类、数目、排列顺序以及肽链空间结构有关。",D:"错误。改正：真核细胞的线粒体和叶绿体也含DNA，原核细胞的拟核也含DNA。"},analysis:"蛋白质和核酸都携带重要的生命信息，但基本单位、连接方式和分布不同。比较时必须从单体、聚合物、空间结构和分布四个角度逐一核对。",steps:["蛋白质单体：氨基酸；连接键：肽键。","核酸单体：核苷酸；DNA与RNA的五碳糖不同。","蛋白质多样性由多个层次决定。","DNA不只存在于细胞核。"],tip:"“核酸都在细胞核”是高频错误。"},{id:"bio-b2-i02",subject:"biology",topicId:"bio-elements",difficulty:4,examStyle:"实验设计 · 有机物检测",stem:"为检测某植物组织提取液中的还原糖、蛋白质和脂肪，下列实验设计最合理的是",options:[{key:"A",text:"用双缩脲试剂检测还原糖，水浴加热后观察紫色"},{key:"B",text:"用斐林试剂检测还原糖，水浴加热后观察砖红色沉淀"},{key:"C",text:"用苏丹Ⅲ染液检测蛋白质，观察红色"},{key:"D",text:"三种物质检测都需要先水浴加热"}],answer:"B",optionNotes:{A:"错误。改正：双缩脲试剂用于检测蛋白质，不经水浴加热即可出现紫色；斐林试剂才用于还原糖且需要水浴加热。",B:"正确。还原糖与斐林试剂水浴加热生成砖红色沉淀。",C:"错误。改正：苏丹Ⅲ染液用于检测脂肪，呈橘黄色（苏丹Ⅳ可呈红色），不用于蛋白质。",D:"错误。改正：只有还原糖与斐林试剂的反应通常需要水浴加热，蛋白质和脂肪检测不需要。"},analysis:"有机物检测要记住三组“试剂—对象—现象—条件”。本题把斐林试剂和双缩脲试剂的使用条件、现象交叉设置，最容易混淆。",steps:["还原糖：斐林试剂，水浴加热，砖红色沉淀。","蛋白质：双缩脲试剂，无需加热，紫色。","脂肪：苏丹Ⅲ或苏丹Ⅳ，分别呈橘黄色或红色。"],tip:"先把检测对象与实际试剂配对，再检查反应条件。"},{id:"bio-b2-i03",subject:"biology",topicId:"bio-elements",difficulty:5,examStyle:"实验评价 · 变量控制",stem:"某同学欲验证“无机盐X是植物正常生长所必需的元素”。下列实验方案最科学的是",options:[{key:"A",text:"取生长状况相同的同种植物，一组用完全培养液，另一组用缺少X的同种培养液，其余条件相同"},{key:"B",text:"给实验组和对照组分别使用不同品牌的培养液，再比较生长高度"},{key:"C",text:"只设置缺少X的实验组，不设置完全培养液组"},{key:"D",text:"在实验开始前就让两组植物处于不同光照强度下，以观察差异更明显"}],answer:"A",optionNotes:{A:"正确。自变量是否为无机盐X，其他条件相同，符合单一变量原则；完全培养液组提供对照。",B:"错误。改正：不同品牌培养液会引入多种无关变量，无法确定差异是否由X引起。",C:"错误。改正：缺少完全培养液对照，无法证明缺X组生长异常确实由缺X导致。",D:"错误。改正：光照强度是本实验的无关变量，应在两组中保持一致，否则产生干扰。"},analysis:"验证某元素必需，最稳妥的方法是“缺某元素的培养液”与“完全培养液”对照，并保证植物种类、长势、光照、温度等条件相同。若缺X组无法正常生长，而补X后恢复，能进一步增强结论。",steps:["明确自变量：培养液中是否含元素X。","因变量：植物生长状况。","控制无关变量：光照、温度、水分等。","选择题干中唯一符合单变量原则的方案。"],tip:"实验题先找自变量，再查是否只有一个变量发生改变。"},{id:"bio-b3-i01",subject:"biology",topicId:"bio-organelles",difficulty:3,examStyle:"细胞器膜结构 · 功能对应",stem:"下列细胞器及其膜结构、主要功能的对应，正确的是",options:[{key:"A",text:"核糖体—双层膜—蛋白质合成"},{key:"B",text:"高尔基体—单层膜—蛋白质加工、分类和包装"},{key:"C",text:"中心体—双层膜—参与细胞分裂"},{key:"D",text:"液泡—无膜结构—调节细胞内环境"}],answer:"B",optionNotes:{A:"错误。改正：核糖体没有膜，是蛋白质合成场所。",B:"正确。高尔基体具有单层膜，参与蛋白质加工、分类、包装和运输。",C:"错误。改正：中心体无膜，与细胞有丝分裂和染色体分离有关。",D:"错误。改正：液泡具有单层膜，可储存物质并调节渗透压和细胞内环境。"},analysis:"细胞器题目必须同时核对“结构—膜层数—功能”三列。常见无膜细胞器是核糖体和中心体；双层膜是线粒体、叶绿体和细胞核；内质网、高尔基体、溶酶体和液泡为单层膜。",steps:["先判断膜层数。","再匹配主要功能。","注意细胞核不是细胞器，但具有双层膜。"],tip:"中心体和核糖体都没有膜，是高频易错点。"},{id:"bio-b3-i02",subject:"biology",topicId:"bio-organelles",difficulty:4,examStyle:"分泌蛋白 · 结构接力",stem:"用放射性氨基酸标记某动物细胞，追踪分泌蛋白的合成和运输。放射性依次集中出现的主要结构是",options:[{key:"A",text:"细胞膜→高尔基体→内质网→核糖体"},{key:"B",text:"核糖体→内质网→高尔基体→细胞膜"},{key:"C",text:"线粒体→核糖体→溶酶体→细胞膜"},{key:"D",text:"中心体→高尔基体→内质网→细胞核"}],answer:"B",optionNotes:{A:"错误。改正：分泌蛋白从核糖体开始合成，不能从细胞膜反向进入细胞器。",B:"正确。分泌蛋白在核糖体合成，进入内质网初步加工，再由高尔基体加工分类，经囊泡运至细胞膜分泌。",C:"错误。改正：线粒体负责供能，不参与分泌蛋白的合成和连续运输；溶酶体也不是分泌蛋白必经细胞器。",D:"错误。改正：中心体与细胞分裂有关，细胞核不是分泌蛋白运输路径中的加工站。"},analysis:"放射性追踪题按时间顺序观察。分泌蛋白的路径是核糖体→内质网→高尔基体→囊泡→细胞膜。线粒体提供能量，但通常不沿这条加工路径依次出现。",steps:["合成起点：核糖体。","初步加工：内质网。","进一步加工和包装：高尔基体。","囊泡运输并分泌：细胞膜。"],tip:"线粒体是供能场所，不是分泌蛋白经过的加工节点。"},{id:"bio-b3-i03",subject:"biology",topicId:"bio-organelles",difficulty:5,examStyle:"细胞类型 · 结构证据",stem:"某同学观察甲、乙两种细胞，发现甲含叶绿体和细胞壁，乙含中心体但无细胞壁。下列分析正确的是",options:[{key:"A",text:"甲一定是植物细胞，乙一定是动物细胞"},{key:"B",text:"甲可能含液泡，乙一定不含叶绿体"},{key:"C",text:"甲和乙都不可能有线粒体"},{key:"D",text:"甲没有高尔基体，乙没有内质网"}],answer:"B",optionNotes:{A:"错误。改正：含叶绿体和细胞壁的甲通常是植物细胞，但没有其他证据不能武断；乙含中心体且无细胞壁，动物细胞可能性较大，但某些低等植物也可能有中心体。",B:"正确。甲含叶绿体和细胞壁，可能为植物细胞，成熟植物细胞常含大液泡；乙无细胞壁且含中心体，不具备叶绿体的证据，但不能仅凭“无细胞壁”绝对排除所有植物细胞类型，题目按结构证据应采用“可能”表述。",C:"错误。改正：甲和乙都可能是真核细胞，通常都含线粒体；至少不能因观察到的特征排除线粒体。",D:"错误。改正：高尔基体和内质网是许多真核细胞共有的结构，不能因为观察到叶绿体或中心体就排除。"},analysis:"细胞类型推断要依赖组合证据，并避免把“可能性”写成“一定”。叶绿体、大液泡和细胞壁支持植物细胞；中心体支持动物或某些低等植物细胞。",steps:["列出题干明确观察到的结构。","将结构与植物、动物、低等植物的典型特征对应。","对不能唯一确定的结论，选择带“可能”的正确表述。"],tip:"“有中心体的一定是动物细胞”并不严谨，某些低等植物也有中心体。"},{id:"bio-b4-i01",subject:"biology",topicId:"bio-nucleus",difficulty:3,examStyle:"细胞核结构 · 核孔",stem:"下列物质或结构通过核孔出入细胞核的叙述，正确的是",options:[{key:"A",text:"所有分子都可以自由通过核孔"},{key:"B",text:"RNA可以从细胞核进入细胞质"},{key:"C",text:"DNA可以通过核孔进入细胞质指导蛋白质合成"},{key:"D",text:"核孔只允许蛋白质进入细胞核，不允许其他物质通过"}],answer:"B",optionNotes:{A:"错误。改正：核孔具有选择性，不是所有分子都能自由通过。",B:"正确。转录形成的RNA可通过核孔进入细胞质，参与蛋白质合成。",C:"错误。改正：DNA通常不通过核孔进入细胞质；遗传信息由mRNA等传递。",D:"错误。改正：核孔既允许蛋白质等进入，也允许RNA等运出，具有双向运输功能。"},analysis:"核孔不是“大洞”，而是具有选择性的核质物质交换通道。它使细胞核和细胞质之间完成RNA、蛋白质等大分子的运输。",steps:["区分核膜与核孔的功能。","记住mRNA、蛋白质等可经核孔运输。","DNA通常留在细胞核内。"],tip:"核孔的选择性常与DNA不能随意进出一起考。"},{id:"bio-b4-i02",subject:"biology",topicId:"bio-nucleus",difficulty:4,examStyle:"细胞核功能 · 实验推理",stem:"将去核的甲细胞与乙细胞的细胞核重组，在适宜条件下培养，重组细胞能够完成正常生命活动。下列结论最合理的是",options:[{key:"A",text:"细胞核是细胞代谢和遗传的控制中心"},{key:"B",text:"细胞质对细胞生命活动没有任何作用"},{key:"C",text:"细胞核可以脱离细胞质独立生活"},{key:"D",text:"细胞的遗传物质全部位于细胞质"}],answer:"A",optionNotes:{A:"正确。去核细胞失去正常生命活动，植入完整细胞核后恢复，说明细胞核控制细胞代谢和遗传。",B:"错误。改正：细胞质提供营养、细胞器和代谢场所，重组细胞需要细胞质才能生活。",C:"错误。改正：实验是核移植后的完整重组细胞，不是单独培养细胞核。",D:"错误。改正：细胞核是遗传信息库，DNA主要在细胞核中；细胞质中也有少量DNA，但实验不能支持“全部位于细胞质”。"},analysis:"核移植实验通过“去核—植入—恢复正常生命活动”证明细胞核的控制作用，同时也不能否认细胞质提供必需环境。结论必须严格限制在实验能证明的范围。",steps:["识别自变量：是否具有完整的细胞核。","因变量：细胞能否完成正常生命活动。","结论只写细胞核的控制作用，不夸大细胞质的作用。"],tip:"实验结论不能超过实验范围和变量关系。"},{id:"bio-b4-i03",subject:"biology",topicId:"bio-nucleus",difficulty:5,examStyle:"结构—功能综合 · 证据链",stem:"某细胞核仁区域异常增大，细胞质中核糖体数量增加，其他结构基本正常。下列分析最合理的是",options:[{key:"A",text:"核仁一定参与蛋白质的直接合成"},{key:"B",text:"核仁可能与核糖体的形成有关"},{key:"C",text:"核仁增大说明细胞内DNA全部迁移到细胞质"},{key:"D",text:"核糖体数量增加一定只由核仁增大导致"}],answer:"B",optionNotes:{A:"错误。改正：蛋白质直接合成场所是核糖体；核仁与核糖体形成有关，不是直接合成蛋白质的场所。",B:"正确。核仁异常增大同时伴随细胞质核糖体增加，支持核仁与核糖体形成有关的结论。",C:"错误。改正：核仁增大不能说明DNA全部迁移到细胞质，且DNA通常不通过核孔大量进入细胞质。",D:"错误。改正：核糖体数量还受其他因素影响，题干的“一定只由”过度归因。"},analysis:"这是一道结构—功能互证题。核仁在真核细胞中与rRNA合成和核糖体亚基形成有关。观察数据支持相关性，但不能把复杂现象绝对归因于单一原因。",steps:["找到题干中的两个现象：核仁增大、核糖体增多。","联系已知功能：核仁参与核糖体形成。","用“可能”“有关”表达证据强度，避免绝对化。"],tip:"实验现象通常支持关联，不足以单独证明唯一因果。"},{id:"cn-c1-i01",type:"fill",subject:"chinese",topicId:"cn-poetry-early",difficulty:3,examStyle:"沁园春·长沙 · 写景层次",stem:"《沁园春·长沙》中，用色彩鲜明的意象描写秋日山、江、船的壮丽景象：____。",answer:"看万山红遍，层林尽染；漫江碧透，百舸争流。",analysis:"“万山红遍、层林尽染”写山色，“漫江碧透”写江水，“百舸争流”写船与生机。红、碧等色彩交织，以壮阔秋景表现昂扬气象。",steps:["题干提示色彩与“山、江、船”。","依次对应“红遍、碧透、百舸”三组意象。"],tip:"易错字：“漫江”不是“满江”，“舸”不要误写。"},{id:"cn-c1-i02",type:"fill",subject:"chinese",topicId:"cn-poetry-early",difficulty:4,examStyle:"短歌行 · 用典与情感",stem:"《短歌行》中，以月、星、乌鹊的意象写贤才彷徨无依，表现作者求贤若渴：____。",answer:"月明星稀，乌鹊南飞。绕树三匝，何枝可依？",analysis:"月光、星稀、乌鹊南飞营造清冷氛围，乌鹊绕树而无所依托，比喻贤才在乱世中徘徊无依，也反衬作者招纳贤才的愿望。",steps:["先写“月明星稀，乌鹊南飞”两句。","再写乌鹊绕树无依的反问。"],tip:"易错字：“匝”表示环绕一周，不是“币”。"},{id:"cn-c1-i03",type:"fill",subject:"chinese",topicId:"cn-poetry-early",difficulty:5,examStyle:"归园田居 · 情感落点",stem:"《归园田居（其一）》结尾用“樊笼”比喻官场束缚，表达重获自由的喜悦：____。",answer:"久在樊笼里，复得返自然。",analysis:"“樊笼”比喻官场和世俗束缚，“返自然”表现回归田园后的解脱。结尾把全诗对田园的热爱升华为对精神自由的追求。",steps:["题干关键词“樊笼”“重获自由”。","对应全诗最后两句。"],tip:"“返自然”不是“返田园”，注意原文。"},{id:"cn-c2-i01",type:"fill",subject:"chinese",topicId:"cn-tang",difficulty:3,examStyle:"登高 · 空间与时间",stem:"《登高》中，以落木和长江写秋景的苍凉壮阔，并用“无边”“不尽”扩展空间与时间：____。",answer:"无边落木萧萧下，不尽长江滚滚来。",analysis:"落木无边、长江不尽，把眼前秋景扩展为巨大空间和绵延时间。“萧萧”“滚滚”叠词强化声音和气势，也映衬诗人的悲凉。",steps:["抓“落木”和“长江”。","注意“无边”“不尽”的互文扩景。"],tip:"易错字：“萧萧”不是“潇潇”。"},{id:"cn-c2-i02",type:"fill",subject:"chinese",topicId:"cn-tang",difficulty:4,examStyle:"梦游天姥 · 浪漫想象",stem:"《梦游天姥吟留别》中，以霓为衣、以风为马，写云中神仙纷纷降落的奇幻场面：____。",answer:"霓为衣兮风为马，云之君兮纷纷而来下。",analysis:"诗人把霓虹想象成衣裳，把风想象成马，让云中神仙纷纷降临。句式用“兮”字延展节奏，构成瑰丽的浪漫主义画面。",steps:["由“霓衣”“风马”锁定前一句。","由“云中神仙降落”写出后一句。"],tip:"易错字：“霓”“兮”。"},{id:"cn-c2-i03",type:"fill",subject:"chinese",topicId:"cn-tang",difficulty:5,examStyle:"琵琶行 · 侧面烘托",stem:"《琵琶行（并序）》中，不直接写听众赞叹，而以环境寂静和秋月倒影侧面表现琵琶声的感染力：____。",answer:"东船西舫悄无言，唯见江心秋月白。",analysis:"“悄无言”写听众沉浸，“唯见江心秋月白”以冷寂清空的画面收束，用无声环境和月色烘托音乐的余韵。",steps:["题干提示“侧面表现”。","定位演奏结束后环境描写的两句。"],tip:"易错字：“舫”指船。"},{id:"cn-c3-i01",type:"fill",subject:"chinese",topicId:"cn-song",difficulty:3,examStyle:"念奴娇 · 人物塑造",stem:"《念奴娇·赤壁怀古》中，以服饰和谈笑姿态塑造周瑜从容指挥、战功显赫的形象：____。",answer:"羽扇纶巾，谈笑间，樯橹灰飞烟灭。",analysis:"“羽扇纶巾”写儒将风度，“谈笑间”突出从容，“樯橹灰飞烟灭”以夸张写曹军战船被焚，表现周瑜英姿与功业。",steps:["先找周瑜服饰“羽扇纶巾”。","再写从容破敌的“樯橹灰飞烟灭”。"],tip:"易错字：“纶巾”“樯橹”。"},{id:"cn-c3-i02",type:"fill",subject:"chinese",topicId:"cn-song",difficulty:4,examStyle:"永遇乐 · 忆昔伤今",stem:"《永遇乐·京口北固亭怀古》中，词人回望四十三年前的抗金烽火，表达对往事的沉痛记忆：____。",answer:"四十三年，望中犹记，烽火扬州路。",analysis:"“四十三年”拉开时间，“望中犹记”强调记忆未淡，“烽火扬州路”写出战火蔓延。今昔对照中寄寓报国无门的悲愤。",steps:["题干数字“四十三年”。","后半写记忆中的“烽火扬州路”。"],tip:"“望中犹记”不要漏字。"},{id:"cn-c3-i03",type:"fill",subject:"chinese",topicId:"cn-song",difficulty:5,examStyle:"声声慢 · 环境与愁情",stem:"《声声慢》中，以梧桐、细雨和黄昏点滴声渲染孤独愁绪：____。",answer:"梧桐更兼细雨，到黄昏、点点滴滴。",analysis:"梧桐、细雨、黄昏共同构成凄清意境，“点点滴滴”既写雨声，也像愁绪不断积累。听觉细节把抽象悲愁具体化。",steps:["题干三个词“梧桐、细雨、黄昏”。","注意最后叠词“点点滴滴”。"],tip:"“更兼”表示又加上，不能写成“更见”。"},{id:"cn-c4-i01",type:"fill",subject:"chinese",topicId:"cn-prose",difficulty:3,examStyle:"劝学 · 比喻论证",stem:"《劝学》中，以靛青从蓝草中提取、冰由水凝结作比，说明学习可以使人提升：____。",answer:"青，取之于蓝，而青于蓝；冰，水为之，而寒于水。",analysis:"靛青来自蓝草却比蓝草颜色更深，冰由水凝成却比水更寒，两句构成类比，说明经过学习和改造可以超过原有状态。",steps:["先写“青取之于蓝”。","再写“冰水为之而寒于水”。"],tip:"易错字：“青于蓝”不是“出于蓝”。"},{id:"cn-c4-i02",type:"fill",subject:"chinese",topicId:"cn-prose",difficulty:4,examStyle:"师说 · 概念辨析",stem:"《师说》中，韩愈区分童子的老师和真正能传道、受业、解惑的老师：____。",answer:"彼童子之师，授之书而习其句读者，非吾所谓传其道解其惑者也。",analysis:"韩愈认为只教书本、讲断句的是童子之师；真正意义上的老师应传道、授业、解惑。这里通过概念区分突出从师学习的根本目的。",steps:["前半写“童子之师，授之书而习其句读”。","后半用“非吾所谓”进行限定和纠正。"],tip:"易错字：“句读”“惑”。"},{id:"cn-c4-i03",type:"fill",subject:"chinese",topicId:"cn-prose",difficulty:5,examStyle:"劝学 · 正反对照",stem:"《劝学》中，以雕刻为喻，正反对比说明坚持的重要性：____。",answer:"锲而舍之，朽木不折；锲而不舍，金石可镂。",analysis:"“舍之”则朽木不能折断，“不舍”则金石也能雕刻。作者用极端对比强调坚持的作用，说明学习需要持续积累。",steps:["先写“锲而舍之，朽木不折”。","再写“锲而不舍，金石可镂”。"],tip:"易错字：“锲”“镂”。"},{id:"cn-c5-i01",type:"fill",subject:"chinese",topicId:"cn-travel",difficulty:3,examStyle:"赤壁赋 · 景物描写",stem:"《赤壁赋》中，以白露、江水和天空写秋夜江面辽阔澄澈的景象：____。",answer:"白露横江，水光接天。",analysis:"“白露横江”写水汽弥漫，“水光接天”写江面反光与远天相连。两句空间开阔，为下文泛舟、饮酒和哲思营造意境。",steps:["题干提示“白露、江水、天空”。","对应“白露横江，水光接天”。"],tip:"“横江”不要写成“浮江”。"},{id:"cn-c5-i02",type:"fill",subject:"chinese",topicId:"cn-travel",difficulty:4,examStyle:"登泰山记 · 云中远山",stem:"《登泰山记》中，写初见云海中若隐若现、形如骰子的远山：____。",answer:"稍见云中白若樗蒱数十立者，山也。",analysis:"作者用“樗蒱”（古代博具）比喻云中露出的白色山峰，既写远山低小、若隐若现的形态，也体现冬日泰山的奇景。",steps:["题干“云中”“像骰子”。","对应“樗蒱”这一古代博具。"],tip:"易错字：“樗蒱”。"},{id:"cn-c5-i03",type:"fill",subject:"chinese",topicId:"cn-travel",difficulty:5,examStyle:"赤壁赋 · 哲理名句",stem:"《赤壁赋》中，苏轼写清风明月为自然无尽宝藏，可以自由享用并与友人共享：____。",answer:"惟江上之清风，与山间之明月，耳得之而为声，目遇之而成色，取之无禁，用之不竭，是造物者之无尽藏也，而吾与子之所共适。",analysis:"清风明月通过听觉和视觉进入感官，取用不尽，成为自然给予人的无穷宝藏。作者把对人生有限、自然无穷的感慨转为当下共享美景的旷达。",steps:["先列对象：江上清风、山间明月。","再写耳得为声、目遇成色。","最后落到“取之无禁，用之不竭”和“吾与子之所共适”。"],tip:"长句默写按“对象—感官—性质—共享”四个层次记忆。"},{id:"cn-c6-i01",type:"fill",subject:"chinese",topicId:"cn-recitation",difficulty:3,examStyle:"静女 · 礼物与情感",stem:"《静女》中，男子赞美女子从郊外赠送的荑草，并指出美好的是所赠之人的心意：____。",answer:"自牧归荑，洵美且异。匪女之为美，美人之贻。",analysis:"荑草本身并不一定珍奇，男子却觉得它“美且异”，原因是“美人之贻”。最后两句把礼物价值落实到赠礼者的情意。",steps:["先写赠送场景“自牧归荑”。","再写否定礼物本身、肯定美人情意的两句。"],tip:"“匪女”中“女”同“汝”，仍按原文默写。"},{id:"cn-c6-i02",type:"fill",subject:"chinese",topicId:"cn-recitation",difficulty:4,examStyle:"涉江采芙蓉 · 空间阻隔",stem:"《涉江采芙蓉》中，写主人公回望故乡，只觉归途漫长遥远：____。",answer:"还顾望旧乡，长路漫浩浩。",analysis:"“还顾”是回望动作，“旧乡”是心上人所在，“长路漫浩浩”把空间阻隔具体化，表现思念与归乡无望。",steps:["“回望故乡”对应“还顾望旧乡”。","“漫长遥远”对应“长路漫浩浩”。"],tip:"易错字：“漫浩浩”。"},{id:"cn-c6-i03",type:"fill",subject:"chinese",topicId:"cn-recitation",difficulty:5,examStyle:"虞美人 · 今昔对照",stem:"李煜《虞美人》中，写旧日宫殿应仍存在，而人的容颜已经改变，暗含物是人非之痛：____。",answer:"雕栏玉砌应犹在，只是朱颜改。",analysis:"“雕栏玉砌”代表故国宫殿，“应犹在”是推测，而“只是朱颜改”陡然转回人事变化。景物未变、身份和容颜已变，形成强烈的物是人非。",steps:["题干提示“宫殿仍在”。","后半写人的容颜和处境改变。"],tip:"易错字：“砌”“朱颜”。"},{id:"cn-c6-i04",type:"fill",subject:"chinese",topicId:"cn-recitation",difficulty:5,examStyle:"鹊桥仙 · 想象起笔",stem:"《鹊桥仙》开头以云彩、流星和银河营造七夕相会的奇幻氛围：____。",answer:"纤云弄巧，飞星传恨，银汉迢迢暗度。",analysis:"“纤云弄巧”化云为巧手，“飞星传恨”把流星想象成传递离愁的使者，“银汉迢迢暗度”写牛郎织女悄悄渡过银河，开篇即充满想象。",steps:["依次写云、星、银河。","注意“弄巧”“传恨”“暗度”三个动词短语。"],tip:"易错字：“迢迢”“暗度”不是“暗渡”。"},{id:"chem-cross-01",subject:"chemistry",topicId:"chem-chlorine",topicIds:["chem-chlorine","chem-redox","chem-gas"],crossChapter:!0,difficulty:4,examStyle:"跨章综合 · 制备—氧化还原—气体",stem:"实验室用足量MnO₂与浓盐酸反应制取Cl₂。若有0.1 mol MnO₂完全反应，下列说法正确的是",options:[{key:"A",text:"MnO₂在反应中被氧化"},{key:"B",text:"反应转移0.2 mol电子，标准状况下生成2.24 L Cl₂"},{key:"C",text:"参加反应的HCl全部被氧化"},{key:"D",text:"生成Cl₂的物质的量为0.2 mol"}],answer:"B",optionNotes:{A:"错误。改正：MnO₂中Mn由+4降到+2，得到电子，被还原，作氧化剂。",B:"正确。MnO₂+4HCl(浓)→MnCl₂+Cl₂↑+2H₂O。0.1 mol MnO₂生成0.1 mol Cl₂，标准状况体积2.24 L；Mn得到0.2 mol电子。",C:"错误。改正：4 mol HCl中只有2 mol Cl⁻被氧化成Cl₂，另2 mol生成MnCl₂和提供酸性环境，没有被氧化。",D:"错误。改正：按系数比，1 mol MnO₂生成1 mol Cl₂，0.1 mol MnO₂只生成0.1 mol Cl₂。"},analysis:"这道题把氧化还原、离子与方程系数、气体摩尔体积放进同一反应。必须完整写方程式，再分别计算被氧化的HCl、转移电子和标准状况下Cl₂体积。",steps:["写方程式：MnO₂+4HCl(浓)→MnCl₂+Cl₂↑+2H₂O。","n(MnO₂):n(Cl₂)=1:1，因此生成Cl₂ 0.1 mol。","标准状况V=0.1×22.4=2.24 L。","Mn由+4到+2，每mol得2e⁻，0.1 mol转移0.2 mol电子。"],tip:"4 mol HCl参加反应，但只有2 mol被氧化，这是跨章压轴的核心陷阱。",diagram:"redox"},{id:"chem-cross-02",subject:"chemistry",topicId:"chem-sodium",topicIds:["chem-sodium","chem-ion","chem-mole","chem-gas"],crossChapter:!0,difficulty:5,examStyle:"跨章综合 · 钠化合物—离子—气体—计算",stem:"将7.8 g Na₂O₂加入足量水中，充分反应后再通入0.10 mol CO₂。下列判断正确的是",options:[{key:"A",text:"整个过程没有发生氧化还原反应"},{key:"B",text:"最终溶液中只含NaHCO₃"},{key:"C",text:"标准状况下最终生成1.12 L O₂，整个过程中Na₂O₂转移0.10 mol电子"},{key:"D",text:"最终溶液中的n(Na⁺)=0.10 mol"}],answer:"C",optionNotes:{A:"错误。改正：Na₂O₂中氧元素为-1价，遇水时发生歧化，生成-2价氧和0价氧，是氧化还原反应。",B:"错误。改正：7.8 g Na₂O₂为0.10 mol，生成0.20 mol NaOH；通入0.10 mol CO₂后生成0.10 mol Na₂CO₃，最终不是只含NaHCO₃。",C:"正确。2Na₂O₂+2H₂O→4NaOH+O₂↑，0.10 mol Na₂O₂生成0.05 mol O₂，标准状况为1.12 L；每mol Na₂O₂对应转移1 mol电子，故转移0.10 mol。",D:"错误。改正：0.10 mol Na₂O₂含0.20 mol Na⁺，最终n(Na⁺)=0.20 mol。"},analysis:"解题要把过程分成两段：Na₂O₂与水反应生成NaOH和O₂；随后CO₂与NaOH反应。Na₂O₂中氧为-1价，歧化时每mol Na₂O₂对应1 mol电子转移。",steps:["n(Na₂O₂)=7.8/78=0.10 mol。","2Na₂O₂+2H₂O→4NaOH+O₂，生成0.20 mol NaOH、0.05 mol O₂。","0.10 mol CO₂恰好把0.20 mol NaOH转化为0.10 mol Na₂CO₃。","核对O₂体积、电子转移与Na⁺总量。"],tip:"先分步写方程式，再把每步的物质的量接起来。",diagram:"gas"},{id:"chem-cross-03",subject:"chemistry",topicId:"chem-redox",topicIds:["chem-redox","chem-ion","chem-mole"],crossChapter:!0,difficulty:5,examStyle:"跨章综合 · 氧化还原—离子—滴定",stem:"在酸性条件下，20.00 mL某FeSO₄溶液恰好被0.0200 mol·L⁻¹ KMnO₄溶液25.00 mL完全氧化。反应中MnO₄⁻被还原为Mn²⁺，Fe²⁺被氧化为Fe³⁺。原FeSO₄溶液的浓度为",options:[{key:"A",text:"0.0250 mol·L⁻¹"},{key:"B",text:"0.100 mol·L⁻¹"},{key:"C",text:"0.125 mol·L⁻¹"},{key:"D",text:"0.500 mol·L⁻¹"}],answer:"C",optionNotes:{A:"错误。改正：该值只乘了KMnO₄浓度与体积，没有使用5:1的电子守恒关系。",B:"错误。改正：0.100 mol·L⁻¹是仅按1:1物质的量比得到的错误结果。",C:"正确。n(MnO₄⁻)=0.0200×0.02500=5.00×10⁻⁴ mol；Mn得5e⁻，Fe失1e⁻，所以n(Fe²⁺)=2.50×10⁻³ mol；c=2.50×10⁻³/0.02000=0.125 mol·L⁻¹。",D:"错误。改正：0.500 mol·L⁻¹扩大了4倍，混淆了体积换算和电子数。"},analysis:"反应关系为MnO₄⁻+5Fe²⁺+8H⁺→Mn²⁺+5Fe³⁺+4H₂O。高难题中可用电子守恒：MnO₄⁻每个得5e⁻，Fe²⁺每个失1e⁻，因此n(Fe²⁺)=5n(MnO₄⁻)。",steps:["n(MnO₄⁻)=0.0200×25.00×10⁻³=5.00×10⁻⁴ mol。","由电子守恒，n(Fe²⁺)=5×5.00×10⁻⁴=2.50×10⁻³ mol。","c(FeSO₄)=2.50×10⁻³/0.02000=0.125 mol·L⁻¹。"],tip:"跨章计算先写离子方程式，再用电子守恒或系数比。",diagram:"redox"},{id:"bio-cross-01",subject:"biology",topicId:"bio-organelles",topicIds:["bio-cell-intro","bio-elements","bio-organelles","bio-nucleus"],crossChapter:!0,difficulty:4,examStyle:"跨章综合 · 细胞结构与功能",stem:"某真核细胞合成并分泌一种蛋白质。下列叙述正确的是",options:[{key:"A",text:"该蛋白质的合成和运输与该细胞的核仁、核孔完全没有关系"},{key:"B",text:"参与该过程的核糖体、内质网、高尔基体和线粒体都含膜结构"},{key:"C",text:"细胞核中的遗传信息可影响该蛋白质的合成，线粒体可为运输和加工提供能量"},{key:"D",text:"分泌蛋白离开细胞后，细胞膜上的蛋白质种类和数量不会变化"}],answer:"C",optionNotes:{A:"错误。改正：核仁与核糖体形成有关，mRNA等可通过核孔进入细胞质，因此不是“完全没有关系”。",B:"错误。改正：核糖体没有膜结构；内质网和高尔基体为单层膜，线粒体为双层膜。",C:"正确。细胞核控制蛋白质合成的遗传信息，线粒体供能，多个结构分工合作。",D:"错误。改正：胞吐会导致细胞膜面积和膜蛋白等成分发生动态变化，不能说完全不变。"},analysis:"分泌蛋白过程同时涉及细胞核、核糖体、内质网、高尔基体、囊泡、细胞膜和线粒体。跨章题要求把“结构—功能—能量—遗传控制”连接成完整链条。",steps:["核内遗传信息通过mRNA经核孔进入细胞质。","核糖体合成肽链，内质网和高尔基体加工运输。","线粒体供能，囊泡与细胞膜融合完成分泌。","核对各结构膜层数及膜成分的动态变化。"],tip:"把分泌蛋白路径画成流程图，跨章结构关系最清楚。"},{id:"bio-cross-02",subject:"biology",topicId:"bio-nucleus",topicIds:["bio-cell-intro","bio-elements","bio-organelles","bio-nucleus"],crossChapter:!0,difficulty:5,examStyle:"跨章综合 · 显微观察与结构推断",stem:"在显微镜下观察某植物细胞，看到细胞壁、叶绿体和一个清晰的细胞核；用某种染料处理后，细胞质中的RNA分布发生改变，但细胞核内DNA分布基本不变。下列推断最合理的是",options:[{key:"A",text:"该细胞一定是原核细胞，因为没有线粒体"},{key:"B",text:"叶绿体和细胞核都具有双层膜，叶绿体中的色素可参与光合作用"},{key:"C",text:"RNA是细胞唯一的遗传物质，DNA只参与结构组成"},{key:"D",text:"细胞核内的DNA可以通过核孔自由进入细胞质"}],answer:"B",optionNotes:{A:"错误。改正：有清晰细胞核说明是真核细胞；未观察到线粒体不等于没有线粒体。",B:"正确。叶绿体和细胞核均具有双层膜，叶绿体中的叶绿素等色素参与光反应。",C:"错误。改正：细胞生物的遗传物质是DNA，RNA参与遗传信息传递和表达。",D:"错误。改正：DNA通常不通过核孔自由进入细胞质，遗传信息主要经RNA传递。"},analysis:"显微镜观察题要区分“看到的结构”与“实际存在但未辨认的结构”。植物真核细胞的细胞壁、叶绿体、细胞核和双层膜关系可以同时考查；遗传物质与核孔选择性也是高频细节。",steps:["由清晰细胞核判定真核细胞。","核对细胞核、叶绿体的双层膜。","明确DNA是细胞生物的主要遗传物质。","核孔具有选择性，DNA不自由进出。"],tip:"没有看到某结构，不等于该结构一定不存在。"},{id:"cn-cross-01",type:"fill",subject:"chinese",topicId:"cn-tang",topicIds:["cn-poetry-early","cn-tang"],crossChapter:!0,difficulty:4,examStyle:"跨篇理解 · 秋景与家国",stem:"杜甫在《登高》中把个人漂泊、年老多病与秋景结合，写出颔联名句：____；毛泽东在《沁园春·长沙》中面对壮阔秋景发出主宰国家命运的追问：____。请依次写出两句。",answer:"万里悲秋常作客，百年多病独登台；怅寥廓，问苍茫大地，谁主沉浮？",analysis:"《登高》把个人身世放进无边的秋景，《沁园春·长沙》则由秋景转向对国家命运的追问。两篇都写秋，但前者苍凉悲慨，后者壮阔昂扬。",steps:["第一空定位《登高》颔联。","第二空定位《沁园春·长沙》上阕结尾。","两段之间可用分号分隔。"],tip:"跨篇默写先确认篇目顺序，再分别回忆对应句。"},{id:"cn-cross-02",type:"fill",subject:"chinese",topicId:"cn-prose",topicIds:["cn-prose","cn-recitation"],crossChapter:!0,difficulty:5,examStyle:"跨篇理解 · 学习观",stem:"《劝学》用“青出于蓝”“冰寒于水”说明学习可以提升自我；《师说》强调从师标准只问道之所在。请依次默写这两处核心句：____。",answer:"青，取之于蓝，而青于蓝；冰，水为之，而寒于水。是故无贵无贱，无长无少，道之所存，师之所存也。",analysis:"《劝学》以比喻说明后天学习与改造的重要性；《师说》以判断句提出能者为师、道在即师在。前者重比喻论证，后者重破立结合。",steps:["前半写《劝学》的“青、冰”两句。","后半写《师说》从师标准。","两段用句号分隔，标点在判分中忽略。"],tip:"长答案先按篇目切块，再按论证对象检查字形。"}],C2=["chem-classification","chem-ion","chem-redox","chem-sodium","chem-chlorine","chem-mole","chem-gas"],N2=["bio-cell-intro","bio-elements","bio-organelles","bio-nucleus"],K0=(o,x)=>x[o%x.length];function ea({id:o,subject:x,topicId:v,difficulty:m,examStyle:b,stem:A,correct:z,wrong:D,analysis:H,steps:w,tip:S,diagram:p,crossChapter:E,topicIds:L}){const et=[{text:z.text,note:`正确。${z.note}`,correct:!0},...D.map(Y=>({text:Y.text,note:`错误。改正：${Y.note}`,correct:!1}))],Q=o.split("").reduce((Y,it)=>Y+it.charCodeAt(0),0)%4,V=[...et.slice(Q),...et.slice(0,Q)],ft=V.map((Y,it)=>({key:String.fromCharCode(65+it),text:Y.text})),B=V.findIndex(Y=>Y.correct),K=Object.fromEntries(V.map((Y,it)=>[String.fromCharCode(65+it),Y.note]));return{id:o,subject:x,topicId:v,difficulty:m,qualityTier:"variant",examStyle:b,stem:A,options:ft,answer:String.fromCharCode(65+B),optionNotes:K,analysis:H,steps:w,tip:S,diagram:p,crossChapter:E,topicIds:L}}function b2(o,x){const v=[{stem:`下列关于物质分类的判断（变式 ${x}），正确的是`,correct:{text:"液氯属于纯净物",note:"液氯只含Cl₂一种物质，状态变化不等于组成改变。"},wrong:[{text:"盐酸属于纯净物",note:"盐酸是HCl气体的水溶液，属于混合物。"},{text:"漂白粉属于纯净物",note:"漂白粉主要含Ca(ClO)₂和CaCl₂等，是混合物。"},{text:"空气属于纯净物",note:"空气由N₂、O₂等多种物质组成。"}],analysis:"由一种物质组成的是纯净物。液氯的组成只有Cl₂；盐酸、漂白粉和空气均由多种物质组成。"},{stem:`关于分散系与胶体（变式 ${x}），正确的是`,correct:{text:"胶体粒子直径通常在1～100 nm之间",note:"粒子直径是区分溶液、胶体和浊液的本质依据。"},wrong:[{text:"胶体一定是液态",note:"胶体可以是液溶胶、气溶胶或固溶胶，例如烟是气溶胶。"},{text:"溶液也一定具有明显丁达尔效应",note:"丁达尔效应通常用于鉴别胶体，溶液现象不明显。"},{text:"胶体不能透过滤纸",note:"胶体粒子可透过滤纸，但不能透过半透膜。"}],analysis:"胶体属于分散系，分散质粒子直径为1～100 nm。其聚集状态、能否透过滤纸和丁达尔效应需分别判断。"},{stem:`关于酸性氧化物和碱性氧化物（变式 ${x}），正确的是`,correct:{text:"CO₂与NaOH反应生成盐和水，属于酸性氧化物",note:"与碱反应只生成盐和水符合酸性氧化物的定义。"},wrong:[{text:"Na₂O₂属于碱性氧化物",note:"Na₂O₂与酸反应还会放出O₂，不能满足碱性氧化物的定义。"},{text:"所有金属氧化物都是碱性氧化物",note:"Al₂O₃、Mn₂O₇等为两性或酸性氧化物，不能一概而论。"},{text:"能与碱反应的氧化物都是酸性氧化物",note:"还应检查生成物是否只有盐和水。"}],analysis:"氧化物分类必须结合组成与反应产物。酸性氧化物与碱只生成盐和水，碱性氧化物与酸只生成盐和水。"},{stem:`关于电解质与非电解质（变式 ${x}），正确的是`,correct:{text:"NaCl固体是电解质",note:"NaCl在水溶液或熔融状态下能导电，符合电解质定义。"},wrong:[{text:"铜是电解质",note:"铜是单质，电解质必须是化合物。"},{text:"NH₃属于电解质",note:"NH₃本身不能电离，是纯净物中的非电解质。"},{text:"电解质在任何状态下都能导电",note:"电解质必须在水溶液或熔融状态下才可能导电。"}],analysis:"电解质首先必须是化合物，其次要在水溶液或熔融状态能导电；能导电的单质不是电解质。"},{stem:`关于物质转化关系（变式 ${x}），正确的是`,correct:{text:"CO₂与C在高温下可转化为CO",note:"CO₂+C 高温→2CO，属于吸热反应。"},wrong:[{text:"Na₂O与水反应生成Na₂O₂",note:"Na₂O与水生成NaOH，不会生成Na₂O₂。"},{text:"Cl₂与水反应只生成HCl",note:"Cl₂与水还生成HClO，同时存在化学平衡。"},{text:"NaHCO₃受热生成NaOH",note:"NaHCO₃受热生成Na₂CO₃、H₂O和CO₂。"}],analysis:"物质转化必须同时核对反应物、条件和产物。条件不同可能得到不同产物。"}],m=v[o%v.leng
