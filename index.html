碱反应生成盐和水，所以它是酸性氧化物"},{key:"D",text:"能导电的物质一定是电解质"}],answer:"C",analysis:"CO₂ 与碱反应只生成盐和水，符合酸性氧化物的定义。NaHSO₄ 属于酸式盐；Na₂O₂ 与酸反应还会生成 O₂，不是碱性氧化物；铜能导电但不是化合物，不是电解质。",steps:["酸性氧化物：与碱反应只生成盐和水。","排除组成或产物不符合定义的选项。"],tip:"分类不仅看“能反应”，还要看生成物和物质类别。"},{id:"chem-c2-01",subject:"chemistry",topicId:"chem-ion",difficulty:1,stem:"FeCl₃ 溶液与 KOH 溶液反应的离子方程式是",options:[{key:"A",text:"Fe³⁺ + 3OH⁻ → Fe(OH)₃↓"},{key:"B",text:"FeCl₃ + 3OH⁻ → Fe(OH)₃↓ + 3Cl⁻"},{key:"C",text:"Fe³⁺ + 3KOH → Fe(OH)₃↓ + 3K⁺"},{key:"D",text:"Fe³⁺ + OH⁻ → Fe(OH)₃↓"}],answer:"A",analysis:"K⁺、Cl⁻ 在反应前后没有变化，应删去；Fe(OH)₃ 是沉淀，保留化学式；电荷与原子数均已守恒。",steps:["先写分子方程式。","把强电解质中实际参加反应的离子拆开。","删除旁观离子并检查守恒。"],tip:"离子方程式左、右两边电荷总数必须相等。"},{id:"chem-c2-02",subject:"chemistry",topicId:"chem-ion",difficulty:1,stem:"在无色酸性溶液中，下列各组离子能大量共存的是",options:[{key:"A",text:"Na⁺、K⁺、NO₃⁻、SO₄²⁻"},{key:"B",text:"Cu²⁺、Na⁺、Cl⁻、NO₃⁻"},{key:"C",text:"HCO₃⁻、Na⁺、Cl⁻、K⁺"},{key:"D",text:"Ba²⁺、Na⁺、SO₄²⁻、Cl⁻"}],answer:"A",analysis:"A 组离子彼此不反应且均无色。B 中 Cu²⁺ 呈蓝色；C 中 HCO₃⁻ 会与 H⁺ 反应；D 中 Ba²⁺ 与 SO₄²⁻ 生成沉淀。",steps:["看颜色：排除有色离子。","看酸性：排除能与 H⁺ 反应的离子。","看离子间是否生成沉淀、气体或弱电解质。"],tip:"题干中的“无色”“酸性”都是过滤条件。"},{id:"chem-c2-03",subject:"chemistry",topicId:"chem-ion",difficulty:2,stem:"Ba(OH)₂ 稀溶液与稀硫酸反应的离子方程式正确的是",options:[{key:"A",text:"H⁺ + OH⁻ → H₂O"},{key:"B",text:"Ba²⁺ + SO₄²⁻ → BaSO₄↓"},{key:"C",text:"Ba²⁺ + 2OH⁻ + 2H⁺ + SO₄²⁻ → BaSO₄↓ + 2H₂O"},{key:"D",text:"Ba²⁺ + OH⁻ + H⁺ + SO₄²⁻ → BaSO₄↓ + H₂O"}],answer:"C",analysis:"该反应同时生成 BaSO₄ 沉淀和水，两项都不能省略；按 Ba(OH)₂ 与 H₂SO₄ 的组成关系配平。",steps:["1 mol Ba(OH)₂ 提供 1 mol Ba²⁺ 和 2 mol OH⁻。","1 mol H₂SO₄ 提供 2 mol H⁺ 和 1 mol SO₄²⁻。","综合沉淀与中和两个过程。"],tip:"生成两种难电离或难溶产物时，不能只写其中一个。"},{id:"chem-c2-04",subject:"chemistry",topicId:"chem-ion",difficulty:3,stem:"向 Na₂CO₃ 溶液中逐滴加入稀盐酸，开始时的主要离子反应是",options:[{key:"A",text:"CO₃²⁻ + 2H⁺ → CO₂↑ + H₂O"},{key:"B",text:"CO₃²⁻ + H⁺ → HCO₃⁻"},{key:"C",text:"HCO₃⁻ + H⁺ → CO₂↑ + H₂O"},{key:"D",text:"2H⁺ + 2Cl⁻ → 2HCl"}],answer:"B",analysis:"逐滴加入盐酸时，H⁺ 相对少量，先与 CO₃²⁻ 反应生成 HCO₃⁻；盐酸继续增加时，HCO₃⁻ 再与 H⁺ 反应放出 CO₂。",steps:["第一阶段：H⁺ + CO₃²⁻ → HCO₃⁻。","第二阶段：H⁺ + HCO₃⁻ → H₂O + CO₂↑。","结论取决于滴加顺序和相对量。"],tip:"“逐滴加入”是在提示你先考虑少量 H⁺ 的反应。"},{id:"chem-c3-01",subject:"chemistry",topicId:"chem-redox",difficulty:1,stem:"反应 Fe + CuSO₄ → FeSO₄ + Cu 中，还原剂是",options:[{key:"A",text:"Fe"},{key:"B",text:"CuSO₄"},{key:"C",text:"FeSO₄"},{key:"D",text:"Cu"}],answer:"A",analysis:"Fe 的化合价由 0 升至 +2，失电子，被氧化，作还原剂；Cu²⁺ 得电子，被还原。",steps:["标出变价元素：Fe 与 Cu。","升失氧：Fe 失电子。","失电子者作还原剂。"],tip:"口诀“升失氧作还原剂”可快速判断。"},{id:"chem-c3-02",subject:"chemistry",topicId:"chem-redox",difficulty:1,stem:"KClO₃ 中氯元素的化合价是",options:[{key:"A",text:"-1"},{key:"B",text:"+1"},{key:"C",text:"+5"},{key:"D",text:"+7"}],answer:"C",analysis:"设 Cl 的化合价为 x。K 为 +1，O 为 -2，则 (+1) + x + 3×(-2) = 0，解得 x = +5。",steps:["化合物中各元素化合价代数和为 0。","1 + x - 6 = 0。","x = +5。"],tip:"考试中先标固定价元素，再列式求未知价。"},{id:"chem-c3-03",subject:"chemistry",topicId:"chem-redox",difficulty:2,stem:"反应 Cl₂ + 2NaOH → NaCl + NaClO + H₂O 中，1 mol Cl₂ 完全反应时转移电子的物质的量为",options:[{key:"A",text:"0.5 mol"},{key:"B",text:"1 mol"},{key:"C",text:"2 mol"},{key:"D",text:"4 mol"}],answer:"B",analysis:"1 mol Cl₂ 中，1 mol Cl 由 0 价降到 -1 价，得到 1 mol 电子；另 1 mol Cl 由 0 价升到 +1 价，失去 1 mol 电子。因此转移电子为 1 mol。",steps:["标价：0 → -1；0 → +1。","转移电子数取单方向，不把得失电子相加。","1 mol Cl₂ 对应 1 mol e⁻ 转移。"],tip:"同一元素既升价又降价，属于歧化反应。"},{id:"chem-c3-04",subject:"chemistry",topicId:"chem-redox",difficulty:3,stem:"KClO₃ + 6HCl(浓) → KCl + 3Cl₂↑ + 3H₂O。若有 1 mol KClO₃ 完全反应，被氧化的 HCl 的物质的量为",options:[{key:"A",text:"1 mol"},{key:"B",text:"3 mol"},{key:"C",text:"5 mol"},{key:"D",text:"6 mol"}],answer:"C",analysis:"KClO₃ 中 +5 价 Cl 降到 0 价，需得到 5 mol 电子；共 6 mol HCl 中，5 mol Cl⁻ 被氧化为 0 价，另 1 mol 形成 KCl，未被氧化。",steps:["确定 KClO₃ 中 Cl：+5 → 0，得 5e⁻。","每个被氧化的 Cl⁻：-1 → 0，失去 1e⁻。","由得失电子守恒，被氧化的 HCl 为 5 mol。"],tip:"参加反应的 HCl 不一定全部被氧化。"},{id:"chem-c4-01",subject:"chemistry",topicId:"chem-sodium",difficulty:1,stem:"Na₂O₂ 与水反应的产物是",options:[{key:"A",text:"NaOH 和 H₂"},{key:"B",text:"NaOH 和 O₂"},{key:"C",text:"Na₂CO₃ 和 H₂"},{key:"D",text:"Na₂O 和 O₂"}],answer:"B",analysis:"反应为 2Na₂O₂ + 2H₂O → 4NaOH + O₂↑。过氧化钠中 -1 价氧同时发生氧化和还原。",steps:["Na₂O₂ 遇水生成 NaOH。","另一产物为 O₂，不是 H₂。"],tip:"Na₂O 与水只生成 NaOH，Na₂O₂ 则会放出 O₂。"},{id:"chem-c4-02",subject:"chemistry",topicId:"chem-sodium",difficulty:1,stem:"下列固体加热时，能产生使澄清石灰水变浑浊气体的是",options:[{key:"A",text:"Na₂CO₃"},{key:"B",text:"NaHCO₃"},{key:"C",text:"NaCl"},{key:"D",text:"NaOH"}],answer:"B",analysis:"NaHCO₃ 受热分解生成 Na₂CO₃、H₂O 和 CO₂；CO₂ 可使澄清石灰水变浑浊。",steps:["2NaHCO₃ → Na₂CO₃ + H₂O + CO₂↑。","Na₂CO₃ 对热稳定。"],tip:"碳酸氢钠受热分解是鉴别 Na₂CO₃ 与 NaHCO₃ 的常用依据。"},{id:"chem-c4-03",subject:"chemistry",topicId:"chem-sodium",difficulty:2,stem:"NaHCO₃ 溶液与稀盐酸反应的离子方程式是",options:[{key:"A",text:"CO₃²⁻ + 2H⁺ → CO₂↑ + H₂O"},{key:"B",text:"HCO₃⁻ + H⁺ → CO₂↑ + H₂O"},{key:"C",text:"Na⁺ + Cl⁻ → NaCl"},{key:"D",text:"NaHCO₃ + H⁺ → Na⁺ + CO₂↑ + H₂O"}],answer:"B",analysis:"NaHCO₃ 可拆为 Na⁺ 和 HCO₃⁻；Na⁺ 是旁观离子，HCO₃⁻ 与 H⁺ 反应生成 CO₂ 和 H₂O。",steps:["NaHCO₃ 可溶于水并完全电离。","HCO₃⁻ 不能拆成 H⁺ 和 CO₃²⁻。","删去旁观离子 Na⁺。"],tip:"HCO₃⁻ 是一个整体，不能随意拆开。"},{id:"chem-c4-04",subject:"chemistry",topicId:"chem-sodium",difficulty:3,stem:"2Na₂O₂ + 2CO₂ → 2Na₂CO₃ + O₂ 中，若 1 mol Na₂O₂ 完全反应，转移电子的物质的量为",options:[{key:"A",text:"0.5 mol"},{key:"B",text:"1 mol"},{key:"C",text:"2 mol"},{key:"D",text:"4 mol"}],answer:"B",analysis:"Na₂O₂ 中 O 为 -1 价。-1 价氧一半降到 -2 价，一半升到 0 价。2 mol Na₂O₂ 参与反应时转移 2 mol 电子，因此 1 mol Na₂O₂ 转移 1 mol 电子。",steps:["先标氧的化合价：Na₂O₂ 中为 -1。","生成 Na₂CO₃ 中 O 为 -2，O₂ 中为 0。","按比例折算为 1 mol Na₂O₂。"],tip:"计算电子转移时，别把得到和失去的电子重复相加。"},{id:"chem-c5-01",subject:"chemistry",topicId:"chem-chlorine",difficulty:1,stem:"氯水中具有漂白作用的微粒主要是",options:[{key:"A",text:"Cl₂"},{key:"B",text:"H⁺"},{key:"C",text:"Cl⁻"},{key:"D",text:"HClO"}],answer:"D",analysis:"Cl₂ 与水反应生成 HCl 和 HClO，其中 HClO 具有强氧化性，能漂白有色物质。",steps:["写出 Cl₂ + H₂O ⇌ HCl + HClO。","HCl 无漂白性，HClO 有漂白性。"],tip:"真正起漂白作用的是次氯酸，不是氯气本身。"},{id:"chem-c5-02",subject:"chemistry",topicId:"chem-chlorine",difficulty:1,stem:"将干燥的有色布条分别放入干燥氯气和湿润氯气中，现象是",options:[{key:"A",text:"两者都褪色"},{key:"B",text:"两者都不褪色"},{key:"C",text:"干燥氯气中褪色，湿润氯气中不褪色"},{key:"D",text:"干燥氯气中不褪色，湿润氯气中褪色"}],answer:"D",analysis:"干燥氯气不能直接提供 HClO；湿润氯气中的水与 Cl₂ 反应生成 HClO，因此有色布条褪色。",steps:["漂白微粒是 HClO。","HClO 的生成需要 Cl₂ 与水共同存在。"],tip:"“干燥氯气无漂白性”是常考结论。"},{id:"chem-c5-03",subject:"chemistry",topicId:"chem-chlorine",difficulty:2,stem:"工业上用氯气与氢氧化钠溶液制取漂白液，下列判断正确的是",options:[{key:"A",text:"反应中 Cl₂ 只被氧化"},{key:"B",text:"反应中 Cl₂ 只被还原"},{key:"C",text:"Cl₂ 既被氧化又被还原"},{key:"D",text:"该反应不是氧化还原反应"}],answer:"C",analysis:"Cl₂ + 2NaOH → NaCl + NaClO + H₂O。Cl 从 0 价分别变到 -1 价和 +1 价，因此既被还原又被氧化。",steps:["标出反应前后 Cl 的化合价。","一种元素同时升价、降价，属于歧化反应。"],tip:"漂白液的有效成分是 NaClO。"},{id:"chem-c5-04",subject:"chemistry",topicId:"chem-chlorine",difficulty:3,stem:"标准状况下，11.2 L Cl₂ 与足量铁反应，最多生成 FeCl₃ 的物质的量为",options:[{key:"A",text:"1/6 mol"},{key:"B",text:"1/3 mol"},{key:"C",text:"1/2 mol"},{key:"D",text:"2/3 mol"}],answer:"B",analysis:"n(Cl₂) = 11.2 L ÷ 22.4 L·mol⁻¹ = 0.5 mol。由 2Fe + 3Cl₂ → 2FeCl₃ 可知，3 mol Cl₂ 生成 2 mol FeCl₃，故 0.5 mol Cl₂ 生成 1/3 mol FeCl₃。",steps:["标准状况下先把体积换算成物质的量。","用方程式系数比：n(FeCl₃) = 2/3 × n(Cl₂)。","0.5 × 2/3 = 1/3 mol。"],tip:"跨章节题目先算 n，再按方程式比例。"},{id:"chem-c6-01",subject:"chemistry",topicId:"chem-mole",difficulty:1,stem:"1 mol O₂ 中含有的氧原子物质的量为",options:[{key:"A",text:"0.5 mol"},{key:"B",text:"1 mol"},{key:"C",text:"2 mol"},{key:"D",text:"4 mol"}],answer:"C",analysis:"每个 O₂ 分子含 2 个氧原子，所以 1 mol O₂ 含 2 mol 氧原子。",steps:["看清微粒种类：O₂ 分子还是 O 原子。","1 mol O₂ → 2 mol O。"],tip:"题目问原子、分子还是离子，结论可能不同。"},{id:"chem-c6-02",subject:"chemistry",topicId:"chem-mole",difficulty:1,stem:"18 g H₂O 的物质的量约为",options:[{key:"A",text:"0.5 mol"},{key:"B",text:"1 mol"},{key:"C",text:"2 mol"},{key:"D",text:"18 mol"}],answer:"B",analysis:"H₂O 的摩尔质量为 18 g·mol⁻¹，所以 n = m/M = 18 g ÷ 18 g·mol⁻¹ = 1 mol。",steps:["写出 M(H₂O) = 18 g·mol⁻¹。","使用 n = m/M。"],tip:"质量换算成物质的量时，单位要与摩尔质量匹配。"},{id:"chem-c6-03",subject:"chemistry",topicId:"chem-mole",difficulty:2,stem:"0.5 mol Na₂SO₄ 中含有的 Na⁺ 数目约为",options:[{key:"A",text:"3.01×10²³"},{key:"B",text:"6.02×10²³"},{key:"C",text:"1.204×10²⁴"},{key:"D",text:"2.408×10²⁴"}],answer:"B",analysis:"1 mol Na₂SO₄ 含 2 mol Na⁺，所以 0.5 mol Na₂SO₄ 含 1 mol Na⁺，约 6.02×10²³ 个。",steps:["从化学式判断微粒比例：Na₂SO₄ : Na⁺ = 1 : 2。","n(Na⁺) = 0.5 × 2 = 1 mol。","微粒数 = n × Nₐ。"],tip:"先找化学式中的下标，再乘以外面的物质的量。"},{id:"chem-c6-04",subject:"chemistry",topicId:"chem-mole",difficulty:3,stem:"若 a g O₂ 中含有 b 个 O₂ 分子，则 c g O₃ 中含有的 O₃ 分子数为",options:[{key:"A",text:"bc/a"},{key:"B",text:"2bc/(3a)"},{key:"C",text:"3bc/(2a)"},{key:"D",text:"ac/b"}],answer:"B",analysis:"b 个 O₂ 分子对应 a g 氧气，因此阿伏加德罗常数的表达式可消去。每个 O₃ 分子质量为 48/Nₐ，O₂ 分子质量为 32/Nₐ，两者比为 3:2，所以相同质量下 O₃ 的分子数是 O₂ 的 2/3。c g O₃ 的分子数为 2bc/(3a)。",steps:["先把“个数”转换成“质量与单个分子质量”的关系。","O₂ 与 O₃ 单个分子质量之比为 32:48 = 2:3。","同质量时分子数之比为 3:2，取 c/a 进行比例缩放。"],tip:"高难比例题先找相同量，再比较不同量。"},{id:"chem-c7-01",subject:"chemistry",topicId:"chem-gas",difficulty:1,stem:"在标准状况下，1 mol 任何气体所占的体积约为",options:[{key:"A",text:"1 L"},{key:"B",text:"22.4 L"},{key:"C",text:"24.5 L"},{key:"D",text:"无法确定"}],answer:"B",analysis:"标准状况下气体摩尔体积约为 22.4 L·mol⁻¹，因此 1 mol 气体体积约为 22.4 L。",steps:["条件：标准状况。","对象：气体。","V = nVₘ ≈ 1 × 22.4 = 22.4 L。"],tip:"使用 22.4 L·mol⁻¹ 前必须核对温度和压强。"},{id:"chem-c7-02",subject:"chemistry",topicId:"chem-gas",difficulty:1,stem:"标准状况下，11.2 L CO₂ 的质量约为",options:[{key:"A",text:"11 g"},{key:"B",text:"22 g"},{key:"C",text:"44 g"},{key:"D",text:"88 g"}],answer:"B",analysis:"n(CO₂) = 11.2 ÷ 22.4 = 0.5 mol；m = nM = 0.5 × 44 = 22 g。",steps:["体积 → 物质的量：n = V/22.4。","物质的量 → 质量：m = nM。","0.5 × 44 = 22 g。"],tip:"体积、物质的量、质量之间的换算链要完整。"},{id:"chem-c7-03",subject:"chemistry",topicId:"chem-gas",difficulty:2,stem:"同温同压下，体积相同的两种气体一定具有相同的",options:[{key:"A",text:"质量"},{key:"B",text:"摩尔质量"},{key:"C",text:"分子数"},{key:"D",text:"原子数"}],answer:"C",analysis:"同温同压下，气体摩尔体积相同。体积相同意味着物质的量相同，因此分子数相同；不同气体摩尔质量可不同，分子内原子数也可能不同。",steps:["由阿伏加德罗定律：同温同压、同体积 → 同物质的量。","物质的量相同 → 分子数相同。","质量与原子数还取决于摩尔质量和分子组成。"],tip:"“相同体积”优先对应“相同物质的量”，不要直接推断质量相同。"},{id:"chem-c7-04",subject:"chemistry",topicId:"chem-gas",difficulty:3,stem:"标准状况下，6.72 L H₂ 和 CO 的混合气体质量为 5.8 g，则混合气体中 H₂ 与 CO 的体积比为",options:[{key:"A",text:"1 : 1"},{key:"B",text:"1 : 2"},{key:"C",text:"2 : 1"},{key:"D",text:"3 : 2"}],answer:"B",analysis:"混合气体总物质的量为 6.72 ÷ 22.4 = 0.3 mol。设 CO 为 x mol，则 H₂ 为 (0.3-x) mol。由 28x + 2(0.3-x) = 5.8，得 x = 0.2 mol，H₂ 为 0.1 mol，因此体积比 H₂ : CO = 1 : 2。",steps:["先算总物质的量：0.3 mol。","设 CO 为 x mol，利用总质量列方程。","解得 n(H₂)=0.1 mol，n(CO)=0.2 mol。","同温同压下，体积比等于物质的量比。"],tip:"混合气体题先建立“总物质的量”和“总质量”两个方程。"},{id:"bio-b1-01",subject:"biology",topicId:"bio-cell-intro",difficulty:1,stem:"下列关于病毒的说法，正确的是",options:[{key:"A",text:"病毒具有细胞结构"},{key:"B",text:"病毒可以独立完成全部生命活动"},{key:"C",text:"病毒必须寄生在活细胞内才能增殖"},{key:"D",text:"病毒属于原核生物"}],answer:"C",analysis:"病毒没有细胞结构，不能独立进行代谢和增殖，必须依赖宿主活细胞；它既不属于原核生物，也不属于真核生物。",steps:["病毒由核酸和蛋白质等组成。","没有完整的酶系统和代谢机构。","只能在宿主活细胞中复制增殖。"],tip:"病毒不是原核生物，这是常错点。"},{id:"bio-b1-02",subject:"biology",topicId:"bio-cell-intro",difficulty:1,stem:"细胞学说建立的重要依据是",options:[{key:"A",text:"所有生物都由多个细胞构成"},{key:"B",text:"细胞通过分裂产生新细胞"},{key:"C",text:"所有细胞都有细胞核"},{key:"D",text:"细胞都能独立完成光合作用"}],answer:"B",analysis:"细胞学说认为细胞是一个相对独立的单位，新细胞可以由老细胞分裂产生。并非所有生物都是多细胞，原核细胞也没有核膜包被的细胞核。",steps:["细胞学说强调细胞是结构和功能单位。","关注“新细胞来自已存在的细胞”。"],tip:"“所有”类绝对表述要警惕。"},{id:"bio-b1-03",subject:"biology",topicId:"bio-cell-intro",difficulty:2,stem:"蓝细菌能够进行光合作用，其原因主要是",options:[{key:"A",text:"具有叶绿体"},{key:"B",text:"具有核膜"},{key:"C",text:"含有藻蓝素和叶绿素等光合色素"},{key:"D",text:"属于真核生物"}],answer:"C",analysis:"蓝细菌是原核生物，没有叶绿体，也没有核膜包被的细胞核，但含有藻蓝素和叶绿素，能进行光合作用。",steps:["蓝细菌属于原核生物。","原核细胞没有叶绿体等膜性细胞器。","光合作用依赖其含有的光合色素。"],tip:"“能光合作用”不等于“一定有叶绿体”。"},{id:"bio-b1-04",subject:"biology",topicId:"bio-cell-intro",difficulty:3,stem:"某池塘水样中观察到甲、乙两种单细胞生物：甲有成形的细胞核，乙有拟核和光合色素，但没有叶绿体。下列判断正确的是",options:[{key:"A",text:"甲一定是植物细胞"},{key:"B",text:"乙可能是蓝细菌"},{key:"C",text:"甲、乙都一定具有细胞壁"},{key:"D",text:"甲、乙都以染色体作为唯一遗传物质"}],answer:"B",analysis:"乙有拟核且没有叶绿体，却含有光合色素，符合蓝细菌的特征。甲有真正的细胞核，只能确定为真核细胞，不能仅凭这一点确定是植物细胞；动物细胞没有细胞壁，遗传物质是 DNA，不能说“染色体作为唯一遗传物质”。",steps:["先按“有无核膜包被的细胞核”区分真核细胞和原核细胞。","乙具拟核，可锁定为原核生物；再结合光合色素进一步判断为蓝细菌。","甲只确定为真核细胞，植物、动物、真菌都有可能。"],tip:"先定大类，再用结构特征缩小范围，避免一步跳到结论。"},{id:"bio-b2-01",subject:"biology",topicId:"bio-elements",difficulty:1,stem:"活细胞中含量最多的化合物是",options:[{key:"A",text:"蛋白质"},{key:"B",text:"水"},{key:"C",text:"糖类"},{key:"D",text:"核酸"}],answer:"B",analysis:"水是活细胞中含量最多的化合物；蛋白质通常是含量最多的有机物。",steps:["区分“无机物/有机物”。","含量最多的化合物是水，含量最多的有机物通常是蛋白质。"],tip:"注意题干问的是化合物还是有机物。"},{id:"bio-b2-02",subject:"biology",topicId:"bio-elements",difficulty:1,stem:"被称为“生命活动的主要能源物质”的是",options:[{key:"A",text:"糖类"},{key:"B",text:"蛋白质"},{key:"C",text:"脂质"},{key:"D",text:"核酸"}],answer:"A",analysis:"糖类是生命活动的主要能源物质。脂肪是重要的储能物质，蛋白质承担多种结构和功能。",steps:["糖类：主要能源物质。","脂肪：主要储能物质。","ATP：直接能源物质。"],tip:"“主要能源物质”“直接能源物质”表述不同。"},{id:"bio-b2-03",subject:"biology",topicId:"bio-elements",difficulty:2,stem:"蛋白质结构具有多样性的直接原因不包括",options:[{key:"A",text:"氨基酸的种类不同"},{key:"B",text:"氨基酸的数目不同"},{key:"C",text:"氨基酸的排列顺序不同"},{key:"D",text:"所有蛋白质都由相同数量的氨基酸组成"}],answer:"D",analysis:"蛋白质多样性来自氨基酸种类、数目、排列顺序以及肽链盘曲、折叠形成的空间结构。若所有蛋白质氨基酸数量都相同，会削弱多样性。",steps:["从一级结构看：种类、数目、顺序。","从高级结构看：肽链的数量和空间结构。"],tip:"题目问“不包括”，先圈出否定词。"},{id:"bio-b2-04",subject:"biology",topicId:"bio-elements",difficulty:3,stem:"某植物在干旱条件下细胞内结合水与自由水的比值升高。下列推断最合理的是",options:[{key:"A",text:"细胞代谢强度一定增强"},{key:"B",text:"细胞的抗逆性可能增强"},{key:"C",text:"细胞已经失去全部自由水"},{key:"D",text:"结合水不再参与细胞结构组成"}],answer:"B",analysis:"结合水比例升高通常有利于降低代谢、提高对不良环境的耐受性。它不表示自由水完全消失，也不能据此认定代谢一定增强。",steps:["自由水多通常代谢旺盛。","结合水比例增加通常抗逆性增强。","比值升高不等于自由水含量一定为零。"],tip:"高难题常把相关关系写成绝对因果关系，要谨慎。"},{id:"bio-b3-01",subject:"biology",topicId:"bio-organelles",difficulty:1,stem:"下列细胞器中，具有双层膜结构的是",options:[{key:"A",text:"核糖体"},{key:"B",text:"高尔基体"},{key:"C",text:"线粒体"},{key:"D",text:"内质网"}],answer:"C",analysis:"线粒体具有双层膜；核糖体无膜，高尔基体和内质网具有单层膜。",steps:["双层膜：线粒体、叶绿体、细胞核。","单层膜：内质网、高尔基体、溶酶体、液泡。"],tip:"细胞核不是细胞器，但具有双层膜结构。"},{id:"bio-b3-02",subject:"biology",topicId:"bio-organelles",difficulty:1,stem:"蛋白质合成的场所是",options:[{key:"A",text:"核糖体"},{key:"B",text:"中心体"},{key:"C",text:"溶酶体"},{key:"D",text:"细胞膜"}],answer:"A",analysis:"核糖体是蛋白质合成的场所，是无膜结构的细胞器。",steps:["核糖体由 rRNA 和蛋白质组成。","负责把氨基酸连接成肽链。"],tip:"核糖体无膜，却不是所有细胞都没有；原核细胞也有核糖体。"},{id:"bio-b3-03",subject:"biology",topicId:"bio-organelles",difficulty:2,stem:"分泌蛋白从合成到分泌到细胞外，经过的结构顺序是",options:[{key:"A",text:"核糖体 → 内质网 → 高尔基体 → 细胞膜"},{key:"B",text:"内质网 → 核糖体 → 高尔基体 → 细胞膜"},{key:"C",text:"高尔基体 → 内质网 → 核糖体 → 细胞膜"},{key:"D",text:"核糖体 → 高尔基体 → 线粒体 → 细胞膜"}],answer:"A",analysis:"分泌蛋白在附着于内质网的核糖体上合成，进入内质网加工，再由高尔基体进一步修饰、分类并通过囊泡运输至细胞膜。",steps:["合成：核糖体。","初步加工：内质网。","进一步加工与包装：高尔基体。","分泌：囊泡与细胞膜融合。"],tip:"线粒体供能，但不是分泌蛋白经过的结构。"},{id:"bio-b3-04",subject:"biology",topicId:"bio-organelles",difficulty:3,stem:"关于生物膜系统，下列说法正确的是",options:[{key:"A",text:"生物膜系统只包括细胞膜"},{key:"B",text:"不同生物膜上的蛋白质种类和数量可能不同"},{key:"C",text:"所有生物膜都以完全相同的方式排列磷脂"},{key:"D",text:"核糖体属于生物膜系统的一部分"}],answer:"B",analysis:"生物膜系统包括细胞膜、细胞器膜和核膜等。不同膜执行的功能不同，蛋白质种类和数量会有差异；核糖体没有膜，不属于生物膜系统。",steps:["生物膜系统强调膜结构之间的组成与联系。","蛋白质承担运输、识别、催化等功能，因此不同膜蛋白有差异。","排除无膜细胞器。"],tip:"“生物膜系统”不是“所有细胞器膜的总和”。"},{id:"bio-b4-01",subject:"biology",topicId:"bio-nucleus",difficulty:1,stem:"细胞核的主要功能是",options:[{key:"A",text:"合成全部蛋白质"},{key:"B",text:"进行有氧呼吸的主要场所"},{key:"C",text:"遗传信息库和细胞代谢、遗传的控制中心"},{key:"D",text:"控制物质进出细胞"}],answer:"C",analysis:"细胞核是遗传信息库，是细胞代谢和遗传的控制中心。蛋白质合成主要在核糖体，有氧呼吸主要在线粒体，控制物质进出是细胞膜的功能。",steps:["先区分细胞核、核糖体、线粒体、细胞膜的功能。","细胞核储存遗传信息，并调控代谢与遗传。"],tip:"细胞核是控制中心，不等于所有化学反应都在核内发生。"},{id:"bio-b4-02",subject:"biology",topicId:"bio-nucleus",difficulty:1,stem:"染色质的主要成分是",options:[{key:"A",text:"DNA 和蛋白质"},{key:"B",text:"RNA 和糖类"},{key:"C",text:"脂质和蛋白质"},{key:"D",text:"水和无机盐"}],answer:"A",analysis:"染色质主要由 DNA 和蛋白质组成；在细胞分裂期，染色质高度螺旋化、缩短变粗，成为染色体。",steps:["染色体和染色质是同一物质在不同时期的两种形态。","两者都主要由 DNA 和蛋白质组成。"],tip:"染色质与染色体不是两种不同物质。"},{id:"bio-b4-03",subject:"biology",topicId:"bio-nucleus",difficulty:3,stem:"下列关于细胞核结构的叙述，正确的是",options:[{key:"A",text:"核膜是单层膜，允许所有分子自由通过"},{key:"B",text:"核仁与核糖体的形成有关"},{key:"C",text:"核孔只允许 DNA 进出细胞核"},{key:"D",text:"染色质在细胞核外合成"}],answer:"B",analysis:"核仁与核糖体的形成有关。核膜为双层膜；核孔具有选择性，通常 DNA 不通过核孔进入细胞质；染色质存在于细胞核内。",steps:["核膜：双层膜。","核孔：选择性通道，mRNA 和蛋白质等可通过。","核仁：参与核糖体形成。"],tip:"“核孔是通道”不代表“什么都能自由通过”。"},{id:"cn-c1-01",type:"fill",subject:"chinese",topicId:"cn-poetry-early",difficulty:1,stem:"面对壮阔的秋景，毛泽东以设问收束上阕，发出对国家命运和时代主宰者的追问：____。",answer:"怅寥廓，问苍茫大地，谁主沉浮？",analysis:"“怅寥廓”点出面对宇宙万物时的深沉思索，“问苍茫大地，谁主沉浮”由写景转入对国家命运和时代主宰者的追问，是全词的关键设问。",steps:["题干关键词是“设问”和“谁主宰命运”。","对应《沁园春·长沙》上阕结尾。"],tip:"易错字：“寥廓”。"},{id:"cn-c1-02",type:"fill",subject:"chinese",topicId:"cn-poetry-early",difficulty:2,stem:"曹操用山海作比，并以周公自比，表达广纳贤才、统一天下的政治抱负：____。",answer:"山不厌高，海不厌深。周公吐哺，天下归心。",analysis:"“山不厌高，海不厌深”比喻招纳贤才唯恐不足；“周公吐哺”用周公礼贤下士的典故，表现作者希望天下归心的抱负。",steps:["先定位“山海作比”的两句。","再由“周公”典故定位最后两句。"],tip:"易错字：“哺”不要写成“辅”。"},{id:"cn-c1-03",type:"fill",subject:"chinese",topicId:"cn-poetry-early",difficulty:3,stem:"《归园田居（其一）》中，以飞鸟和池鱼作比，表达厌倦官场、渴望回归田园的诗句是：____。",answer:"羁鸟恋旧林，池鱼思故渊。",analysis:"诗人以“羁鸟”和“池鱼”自比，用“旧林”“故渊”象征自由田园，表达摆脱官场束缚、回归自然的强烈愿望。",steps:["题干给出两个核心意象：“飞鸟”“池鱼”。","把意象与“旧林”“故渊”对应起来。"],tip:"易错字：“羁”“渊”。"},{id:"cn-c2-01",type:"fill",subject:"chinese",topicId:"cn-tang",difficulty:1,stem:"杜甫《登高》中，从空间广阔和时间久远着笔，集中写漂泊异乡、年老多病的诗句是：____。",answer:"万里悲秋常作客，百年多病独登台。",analysis:"“万里”写漂泊空间之远，“百年”写人生晚境；“悲秋”“作客”“多病”“独登台”层层叠加，集中表现诗人的孤苦与身世之悲。",steps:["抓住“漂泊异乡”和“年老多病”两个提示。","对应颈联“万里悲秋常作客，百年多病独登台”。"],tip:"“作客”指客居他乡，不写作“做客”。"},{id:"cn-c2-02",type:"fill",subject:"chinese",topicId:"cn-tang",difficulty:2,stem:"《梦游天姥吟留别》结尾，李白直抒对权贵的蔑视和对人格自由的追求：____。",answer:"安能摧眉折腰事权贵，使我不得开心颜？",analysis:"“摧眉折腰”形象写出对权贵低声下气的屈辱姿态。诗人用反问坚决拒绝这种生活，突出对独立人格和精神自由的追求。",steps:["题干关键词是“蔑视权贵”“人格自由”。","定位全诗结尾的反问句。"],tip:"易错字：“摧眉”不是“催眉”。"},{id:"cn-c2-03",type:"fill",subject:"chinese",topicId:"cn-tang",difficulty:3,stem:"《琵琶行（并序）》中，诗人由琵琶女的身世联想到自己的贬谪处境，产生命运共鸣：____。",answer:"同是天涯沦落人，相逢何必曾相识！",analysis:"诗人与琵琶女身份、经历不同，却同样漂泊失意。“同是天涯沦落人”把两人的命运连在一起，构成全诗情感转折和共鸣的核心。",steps:["题干提示“命运共鸣”。","对应诗中由琵琶女身世转向诗人自述的过渡句。"],tip:"“沦落”指流落、失意，注意“沦”字。"},{id:"cn-c3-01",type:"fill",subject:"chinese",topicId:"cn-song",difficulty:1,stem:"苏轼《念奴娇·赤壁怀古》中，用夸张和比喻描绘赤壁险峻山势与汹涌波涛：____。",answer:"乱石穿空，惊涛拍岸，卷起千堆雪。",analysis:"“穿空”写山石高峻，“拍岸”写波涛冲击，“千堆雪”比喻浪花。三句从视觉和听觉写出赤壁景象的雄奇壮阔。",steps:["先找“夸张写山势”。","再找“比喻写浪花”，组成完整三句。"],tip:"“涛”不要写成“滔”。"},{id:"cn-c3-02",type:"fill",subject:"chinese",topicId:"cn-song",difficulty:2,stem:"辛弃疾《永遇乐·京口北固亭怀古》开篇，由眼前江山想到历史英雄孙权，表达英雄难觅的感慨：____。",answer:"千古江山，英雄无觅，孙仲谋处。",analysis:"词人登临北固亭，面对千古江山，寻找孙权那样的英雄却已无处可觅。开篇为全词怀古和现实感慨定下基调。",steps:["题干出现“开篇”和“孙权”。","孙权字仲谋，据此定位。"],tip:"“无觅”是寻找不到，注意“觅”字。"},{id:"cn-c3-03",type:"fill",subject:"chinese",topicId:"cn-song",difficulty:3,stem:"李清照《声声慢》开头连用七组叠字，从动作、环境一路写到凄苦心境：____。",answer:"寻寻觅觅，冷冷清清，凄凄惨惨戚戚。",analysis:"“寻寻觅觅”写若有所失的动作，“冷冷清清”写环境，“凄凄惨惨戚戚”写内心感受。叠字层层推进，节奏低沉，强化孤独凄凉。",steps:["七组叠字分为三层：动作、环境、心境。","逐字检查“凄”“惨”“戚”的字形。"],tip:"完整默写七组叠字，不要漏掉“戚戚”。"},{id:"cn-c4-01",type:"fill",subject:"chinese",topicId:"cn-prose",difficulty:1,stem:"《劝学》中，用木材和金属的变化作比，说明学习、自省能够使人智慧明达、行为无过：____。",answer:"故木受绳则直，金就砺则利，君子博学而日参省乎己，则知明而行无过矣。",analysis:"木材经墨线校正而直，金属在磨石上磨过而锋利。作者以此引出君子广泛学习、每日自省，才能智慧明达、少犯过错。",steps:["题干把“木材”“金属”“自省”连在一起。","按比喻、推论两层结构默写完整。"],tip:"“知明”中的“知”同“智”，不要误改为“智”。"},{id:"cn-c4-02",type:"fill",subject:"chinese",topicId:"cn-prose",difficulty:2,stem:"韩愈《师说》中提出从师标准，不论地位高低、年龄长少，道在哪里，老师就在哪里：____。",answer:"是故无贵无贱，无长无少，道之所存，师之所存也。",analysis:"这句话用排比和判断句式，把从师标准归结为“道之所存”，直接批判当时看重门第、年龄而不重从师学习的风气。",steps:["先写两组“无……”排除身份和年龄。","再落到“道”和“师”的对应关系。"],tip:"“无贵无贱”指不论贵贱，不是没有贵贱。"},{id:"cn-c4-03",type:"fill",subject:"chinese",topicId:"cn-prose",difficulty:3,stem:"《劝学》中，用骏马和劣马作对比，强调学习贵在坚持、不能半途而废：____。",answer:"骐骥一跃，不能十步；驽马十驾，功在不舍。",analysis:"骏马跳跃一次也不能达到十步，劣马拉车走十天却能走得很远，靠的是不停歇。作者借对比说明坚持的功效，论证学习必须积累。",steps:["骏马对应“骐骥”。“劣马”对应“驽马”。","找到对比后总结坚持的“不舍”。"],tip:"易错字：“骐骥”“驽马”。"},{id:"cn-c5-01",type:"fill",subject:"chinese",topicId:"cn-travel",difficulty:1,stem:"《赤壁赋》中，苏轼用蜉蝣和一粒粟米作比，感叹个人生命短暂、人在天地间渺小：____。",answer:"寄蜉蝣于天地，渺沧海之一粟。",analysis:"“蜉蝣”生命短暂，“一粟”极言渺小。两句写出个体相对于天地、沧海时的短暂与微不足道，也引出后文对变与不变的讨论。",steps:["由“蜉蝣”定位第一句。","由“粟米”和“沧海”定位第二句。"],tip:"易错字：“蜉蝣”“渺”“粟”。"},{id:"cn-c5-02",type:"fill",subject:"chinese",topicId:"cn-travel",difficulty:2,stem:"姚鼐《登泰山记》中，描写青山覆盖积雪、雪光照亮南面天空的景象：____。",answer:"苍山负雪，明烛天南。",analysis:"《登泰山记》写冬日泰山雪景：青山背负着积雪，雪光映照如烛，照亮南面天空。凝练的句子兼有色彩、力量和光感。",steps:["“青山覆盖积雪”对应“苍山负雪”。","“雪光照亮南面天空”对应“明烛天南”。"],tip:"“烛”在此是名词作动词，指像蜡烛一样照亮。"},{id:"cn-c5-03",type:"fill",subject:"chinese",topicId:"cn-travel",difficulty:3,stem:"《赤壁赋》中，苏轼从“变”与“不变”两个角度观察世界，说明事物和我都无穷无尽：____。",answer:"盖将自其变者而观之，则天地曾不能以一瞬；自其不变者而观之，则物与我皆无尽也，而又何羡乎！",analysis:"从变化角度看，天地万物瞬息万变；从不变角度看，物与我都可以延续无穷，因此不必羡慕长江的无穷。这里体现苏轼超越个体有限性的哲思。",steps:["先写“自其变者而观之”这一层。","再写“自其不变者而观之”这一层，注意结句“而又何羡乎”。"],tip:"长句按分号分成两个层次默写，特别注意“曾不能以一瞬”。"},{id:"cn-c6-01",type:"fill",subject:"chinese",topicId:"cn-recitation",difficulty:1,stem:"《静女》中，男子等待心上人，女子却故意躲藏，男子焦急徘徊：____。",answer:"爱而不见，搔首踟蹰。",analysis:"女子藏起来不肯露面，男子抓头徘徊，动作描写生动传神，写出等待中的焦急、笨拙和深情。",steps:["“故意躲藏”对应“爱而不见”。","“焦急徘徊”对应“搔首踟蹰”。"],tip:"“见”同“现”，这里仍按课文原字默写。"},{id:"cn-c6-02",type:"fill",subject:"chinese",topicId:"cn-recitation",difficulty:2,stem:"《涉江采芙蓉》中，写相爱的人却分居两地，只能在忧伤中度过一生：____。",answer:"同心而离居，忧伤以终老。",analysis:"“同心”说明彼此情深，“离居”点出分离现实，两者形成强烈反差，引出无法团聚的忧伤。",steps:["“相爱”对应“同心”。","“分居两地、忧伤终生”对应后一句。"],tip:"“离居”是分离而居，不是离开居所。"},{id:"cn-c6-03",type:"fill",subject:"chinese",topicId:"cn-recitation",difficulty:2,stem:"李煜《虞美人》中，以滔滔春水比喻无穷无尽的愁绪：____。",answer:"问君能有几多愁？恰似一江春水向东流。",analysis:"词人先用疑问把“愁”具体化，再以向东奔流的春水作比，把抽象愁绪写成绵延无穷、无法阻断的形象。",steps:["先定位“问君能有几多愁”的设问。","再写“一江春水”的比喻。"],tip:"“恰似”不要漏写；“向东流”不要写成“向东去”。"},{id:"cn-c6-04",type:"fill",subject:"chinese",topicId:"cn-recitation",difficulty:3,stem:"《鹊桥仙》中，秦观翻出爱情新境界，认为感情只要长久真挚，不必追求朝夕相守：____。",answer:"两情若是久长时，又岂在朝朝暮暮。",analysis:"这两句突破传统爱情词中对离别的哀怨，把真挚长久的感情放在朝夕相伴之上，境界开阔而积极。",steps:["“长久真挚”对应“久长时”。","“不必朝夕相守”对应反问“又岂在朝朝暮暮”。"],tip:"易错词：“久长时”“朝朝暮暮”。"}],Ty=(d="")=>d.normalize("NFKC").replace(/[\s，。！？；：、“”‘’《》（）,.!?;:'"()[\]—…-]/gu,"").trim(),Cy=(d,_)=>{var C;if(d.type!=="fill")return _===d.answer;const z=Ty(_);return((C=d.acceptedAnswers)!=null&&C.length?d.acceptedAnswers:[d.answer]).some(U=>Ty(U)===z)},Uy=d=>d.type==="fill"?d.answer:`选项 ${d.answer}`,Ry=({subject:d="all",difficulty:_="all",topicId:z="all"}={})=>Tt.filter(m=>(d==="all"||m.subject===d)&&(_==="all"||m.difficulty===Number(_))&&(z==="all"||m.topicId===z)),ae={chemistry:{id:"chemistry",name:"化学",short:"化",range:"必修一 · 至气体摩尔体积",accent:"#d45a3f",soft:"#f5d8cf"},biology:{id:"biology",name:"生物",short:"生",range:"必修1 · 至细胞核",accent:"#257266",soft:"#d6e9e3"},chinese:{id:"chinese",name:"语文",short:"语",range:"必修上册 · 理解性默写",accent:"#6651a8",soft:"#e5dff4"}},We=[{id:"chem-classification",subject:"chemistry",order:1,title:"物质的分类及转化",shortTitle:"物质分类",summary:"纯净物、混合物与分散系",points:["胶体的本质特征是分散质粒子直径在 1～100 nm。","丁达尔效应可用于区分胶体和溶液。","酸性、碱性氧化物要同时看组成与反应产物。"],formula:"分散系 = 分散质 + 分散剂"},{id:"chem-ion",subject:"chemistry",order:2,title:"离子反应",shortTitle:"离子反应",summary:"离子共存与离子方程式",points:["拆写顺序：强酸、强碱和可溶性盐写成离子。","沉淀、气体、弱电解质和水保留化学式。","判断离子共存时同时看颜色、酸碱性及是否发生反应。"],formula:"H⁺ + OH⁻ → H₂O"},{id:"chem-redox",subject:"chemistry",order:3,title:"氧化还原反应",shortTitle:"氧化还原",summary:"化合价、电子转移与守恒",points:["升失氧：化合价升高、失电子、被氧化。","降得还：化合价降低、得电子、被还原。","先找变价元素，再用得失电子守恒配平。"],formula:"失电子总数 = 得电子总数"},{id:"chem-sodium",subject:"chemistry",order:4,title:"钠及其化合物",shortTitle:"钠及其化合物",summary:"Na₂O₂、碳酸钠与碳酸氢钠",points:["钠在空气中燃烧生成淡黄色 Na₂O₂。","Na₂O₂ 中氧元素为 -1 价，遇水、CO₂ 均可放出 O₂。","NaHCO₃ 热稳定性弱于 Na₂CO₃，可用于鉴别。"],formula:"2Na₂O₂ + 2H₂O → 4NaOH + O₂↑"},{id:"chem-chlorine",subject:"chemistry",order:5,title:"氯及其化合物",shortTitle:"氯及其化合物",summary:"氯水、漂白液与氯离子检验",points:["Cl₂ 与水反应生成 HCl 和 HClO。","HClO 具有弱酸性和漂白性，见光易分解。","Cl⁻ 可用 AgNO₃ 溶液和稀硝酸检验。"],formula:"Cl₂ + H₂O ⇌ HCl + HClO"},{id:"chem-mole",subject:"chemistry",order:6,title:"物质的量与摩尔质量",shortTitle:"物质的量",summary:"微粒数、质量与摩尔质量",points:["物质的量描述的是粒子集合，单位是 mol。","以 g·mol⁻¹ 为单位时，摩尔质量在数值上等于相对分子质量。","计算先统一单位，再判断微粒种类和数目。"],formula:"n = m / M = N / Nₐ"},{id:"chem-gas",subject:"chemistry",order:7,title:"气体摩尔体积",shortTitle:"气体摩尔体积",summary:"标准状况、气体体积与混合气体",points:["标准状况下，气体摩尔体积约为 22.4 L·mol⁻¹。","22.4 L·mol⁻¹ 只适用于气体，不适用于水、酒精等液体。","同温同压下，相同体积的任何气体含有相同数目的分子。"],formula:"n = V / Vₘ（标准状况 Vₘ ≈ 22.4 L·mol⁻¹）"},{id:"bio-cell-intro",subject:"biology",order:1,title:"走近细胞",shortTitle:"走近细胞",summary:"细胞学说与原核、真核细胞",points:["细胞是生物体结构和功能的基本单位。","病毒没有细胞结构，必
