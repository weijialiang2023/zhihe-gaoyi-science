他们可形成 MgO, 为离子化合物, C 正确;","D":"错误。改正：Z 为 S, 硫的最高价含氧酸为硫酸, 是强酸, D 错误; 故选 C。"},"analysis":"【详解】 A . X 为 O, W 为 N, 同周期从左往右, 原子半径依次减小, 所以半径大小为 W>X, A 错误; B. X 为 O, Z 为 S, X 的简单氢化物为 H₂ O, 含有分子间氢键, Z 的简单氢化物为 H₂ ~S, 没有氢键, 所以简单氢化物的沸点为 X>Z, B 错误; C. Y 为 Mg, X 为 O, 他们可形成 MgO, 为离子化合物, C 正确; D. Z 为 S, 硫的最高价含氧酸为硫酸, 是强酸, D 错误; 故选 C。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 C。"],"tip":"真题来源：bench-化学-2023-全国甲卷","examSource":{"title":"bench-化学-2023-全国甲卷","year":2023,"region":"全国","examType":"全国甲卷","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-56d00971e8aacd2b161142d6","subject":"chemistry","topicId":"chem-classification","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2023 · 全国 · 新课标卷","stem":"化学在文物的研究和修复中有重要作用。下列说法错误的是","options":[{"key":"A","text":"竹简的成分之一纤维素属于天然高分子"},{"key":"B","text":"龟甲的成分之一羟基磷灰石属于无机物"},{"key":"C","text":"古陶瓷修复所用的熟石膏, 其成分为 Ca(OH)₂"},{"key":"D","text":"古壁画颜料中所用的铁红, 其成分为 Fe₂ O₃"}],"answer":"C","optionNotes":{"A":"错误。改正：本题标准答案为 C，“古陶瓷修复所用的熟石膏, 其成分为 Ca(OH)₂”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：羟基磷灰石又称又称羟磷灰石、碱式磷酸钙, 其化学式为 [Ca₁₀ (PO₄ )₆(OH)₂ ], 属于无机物, B 正确;","C":"正确。熟石膏是主要成分为 2 CaSO₄ H₂ O, Ca(OH)₂ 为熟石灰的主要成分, C 错误;","D":"错误。改正：Fe₂ O₃ 为红色, 常被用于油漆、涂料、油墨和橡胶的红色颜料, 俗称铁红, D 正确;故答案选 C。"},"analysis":"【详解】A. 纤维素是一种天然化合物, 其分子式为 (C₆ H₁₀ O₅ )_n, 其相对分子质量较高, 是一种天然高分子, A 正确; B. 羟基磷灰石又称又称羟磷灰石、碱式磷酸钙, 其化学式为 [Ca₁₀ (PO₄ )₆(OH)₂ ], 属于无机物, B 正确; C. 熟石膏是主要成分为 2 CaSO₄ H₂ O, Ca(OH)₂ 为熟石灰的主要成分, C 错误; D. Fe₂ O₃ 为红色, 常被用于油漆、涂料、油墨和橡胶的红色颜料, 俗称铁红, D 正确;故答案选 C。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 C。"],"tip":"真题来源：bench-化学-2023-新课标卷","examSource":{"title":"bench-化学-2023-新课标卷","year":2023,"region":"全国","examType":"新课标卷","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-6282a9051a0dc31219458c20","subject":"chemistry","topicId":"chem-classification","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2024 · 全国 · 全国甲卷","stem":"人类对能源的利用经历了柴薪、煤炭和石油时期, 现正向新能源方向高质量发展。下列有关能源的叙述错误的是","options":[{"key":"A","text":"木材与煤均含有碳元素"},{"key":"B","text":"石油裂化可生产汽油"},{"key":"C","text":"燃料电池将热能转化为电能"},{"key":"D","text":"太阳能光解水可制氢"}],"answer":"C","optionNotes":{"A":"错误。改正：本题标准答案为 C，“燃料电池将热能转化为电能”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：石油裂化是将相对分子质量较大、沸点较高的烃断裂为相对分子质量较小、沸点较低的烃的过程，汽油的相对分子质量较小，可以通过石油裂化的方式得到，B 正确;","C":"正确。燃料电池是将燃料 化学能变成电能的装置, 不是将热能转化为电能, C 错误;","D":"错误。改正：在催化剂作用下, 利用太阳能光解水可以生成氢气和氧气, D 正确; 故答案选 C。"},"analysis":"【详解】A. 木材的主要成分为纤维素，纤维素中含碳、氢、氧三种元素，煤是古代植物埋藏在地下经历了复杂的变化逐渐形成的固体, 是有机物和无机物组成的复杂混合物, 主要含碳元素, A 正确; B. 石油裂化是将相对分子质量较大、沸点较高的烃断裂为相对分子质量较小、沸点较低的烃的过程，汽油的相对分子质量较小，可以通过石油裂化的方式得到，B 正确; C. 燃料电池是将燃料 化学能变成电能的装置, 不是将热能转化为电能, C 错误; D. 在催化剂作用下, 利用太阳能光解水可以生成氢气和氧气, D 正确; 故答案选 C。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 C。"],"tip":"真题来源：bench-化学-2024-全国甲卷","examSource":{"title":"bench-化学-2024-全国甲卷","year":2024,"region":"全国","examType":"全国甲卷","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-e527688f9dcfc1cc9054bcd1","subject":"chemistry","topicId":"chem-ion","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2024 · 全国 · 全国甲卷","stem":"下列过程对应的离子方程式正确的是","options":[{"key":"A","text":"用氢氟酸刻蚀玻璃: SiO₃²⁻+4 ~F⁻+6 H⁺=SiF₄ +3 H₂ O"},{"key":"B","text":"用三氯化铁溶液刻制覆铜电路板: 2 Fe³⁺+3 Cu=3 Cu²⁺+2 Fe"},{"key":"C","text":"用硫代硫酸钠溶液脱氯: S₂ O₃²⁻+2 Cl₂+3 H₂ O=2 SO₃²⁻+4 Cl⁻+6 H⁺"},{"key":"D","text":"用碳酸钠溶液浸泡锅炉水垢中的硫酸钙: CaSO₄+CO₃²⁻=CaCO₃+SO₄²⁻"}],"answer":"D","optionNotes":{"A":"错误。改正：本题标准答案为 D，“用碳酸钠溶液浸泡锅炉水垢中的硫酸钙: CaSO₄+CO₃²⁻=CaCO₃+SO₄²⁻”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：Fe³⁺ 可以将 Cu 氧化成 Cu²⁺, 三氯化铁刻蚀铜电路板时反应的离子方程式为 2 Fe³⁺+Cu⁻¹ 2 Fe²⁺+Cu²⁺, B 错误;","C":"错误。改正：氯气具有强氧化性, 可以氧化硫代硫酸根成硫酸根, 氯气被还原为氯离子, 反应的离子方程式为 S₂ O ₃²⁻+4 Cl₂+5 H₂ O=2 SO₄²⁻+8 Cl⁻+10 H⁺, C 错误;","D":"正确。碳酸钙的溶解度小于硫酸钙，可以用碳酸钠溶液浸泡水垢使硫酸钙转化为疏松、易溶于酸的碳酸钙，反应的离子方程式为 CaSO₄+CO₃²⁻=CaCO₃+SO₄²⁻, D 正确;故答案选D。"},"analysis":"【详解】A. 玻璃的主要成分为 SiO₂, 用氢氟酸刻蚀玻璃时, SiO₂ 和氢氟酸反应生成 SiF₄ 气体和水, 反应的方程式为 SiO₂+4 HF=SiF₄ +2 H₂ O, A 错误; B. Fe³⁺ 可以将 Cu 氧化成 Cu²⁺, 三氯化铁刻蚀铜电路板时反应的离子方程式为 2 Fe³⁺+Cu⁻¹ 2 Fe²⁺+Cu²⁺, B 错误; C. 氯气具有强氧化性, 可以氧化硫代硫酸根成硫酸根, 氯气被还原为氯离子, 反应的离子方程式为 S₂ O ₃²⁻+4 Cl₂+5 H₂ O=2 SO₄²⁻+8 Cl⁻+10 H⁺, C 错误; D. 碳酸钙的溶解度小于硫酸钙，可以用碳酸钠溶液浸泡水垢使硫酸钙转化为疏松、易溶于酸的碳酸钙，反应的离子方程式为 CaSO₄+CO₃²⁻=CaCO₃+SO₄²⁻, D 正确;故答案选D。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 D。"],"tip":"真题来源：bench-化学-2024-全国甲卷","examSource":{"title":"bench-化学-2024-全国甲卷","year":2024,"region":"全国","examType":"全国甲卷","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-3f35f97e77abbdcf2f7408db","subject":"chemistry","topicId":"chem-periodic","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2024 · 全国 · 全国甲卷","stem":"W、X、Y、 Z 为原子序数依次增大 ^ 短周期元素。 W 和 X 原子序数之和等于 Y⁻的核外电子数, 化合物 W⁺ [ZY₆ ]⁻⁵ 可用作化学电源的电解质。下列叙述正确的是","options":[{"key":"A","text":"X 和 Z 属于同一主族"},{"key":"B","text":"非属性： X>Y>Z"},{"key":"C","text":"气态氢化物的稳定性： Z>Y"},{"key":"D","text":"原子半径: Y>X>W"}],"answer":"A","optionNotes":{"A":"正确。本题标准答案为 A，该表述符合真题结论。完整依据见上方解析。","B":"错误。改正：由分析可知, X 为 N 元素, Y 为 F 元素, Z 为 P 元素, 非金属性: F>N>P, B 项错误;","C":"错误。改正：由分析可知, Y 为 F 元素, Z 为 P 元素, 非金属性越强, 其简单气态氢化物的稳定性越强, 即气态氢化物的稳定性: HF>PH₃, C 项错误;","D":"错误。改正：由分析可知, W 为 Li 元素, X 为 N 元素, Y 为 F 元素, 同周期主族元素原子半径随着原子序数的增大而减小, 故原子半径: Li>N>F, D 项错误; 故选 A。"},"analysis":"【分析】 W 、 X 、 Y 、 Z 为原子序数依次增大的短周期元素，且能形成离子化合物 W⁺ [ZY₆ ] ，则 W 为 Li 或 Na ；又由于 W 和 X 原子序数之和等于 Y⁻的核外电子数，若 W 为 Na ， X 原子序数大于 Na ，则 W 和 X 原子序数之和大于 18 ，不符合题意，因此 W 只能为 Li 元素；由于 Y 可形成 Y⁻，故 Y 为第VII主族元素，且原子序数 Z 大于 Y ，故 Y 不可能为 Cl 元素，因此 Y 为 F 元素， X 的原子序数为 10-3=7, X 为 N 元素；根据 W 、 Y 、 Z 形成离子化合物 W⁺ [ZY₆ ]⁻，可知 Z 为 P 元素；综上所述， W 为 Li 元素， X 为 N 元素， Y 为 F 元素， Z 为 P 元素。 【详解】A. 由分析可知, X 为 N 元素, Z 为 P 元素, X 和 Z 属于同一主族, A 项正确; B. 由分析可知, X 为 N 元素, Y 为 F 元素, Z 为 P 元素, 非金属性: F>N>P, B 项错误; C. 由分析可知, Y 为 F 元素, Z 为 P 元素, 非金属性越强, 其简单气态氢化物的稳定性越强, 即气态氢化物的稳定性: HF>PH₃, C 项错误; D. 由分析可知, W 为 Li 元素, X 为 N 元素, Y 为 F 元素, 同周期主族元素原子半径随着原子序数的增大而减小, 故原子半径: Li>N>F, D 项错误; 故选 A。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 A。"],"tip":"真题来源：bench-化学-2024-全国甲卷","examSource":{"title":"bench-化学-2024-全国甲卷","year":2024,"region":"全国","examType":"全国甲卷","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-d9bfb9ff9d27a7ec8890050c","subject":"chemistry","topicId":"chem-classification","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2024 · 全国 · 新课标","stem":"文房四宝是中华传统文化的瑰宝。下列有关叙述错误的是","options":[{"key":"A","text":"羊毛可用于制毛笔, 主要成分为蛋白质"},{"key":"B","text":"松木可用于制墨, 墨的主要成分是单质碳"},{"key":"C","text":"竹子可用于造纸, 纸的主要成分是纤维素"},{"key":"D","text":"大理石可用于制砚台, 主要成分为硅酸盐"}],"answer":"D","optionNotes":{"A":"错误。改正：本题标准答案为 D，“大理石可用于制砚台, 主要成分为硅酸盐”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：墨的主要成分是炭黑, 炭黑是碳元素的一种单质, 碳的单质在常温下的化学性质很稳定, 不易与其他物质发生化学反应, 故用墨汁书写的字画历经千年仍不褪色, B 正确;","C":"错误。改正：竹子可用于造纸, 竹子的主要成分是纤维素, 用其造的纸的主要成分也是纤维素, C 正确;","D":"正确。大理石可用于制砚台，大理石主要成分为碳酸钙，不是硅酸盐，D 错误； 故选 D。"},"analysis":"【详解】A. 动物的毛、皮、角等的主要成分都是蛋白质，羊毛的主要成分为蛋白质，A 正确； B. 墨的主要成分是炭黑, 炭黑是碳元素的一种单质, 碳的单质在常温下的化学性质很稳定, 不易与其他物质发生化学反应, 故用墨汁书写的字画历经千年仍不褪色, B 正确; C. 竹子可用于造纸, 竹子的主要成分是纤维素, 用其造的纸的主要成分也是纤维素, C 正确; D. 大理石可用于制砚台，大理石主要成分为碳酸钙，不是硅酸盐，D 错误； 故选 D。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 D。"],"tip":"真题来源：bench-化学-2024-新课标","examSource":{"title":"bench-化学-2024-新课标","year":2024,"region":"全国","examType":"新课标","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-25e434c8e1deb9a1799688a4","subject":"chemistry","topicId":"chem-ion","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2024 · 全国 · 新课标","stem":"对于下列过程中发生的化学反应, 相应离子方程式正确的是","options":[{"key":"A","text":"试管壁上的银镜用稀硝酸清洗: Ag+2 H⁺+NO₃⁻=Ag⁺+NO₂ +H₂ O"},{"key":"B","text":"工业废水中的 Pb²⁺ 用 FeS 去除： Pb²⁺+S²⁻=PbS"},{"key":"C","text":"海水提溴过程中将溴吹入 SO₂ 吸收塔: Br₂+SO₂+2 H₂ O=2 Br⁻+SO₄²⁻+4 H⁺"},{"key":"D","text":"用草酸标准溶液测定高锰酸钾溶液的浓度: 2 MnO₄⁻+5 C₂ O₄²⁻+16 H⁺=2 Mn²⁺+10 CO₂ +8 H₂ O"}],"answer":"C" 正确；","D":"错误。改正：Mg₃ [Fe(CN)₆ ]₂ 中 CN⁻提供电子对与 Fe³⁺ 形成配位键, D 正确; 综上所述, 本题选 A。"},"analysis":"【分析】 W 、 X 、 Y 、 Z 的原子序数依次增加，且 W 、 X 、 Y 属于不同族的短周期元素。 W 的外层电子数是其内层电子数的 2 倍, 则 W 为 C 元素; 每个周期的IIA 和VA 的元素的第一电离能都比左右相邻元素的高,由于配合物 Y₃ [Z(WX)₆ ]₂ 中 Y 在外界, Y 可形成简单阳离子, 则 Y 属于金属元素, 故 X 和 Y 分别为 N 和 Mg ; Z 的 M 层未成对电子数为 4 , 则其 3 d 轨道上有 4 个不成对电子, 其价电子排布式为 3 ~d⁶ 4 ~s², Z 为 Fe元素, Y₃ [Z(WX)₆ ]₂ 为 Mg₃ [Fe(CN)₆ ]₂ 。 【详解】A. W、X、Y、Z 四种元素的单质中, N 元素的单质形成分子晶体, Mg 和 Fe 均形成金属晶体, C 元素既可以形成金刚石又可以形成石墨，石墨的熔点最高，A 不正确； B. 在 X 的简单氢化物是 NH₃ ，其中 C 原子轨道杂化类型为 sp³ ，B 正确; C. Y 的氢氧化物是 Mg(OH)₂, 其属于中强碱, 其难溶于水, 难溶于 NaCl 溶液, 但是, 由于 NH₄ Cl 电离产生的 NH₄⁺可以破坏 Mg(OH)₂ 的沉淀溶解平衡，因此 Mg(OH)₂ 可以溶于 NH₄ Cl 溶液， C 正确； D. Mg₃ [Fe(CN)₆ ]₂ 中 CN⁻提供电子对与 Fe³⁺ 形成配位键, D 正确; 综上所述, 本题选 A。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 A。"],"tip":"真题来源：bench-化学-2024-新课标","examSource":{"title":"bench-化学-2024-新课标","year":2024,"region":"全国","examType":"新课标","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-c55efa852598fe3404b21366","subject":"biology","topicId":"bio-protein","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2021 · 全国 · （全国甲卷）","stem":"已知①酶、②抗体、③激素、④糖原、⑤脂肪、⑥核酸都是人体内有重要作用的物质。下列说法正确的 是（）","options":[{"key":"A","text":"①②③都是由氨基酸通过肽键连接而成的"},{"key":"B","text":"③④⑤都是生物大分子，都以碳链为骨架"},{"key":"C","text":"①②⑥都是由含氮的单体连接成的多聚体"},{"key":"D","text":"④⑤⑥都是人体细胞内的主要能源物质"}],"answer":"C","optionNotes":{"A":"错误。改正：本题标准答案为 C，“①②⑥都是由含氮的单体连接成的多聚体”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：糖原是生物大分子，脂肪不是生物大分子，且激素不一定是大分子物质，如甲状腺激素是含碘的氨基酸， B错误；","C":"正确。酶的化学本质是蛋白质或RNA，抗体的化学成分是蛋白质，蛋白质是由氨基酸连接而成的多聚体，核酸是由核苷酸连接而成的多聚体，氨基酸和核苷酸都含有氮元素，C正确；","D":"错误。改正：人体主要的能源物质是糖类，核酸是生物的遗传物质，脂肪是机体主要的储能物质，D错误。 故选C。"},"analysis":"【详解】A、酶的化学本质是蛋白质或RNA，抗体的化学本质是蛋白质，激素的化学本质是有机物，如蛋 白质、氨基酸的衍生物、脂质等，只有蛋白质才是由氨基酸通过肽键连接而成的，A错误； B、糖原是生物大分子，脂肪不是生物大分子，且激素不一定是大分子物质，如甲状腺激素是含碘的氨基酸， B错误； C、酶的化学本质是蛋白质或RNA，抗体的化学成分是蛋白质，蛋白质是由氨基酸连接而成的多聚体，核酸是由核苷酸连接而成的多聚体，氨基酸和核苷酸都含有氮元素，C正确； D、人体主要的能源物质是糖类，核酸是生物的遗传物质，脂肪是机体主要的储能物质，D错误。 故选C。","st 题干条件和真题结论一致，该项不符合。完整依据见上方解析。","C":"错误。改正：生物的性状是由基因控制的，生长素能引起生物性状的改变，是通过调控某些基因的表达来影响植物生 长的，C正确；","D":"正确。根、茎两种器官对生长素的反应敏感程度有明显差异，其中根对生长素最敏感，D错误。 故选D。"},"analysis":"【详解】AB、顶端优势产生的原因是顶芽产生的生长素向下运输，枝条上部的侧芽部位生长素浓度较高， 侧芽对生长素浓度比较敏感，因而使侧芽的发育受到抑制，可以通过摘除顶芽的方式解除植株顶端优势， AB正确； C、生物的性状是由基因控制的，生长素能引起生物性状的改变，是通过调控某些基因的表达来影响植物生 长的，C正确； D、根、茎两种器官对生长素的反应敏感程度有明显差异，其中根对生长素最敏感，D错误。 故选D。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 D。"],"tip":"真题来源：bench-生物-2021-全国甲卷","examSource":{"title":"bench-生物-2021-全国甲卷","year":2021,"region":"全国","examType":"（全国甲卷）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-fc012daff0ba50d5ed39c157","subject":"biology","topicId":"bio-cell-intro","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2021 · 全国 · （全国甲卷）","stem":"人体下丘脑具有内分泌功能，也是一些调节中枢的所在部位。下列有关下丘脑的叙述，错误的是（）","options":[{"key":"A","text":"下丘脑能感受细胞外液渗透压的变化"},{"key":"B","text":"下丘脑能分泌抗利尿激素和促甲状腺激素"},{"key":"C","text":"下丘脑参与水盐平衡的调节：下丘脑有水平衡调节中枢"},{"key":"D","text":"下丘脑能感受体温的变化；下丘脑有体温调节中枢"}],"answer":"B","optionNotes":{"A":"错误。改正：本题标准答案为 B，“下丘脑能分泌抗利尿激素和促甲状腺激素”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"正确。下丘脑能分泌促甲状腺激素释放激素、抗利尿激素等，具有内分泌功能，促甲状腺激素是由垂体分泌， B错误；","C":"错误。改正：本题标准答案为 B，“下丘脑能分泌抗利尿激素和促甲状腺激素”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","D":"错误。改正：下丘脑内有是维持体温相对恒定的体温调节中枢，能感受体温变化，能调节产热和散热，D正确。 故选B。"},"analysis":"【详解】AC、下丘脑是水盐平衡调节中枢，同时也具有渗透压感受器，来感知细胞外液渗透压的变化，AC 正确；B、下丘脑能分泌促甲状腺激素释放激素、抗利尿激素等，具有内分泌功能，促甲状腺激素是由垂体分泌， B错误； D、下丘脑内有是维持体温相对恒定的体温调节中枢，能感受体温变化，能调节产热和散热，D正确。 故选B。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 B。"],"tip":"真题来源：bench-生物-2021-全国甲卷","examSource":{"title":"bench-生物-2021-全国甲卷","year":2021,"region":"全国","examType":"（全国甲卷）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-0c1191fd3fcc1ba9bc03be71","subject":"biology","topicId":"bio-cell-intro","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2021 · 全国 · （全国甲卷）","stem":"群落是一个不断发展变化的动态系统。下列关于发生在裸岩和弃耕农田上的群落演替的说法，错误的是 （）","options":[{"key":"A","text":"人为因素或自然因素的干扰可以改变植物群落演替的方向"},{"key":"B","text":"发生在裸岩和弃耕农田上的演替分别为初生演替和次生演替"},{"key":"C","text":"发生在裸岩和弃耕农田上的演替都要经历苔藓阶段、草本阶段"},{"key":"D","text":"在演替过程中，群落通常是向结构复杂、稳定性强的方向发展"}],"answer":"C","optionNotes":{"A":"错误。改正：本题标准答案为 C，“发生在裸岩和弃耕农田上的演替都要经历苔藓阶段、草本阶段”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：本题标准答案为 C，“发生在裸岩和弃耕农田上的演替都要经历苔藓阶段、草本阶段”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","C":"正确。本题标准答案为 C，该表述符合真题结论。完整依据见上方解析。","D":"错误。改正：一般情况下，演替过程中生物生存的环境逐渐改善，群落的营养结构越来越复杂，抵抗力稳定性越来越 高，恢复力稳定性越来越低，D正确。 故选C。"},"analysis":"【详解】A、人类活动可以影响群落演替的方向和速度，退湖还田、封山育林、改造沙漠、生态农业等相关 措施都能促进群落良性发展，A正确； BC、发生在裸岩上的演替是初生演替，依次经过：地衣阶段→苔藓阶段→草本阶段→灌木阶段→森林阶段，弃耕农田的演替为次生演替，自然演替方向为草本阶段→灌木阶段→乔木阶段，B正确，C错误； D、一般情况下，演替过程中生物生存的环境逐渐改善，群落的营养结构越来越复杂，抵抗力稳定性越来越 高，恢复力稳定性越来越低，D正确。 故选C。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 C。"],"tip":"真题来源：bench-生物-2021-全国甲卷","examSource":{"title":"bench-生物-2021-全国甲卷","year":2021,"region":"全国","examType":"（全国甲卷）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-3372dc6b4ff9acc4d0abff65","subject":"biology","topicId":"bio-cell-cycle","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2021 · 全国 · （新课标ⅰ）","stem":"果蝇体细胞含有8条染色体。下列关于果蝇体细胞有丝分裂的叙述，错误的是（）","options":[{"key":"A","text":"在间期，DNA进行半保留复制，形成16个DNA分子"},{"key":"B","text":"在前期，每条染色体由2条染色单体组成，含2个DNA分子"},{"key":"C","text":"在中期，8条染色体的着丝点排列在赤道板上，易于观察染色体"},{"key":"D","text":"在后期，成对的同源染色体分开，细胞中有16条染色体"}],"answer":"D","optionNotes":{"A":"错误。改正：本题标准答案为 D，“在后期，成对的同源染色体分开，细胞中有16条染色体”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：间期染色体已经复制，故在前期每条染色体由2条染色单体组成，含2个DNA分子， B正确；","C":"错误。改正：在中期，8条染色体的着丝点排列在赤道板上，此时染色体形态固定、数目清晰，易于 观察染色体，C正确；","D":"正确。有丝分裂后期，着丝点分裂，姐妹染色单体分开，染色体数目加倍，由8条变成16条， 同源染色体不分离，D错误。 故选D。"},"analysis":"【详解】A、已知果蝇体细胞含有8条染色体，每条染色体上有1个DNA分子，共8个DNA 分子，在间期，DNA进行半保留复制，形成16个DNA分子，A正确； B、间期染色体已经复制，故在前期每条染色体由2条染色单体组成，含2个DNA分子， B正确； C、在中期，8条染色体的着丝点排列在赤道板上，此时染色体形态固定、数目清晰，易于 观察染色体，C正确； D、有丝分裂后期，着丝点分裂，姐妹染色单体分开，染色体数目加倍，由8条变成16条， 同源染色体不分离，D错误。 故选D。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 D。"],"tip":"真题来源：bench-生物-2021-新课标","examSource":{"title":"bench-生物-2021-新课标","year":2021,"region":"全国","examType":"（新课标ⅰ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-4524a0771918c570497264bc","subject":"biology","topicId":"bio-respiration","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2021 · 全国 · （新课标ⅰ）","stem":"植物在生长发育过程中，需要不断从环境中吸收水。下列有关植物体内水的叙述，错误 的是（）","options":[{"key":"A","text":"根系吸收的水有利于植物保持固有姿态"},{"key":"B","text":"结合水是植物细胞结构的重要组成成分"},{"key":"C","text":"细胞的有氧呼吸过程不消耗水但能产生水"},{"key":"D","text":"自由水和结合水比值的改变会影响细胞的代谢活动"}],"answer":"C","optionNotes":{"A":"错误。改正：本题标准答案为 C，“细胞的有氧呼吸过程不消耗水但能产生水”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：结合水与细胞内其他物质相结合，是植物细胞结构的重要组成成分，B正确；","C":"正确。细胞的有氧呼吸第二阶段消耗水，第三阶段产生水，C错误；","D":"错误。改正：自由水参与细胞代谢活动，故自由水和结合水比值的改变会影响细胞的代谢活动，自由 水与结合水比值越高，细胞代谢越旺盛，反之亦然，D正确。 故选C。"},"analysis":"【详解】A、水是植物细胞液的主要成分，细胞液主要存在于液泡中，充盈的液泡使植物细 胞保持坚挺，故根系吸收的水有利于植物保持固有姿态，A正确； B、结合水与细胞内其他物质相结合，是植物细胞结构的重要组成成分，B正确； C、细胞的有氧呼吸第二阶段消耗水，第三阶段产生水，C错误； D、自由水参与细胞代谢活动，故自由水和结合水比值的改变会影响细胞的代谢活动，自由 水与结合水比值越高，细胞代谢越旺盛，反之亦然，D正确。 故选C。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 C。"],"tip":"真题来源：bench-生物-2021-新课标","examSource":{"title":"bench-生物-2021-新课标","year":2021,"region":"全国","examType":"（新课标ⅰ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-ba3d859f8877da1fa3e0320f","subject":"biology","topicId":"bio-organelles","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2021 · 全国 · （新课标ⅰ）","stem":"在神经调节过程中，兴奋会在神经纤维上传导和神经元之间传递。下列有关叙述错误的 是（）","options":[{"key":"A","text":"兴奋从神经元的细胞体传导至突触前膜，会引起Na+外流"},{"key":"B","text":"突触前神经元兴奋可引起突触前膜释放乙酰胆碱"},{"key":"C","text":"乙酰胆碱是一种神经递质，在突触间隙中经扩散到达突触后膜"},{"key":"D","text":"乙酰胆碱与突触后膜受体结合，引起突触后膜电位变化"}],"answer":"A","optionNotes":{"A":"正确。本题标准答案为 A，该表述符合真题结论。完整依据见上方解析。","B":"错误。改正：突触前神经元兴奋可引起突触前膜释放神经递质，如乙酰胆碱，B正确；","C":"错误。改正：乙酰胆碱是一种兴奋性神经递质，在突触间隙中经扩散到达突触后膜，与后膜上的特异 性受体相结合，C正确；","D":"错误。改正：乙酰胆碱与突触后膜受体结合，引起突触后膜电位变化，即引发一次新的神经冲动，D 正确。 故选A。"},"analysis":"【详解】A、神经细胞膜外Na+浓度高于细胞内，兴奋从神经元的细胞体传导至突触前膜， 会引起Na+内流，A错误； B、突触前神经元兴奋可引起突触前膜释放神经递质，如乙酰胆碱，B正确； C、乙酰胆碱是一种兴奋性神经递质，在突触间隙中经扩散到达突触后膜，与后膜上的特异 性受体相结合，C正确； D、乙酰胆碱与突触后膜受体结合，引起突触后膜电位变化，即引发一次新的神经冲动，D 正确。 故选A。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 A。"],"tip":"真题来源：bench-生物-2021-新课标","examSource":{"title":"bench-生物-2021-新课标","year":2021,"region":"全国","examType":"（新课标ⅰ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-d56a5dbc078b2b771e269cec","subject":"biology","topicId":"bio-protein","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2021 · 全国 · （新课标ⅰ）","stem":"在格里菲思所做的肺炎双球菌转化实验中，无毒性的R型活细菌与被加热杀死的S型细 菌混合后注射到小鼠体内，从小鼠体内分离出了有毒性的S型活细菌。某同学根据上述实 验，结合现有生物学知识所做的下列推测中，不合理的是（）","options":[{"key":"A","text":"与R型菌相比，S型菌的毒性可能与荚膜多糖有关"},{"key":"B","text":"S型菌的DNA能够进入R型菌细胞指导蛋白质的合成"},{"key":"C","text":"加热杀死S型菌使其蛋白质功能丧失而DNA功能可能不受影响"},{"key":"D","text":"将S型菌的DNA经DNA酶处理后与R型菌混合，可以得到S型菌"}],"answer":"D","optionNotes":{"A":"错误。改正：本题标准答案为 D，“将S型菌的DNA经DNA酶处理后与R型菌混合，可以得到S型菌”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：S型菌的DNA进入R型菌细胞后使R型菌具有了S型菌的性状，可知S型菌的DNA 进入R型菌细胞后指导蛋白质的合成，B正确；","C":"错误。改正：加热杀死的S型菌不会使小白鼠死亡，说明加热杀死的S型菌的蛋白质功能丧失，而加 热杀死的S型菌的DNA可以使R型菌发生转化，可知其DNA功能不受影响，C正确；","D":"正确。将S型菌的DNA经DNA酶处理后，DNA被水解为小分子物质，故与R型菌混合，不 能得到S型菌，D错误。故选D。"},"analysis":"【详解】A、与R型菌相比，S型菌具有荚膜多糖，S型菌有毒，故可推测S型菌的毒性可 能与荚膜多糖有关，A正确； B、S型菌的DNA进入R型菌细胞后使R型菌具有了S型菌的性状，可知S型菌的DNA 进入R型菌细胞后指导蛋白质的合成，B正确； C、加热杀死的S型菌不会使小白鼠死亡，说明加热杀死的S型菌的蛋白质功能丧失，而加 热杀死的S型菌的DNA可以使R型菌发生转化，可知其DNA功能不受影响，C正确； D、将S型菌的DNA经DNA酶处理后，DNA被水解为小分子物质，故与R型菌混合，不 能得到S型菌，D错误。故选D。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 D。"],"tip":"真题来源：bench-生物-2021-新课标","examSource":{"title":"bench-生物-2021-新课标","year":2021,"region":"全国","examType":"（新课标ⅰ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-68e52fdc8cfcf990b5671cda","subject":"biology","topicId":"bio-cell-intro","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2021 · 全国 · （新课标ⅰ）","stem":"某种二倍体植物的n个不同性状由n对独立遗传的基因控制（杂合子表现显性性状）。已 知植株A的n对基因均杂合。理论上，下列说法错误的是（）","options":[{"key":"A","text":"植株A的测交子代会出现2n种不同表现型的个体"},{"key":"B","text":"n越大，植株A测交子代中不同表现型个体数目彼此之间的差异越大"},{"key":"C","text":"植株A测交子代中n对基因均杂合的个体数和纯合子的个体数相等"},{"key":"D","text":"n≥2时，植株A的测交子代中杂合子的个体数多于纯合子的个体数"}],"answer":"B","optionNotes":{"A":"错误。改正：本题标准答案为 B，“n越大，植株A测交子代中不同表现型个体数目彼此之间的差异越大”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"正确。不管n有多大，植株A测交子代比为（1：1）n =1：1：1：1……（共2n个1），即不同 表现型个体数目均相等，B错误；","C":"错误。改正：植株A测交子代中n对基因均杂合的个体数为1/2n，纯合子的个体数也是1/2n，两者相 等，C正确；","D":"错误。改正：n≥2时，植株A的测交子代中纯合子的个体数是1/2n，杂合子的个体数为1-（1/2n）， 故杂合子的个体数多于纯合子的个体数，D正确。 故选B。"},"analysis":"【详解】A、每对等位基因测交后会出现2种表现型，故n对等位基因杂合的植株A的测交 子代会出现2n种不同表现型的个体，A正确； B、不管n有多大，植株A测交子代比为（1：1）n =1：1：1：1……（共2n个1），即不同 表现型个体数目均相等，B错误； C、植株A测交子代中n对基因均杂合的个体数为1/2n，纯合子的个体数也是1/2n，两者相 等，C正确； D、n≥2时，植株A的测交子代中纯合子的个体数是1/2n，杂合子的个体数为1-（1/2n）， 故杂合子的个体数多于纯合子的个体数，D正确。 故选B。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 B。"],"tip":"真题来源：bench-生物-2021-新课标","examSource":{"title":"bench-生物-2021-新课标","year":2021,"region":"全国","examType":"（新课标ⅰ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-c75a14b5591089b5ad678ae8","subject":"biology","topicId":"bio-cell-cycle","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2022 · 全国 · （全国乙卷）","stem":"有丝分裂和减数分裂是哺乳动物细胞分裂的两种形式。某动物的基因型是Aa，若该动物 的某细胞在四分体时期一条染色单体上的A和另一条染色单体上的a发生了互换，则通常 情况下姐妹染色单体分离导致等位基因A和a进入不同细胞的时期是（）","options":[{"key":"A","text":"有丝分裂的后期"},{"key":"B","text":"有丝分裂的末期"},{"key":"C","text":"减数第一次分裂"},{"key":"D","text":"减数第二次分裂"}],"answer":"D","optionNotes":{"A":"错误。改正：本题标准答案为 D，“减数第二次分裂”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：本题标准答案为 D，“减数第二次分裂”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","C":"错误。改正：D、根据题意，某动物基因型是Aa，经过间期复制，初级性母细胞 细胞c的细胞液浓度小于外界蔗糖溶液的浓度，因此水分 交换前，细胞液浓度大小关系为细胞b>细胞a>细胞c，B正确；","C":"正确。由题意可知，水分交换达到平衡时，细胞a未发生变化，说明其细胞液浓度与外界蔗糖 溶液浓度相等；水分交换达到平衡时，细胞c的细胞液浓度等于外界蔗糖溶液的浓度，因此， 水分交换平衡时，细胞c的细胞液浓度等于细胞a的细胞液浓度，C错误；","D":"错误。改正：在一定的蔗糖溶液中，细胞c发生了质壁分离，水分交换达到平衡时，其细胞液浓度等 于外界蔗糖溶液的浓度，D正确。 故选C。"},"analysis":"【详解】A、由于细胞b在水分交换达到平衡时细胞的体积增大，说明细胞吸水，则水分交 换前，细胞b的细胞液浓度大于外界蔗糖溶液的浓度，A正确； B、水分交换达到平衡时，细胞a的细胞液浓度等于外界蔗糖溶液的浓度，细胞b的细胞 液浓度大于外界蔗糖溶液的浓度，细胞c的细胞液浓度小于外界蔗糖溶液的浓度，因此水分 交换前，细胞液浓度大小关系为细胞b>细胞a>细胞c，B正确； C、由题意可知，水分交换达到平衡时，细胞a未发生变化，说明其细胞液浓度与外界蔗糖 溶液浓度相等；水分交换达到平衡时，细胞c的细胞液浓度等于外界蔗糖溶液的浓度，因此， 水分交换平衡时，细胞c的细胞液浓度等于细胞a的细胞液浓度，C错误； D、在一定的蔗糖溶液中，细胞c发生了质壁分离，水分交换达到平衡时，其细胞液浓度等 于外界蔗糖溶液的浓度，D正确。 故选C。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 C。"],"tip":"真题来源：bench-生物-2022-全国甲卷","examSource":{"title":"bench-生物-2022-全国甲卷","year":2022,"region":"全国","examType":"（全国甲卷）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-91cf1165e29dea60272d95e9","subject":"biology","topicId":"bio-cell-intro","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2022 · 全国 · （全国甲卷）","stem":"植物激素通常与其受体结合才能发挥生理作用。喷施某种植物激素，能使某种作物的矮 生突变体长高。关于该矮生突变体矮生的原因，下列推测合理的是（）","options":[{"key":"A","text":"赤霉素合成途径受阻"},{"key":"B","text":"赤霉素受体合成受阻"},{"key":"C","text":"脱落酸合成途径受阻"},{"key":"D","text":"脱落酸受体合成受阻"}],"answer":"A","optionNotes":{"A":"正确。本题标准答案为 A，该表述符合真题结论。完整依据见上方解析。","B":"错误。改正：本题标准答案为 A，“赤霉素合成途径受阻”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","C":"错误。改正：本题标准答案为 A，“赤霉素合成途径受阻”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","D":"错误。改正：本题标准答案为 A，“赤霉素合成途径受阻”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。"},"analysis":"【详解】AB、赤霉素具有促进细胞伸长的功能，该作用的发挥需要与受体结合后才能完成， 故喷施某种激素后作物的矮生突变体长高，说明喷施的为赤霉素，矮生突变体矮生的原因是 缺乏赤霉素而非受体合成受阻（若受体合成受阻，则外源激素也不能起作用），A正确，B 错误； CD、脱落酸抑制植物细胞的分裂和种子的萌发，与植物矮化无直接关系，CD错误。 故选A。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 A。"],"tip":"真题来源：bench-生物-2022-全国甲卷","examSource":{"title":"bench-生物-2022-全国甲卷","year":2022,"region":"全国","examType":"（全国甲卷）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-2cf9ec7087030af1252e5e23","subject":"biology","topicId":"bio-respiration","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2022 · 全国 · （全国甲卷）","stem":"线粒体是细胞进行有氧呼吸的主要场所。研究发现，经常运动的人肌细胞中线粒体数量 通常比缺乏锻炼的人多。下列与线粒体有关的叙述，错误的是（）","options":[{"key":"A","text":"有氧呼吸时细胞质基质和线粒体中都能产生ATP"},{"key":"B","text":"线粒体内膜上的酶可以参与[H]和氧反应形成水的过程"},{"key":"C","text":"线粒体中的丙酮酸分解成CO2和[H]的过程需要O2的直接参与"},{"key":"D","text":"线粒体中的DNA能够通过转录和翻译控制某些蛋白质的合成"}],"answer":"C","optionNotes":{"A":"错误。改正：本题标准答案为 C，“线粒体中的丙酮酸分解成CO2和[H]的过程需要O2的直接参与”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：线粒体内膜是有氧呼吸第三阶段的场所，该阶段氧气和[H]反应生成水，该过程需要酶 的催化，B正确；","C":"正确。丙酮酸分解为CO2和[H]是有氧呼吸第二阶段，场所是线粒体基质，该过程需要水的参 与，不需要氧气的参与，C错误；","D":"错误。改正：线粒体是半自主性细胞器，其中含有少量DNA，可以通过转录和翻译控制蛋白质的合 成，D正确。 故选C。"},"analysis":"【详解】A、有氧呼吸的第一阶段场所是细胞质基质，第二、三阶段在线粒体，三个阶段均 可产生ATP，故有氧呼吸时细胞质基质和线粒体都可产生ATP，A正确； B、线粒体内膜是有氧呼吸第三阶段的场所，该阶段氧气和[H]反应生成水，该过程需要酶 的催化，B正确； C、丙酮酸分解为CO2和[H]是有氧呼吸第二阶段，场所是线粒体基质，该过程需要水的参 与，不需要氧气的参与，C错误； D、线粒体是半自主性细胞器，其中含有少量DNA，可以通过转录和翻译控制蛋白质的合 成，D正确。 故选C。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 C。"],"tip":"真题来源：bench-生物-2022-全国甲卷","examSource":{"title":"bench-生物-2022-全国甲卷","year":2022,"region":"全国","examType":"（全国甲卷）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-eaa42f1f46e2015243222a39","subject":"biology","topicId":"bio-cell-intro","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2022 · 全国 · （全国甲卷）","stem":"某种自花传粉植物的等位基因A/a和B/b位于非同源染色体上。A/a控制花粉育性，含A 的花粉可育；含a的花粉50%可育、50%不育。B/b控制花色，红花对白花为显性。若基因 型为AaBb的亲本进行自交，则下列叙述错误的是（）","options":[{"key":"A","text":"子一代中红花植株数是白花植株数的3倍"},{"key":"B","text":"子一代中基因型为aabb的个体所占比例是1/12"},{"key":"C","text":"亲本产生的可育雄配子数是不育雄配子数的3倍"},{"key":"D","text":"亲本产生的含B的可育雄配子数与含b的可育雄配子数相等"}],"answer":"B","optionNotes":{"A":"错误。改正：本题标准答案为 B，“子一代中基因型为aabb的个体所占比例是1/12”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"正确。基因型为AaBb的亲本产生的雌配子种类和比例为AB:Ab:aB:ab=1:1:1:1，由于含a的花 粉50%可育，故雄配子种类及比例为AB:Ab:aB:ab=2:2:1:1，所以子一代中基因型为aabb的 个体所占比例为1/4×1/6=1/24，B错误；","C":"错误。改正：由于含a的花粉50%可育，50%不可育，故亲本产生的可育雄配子是A+1/2a，不育雄配 子为1/2a，由于Aa个体产生的A：a=1:1，故亲本产生的可育雄配子数是不育雄配子的三倍， C正确；","D":"错误。改正：两对等位基因独立遗传，所以Bb自交，亲本产生的含B的雄配子数和含b的雄配子数 相等，D正确。 故选B。"},"analysis":"【详解】A、分析题意可知，两对等位基因独立遗传，故含a的花粉育性不影响B和b基因 的遗传，所以Bb自交，子一代中红花植株B_：白花植株bb=3：1，A正确； B、基因型为AaBb的亲本产生的雌配子种类和比例为AB:Ab:aB:ab=1:1:1:1，由于含a的花 粉50%可育，故雄配子种类及比例为AB:Ab:aB:ab=2:2:1:1，所以子一代中基因型为aabb的 个体所占比例为1/4×1/6=1/24，B错误； C、由于含a的花粉50%可育，50%不可育，故亲本产生的可育雄配子是A+1/2a，不育雄配 子为1/2a，由于Aa个体产生的A：a=1:1，故亲本产生的可育雄配子数是不育雄配子的三倍， C正确； D、两对等位基因独立遗传，所以Bb自交，亲本产生的含B的雄配子数和含b的雄配子数 相等，D正确。 故选B。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 B。"],"tip":"真题来源：bench-生物-2022-全国甲卷","examSource":{"title":"bench-生物-2022-全国甲卷","year":2022,"region":"全国","examType":"（全国甲卷）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-b16adb9dd13c555082871e6b","subject":"biology","topicId":"bio-transport","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2023 · 全国 · 全国乙卷","stem":"葡萄糖是人体所需的一种单糖。下列关于人体内葡萄糖的叙述，错误的是（ ）","options":[{"key":"A","text":"葡萄糖是人体血浆的重要组成成分，其含量受激素的调节"},{"key":"B","text":"葡萄糖是机体能量的重要来源，能经自由扩散通过细胞膜"},{"key":"C","text":"血液中的葡萄糖进入肝细胞可被氧化分解或转化为肝糖原"},{"key":"D","text":"血液中的葡萄糖进入人体脂肪组织细胞可转变为甘油三酯"}],"answer":"B","optionNotes":{"A":"错误。改正：本题标准答案为 B，“葡萄糖是机体能量的重要来源，能经自由扩散通过细胞膜”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"正确。葡萄糖是细胞生命活动所需要的主要能源物质，是机体能量的重要来源，葡萄糖通过细胞膜进入红细胞是协助扩散，进入其他细胞一般通过主动运输，B错误； CD、血糖浓度升高时，在胰岛素作用下，血糖可以进入肝细胞进行氧化分解并合成肝糖原，进入脂肪组织细胞转变为甘油三酯，CD正确。 故选B","C":"错误。改正：本题标准答案为 B，“葡萄糖是机体能量的重要来源，能经自由扩散通过细胞膜”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","D":"错误。改正：本题标准答案为 B，“葡萄糖是机体能量的重要来源，能经自由扩散通过细胞膜”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。"},"analysis":"【详解】A、葡萄糖是人体血浆的重要组成成分，血液中的糖称为血糖，血糖含量受胰岛素、胰高血糖素等激素的调节，A正确； B、葡萄糖是细胞生命活动所需要的主要能源物质，是机体能量的重要来源，葡萄糖通过细胞膜进入红细胞是协助扩散，进入其他细胞一般通过主动运输，B错误； CD、血糖浓度升高时，在胰岛素作用下，血糖可以进入肝细胞进行氧化分解并合成肝糖原，进入脂肪组织细胞转变为甘油三酯，CD正确。 故选B","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。 胞外液渗透压下降对下丘脑渗透压感受器的刺激作用减弱, 因而下丘脑的神经分泌细胞分泌的抗利尿激素减少，同时通过垂体释放的抗利尿激素也减少， B 错误; C 、 胸腺可分泌脑腺激素, 能增强免疫细胞的功能, 同时 T 细胞成熟的场所也在胸腺, C 正确;","C":"错误。改正：本题标准答案为 B，“细胞外液渗透压下降可促进抗利尿激素的释放”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","D":"错误。改正：促甲状腺激素作为一种激素由垂体细胞合成和分泌后, 经血液运输到靶细胞, 即甲状腺细胞发挥作用, D 正确。 故选 B。"},"analysis":"【详解】A、甲状腺分泌甲状腺激素受下丘脑分泌的促甲状腺激素释放激素以及垂体分泌的促甲状腺激素的调节, A 正确; B、细胞外液渗透压下降对下丘脑渗透压感受器的刺激作用减弱, 因而下丘脑的神经分泌细胞分泌的抗利尿激素减少，同时通过垂体释放的抗利尿激素也减少， B 错误; C 、 胸腺可分泌脑腺激素, 能增强免疫细胞的功能, 同时 T 细胞成熟的场所也在胸腺, C 正确; D、促甲状腺激素作为一种激素由垂体细胞合成和分泌后, 经血液运输到靶细胞, 即甲状腺细胞发挥作用, D 正确。 故选 B。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 B。"],"tip":"真题来源：bench-生物-2023-全国乙卷","examSource":{"title":"bench-生物-2023-全国乙卷","year":2023,"region":"全国","examType":"全国乙卷","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-b36c71608609dc27806205ba","subject":"biology","topicId":"bio-respiration","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2023 · 全国 · 全国乙卷","stem":"已知某种氨基酸（简称甲）是一种特殊氨基酸，迄今只在某些古菌（古细菌）中发现含有该氨基酸 蛋白质。研究发现这种情况出现的原因是，这些古菌含有特异的能够转运甲的tRNA（表示为tRNA甲）和酶E，酶E催化甲与tRNA甲结合生成携带了甲的tRNA甲（表示为甲－tRNA甲），进而将甲带入核糖体参与肽链合成。已知tRNA甲可以识别大肠杆菌mRNA中特定的密码子，从而在其核糖体上参与肽链的合成。若要在大肠杆菌中合成含有甲的肽链，则下列物质或细胞器中必须转入大肠杆菌细胞内的是（ ） ①ATP ②甲 ③RNA聚合酶 ④古菌的核糖体 ⑤酶E的基因 ⑥tRNA甲的基因","options":[{"key":"A","text":"②⑤⑥"},{"key":"B","text":"①②⑤"},{"key":"C","text":"③④⑥"},{"key":"D","text":"②④⑤"}],"answer":"A","optionNotes":{"A":"正确。本题标准答案为 A，该表述符合真题结论。完整依据见上方解析。","B":"错误。改正：本题标准答案为 A，“②⑤⑥”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","C":"错误。改正：本题标准答案为 A，“②⑤⑥”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","D":"错误。改正：本题标准答案为 A，“②⑤⑥”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。"},"analysis":"【详解】据题意可知，氨基酸甲是一种特殊氨基酸，迄今只在某些古菌（古细菌）中发现含有该氨基酸的蛋白质，所以要在大肠杆菌中合成含有甲的肽链，必须往大肠杆菌中转入氨基酸甲，②正确；又因古菌含有特异的能够转运甲的tRNA（表示为tRNA甲）和酶E，酶E催化甲与tRNA甲结合生成携带了甲的tRNA甲（表示为甲－tRNA甲），进而将甲带入核糖体参与肽链合成。tRNA甲可以识别大肠杆菌mRNA中特定的密码子，从而在其核糖体上参与肽链的合成。所以大肠杆菌细胞内要含有tRNA甲的基因以便合成tRNA甲，大肠杆菌细胞内也要含有酶E的基因以便合成酶E，催化甲与tRNA甲结合，⑤⑥正确。肽链的合成过程需要能量（ATP），但是大肠杆菌可通过无氧呼吸提供能量。 故选A。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 A。"],"tip":"真题来源：bench-生物-2023-全国乙卷","examSource":{"title":"bench-生物-2023-全国乙卷","year":2023,"region":"全国","examType":"全国乙卷","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-237a4df84ceb17179e69f404","subject":"biology","topicId":"bio-cell-intro","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2023 · 全国 · 全国乙卷","stem":"某种植物的宽叶/窄叶由等位基因A/a控制，A基因控制宽叶性状：高茎/矮茎由等位基因B/b控制，B基因控制高茎性状。这2对等位基因独立遗传。为研究该种植物的基因致死情况，某研究小组进行了两个实验，实验①：宽叶矮茎植株自交，子代中宽叶矮茎∶窄叶矮茎＝2∶1；实验②：窄叶高茎植株自交，子代中窄叶高茎∶窄叶矮茎＝2∶1。下列分析及推理中错误的是（ ）","options":[{"key":"A","text":"从实验①可判断A基因纯合致死，从实验②可判断B基因纯合致死"},{"key":"B","text":"实验①中亲本的基因型为Aabb，子代中宽叶矮茎的基因型也为Aabb"},{"key":"C","text":"若发现该种植物中的某个植株表现为宽叶高茎，则其基因型为AaBb"},{"key":"D","text":"将宽叶高茎植株进行自交，所获得子代植株中纯合子所占比例为1/4"}],"answer":"D","optionNotes":{"A":"错误。改正：本题标准答案为 D，“将宽叶高茎植株进行自交，所获得子代植株中纯合子所占比例为1/4”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：实验①中亲本为宽叶矮茎，且后代出现性状分离，所以基因型为Aabb，子代中由于AA致死，因此宽叶矮茎的基因型也为Aabb，B正确；","C":"错误。改正：由于AA和BB均致死，因此若发现该种植物中的某个植株表现为宽叶高茎，则其基因型为AaBb ，C正确；","D":"正确。将宽叶高茎植株AaBb进行自交，由于AA和BB致死，子代原本的9：3：3：1剩下4：2：2：1，其中只有窄叶矮茎的植株为纯合子，所占比例为1/9，D错误。 故选D。"},"analysis":"【详解】A、实验①：宽叶矮茎植株自交，子代中宽叶矮茎∶窄叶矮茎＝2∶1，亲本为Aabb，子代中原本为AA：Aa：aa=1：2：1，因此推测AA致死；实验②：窄叶高茎植株自交，子代中窄叶高茎∶窄叶矮茎＝2∶1，亲本为aaBb，子代原本为BB：Bb：bb=1：2：1，因此推测BB致死，A正确； B、实验①中亲本为宽叶矮茎，且后代出现性状分离，所以基因型为Aabb，子代中由于AA致死，因此宽叶矮茎的基因型也为Aabb，B正确； C、由于AA和BB均致死，因此若发现该种植物中的某个植株表现为宽叶高茎，则其基因型为AaBb ，C正确； D、将宽叶高茎植株AaBb进行自交，由于AA和BB致死，子代原本的9：3：3：1剩下4：2：2：1，其中只有窄叶矮茎的植株为纯合子，所占比例为1/9，D错误。 故选D。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 D。"],"tip":"真题来源：bench-生物-2023-全国乙卷","examSource":{"title":"bench-生物-2023-全国乙卷","year":2023,"region":"全国","examType":"全国乙卷","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-a22ddb5263824717035e4fbf","subject":"biology","topicId":"bio-cell-intro","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2023 · 全国 · 全国甲卷","stem":"植物激素是一类由植物体产生的, 对植物的生长发育有显著影响的微量有机物, 下列关于植物激素的叙述,错误的是()","options":[{"key":"A","text":"在植物幼嫩的芽中色氨酸可以转变成生长素"},{"key":"B","text":"生长素可以从产生部位运输到其他部位发挥作用"},{"key":"C","text":"生长素和乙烯可通过相互作用共同调节植物的生长发育"},{"key":"D","text":"植物体内生长素可以作为催化剂直接参与细胞代谢过程"}],"answer":"D","optionNotes":{"A":"错误。改正：本题标准答案为 D，“植物体内生长素可以作为催化剂直接参与细胞代谢过程”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：植物激素都是由产生部位运输到作用部位的, B 正确;","C":"错误。改正：植物激素之间相互协调, 互相配合共同影响植物生命活动, 调节植物生长发育, C 正确;","D":"正确。生长素是信号分子, 不是催化剂, 催化剂是酶的作用, D 错误。 故选 D。"},"analysis":"【详解】A、生长素的产生位置主要是植物幼嫩的芽、叶和发育中的种子; 色氨酸是合成生长素的原料, A 正确; B、植物激素都是由产生部位运输到作用部位的, B 正确; C、植物激素之间相互协调, 互相配合共同影响植物生命活动, 调节植物生长发育, C 正确; D、生长素是信号分子, 不是催化剂, 催化剂是酶的作用, D 错误。 故选 D。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 D。"],"tip":"真题来源：bench-生物-2023-全国甲卷","examSource":{"title":"bench-生物-2023-全国甲卷","year":2023,"region":"全国","examType":"全国甲卷","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-9fbcb801695e5c48cd208907","subject":"biology","topicId":"bio-photosynthesis","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2023 · 全国 · 全国甲卷","stem":"在生态系统中, 生产者所固定的能量可以沿着食物链传递, 食物链中的每个环节即为一个营养级。下列关于营养级的叙述，错误的是 ()","options":[{"key":"A","text":"同种动物在不同食物链中可能属于不同营养级"},{"key":"B","text":"作为生产者的绿色植物所固定的能量来源于太阳"},{"key":"C","text":"作为次级消费者的肉食性动物属于食物链的第二营养级"},{"key":"D","text":"能量从食物链第一营养级向第二营养级只能单向流动"}],"answer":"C","optionNotes":{"A":"错误。改正：本题标准答案为 C，“作为次级消费者的肉食性动物属于食物链的第二营养级”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：绿色植物进行的是光合作用, 能量来源于太阳, B 正确;","C":"正确。次级消费者是第三营养级，初级消费者是第二营养级，第一营养级是生产者， C 错误; D 、 因为第一营养级是植物, 第二营养级是动物, 食物链是单向的, 能量流动也就是单间的, D 正确。故选 C。","D":"错误。改正：本题标准答案为 C，“作为次级消费者的肉食性动物属于食物链的第二营养级”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。"},"analysis":"【详解】A、杂食动物既会捕食植物, 又会捕食动物, 如果捕食植物, 就是第二营养级, 捕食动物, 就是第三营养级或更高营养级，所以不同食物链中的动物会处于不同的营养级， A 正确; B、绿色植物进行的是光合作用, 能量来源于太阳, B 正确; C、次级消费者是第三营养级，初级消费者是第二营养级，第一营养级是生产者， C 错误; D 、 因为第一营养级是植物, 第二营养级是动物, 食物链是单向的, 能量流动也就是单间的, D 正确。故选 C。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 C。"],"tip":"真题来源：bench-生物-2023-全国甲卷","examSource":{"title":"bench-生物-2023-全国甲卷","year":2023,"region":"全国","examType":"全国甲卷","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-eab12ac20964cd19724a1806","subject":"biology","topicId":"bio-cell-intro","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2023 · 全国 · 全国甲卷","stem":"水稻的某病害是由某种真菌（有多个不同菌株）感染引起的。水稻中与该病害抗性有关的基因有 3 个 （A1、A2、a); 基因 A1 控制全抗性状（抗所有菌株)，基因 A2 控制抗性性状（抗部分菌株），基因 a 控制易感性状 (不抗任何菌株), 且 A1 对 A2 为显性, A1 对 a 为显性、A2 对 a 为显性。现将不同表现型的水稻植株进行杂交, 子代可能会出现不同的表现型及其分离比。下列叙述错误的是 ( )","options":[{"key":"A","text":"全抗植株与抗性植株杂交, 子代可能出现全抗：抗性 =3: 1"},{"key":"B","text":"抗性植株与易感植株杂交, 子代可能出现抗性：易感 =1: 1"},{"key":"C","text":"全抗植株与易感植株杂交, 子代可能出现全抗：抗性=1：1"},{"key":"D","text":"全抗植株与抗性植株杂交, 子代可能出现全抗：抗性：易感=2: 1: 1"}],"answer":"A","optionNotes":{"A":"正确。本题标准答案为 A，该表述符合真题结论。完整依据见上方解析。","B":"错误。改正：抗性植株 A2A2 或者 A2a 与易感植株 aa 交配, 后代全为抗性, 或者为抗性: 易感 =1: 1, ~B 正确","C":"错误。改正：全抗与易感植株交, 若如果是 A 1 ~A 1 与 aa, 后代全为全抗, 若是 A 1 ~A 2 与 a, 后代为全抗: 抗性 =1 : 1, 若是 A1a 与 aa, 后代为全抗:易感 =1: 1, C 正确。故选 A。","D":"错误。改正：本题标准答案为 A，“全抗植株与抗性植株杂交, 子代可能出现全抗：抗性 =3: 1”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。"},"analysis":"【详解】 AD 、全抗植株与抗性植株, 有六种交配情况: A 1 ~A 1 与 A 2 ~A 2 或者 A 2 a 交配, 后代全是全抗植株; A 1 ~A 2 与 A 2 ~A 2 或者 A 2 a 交配, 后代全抗: 抗性 =1: 1 ; A 1 a 与 A 2 ~A 2 交配, 后代全抗: 抗性 =1: 1; A1a 与 A2a 交配, 后代全抗: 抗性: 易感 =2: 1: 1 。 A 错误, D 正确; B、抗性植株 A2A2 或者 A2a 与易感植株 aa 交配, 后代全为抗性, 或者为抗性: 易感 =1: 1, ~B 正确 C、全抗与易感植株交, 若如果是 A 1 ~A 1 与 aa, 后代全为全抗, 若是 A 1 ~A 2 与 a, 后代为全抗: 抗性 =1 : 1, 若是 A1a 与 aa, 后代为全抗:易感 =1: 1, C 正确。故选 A。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 A。"],"tip":"真题来源：bench-生物-2023-全国甲卷","examSource":{"title":"bench-生物-2023-全国甲卷","year":2023,"region":"全国","examType":"全国甲卷","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-569763996a52da9f50a7a69c","subject":"biology","topicId":"bio-respiration","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2023 · 全国 · 新课标卷","stem":"我国劳动人民在漫长的历史进程中，积累了丰富的生产、生活经验，并在实践中应用。生产和生活中常采取的一些措施如下。 ①低温储存，即果实、蔬菜等收获后在低温条件下存放 ②春化处理，即对某些作物萌发的种子或幼苗进行适度低温处理 ③风干储藏，即小麦、玉米等种子收获后经适当风干处理后储藏 ④光周期处理，即在作物生长的某一时期控制每天光照和黑暗的相对时长 ⑤合理密植，即裁种作物时做到密度适当，行距、株距合理 ⑥间作种植，即同一生长期内，在同一块土地上隔行种植两种高矮不同的作物 关于这些措施，下列说法合理的是（ ）","options":[{"key":"A","text":"措施②④分别反映了低温和昼夜长短与作物开花的关系"},{"key":"B","text":"措施③⑤的主要目的是降低有机物的消耗"},{"key":"C","text":"措施②⑤⑥的主要目的是促进作物的光合作用"},{"key":"D","text":"措施①③④的主要目的是降低作物或种子的呼吸作用强"}],"answer":"A","optionNotes":{"A":"正确。本题标准答案为 A，该表述符合真题结论。完整依据见上方解析。","B":"错误。改正：措施③风干储藏可以减少自由水，从而减弱细胞呼吸，降低有机物的消耗，⑤合理密植的主要目的是提高能量利用率，促进光合作用，B错误；","C":"错误。改正：措施②春化处理是为了促进花芽形成，⑤⑥的主要目的是促进作物的光合作用，C错误；","D":"错误。改正：措施①③的主要目的是降低作物或种子的呼吸作用强度，④光周期处理，目的是促进或抑制植物开花，D错误。 故选A。"},"analysis":"【详解】A、措施②春化处理是为了促进花芽形成，反映了低温与作物开花的关系，④光周期处理，反映了昼夜长短与作物开花的关系，A正确； B、措施③风干储藏可以减少自由水，从而减弱细胞呼吸，降低有机物的消耗，⑤合理密植的主要目的是提高能量利用率，促进光合作用，B错误； C、措施②春化处理是为了促进花芽形成，⑤⑥的主要目的是促进作物的光合作用，C错误； D、措施①③的主要目的是降低作物或种子的呼吸作用强度，④光周期处理，目的是促进或抑制植物开花，D错误。 故选A。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 A。"],"tip":"真题来源：bench-生物-2023-新课标卷","examSource":{"title":"bench-生物-2023-新课标卷","year":2023,"region":"全国","examType":"新课标卷","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-0053792eecd7591c39ed6d3c","subject":"biology","topicId":"bio-protein","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2023 · 全国 · 新课标卷","stem":"人体内的免疫细胞是体液免疫和细胞免疫过程的重要参与者。下列叙述正确的是（ ） ①免疫细胞表面的受体可识别细菌、病毒等入侵机体的病原体 ②树突状细胞能够处理和呈递抗原，淋巴细胞不能呈递抗原 ③辅助性T细胞参与体液免疫过程而不参与细胞免疫过程 ④体液免疫可产生记忆B细胞，细胞免疫可产生记忆T细胞 ⑤某些致病细菌感染人体既可引发体液免疫又可引发细胞免疫","options":[{"key":"A","text":"①②④"},{"key":"B","text":"①④⑤"},{"key":"C","text":"②③⑤"},{"key":"D","text":"③④⑤"}],"answer":"B","optionNotes":{"A":"错误。改正：本题标准答案为 B，“①④⑤”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"正确。本题标准答案为 B，该表述符合真题结论。完整依据见上方解析。","C":"错误。改正：本题标准答案为 B，“①④⑤”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","D":"错误。改正：本题标准答案为 B，“①④⑤”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。"},"analysis":"【详解】①病原体进入机体后，其表面一些特定的蛋白质等物质，能够与免疫细胞表面的受体结合，从而引发免疫反应，故免疫细胞表面的受体可识别细菌、病毒等入侵机体的病原体，①正确； ②B细胞、树突状细胞和巨噬细胞都能够处理和呈递抗原，B细胞属于淋巴细胞，②错误； ③辅助性T细胞在体液免疫过程中，辅助性T细胞表面的特定分子发生变化与B细胞结合作为激活B细胞的第二信号，并且分裂分化，分泌细胞因子促进B细胞的分裂、分化过程；在细胞免疫过程中，辅助性T细胞分泌细胞因子促进细胞毒性T细胞增殖分化。因此辅助性T细胞既参与体液免疫又参与细胞免疫过程，③错误； ④体液免疫过程中，B细胞活化后开始增殖分化，一小部分分化为记忆B细胞；细胞免疫过程中，细胞毒性T细胞分裂并分化，形成新的细胞毒性T细胞和记忆T细胞，④正确； ⑤某些病细菌是寄生在宿主细胞内的，感染人体时既可引发体液免疫又可引发细胞免疫，⑤正确。 综上所述，①④⑤正确。 故选B。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 B。"],"tip":"真题来源：bench-生物-2023-新课标卷","examSource":{"title":"bench-生物-2023-新课标卷","year":2023,"region":"全国","examType":"新课标卷","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-141ecb28884833a78725192a","subject":"biology","topicId":"bio-cell-intro","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2023 · 全国 · 新课标卷","stem":"为了研究和保护我国东北地区某自然保护区内的野生哺乳动物资源，研究人员采用红外触发相机自动拍摄技术获得了该保护区内某些野生哺乳动物资源的相应数据，为生态学研究提供了相关依据。下列叙述错误的是（ ）","options":[{"key":"A","text":"通过对数据的分析和处理，可以了解保护区内大型野生哺乳动物的物种丰富度"},{"key":"B","text":"与标记重捕法相比，采用该技术进行调查对野生哺乳动物的生活干扰相对较小"},{"key":"C","text":"采用红外触发相机拍摄技术可调查生活在该自然保护区内东北豹的种群密度"},{"key":"D","text":"该技术能调查保护区内东北豹种群中成年个体数量，不能调查幼年个体数量"}],"answer":"D","optionNotes":{"A":"错误。改正：本题标准答案为 D，“该技术能调查保护区内东北豹种群中成年个体数量，不能调查幼年个体数量”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：标记重捕法需要捕捉动物并标记，后再次捕捉，故与标记重捕法相比，采用该技术进行调查对野生哺乳动物的生活干扰相对较小， B正确；","C":"错误。改正：采用红外触发相机拍摄技术可得保护区内东北豹种群数量和分布情况，即可调查生活在该自然保护区内东北豹的种群密度 ，C正确；","D":"正确。该技术能调查保护区内东北豹种群中各年龄段的个体数量，D错误。 故选D。"},"analysis":"【详解】A、红外触发相机监测野生动物方法是一种新型调查手段，特别适用于对活动隐秘的大中型、珍稀兽类、鸟类的记录。通过对数据的分析和处理，可以了解保护区内大型野生哺乳动物的物种数目的多少，即物种丰富度，A正确； B、标记重捕法需要捕捉动物并标记，后再次捕捉，故与标记重捕法相比，采用该技术进行调查对野生哺乳动物的生活干扰相对较小， B正确； C、采用红外触发相机拍摄技术可得保护区内东北豹种群数量和分布情况，即可调查生活在该自然保护区内东北豹的种群密度 ，C正确； D、该技术能调查保护区内东北豹种群中各年龄段的个体数量，D错误。 故选D。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 D。"],"tip":"真题来源：bench-生物-2023-新课标卷","examSource":{"title":"bench-生物-2023-新课标卷","year":2023,"region":"全国","examType":"新课标卷","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-7e319b4bc799cac334db3462","subject":"biology","topicId":"bio-cell-intro","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2023 · 全国 · 新课标卷","stem":"某研究小组从野生型高秆（显性）玉米中获得了2个矮秆突变体，为了研究这2个突变体 基因型，该小组让这2个矮秆突变体（亲本）杂交得F1，F1自交得F2，发现F2中表型及其比例是高秆:矮秆:极矮秆=9:6:1。若用A、B表示显性基因，则下列相关推测错误的是（ ）","options":[{"key":"A","text":"亲本的基因型为aaBB和AAbb，F1的基因型为AaBb"},{"key":"B","text":"F2矮秆的基因型有aaBB、AAbb、aaBb、Aabb，共4种"},{"key":"C","text":"基因型是AABB 个体为高秆，基因型是aabb的个体为极矮秆"},{"key":"D","text":"F2矮秆中纯合子所占比例为1/2，F2高秆中纯合子所占比例为1/16"}],"answer":"D","optionNotes":{"A":"错误。改正：本题标准答案为 D，“F2矮秆中纯合子所占比例为1/2，F2高秆中纯合子所占比例为1/16”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：矮秆基因型为A_bb、aaB_，因此F2矮秆的基因型有aaBB、AAbb、aaBb、Aabb，共4种，B正确；","C":"错误。改正：由F2中表型及其比例可知基因型是AABB的个体为高秆，基因型是aabb的个体为极矮秆，C正确；","D":"正确。F2矮秆基因型为A_bb、aaB_共6份，纯合子基因型为aaBB、AAbb共2份，因此矮秆中纯合子所占比例为1/3，F2高秆基因型为A_B_共9份，纯合子为AABB共1份，因此高秆中纯合子所占比例为1/9，D错误。 故选D。"},"analysis":"【详解】A、F2中表型及其比例是高秆:矮秆:极矮秆=9:6:1，符合:9:3:3:1的变式，因此因此控制两个矮秆突变体的基因遵循基因的自由组合定律，即高秆基因型为A_B_，矮秆基因型为A_bb、aaB_，极矮秆基因型为aabb，因此可推知亲本的基因型为aaBB和AAbb，F1的基因型为AaBb，A正确； B、矮秆基因型为A_bb、aaB_，因此F2矮秆的基因型有aaBB、AAbb、aaBb、Aabb，共4种，B正确； C、由F2中表型及其比例可知基因型是AABB的个体为高秆，基因型是aabb的个体为极矮秆，C正确； D、F2矮秆基因型为A_bb、aaB_共6份，纯合子基因型为aaBB、AAbb共2份，因此矮秆中纯合子所占比例为1/3，F2高秆基因型为A_B_共9份，纯合子为AABB共1份，因此高秆中纯合子所占比例为1/9，D错误。 故选D。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 D。"],"tip":"真题来源：bench-生物-2023-新课标卷","examSource":{"title":"bench-生物-2023-新课标卷","year":2023,"region":"全国","examType":"新课标卷","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-ce8e358dceabc72a880d782d","subject":"biology","topicId":"bio-respiration","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2024 · 全国 · 全国甲卷","stem":"细胞是生物体结构和功能的基本单位。下列叙述正确的是（）","options":[{"key":"A","text":"病毒通常是由蛋白质外壳和核酸构成的单细胞生物"},{"key":"B","text":"原核生物因为没有线粒体所以都不能进行有氧呼吸"},{"key":"C","text":"哺乳动物同一个体中细胞的染色体数目有可能不同"},{"key":"D","text":"小麦根细胞吸收离子消耗的 ATP 主要由叶绿体产生"}],"answer":"C","optionNotes":{"A":"错误。改正：本题标准答案为 C，“哺乳动物同一个体中细胞的染色体数目有可能不同”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：原核生物也可以进行有氧呼吸，原核细胞中含有与有氧呼吸相关的酶，B 错误;","C":"正确。哺乳动物同一个体中细胞的染色体数目有可能不同，如生殖细胞中染色体数目是体细胞的一半，C 正确;","D":"错误。改正：小麦根细胞不含叶绿体，而线粒体是有氧呼吸的主要场所，小麦根细胞吸收离子消耗的 ATP 主要由线粒体产生，D错误。 故选 C。"},"analysis":"【分析】原核细胞和真核细胞最主要的区别是原核细胞没有核膜包被的典型的细胞核，但是它们均具有细胞膜、细胞质、核糖体以及遗传物质 DNA 等结构。原核生物虽没有叶绿体和线粒体，但是少数生物也能进行光合作用和有氧呼吸，如蓝藻。 【详解】A、病毒没有细胞结构，A 错误； B、原核生物也可以进行有氧呼吸，原核细胞中含有与有氧呼吸相关的酶，B 错误; C、哺乳动物同一个体中细胞的染色体数目有可能不同，如生殖细胞中染色体数目是体细胞的一半，C 正确; D、小麦根细胞不含叶绿体，而线粒体是有氧呼吸的主要场所，小麦根细胞吸收离子消耗的 ATP 主要由线粒体产生，D错误。 故选 C。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 C。"],"tip":"真题来源：bench-生物-2024-全国甲卷","examSource":{"title":"bench-生物-2024-全国甲卷","year":2024,"region":"全国","examType":"全国甲卷","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-c75b2285c1d16d71ff24e6ea","subject":"biology","topicId":"bio-transport","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2024 · 全国 · 全国甲卷","stem":"植物生长发育受植物激素的调控。下列叙述错误的是（）","options":[{"key":"A","text":"赤霉素可以诱导某些酶的合成促进种子萌发"},{"key":"B","text":"单侧光下生长素的极性运输不需要载体蛋白"},{"key":"C","text":"植物激素可与特异性受体结合调节基因表达"},{"key":"D","text":"一种激素可通过诱导其他激素的合成发挥作用"}],"answer":"B","optionNotes":{"A":"错误。改正：本题标准答案为 B，“单侧光下生长素的极性运输不需要载体蛋白”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"正确。本题标准答案为 B，该表述符合真题结论。完整依据见上方解析。","C":"错误。改正：植物激素与受体特异性结合，引发细胞内发生一系列信号转导过程，进而诱导特定基因的表达，从而产生效应，C 正确；","D":"错误。改正：调节植物生命活动的激素不是孤立的，而是相互作用共同调节的，因此一种激素可通过诱导其他激素的合成发挥作用，D 正确； 故选 B。"},"analysis":"【分析】1、植物激素是由植物体内产生, 能从产生部位送到作用部位, 对植物的生长发育有显著影响的微量有机物；植物激素主要有生长素、赤霉素、细胞分裂素、乙烯和脱落酸等，它们对植物各种生命活动起着不同的调节作用。 2、植物激素包括生长素、细胞分裂素、赤霉素、脱落酸、乙烯等。其中生长素、细胞分裂素、赤霉素能 促进植物的生长，而脱落酸和乙烯是抑制植物的生长。生长素能促进子房发育成果实，而乙烯能促进果实成熟 3、调节植物生命活动的激素不是孤立的，而是相互作用共同调节的，植物生命活动的调节从根本上说是植物基因组程序性表达的结果。植物的生长发育既受内部因子（激素）的调节，也受外部因子（如光、温度、日照长度、重力、化学物质等）的影响。这些化学和物理因子通过信号转导，诱导相关基因表达，调控生长发育。 【详解】A、赤霉素主要合成部位是未成熟的种子、幼根和幼芽，赤霉素能促进植物的生长，可以诱导某些酶的合成促进种子萌发，A 正确； B 、 生长素的极性运输属于主动运输，主动运输需要载体蛋白的协助并消耗能量， B 错误； C、植物激素与受体特异性结合，引发细胞内发生一系列信号转导过程，进而诱导特定基因的表达，从而产生效应，C 正确； D、调节植物生命活动的激素不是孤立的，而是相互作用共同调节的，因此一种激素可通过诱导其他激素的合成发挥作用，D 正确； 故选 B。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 B。"],"tip":"真题来源：bench-生物-2024-全国甲卷","examSource":{"title":"bench-生物-2024-全国甲卷","year":2024,"region":"全国","examType":"全国甲卷","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-d49760c46573051563a1c51e","subject":"biology","topicId":"bio-cell-intro","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2024 · 全国 · 全国甲卷","stem":"甲状腺激素在人体生命活动的调节中发挥重要作用。下列叙述错误的是（）","options":[{"key":"A","text":"甲状腺激素受体分布于人体内几乎所有细胞"},{"key":"B","text":"甲状腺激素可以提高机体神经系统的兴奋性"},{"key":"C","text":"甲状腺激素分泌增加可使细胞代谢速率加快"},{"key":"D","text":"甲状腺激素分泌不足会使血中 TSH 含量减少"}],"answer":"D","optionNotes":{"A":"错误。改正：本题标准答案为 D，“甲状腺激素分泌不足会使血中 TSH 含量减少”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：甲状腺激素可以促进中枢神经系统的发育，提高机体神经系统的兴奋性，B 正确；","C":"错误。改正：甲状腺激素能促进新陈代谢，因此其分泌增加可使细胞代谢速率加快，C 正确；","D":"正确。甲状腺激素对下丘脑分泌促甲状腺激素释放激素（TRH）和垂体分泌促甲状腺激素（TSH）存在反负馈调节，因此甲状腺激素分泌不足会使血中促甲状腺激素（TSH）含量增加，D 错误。 故选 D。"},"analysis":"【分析】甲状腺分泌甲状腺激素，甲状腺激素能促进代谢，增加产热；能提高神经系统兴奋性；能促进幼小动物的生长发育。 【详解】A、甲状腺激素几乎可以作用于人体所有细胞，因此其受体分布于人体内几乎所有细胞，A正确； B、甲状腺激素可以促进中枢神经系统的发育，提高机体神经系统的兴奋性，B 正确； C、甲状腺激素能促进新陈代谢，因此其分泌增加可使细胞代谢速率加快，C 正确； D、甲状腺激素对下丘脑分泌促甲状腺激素释放激素（TRH）和垂体分泌促甲状腺激素（TSH）存在反负馈调节，因此甲状腺激素分泌不足会使血中促甲状腺激素（TSH）含量增加，D 错误。 故选 D。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 D。"],"tip":"真题来源：bench-生物-2024-全国甲卷","examSource":{"title":"bench-生物-2024-全国甲卷","year":2024,"region":"全国","examType":"全国甲卷","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-24a9d708595025d8cbf36778","subject":"biology","topicId":"bio-protein","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2024 · 全国 · 新课标","stem":"大豆是我国重要的粮食作物。下列叙述错误的是（）","options":[{"key":"A","text":"大豆油含有不饱和脂肪酸, 熔点较低, 室温时呈液态"},{"key":"B","text":"大豆的蛋白质、脂肪和淀粉可在人体内分解产生能量"},{"key":"C","text":"大豆中的蛋白质含有人体细胞不能合成的必需氨基酸"},{"key":"D","text":"大豆中的脂肪和磷脂均含有碳、氢、氧、磷 4 种元素"}],"answer":"D","optionNotes":{"A":"错误。改正：本题标准答案为 D，“大豆中的脂肪和磷脂均含有碳、氢、氧、磷 4 种元素”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：蛋白质、脂肪和淀粉可在人体内分解产生能量，B 正确","C":"错误。改正：H、O，D 错误。故选 D。","D":"正确。本题标准答案为 D，该表述符合真题结论。完整依据见上方解析。"},"analysis":"【分析】1、脂肪：是由三分子脂肪酸与一分子甘油发生反应而形成的。 2、磷脂：构成膜（细胞膜、核膜、细胞器膜）结构的重要成分。 3、固醇：维持新陈代谢和生殖起重要调节作用，分为胆固醇、性激素、维生素 D 等。 【详解】A、植物脂肪大多含有不饱和脂肪酸, 在室温下呈液态, 动物脂肪大多含有饱和脂肪酸, 在室温下呈固态，A 正确；B、蛋白质、脂肪和淀粉可在人体内分解产生能量，B 正确；C、必需氨基酸是人体细胞不能合成必须从外界获取的氨基酸，因此大豆中的蛋白质含有人体细胞不能合成的必需氨基酸, C 正确;D、脂肪的组成元素只有 C、H、O，D 错误。故选 D。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 D。"],"tip":"真题来源：bench-生物-2024-新课标","examSource":{"title":"bench-生物-2024-新课标","year":2024,"region":"全国","examType":"新课标","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-5872134c6c9f6538d6f74a39","subject":"biology","topicId":"bio-elements","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2024 · 全国 · 新课标","stem":"干旱缺水条件下, 植物可通过减小气孔开度减少水分散失。下列叙述错误的是（）","options":[{"key":"A","text":"叶片萎蓞时叶片中脱落酸的含量会降低"},{"key":"B","text":"干旱缺水时进入叶肉细胞的 CO₂ 会减少"},{"key":"C","text":"植物细胞失水时胞内结合水与自由水比值增大"},{"key":"D","text":"干旱缺水不利于植物对营养物质的吸收和运输"}],"answer":"A","optionNotes":{"A":"正确。本题标准答案为 A，该表述符合真题结论。完整依据见上方解析。","B":"错误。改正：干旱缺水时, 植物气孔开度减小, 吸收的二氧化碳会减少, 植物的光合速率会降低, B 正确;","C":"错误。改正：植物细胞失水时主要失去自由水，自由水含量下降，结合水与自由水比值会增大，C正确；","D":"错误。改正：缺水会影响植物体内各种需要水分参与的生理反应，植物对营养物质的吸收和运输往往需要水分参与, 缺水不利于该过程, D 正确。 故选 A。"},"analysis":"【分析】干旱缺水条件下气孔开度减小, 植物吸收的二氧化碳会减少, 植物的光合速率会降低, 同时植物体内水分含量减少，各种需要水分参与的生理反应都会减弱，植物根细胞的吸水能力增强，植物缺水主要是自由水大量失去。 【详解】A、叶片萎莨时, 叶片中的脱落酸(ABA)含量会增加, 达到一定程度叶片可能会脱落, A 错误; B、干旱缺水时, 植物气孔开度减小, 吸收的二氧化碳会减少, 植物的光合速率会降低, B 正确; C、植物细胞失水时主要失去自由水，自由水含量下降，结合水与自由水比值会增大，C正确； D、缺水会影响植物体内各种需要水分参与的生理反应，植物对营养物质的吸收和运输往往需要水分参与, 缺水不利于该过程, D 正确。 故选 A。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 A。"],"tip":"真题来源：bench-生物-2024-新课标","examSource":{"title":"bench-生物-2024-新课标","year":2024,"region":"全国","examType":"新课标","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-d6fdd9458d3dddf95b620910","subject":"biology","topicId":"bio-transport","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2024 · 全国 · 新课标","stem":"人体消化道内食物的消化和吸收过程受神经和体液调节。下列叙述错误的是（）","options":[{"key":"A","text":"进食后若副交感神经活动增强可抑制消化液分泌"},{"key":"B","text":"唾液分泌条件反射的建立需以非条件反射为基础"},{"key":"C","text":"胃液中的盐酸能为胃蛋白酶提供适宜的 pH 环境"},{"key":"D","text":"小肠上皮细胞通过转运蛋白吸收肠腔中的氨基酸"}],"answer":"A","optionNotes":{"A":"正确。本题标准答案为 A，该表述符合真题结论。完整依据见上方解析。","B":"错误。改正：条件反射是在非条件反射的基础上，通过学习和训练而建立的。即唾液分泌条件反射的建立需以非条件反射为基础，B 正确；","C":"错误。改正：胃蛋白酶的最适 pH 为 1.5 , 胃液中的盐酸能为胃蛋白酶提供适宜的 pH 环境, C 正确;","D":"错误。改正：小肠上皮细胞吸收氨基酸的方式通常为主动运输，过程中需要转运蛋白， D 正确。 故选 A。"},"analysis":"【分析】自主神经系统: 自主神经系统由交感神经和副交感神经两部分组成。它们的作用通常是相反的。当人体处于兴奋状态时，交感神经活动占据优势，心跳加快，支气管扩张，但胃肠的蠕动和消化腺的分泌活动减弱; 当人处于安静状态时, 副交感神经活动占据优势, 此时, 心跳减慢, 但胃肠的蠕动和消化液的分泌会加强，有利于食物的消化和营养物质的吸收。 【详解】A、副交感神经活动增强，促进胃肠的蠕动和消化液的分泌，有利于食物的消化和营养物质的吸收，A 错误； B、条件反射是在非条件反射的基础上，通过学习和训练而建立的。即唾液分泌条件反射的建立需以非条件反射为基础，B 正确； C、胃蛋白酶的最适 pH 为 1.5 , 胃液中的盐酸能为胃蛋白酶提供适宜的 pH 环境, C 正确; D、小肠上皮细胞吸收氨基酸的方式通常为主动运输，过程中需要转运蛋白， D 正确。 故选 A。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 A。"],"tip":"真题来源：bench-生物-2024-新课标","examSource":{"title":"bench-生物-2024-新课标","year":2024,"region":"全国","examType":"新课标","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-049842095dd8871381c92d95","subject":"biology","topicId":"bio-respiration","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2024 · 全国 · 新课标","stem":"采用稻田养蟹的生态农业模式既可提高水稻产量又可收获螃蟹。下列叙述错误的是（）","options":[{"key":"A","text":"该模式中水稻属于第一营养级"},{"key":"B","text":"该模式中水稻和螃蟹处于相同生态位"},{"key":"C","text":"该模式可促进水稻对二氧化碳的吸收"},{"key":"D","text":"该模式中碳循环在无机环境和生物间进行"}],"answer":"B","optionNotes":{"A":"错误。改正：本题标准答案为 B，“该模式中水稻和螃蟹处于相同生态位”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"正确。这个模式中，水稻和螃蟹处于不同 生态位，因为它们消耗不同的资源。水稻是水生植物，吸收水分和矿物质，而螃蟹是水生动物，以植物残渣和小型水生动物为食， B 错误；","C":"错误。改正：这种模式确实可以促进水稻对二氧化碳的吸收，因为螃蟹在稻田中活动可以改善土壤通气状况，有利于水稻根系呼吸作用，进而促进二氧化碳的吸收，C 正确；","D":"错误。改正：碳循环在稻田生态系统中包括无机环境和生物两个部分。水稻通过光合作用将无机碳（二氧化碳）转化为有机物，螃蟹则通过呼吸作用将有机物中的碳以二氧化碳的形式释放回大气中，从而完成了碳在生态系统中的循环，D 正确。 故选 B。"},"analysis":"【分析】稻田养蟹的模式中蟹能清除稻田杂草，吃掉部分害虫，其排泄物还能改善稻田土壤状况，促进水稻生长，提高水稻的品质；水稻则为蟹生长提供了丰富的天然饵料和良好的栖息环境。\\"稻蟹共生\\"为充分利用人工新建的农田生态系统。 【详解】A、在稻田养蟹的生态农业模式中，水稻属于生产者，属于第一营养级，A 正确； B、这个模式中，水稻和螃蟹处于不同 生态位，因为它们消耗不同的资源。水稻是水生植物，吸收水分和矿物质，而螃蟹是水生动物，以植物残渣和小型水生动物为食， B 错误； C、这种模式确实可以促进水稻对二氧化碳的吸收，因为螃蟹在稻田中活动可以改善土壤通气状况，有利于水稻根系呼吸作用，进而促进二氧化碳的吸收，C 正确； D、碳循环在稻田生态系统中包括无机环境和生物两个部分。水稻通过光合作用将无机碳（二氧化碳）转化为有机物，螃蟹则通过呼吸作用将有机物中的碳以二氧化碳的形式释放回大气中，从而完成了碳在生态系统中的循环，D 正确。 故选 B。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 B。"],"tip":"真题来源：bench-生物-2024-新课标","examSource":{"title":"bench-生物-2024-新课标","year":2024,"region":"全国","examType":"新课标","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}}]'),P1=JSON.parse('[{"id":"bench-biology-2010-001","subject":"biology","topicId":"bio-respiration","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2010 · （新课标） · 高考真题","stem":"下列关于呼吸作用的叙述，正确的是（ 　　）","options":[{"key":"A","text":"无氧呼吸的终产物是丙酮酸"},{"key":"B","text":"有氧呼吸产生的 [H]在线粒体基质中与氧结合生成水"},{"key":"C","text":"无氧呼吸不需要 O2的参与．该过程最终有 [H]的积累"},{"key":"D","text":"质量相同时，脂肪比糖原有氧氧化释放的能量多"}],"answer":"D","optionNotes":{"A":"错误。本题不应选 A；原题对照：无氧呼吸的终产物是二氧化碳和酒精，或者分解成乳酸（有机 物不彻底分解），而不是丙酮酸， A错误；","B":"错误。本题不应选 B；原题对照：有氧呼吸前两个阶段产生的 [H]在线粒体内膜上与氧结合生成水， B错误；","C":"错误。本题不应选 C；原题对照：无氧呼吸不需要 O2的参与。但该过程中没有 [H]的积累， [H]只在细胞质基 质中参与反应， C错误；","D":"正确。本题应选 D；原题对照：质量相同的脂肪和糖原 ，脂肪贮存的能量更多 ，因此比糖原有氧氧化释放的 能量多， D正确。 故选： D。"},"analysis":"A、无氧呼吸的终产物是二氧化碳和酒精，或者分解成乳酸（有机 物不彻底分解），而不是丙酮酸， A错误； B、有氧呼吸前两个阶段产生的 [H]在线粒体内膜上与氧结合生成水， B错误； C、无氧呼吸不需要 O2的参与。但该过程中没有 [H]的积累， [H]只在细胞质基 质中参与反应， C错误； D、质量相同的脂肪和糖原 ，脂肪贮存的能量更多 ，因此比糖原有氧氧化释放的 能量多， D正确。 故选： D。","steps":["先圈出题干中的限定条件、实验现象和设问方向。","逐项核对学科规律、守恒关系或结构功能关 nNotes":{"A":"错误。本题不应选 A；原题对照：提取叶绿体中的色素用的是无水乙醇，因为叶绿体中的色素能 够溶解在有机溶剂乙醇中， A正确；","B":"错误。本题不应选 B；原题对照：根是植物吸收水分和矿质元素的主要器官 ，构成叶绿素的镁可以由植物的根 从土壤中吸收， B正确；","C":"正确。本题应选 C；原题对照：植物进行光合作用只能吸收可见光，不能吸收红外光和紫外光， C错误；","D":"错误。本题不应选 D；原题对照：叶绿素的形成需要光 ，黑暗中生长的植物幼苗叶片呈黄色是由于叶绿素合成 受阻引起的， D正确。 故选： C。"},"analysis":"A、提取叶绿体中的色素用的是无水乙醇，因为叶绿体中的色素能 够溶解在有机溶剂乙醇中， A正确； B、根是植物吸收水分和矿质元素的主要器官 ，构成叶绿素的镁可以由植物的根 从土壤中吸收， B正确； C、植物进行光合作用只能吸收可见光，不能吸收红外光和紫外光， C错误； D、叶绿素的形成需要光 ，黑暗中生长的植物幼苗叶片呈黄色是由于叶绿素合成 受阻引起的， D正确。 故选： C。","steps":["先圈出题干中的限定条件、实验现象和设问方向。","逐项核对学科规律、守恒关系或结构功能关系，排除条件不符的结论。","公开答案选择 C，再回看完整解析确认判断链条。"],"tip":"真题的难点常在条件组合：先排除绝对化表述，再验证正确项能否解释全部现象。","examSource":{"title":"2016 （新课标ⅱ） 高考选择题","year":"2016","region":"全国","examType":"高考选择题","url":"https://github.com/OpenLMLab/GAOKAO-Bench","dataset":"GAOKAO-Bench","license":"Apache-2.0"}},{"id":"bench-biology-2016-059","subject":"biology","topicId":"bio-organelles","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2016 · （新课标ⅲ） · 高考真题","stem":"下列有关细胞膜的叙述，正确的是（）","options":[{"key":"A","text":"细胞膜两侧的离子浓度差是通过自由扩散实现的"},{"key":"B","text":"细胞膜与线粒体膜、核膜中所含蛋白质的功能相同"},{"key":"C","text":"分泌蛋白分泌到细胞外的过程存在膜脂的流动现象"},{"key":"D","text":"膜中的磷脂分子是由胆固醇、脂肪酸和磷酸组成的"}],"answer":"C","optionNotes":{"A":"错误。本题不应选 A；原题对照：细胞膜两侧的离子浓度差是通过主动运输实现的，A错误；","B":"错误。本题不应选 B；原题对照：细胞膜与线粒体膜、核膜中所含蛋白质种类不同，功能也不同，B错误；","C":"正确。本题应选 C；原题对照：分泌蛋白分泌到细胞外的方式为胞吐，此过程依赖细胞膜的流动性，C正确；","D":"错误。本题不应选 D；原题对照：磷脂、胆固醇属于脂质，磷脂不含有胆固醇，D错误。 故选：C。"},"analysis":"A、细胞膜两侧的离子浓度差是通过主动运输实现的，A错误； B、细胞膜与线粒体膜、核膜中所含蛋白质种类不同，功能也不同，B错误； C、分泌蛋白分泌到细胞外的方式为胞吐，此过程依赖细胞膜的流动性，C正确； D、磷脂、胆固醇属于脂质，磷脂不含有胆固醇，D错误。 故选：C。","steps":["先圈出题干中的限定条件、实验现象和设问方向。","逐项核对学科规律、守恒关系或结构功能关系，排除条件不符的结论。","公开答案选择 C，再回看完整解析确认判断链条。"],"tip":"真题的难点常在条件组合：先排除绝对化表述，再验证正确项能否解释全部现象。","examSource":{"title":"2016 （新课标ⅲ） 高考选择题","year":"2016","region":"全国","examType":"高考选择题","url":"https://github.com/OpenLMLab/GAOKAO-Bench","dataset":"GAOKAO-Bench","license":"Apache-2.0"}},{"id":"bench-biology-2017-074","subject":"biology","topicId":"bio-photosynthesis","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2017 · （新课标ⅲ） · 高考真题","stem":"植物光合作用的作用光谱是通过测量光合作用对不同波长光的反应 （如O2的释放）来绘制的。下列叙述错误的是（）","options":[{"key":"A","text":"类胡萝卜素在红光区吸收的光能可用于光反应中ATP的合成"},{"key":"B","text":"叶绿素的吸收光谱可通过测量其对不同波长光的吸收值来绘制"},{"key":"C","text":"光合作用的作用光谱也可用CO2的吸收速率随光波长的变化来表示"},{"key":"D","text":"叶片在640～660nm波长光下释放O2是由叶绿素参与光合作用引起的"}],"answer":"A","optionNotes":{"A":"正确。本题应选 A；原题对照：类胡萝卜素只吸收蓝紫光，所以在蓝紫光区吸收的光能可用于 光反应中ATP的合成，A错误；","B":"错误。本题不应选 B；原题对照：叶绿素主要吸收红光和蓝紫光，其吸收光谱可通过测量其对不同波长光的吸收值来绘制，B正确；","C":"错误。本题不应选 C；原题对照：由于光反应产生的[H]和ATP能用于暗反应，所以光合作用的作用光谱也可 用CO2的吸收速率随光波长的变化来表示，C正确；","D":"错误。本题不应选 D；原题对照：根据吸收光谱可知，叶片在640～660nm波长光下释放O2是由叶绿素参与光 合作用引起的，D正确。 故选：A。"},"analysis":"A、类胡萝卜素只吸收蓝紫光，所以在蓝紫光区吸收的光能可用于 光反应中ATP的合成，A错误； B、叶绿素主要吸收红光和蓝紫光，其吸收光谱可通过测量其对不同波长光的吸收值来绘制，B正确； C、由于光反应产生的[H]和ATP能用于暗反应，所以光合作用的作用光谱也可 用CO2的吸收速率随光波长的变化来表示，C正确； D、根据吸收光谱可知，叶片在640～660nm波长光下释放O2是由叶绿素参与光 合作用引起的，D正确。 故选：A。","steps":["先圈出题干中的限定条件、实验现象和设问方向。","逐项核对学科规律、守恒关系或结构功能关系，排除条件不符的结论。","公开答案选择 A，再回看完整解析确认判断链条。"],"tip":"真题的难点常在条件组合：先排除绝对化表述，再验证正确项能否解释全部现象。","examSource":{"title":"2017 （新课标ⅲ） 高考选择题","year":"2017","region":"全国","examType":"高考选择题","url":"https://github.com/OpenLMLab/GAOKAO-Bench","dataset":"GAOKAO-Bench","license":"Apache-2.0"}},{"id":"bench-biology-2018-078","subject":"biology","topicId":"bio-organelles","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2018 · （新课标ⅰ） · 高考真题","stem":"生物膜的结构与功能存在密切的联系 ，下列有关叙述错误的是 （　　）","options":[{"key":"A","text":"叶绿体的类囊体膜上存在催化 ATP合成的酶"},{"key":"B","text":"溶酶体膜破裂后释放出的酶会造成细胞结构的破坏"},{"key":"C","text":"细胞的核膜是双层膜结构，核孔是物质进出细胞核的通道"},{"key":"D","text":"线粒体 DNA位于线粒体外膜上，编码参与呼吸作用的酶"}],"answer":"D","optionNotes":{"A":"错误。本题不应选 A；原题对照：叶绿体的类囊体膜是光反应的场所， 而光反应有 ATP 的生成， 故叶绿体的类囊体膜上存在催化 ATP合成的酶， A正确；","B":"错误。本题不应选 B；原题对照：溶酶体内含有多种水解酶，溶酶体膜破裂后释放出的酶会造成细胞结构的破 坏， B正确；","C":"错误。本题不应选 C；原题对照：细胞的核膜是双层膜结构，核孔是某些物质（如酶、 RNA等）进出细胞核的 通道， C正确；","D":"正确。本题应选 D；原题对照：线粒体 DNA位于线粒体内，可以编码部分参与呼吸作用的酶， D错误。 故选： D。"},"analysis":"A、叶绿体的类囊体膜是光反应的场所， 而光反应有 ATP 的生成， 故叶绿体的类囊体膜上存在 type":"single","qualityTier":"exam","examStyle":"2018 · （新课标ⅰ） · 高考真题","stem":"某大肠杆菌能在基本培养基上生长， 其突变体 M和N均不能在基本 培养基上生长， 但M可在添加了氨基酸甲的基本培养基上生长， N可在添加 了氨基酸乙的基本培养基上生长 。将M和N在同时添加氨基酸甲和乙的基本 培养基中混合培养一段时后，再将菌体接种在基本培养基平板上，发现长出 了大肠杆菌（ X）的菌落。据此判断，下列说法不合理的是（ 　　）","options":[{"key":"A","text":"突变体 M催化合成氨基酸甲所需酶的活性丧失"},{"key":"B","text":"突变体 M和N都是由于基因发生突变而得来"},{"key":"C","text":"突变体 M的RNA与突变体 N混合培养能得到 X"},{"key":"D","text":"突变体 M和N在混合培养期间发生了 DNA转移"}],"answer":"C","optionNotes":{"A":"错误。本题不应选 A；原题对照：根据题意可知， “突变体 M不能在基本培养基上生长，但突变 体M可在添加了氨基酸甲的基本培养基上生长 ”，说明突变体 M催化合成氨 基酸甲所需酶的活性丧失， A正确；","B":"错误。本题不应选 B；原题对照：大肠杆菌属于原核生物 ，原核细胞只能发生基因突变 ，由此可见 ，突变体 M 和N都是由于基因发生突变而得来， B正确；","C":"正确。本题应选 C；原题对照：突变体 M和N在同时添加氨基酸甲和乙的基本培养基中混合培养 ，产生了大 肠杆菌 X，这可能是两种大肠杆菌之间发生了重组 ，但不能确定突变体 M的 RNA与突变体 N混合培养能否得到 X，C错误；","D":"错误。本题不应选 D；原题对照：突变体 M和N在混合培养期间可能发生了 DNA转移，从而产生大肠杆菌 X， D正确。 故选： C。"},"analysis":"A、根据题意可知， “突变体 M不能在基本培养基上生长，但突变 体M可在添加了氨基酸甲的基本培养基上生长 ”，说明突变体 M催化合成氨 基酸甲所需酶的活性丧失， A正确； B、大肠杆菌属于原核生物 ，原核细胞只能发生基因突变 ，由此可见 ，突变体 M 和N都是由于基因发生突变而得来， B正确； C、突变体 M和N在同时添加氨基酸甲和乙的基本培养基中混合培养 ，产生了大 肠杆菌 X，这可能是两种大肠杆菌之间发生了重组 ，但不能确定突变体 M的 RNA与突变体 N混合培养能否得到 X，C错误； D、突变体 M和N在混合培养期间可能发生了 DNA转移，从而产生大肠杆菌 X， D正确。 故选： C。","steps":["先圈出题干中的限定条件、实验现象和设问方向。","逐项核对学科规律、守恒关系或结构功能关系，排除条件不符的结论。","公开答案选择 C，再回看完整解析确认判断链条。"],"tip":"真题的难点常在条件组合：先排除绝对化表述，再验证正确项能否解释全部现象。","examSource":{"title":"2018 （新课标ⅰ） 高考选择题","year":"2018","region":"全国","examType":"高考选择题","url":"https://github.com/OpenLMLab/GAOKAO-Bench","dataset":"GAOKAO-Bench","license":"Apache-2.0"}},{"id":"bench-biology-2018-083","subject":"biology","topicId":"bio-protein","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2018 · （新课标ⅱ） · 高考真题","stem":"下列关于人体中蛋白质功能的叙述，错误的是（ 　　）","options":[{"key":"A","text":"浆细胞产生的抗体可结合相应的病毒抗原"},{"key":"B","text":"肌细胞中的某些蛋白质参与肌肉收缩的过程"},{"key":"C","text":"蛋白质结合 Mg2+形成的血红蛋白参与 O2运输"},{"key":"D","text":"细胞核中某些蛋白质是染色体的重要组成成分"}],"answer":"C","optionNotes":{"A":"错误。本题不应选 A；原题对照：浆细胞产生的抗体可结合相应的病毒抗原，产生抗原抗体复合 物， A正确；","B":"错误。本题不应选 B；原题对照：肌细胞中的某些蛋白质参与肌肉收缩的过程，如肌动蛋白和肌 ogy","topicId":"bio-nucleus","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2019 · （新课标ⅱ） · 高考真题","stem":"在真核细胞的内质网和细胞核中能够合成的物质分别是（）","options":[{"key":"A","text":"脂质、RNA"},{"key":"B","text":"氨基酸、蛋白质"},{"key":"C","text":"RNA、DNA"},{"key":"D","text":"DNA、蛋白质"}],"answer":"A","optionNotes":{"A":"正确。本题应选 A；原题对照：内质网可以合成脂质，细胞核中可以发生转录合成RNA，A正确；","B":"错误。本题不应选 B；原题对照：蛋白质的合成场所是核糖体，B错误；","C":"错误。本题不应选 C；原题对照：内质网中不能合成RNA，细胞核中可以合成DNA和RNA，C错误；","D":"错误。本题不应选 D；原题对照：内质网中不能合成DNA，蛋白质的合成场所是核糖体，D错误。 故选：A。"},"analysis":"A、内质网可以合成脂质，细胞核中可以发生转录合成RNA，A正确； B、蛋白质的合成场所是核糖体，B错误； C、内质网中不能合成RNA，细胞核中可以合成DNA和RNA，C错误； D、内质网中不能合成DNA，蛋白质的合成场所是核糖体，D错误。 故选：A。","steps":["先圈出题干中的限定条件、实验现象和设问方向。","逐项核对学科规律、守恒关系或结构功能关系，排除条件不符的结论。","公开答案选择 A，再回看完整解析确认判断链条。"],"tip":"真题的难点常在条件组合：先排除绝对化表述，再验证正确项能否解释全部现象。","examSource":{"title":"2019 （新课标ⅱ） 高考选择题","year":"2019","region":"全国","examType":"高考选择题","url":"https://github.com/OpenLMLab/GAOKAO-Bench","dataset":"GAOKAO-Bench","license":"Apache-2.0"}},{"id":"bench-biology-2019-101","subject":"biology","topicId":"bio-respiration","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2019 · （新课标ⅱ） · 高考真题","stem":"马铃薯块茎储藏不当会出现酸味，这种现象与马铃薯块茎细胞的无氧呼吸有关。 下列叙述正确的是（）","options":[{"key":"A","text":"马铃薯块茎细胞无氧呼吸的产物是乳酸和葡萄糖"},{"key":"B","text":"马铃薯块茎细胞无氧呼吸产生的乳酸是由丙酮酸转化而来"},{"key":"C","text":"马铃薯块茎细胞无氧呼吸产生丙酮酸的过程不能生成ATP"},{"key":"D","text":"马铃薯块茎储藏库中氧气浓度的升高会增加酸味的产生"}],"answer":"B","optionNotes":{"A":"错误。本题不应选 A；原题对照：马铃薯块茎无氧呼吸的产物是乳酸，无葡萄糖，A错误；","B":"正确。本题应选 B；原题对照：马铃薯块茎细胞无氧呼吸的第一阶段，葡萄糖被分解成丙酮酸，丙酮酸在第二阶段转 化成乳酸，B正确；","C":"错误。本题不应选 C；原题对照：马铃薯块茎细胞无氧呼吸产生丙酮酸属于无氧呼吸的第一阶段，会生成少量ATP，C错误；","D":"错误。本题不应选 D；原题对照：马铃薯块茎储存时，氧气浓度增加会抑制其无氧呼吸，酸味会减少，D错误。 故选：B。"},"analysis":"A、马铃薯块茎无氧呼吸的产物是乳酸，无葡萄糖，A错误； B、马铃薯块茎细胞无氧呼吸的第一阶段，葡萄糖被分解成丙酮酸，丙酮酸在第二阶段转 化成乳酸，B正确； C、马铃薯块茎细胞无氧呼吸产生丙酮酸属于无氧呼吸的第一阶段，会生成少量ATP，C错误； D、马铃薯块茎储存时，氧气浓度增加会抑制其无氧呼吸，酸味会减少，D错误。 故选：B。","steps":["先圈出题干中的限定条件、实验现象和设问方向。","逐项核对学科规律、守恒关系或结构功能关系，排除条件不符的结论。","公开答案选择 B，再回看完整解析确认判断链条。"],"tip":"真题的难点常在条件组合：先排除绝对化表述，再验证正确项能否解释全部现象。","examSource":{"title":"2019 （新课标ⅱ） 高考选择题","year":"2019","region":"全国","examType":"高考选择题","url":"https://github.com/OpenLMLab/GAOKAO-Bench","dataset":"GAOKAO-Bench","license":"Apache-2.0"}},{"id":"bench-biology-2019-102","subject":"biology","topicId":"bio-enzyme","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2019 · （新课标ⅱ） · 高考真题","stem":"某种H+﹣ATPase是一种位于膜上的载体蛋白，具有ATP水解酶活性，能够利用 水解ATP释放的能量逆浓度梯度跨膜转运H+．①将某植物气孔的保卫细胞悬浮在一定 pH的溶液中（假设细胞内的pH高于细胞外），置于暗中一段时间后，溶液的pH不变。 ②再将含有保卫细胞的该溶液分成两组，一组照射蓝光后溶液的pH明显降低；另一组先 在溶液中加入H+﹣ATPase的抑制剂（抑制ATP水解），再用蓝光照射，溶液的pH不变。 根据上述实验结果，下列推测不合理的是（）","options":[{"key":"A","text":"H+﹣ATPase位于保卫细胞质膜上，蓝光能够引起细胞内的H+转运到细胞外"},{"key":"B","text":"蓝光通过保卫细胞质膜上的H+﹣ATPase发挥作用导致H+逆浓度梯度跨膜运输"},{"key":"C","text":"H+﹣ATPase逆浓度梯度跨膜转运H+所需的能量可由蓝光直接提供"},{"key":"D","text":"溶液中的H+不能通过自由扩散的方式透过细胞质膜进入保卫细胞"}],"answer":"C","optionNotes":{"A":"错误。本题不应选 A；原题对照：分析题意可知，H+﹣ATPase位于保卫细胞质膜上，蓝光能够引起细胞 内的H+转运到细胞外，A正确；","B":"错误。本题不应选 B；原题对照：蓝光通过保卫细胞质膜上的H+﹣ATPase发挥作用导致H+逆浓度梯度跨膜运输，B 正确；","C":"正确。本题应选 C；原题对照：H+﹣ATPase逆浓度梯度跨膜转运H+所需的能量由ATP水解提供，C错误；","D":"错误。本题不应选 D；原题对照：溶液中的H+不能通过自由扩散进入保卫细胞，D正确。 故选：C。"},"analysis":"A、分析题意可知，H+﹣ATPase位于保卫细胞质膜上，蓝光能够引起细胞 内的H+转运到细胞外，A正确； B、蓝光通过保卫细胞质膜上的H+﹣ATPase发挥作用导致H+逆浓度梯度跨膜运输，B 正确； C、H+﹣ATPase逆浓度梯度跨膜转运H+所需的能量由ATP水解提供，C错误； D、溶液中的H+不能通过自由扩散进入保卫细胞，D正确。 故选：C。","steps":["先圈出题干中的限定条件、实验现象和设问方向。","逐项核对学科规律、守恒关系或结构功能关系，排除条件不符的结论。","公开答案选择 C，再回看完整解析确认判断链条。"],"tip":"真题的难点常在条件组合：先排除绝对化表述，再验证正确项能否解释全部现象。","examSource":{"title":"2019 （新课标ⅱ） 高考选择题","year":"2019","region":"全国","examType":"高考选择题","url":"https://github.com/OpenLMLab/GAOKAO-Bench","dataset":"GAOKAO-Bench","license":"Apache-2.0"}},{"id":"bench-biology-2019-106","subject":"biology","topicId":"bio-organelles","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2019 · （新课标ⅲ） · 高考真题","stem":"下列有关高尔基体、线粒体和叶绿体的叙述，正确的是（）","options":[{"key":"A","text":"三者都存在于蓝藻中"},{"key":"B","text":"三者都含有DNA"},{"key":"C","text":"三者都是ATP合成的场所"},{"key":"D","text":"三者的膜结构中都含有蛋白质"}],"answer":"D","optionNotes":{"A":"错误。本题不应选 A；原题对照：蓝藻为原核生物只有核糖体一种细胞器，无其他细胞器，A错误；","B":"错误。本题不应选 B；原题对照：线粒体和叶绿体基质中都有酶和少量的DNA和RNA，而高尔基体中没有DNA，B 错误","C":"错误。本题不应选 C；原题对照：线粒体是细胞进行有氧呼吸的主要场所，是细胞的“动力车间”。叶绿体是绿色植物 进行光合作用的主要场所，是植物细胞的“养料制造车间”都能产生ATP，而高尔基体 不能产生ATP，C错误。","D":"正确。本题应选 D；原题对照：线粒体和叶绿体都是双层膜结构，高尔基体是单层膜结构，膜结构都是由大量的蛋白 质和磷脂还有少量的糖类组成，D正确。 故选：D。"},"analysis":"A、蓝藻为原核生物只有核糖体一种细胞器，无其他细胞器，A错误； B、线粒体和叶绿体基质中都有酶和少量的DNA和RNA，而高尔基体中没有DNA，B 错误；C、线粒体是细胞进行有氧呼吸的主要场所，是细胞的“动力车间”。叶绿体是绿色植物 进行光合作用的主要场所，是植物细胞的“养料制造车间”都能产生ATP，而高尔基体 不能产生ATP，C错误。 D、线粒体和叶绿体都是双层膜结构，高尔基体是单层膜结构，膜结构都是由大量的蛋白 质和磷脂还有少量的糖类组成，D正确。 故选：D。","steps":["先圈出题干中的限定条件、实验现象和设问方向。","逐项核对学科规律、守恒关系或结构功能关系，排除条件不符的结论。","公开答案选择 D，再回看完整解析确认判断链条。"],"tip":"真题的难点常在条件组合：先排除绝对化表述，再验证正确项能否解释全部现象。","examSource":{"title":"2019 （新课标ⅲ） 高考选择题","year":"2019","region":"全国","examType":"高考选择题","url":"https://github.com/OpenLMLab/GAOKAO-Bench","dataset":"GAOKAO-Bench","license":"Apache-2.0"}},{"id":"bench-biology-2019-107","subject":"biology","topicId":"bio-nucleus","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2019 · （新课标ⅲ） · 高考真题","stem":"下列与真核生物细胞核有关的叙述，错误的是（）","options":[{"key":"A","text":"细胞中的染色质存在于细胞核中"},{"key":"B","text":"细胞核是遗传信息转录和翻译的场所"},{"key":"C","text":"细胞核是细胞代谢和遗传的控制中心"},{"key":"D","text":"细胞核内遗传物质的合成需要能量"}],"answer":"B","optionNotes":{"A":"错误。本题不应选 A；原题对照：染色体指的是DNA+组蛋白→染色质经过一定的空间排列顺序之后形成 的高度折叠的很复杂的一个生物大分子，它只存在于细胞核中，A正确；","B":"正确。本题应选 B；原题对照：遗传信息的复制和转录是在细胞核中进行，而翻译则是在细胞质的核糖体上进行，B 错误；","C":"错误。本题不应选 C；原题对照：细胞核功能：细胞遗传物质贮存和复制的场所，细胞遗传性和细胞代谢活动的控制中心。细胞的代谢主要是在细胞质中进行的，C正确；","D":"错误。本题不应选 D；原题对照：细胞核中有染色体，染色体中有DNA，DNA上有遗传信息。这些信息其实就是指导 和控制细胞中物质和能量变化的一系列指令，而DNA的复制需要消耗能量，D正确。 故选：B。"},"analysis":"A、染色体指的是DNA+组蛋白→染色质经过一定的空间排列顺序之后形成 的高度折叠的很复杂的一个生物大分子，它只存在于细胞核中，A正确； B、遗传信息的复制和转录是在细胞核中进行，而翻译则是在细胞质的核糖体上进行，B 错误； C、细胞核功能：细胞遗传物质贮存和复制的场所，细胞遗传性和细胞代谢活动的控制中心。细胞的代谢主要是在细胞质中进行的，C正确； D、细胞核中有染色体，染色体中有DNA，DNA上有遗传信息。这些信息其实就是指导 和控制细胞中物质和能量变化的一系列指令，而DNA的复制需要消耗能量，D正确。 故选：B。","steps":["先圈出题干中的限定条件、实验现象和设问方向。","逐项核对学科规律、守恒关系或结构功能关系，排除条件不符的结论。","公开答案选择 B，再回看完整解析确认判断链条。"],"tip":"真题的难点常在条件组合：先排除绝对化表述，再验证正确 ；","B":"错误。本题不应选 B；原题对照：若细胞只进行有氧呼吸，则吸收O2的分子数与释放CO2的相等，B正确；","C":"错误。本题不应选 C；原题对照：由分析可知：若细胞只进行无氧呼吸且产物是乳酸，则无O2吸收也无CO2释放，C 正确；","D":"正确。本题应选 D；原题对照：若细胞同时进行有氧和无氧呼吸，若为有氧呼吸和酒精式无氧呼吸，则释放CO2的 分子数比吸收O2的多，若细胞同时进行有氧和无氧呼吸，且为有氧呼吸和乳酸式无氧呼 吸，则释放CO2的分子数等于吸收O2的分子数，D错误。 故选：D。"},"analysis":"A、由分析可知：由于有氧呼吸产生二氧化碳，不产生乙醇，若产生的CO2 与乙醇的分子数相等，则说明细胞只进行无氧呼吸，A正确； B、若细胞只进行有氧呼吸，则吸收O2的分子数与释放CO2的相等，B正确； C、由分析可知：若细胞只进行无氧呼吸且产物是乳酸，则无O2吸收也无CO2释放，C 正确； D、若细胞同时进行有氧和无氧呼吸，若为有氧呼吸和酒精式无氧呼吸，则释放CO2的 分子数比吸收O2的多，若细胞同时进行有氧和无氧呼吸，且为有氧呼吸和乳酸式无氧呼 吸，则释放CO2的分子数等于吸收O2的分子数，D错误。 故选：D。","steps":["先圈出题干中的限定条件、实验现象和设问方向。","逐项核对学科规律、守恒关系或结构功能关系，排除条件不符的结论。","公开答案选择 D，再回看完整解析确认判断链条。"],"tip":"真题的难点常在条件组合：先排除绝对化表述，再验证正确项能否解释全部现象。","examSource":{"title":"2020 （新课标ⅰ） 高考选择题","year":"2020","region":"全国","examType":"高考选择题","url":"https://github.com/OpenLMLab/GAOKAO-Bench","dataset":"GAOKAO-Bench","license":"Apache-2.0"}},{"id":"bench-biology-2020-118","subject":"biology","topicId":"bio-cell-intro","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2020 · （新课标ⅱ） · 高考真题","stem":"新冠病毒（SARS﹣CoV﹣2）和肺炎双球菌均可引发肺炎，但二者的结构不同， 新冠病毒是一种含有单链RNA的病毒。下列相关叙述正确的是（）","options":[{"key":"A","text":"新冠病毒进入宿主细胞的跨膜运输方式属于被动运输"},{"key":"B","text":"新冠病毒与肺炎双球菌均可利用自身的核糖体进行蛋白质合成"},{"key":"C","text":"新冠病毒与肺炎双球菌二者遗传物质所含有的核苷酸是相同的"},{"key":"D","text":"新冠病毒或肺炎双球菌的某些蛋白质可作为抗原引起机体免疫反应"}],"answer":"D","optionNotes":{"A":"错误。本题不应选 A；原题对照：新冠病毒进入宿主细胞的方式是胞吞，A错误；","B":"错误。本题不应选 B；原题对照：新冠病毒无核糖体，只能利用宿主细胞的核糖体进行蛋白质合成，B错误；","C":"错误。本题不应选 C；原题对照：新冠病毒的遗传物质是RNA，肺炎双球菌的遗传物质是DNA，两者含有的核苷酸不 相同的，C错误；","D":"正确。本题应选 D；原题对照：新冠病毒或肺炎双球菌的某些蛋白质可作为抗原引起机体免疫反应，D正确。 故选：D。"},"analysis":"A、新冠病毒进入宿主细胞的方式是胞吞，A错误； B、新冠病毒无核糖体，只能利用宿主细胞的核糖体进行蛋白质合成，B错误； C、新冠病毒的遗传物质是RNA，肺炎双球菌的遗传物质是DNA，两者含有的核苷酸不 相同的，C错误； D、新冠病毒或肺炎双球菌的某些蛋白质可作为抗原引起机体免疫反应，D正确。 故选：D。","steps":["先圈出题干中的限定条件、实验现象和设问方向。","逐项核对学科规律、守恒关系或结构功能关系，排除条件不符的结论。","公开答案选择 D，再回看完整解析确认判断链条。"],"tip":"真题的难点常在条件组合：先排除绝对化表述，再验证正确项能否解释全部现象。","examSource":{"title":"2020 （新课标ⅱ） 高考选择题","year":"2020","region":"全国","examType":"高考选择题","url":"https://github.com/OpenLMLa ":"single","qualityTier":"exam","examStyle":"2012 · （新课标） · 高考真题","stem":"用 Nₐ 表示阿伏加德罗常数的值, 下列叙述中不正确的是（）","options":[{"key":"A","text":"分子总数为 Nₐ 的 NO₂ 和 CO₂ 混合气体中含有的氧原子数为 2 ~Nₐ"},{"key":"B","text":"28 ~g 乙烯和环丁烷 (C₄ H₈) 的混合气体中含有的碳原子数为 2 ~Nₐ"},{"key":"C","text":"常温常压下, 92 ~g 的 NO₂ 和 N₂ O₄ 混合气体含有的原子数为 6 ~Nₐ"},{"key":"D","text":"常温常压下, 22.4 ~L 氯气与足量的镁粉充分反应, 转移的电子数为 2 ~Nₐ"}],"answer":"D","optionNotes":{"A":"错误。本题不应选 A；原题对照：NO₂ 和 CO₂ 分子中含有相同氧原子, 分子总数为 Nₐ 的 NO₂ 和 CO₂ 混合气体含有的氧原子数为 2 ~Nₐ, 故 A 正确;","B":"错误。本题不应选 B；原题对照：28 g 乙烯和环丁烷 (C₄ H₈) 的混合气体中，乙烯和环丁烷 (C₄ H₈) 最简式相 同为 CH₂, 计算 28 gCH₂ 中所含碳原子物质的量 = 28 ~g14 ~g / mol=2 ~mol, 含有的碳 原子数为 2 ~Nₐ, 故 B 正确;","C":"错误。本题不应选 C；原题对照：NO₂ 和 N₂ O₄ 分子最简比相同为 NO₂ 计算 92 gNO₂ 中所含原子数 = 92 ~g46 ~g / mol × 3 × Nₐ=6 ~Nₐ, 故 C 正确;","D":"正确。本题应选 D；原题对照：常温常压下, 22.4 ~L 氯气物质的量不是 1 ~mol, 故 D 错误; 故选：D。"},"analysis":"A 、 NO₂ 和 CO₂ 分子中含有相同氧原子, 分子总数为 Nₐ 的 NO₂ 和 CO₂ 混合气体含有的氧原子数为 2 ~Nₐ, 故 A 正确; B、28 g 乙烯和环丁烷 (C₄ H₈) 的混合气体中，乙烯和环丁烷 (C₄ H₈) 最简式相 同为 CH₂, 计算 28 gCH₂ 中所含碳原子物质的量 = 28 ~g14 ~g / mol=2 ~mol, 含有的碳 原子数为 2 ~Nₐ, 故 B 正确; C 、 NO₂ 和 N₂ O₄ 分子最简比相同为 NO₂ 计算 92 gNO₂ 中所含原子数 = 92 ~g46 ~g / mol × 3 × Nₐ=6 ~Nₐ, 故 C 正确; D、常温常压下, 22.4 ~L 氯气物质的量不是 1 ~mol, 故 D 错误; 故选：D。","steps":["先圈出题干中的限定条件、实验现象和设问方向。","逐项核对学科规律、守恒关系或结构功能关系，排除条件不符的结论。","公开答案选择 D，再回看完整解析确认判断链条。"],"tip":"真题的难点常在条件组合：先排除绝对化表述，再验证正确项能否解释全部现象。","examSource":{"title":"2012 （新课标） 高考选择题","year":"2012","region":"全国","examType":"高考选择题","url":"https://github.com/OpenLMLab/GAOKAO-Bench","dataset":"GAOKAO-Bench","license":"Apache-2.0"}},{"id":"bench-chemistry-2012-018","subject":"chemistry","topicId":"chem-atom","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2012 · （新课标） · 高考真题","stem":"短周期元素 W 、 X 、 Y 、 Z 的原子序数依次增大，其中 W 的阴离子 的核外电子数与 X 、 Y 、 Z 原子的核外内层电子数相同. X 的一种核素在考古 时常用来鉴定一些文物的年代, 工业上采用液态空气分馏方法来生产 Y 的单 质，而 Z 不能形成双原子分子. 根据以上叙述，下列说法中正确的是（）","options":[{"key":"A","text":"上述四种元素的原子半径大小为 W<X<Y<Z"},{"key":"B","text":"W 、 X 、 Y 、 Z 原子的核外最外层电子数的总和为 20"},{"key":"C","text":"W 与 Y 可形成既含极性共价键又含非极性共价键的化合物"},{"key": ₃ 发生铝热反应"},{"key":"D","text":"将锌粒投入 Cu(NO₃)₂ 溶液"}],"answer":"B","optionNotes":{"A":"错误。本题不应选 A；原题对照：发生氢气与 CuO 的反应生成 Cu 和水, 反应前固体为 CuO, 反 应后固体为 Cu, 固体质量减小,故 A 错误;","B":"正确。本题应选 B；原题对照：发生二氧化碳与过氧化钠的反应生成碳酸钠和氧气, 反应前固体为过氧化钠 , 反应后固体为碳酸钠, 二者物质的量相同, 固体质量增加, 故 B 正确;","C":"错误。本题不应选 C；原题对照：发生 Al 与 Fe₂ O₃ 反应生成 Al₂ O₃ 和 Fe, 反应前固体为氧化铁、 Al, 反应后固 体为氧化铝、 Fe, 均为固体, 固体质量不变, 故 C 错误;","D":"错误。本题不应选 D；原题对照：发生 Zn 与 Cu(NO₃)₂ 反应生成 Zn(NO₃)₂ 和 Cu, 反应前固体为 Zn, 反 应后固体为 Cu, 二者物质的量相同, 则固体质量减小, 故 D 错误; 故选: B。"},"analysis":"A. 发生氢气与 CuO 的反应生成 Cu 和水, 反应前固体为 CuO, 反 应后固体为 Cu, 固体质量减小,故 A 错误; B. 发生二氧化碳与过氧化钠的反应生成碳酸钠和氧气, 反应前固体为过氧化钠 , 反应后固体为碳酸钠, 二者物质的量相同, 固体质量增加, 故 B 正确; C. 发生 Al 与 Fe₂ O₃ 反应生成 Al₂ O₃ 和 Fe, 反应前固体为氧化铁、 Al, 反应后固 体为氧化铝、 Fe, 均为固体, 固体质量不变, 故 C 错误; D. 发生 Zn 与 Cu(NO₃)₂ 反应生成 Zn(NO₃)₂ 和 Cu, 反应前固体为 Zn, 反 应后固体为 Cu, 二者物质的量相同, 则固体质量减小, 故 D 错误; 故选: B。","steps":["先圈出题干中的限定条件、实验现象和设问方向。","逐项核对学科规律、守恒关系或结构功能关系，排除条件不符的结论。","公开答案选择 B，再回看完整解析确认判断链条。"],"tip":"真题的难点常在条件组合：先排除绝对化表述，再验证正确项能否解释全部现象。","examSource":{"title":"2014 （新课标ⅱ） 高考选择题","year":"2014","region":"全国","examType":"高考选择题","url":"https://github.com/OpenLMLab/GAOKAO-Bench","dataset":"GAOKAO-Bench","license":"Apache-2.0"}},{"id":"bench-chemistry-2015-038","subject":"chemistry","topicId":"chem-mole","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2015 · （新课标ⅰ） · 高考真题","stem":"Nₐ 为阿伏伽德罗常数的值。下列说法正确的是（）","options":[{"key":"A","text":"18 gD₂ O 和 18 gH₂ O 中含有的质子数均为 10 ~Nₐ"},{"key":"B","text":"2 ~L 0.5 ~mol / L 亚硫酸溶液中含有的 H⁺个数为 2 ~Nₐ"},{"key":"C","text":"过氧化钠与水反应时, 生成 0.1 ~mol 氧气转移的电子数为 0.2 ~Nₐ"},{"key":"D","text":"密闭容器中 2 molNO 与 1 molO₂ 充分反应, 产物的分子数为 2 ~Nₐ"}],"answer":"C","optionNotes":{"A":"错误。本题不应选 A；原题对照：一个 D₂ O 和 H₂ O 分子中质子数都是 10,18 ~g 的 D₂ O 物质的量= 18 ~g20 ~g / mol=0.9 ~mol 、 18 gH₂ O 的物质的量 = 18 ~g18 ~g / mol=1 ~mol, 根据 N=nNₐ 知, 其 分子数之比等于物质的量之比 =0.9 ~mol: 1 ~mol=0.9: 1, 二者的分子数分别是 0.9 ~Nₐ 、 ~Nₐ, 结合分子构成知, 二者的质子数分别是 9 ~Nₐ 、 10 ~Nₐ, 故 A 错误","B":"错误。本题不应选 B；原题对照：n(H₂ SO₃)=0.5 ~mol / L × 2 ~L=1 ~mol, 亚硫酸是弱电解质, 在水溶液中部分电离 , 且第二步电离程度远远小于第一步电离程度, 所以  1 ~mol, 故 2.24 LN₂ 和 O₂ 的混合 气体中分子数为 0.1 ~mol, 即 0.1 ~Nₐ, 故 C 错误;","D":"正确。本题应选 D；原题对照：H₂+I₂ leftharpoons 2 HI 是可逆反应, 不过是 1+1=2 的反应, 即这是一个反应前后分子物 质的量不变的反应, 故反应后分子总数仍为 0.2 NA, 故选 D 。"},"analysis":"A. 铵根易水解, 所含 NH₄ ⁺数小于 0.1 ~Nₐ, 故 A 错误; B. n(Mg)= 2.4 ~g24 ~g / mol=0.1 ~mol, Mg 与 H₂ SO₄ 反应生成 Mg²⁺, 则 1 molMg 参与 反应转移 2 ~mol 电子, 故 0.1 molMg 参与反应转移 0.2 ~mol 电子, 即 0.2 ~Nₐ, 故 B 错误; C. 标准状况下, 22.4 ~L 任何气体所含的分子数为 1 ~mol, 故 2.24 LN₂ 和 O₂ 的混合 气体中分子数为 0.1 ~mol, 即 0.1 ~Nₐ, 故 C 错误; D. H₂+I₂ leftharpoons 2 HI 是可逆反应, 不过是 1+1=2 的反应, 即这是一个反应前后分子物 质的量不变的反应, 故反应后分子总数仍为 0.2 NA, 故选 D 。","steps":["先圈出题干中的限定条件、实验现象和设问方向。","逐项核对学科规律、守恒关系或结构功能关系，排除条件不符的结论。","公开答案选择 D，再回看完整解析确认判断链条。"],"tip":"真题的难点常在条件组合：先排除绝对化表述，再验证正确项能否解释全部现象。","examSource":{"title":"2017 （新课标ⅱ） 高考选择题","year":"2017","region":"全国","examType":"高考选择题","url":"https://github.com/OpenLMLab/GAOKAO-Bench","dataset":"GAOKAO-Bench","license":"Apache-2.0"}},{"id":"bench-chemistry-2017-074","subject":"chemistry","topicId":"chem-mole","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2017 · （新课标ⅲ） · 高考真题","stem":"Nₐ 为阿伏加德罗常数的值. 下列说法正确的是 （）","options":[{"key":"A","text":"0.1 ~mol 的 ¹¹ ~B 中, 含有 0.6 ~Nₐ 个中子"},{"key":"B","text":"pH=1 的 H₃ PO₄ 溶液中, 今含有 0.1 ~Nₐ 个 H⁺"},{"key":"C","text":"2.24 ~L (标准状况) 苯在 O₂ 中完全燃烧, 得到 0.6 ~Nₐ 个 CO₂ 分子"},{"key":"D","text":"密闭容器中 1 ~mol PCl₃ 与 1 ~mol Cl₂ 反应制备 PCl₅(~g) ， 增加 2 ~Nₐ 个 P- Cl 键"}],"answer":"A","optionNotes":{"A":"正确。本题应选 A；原题对照：¹¹ ~B 中含有中子数 =11-5=6,0.1 ~mol 的 ¹¹ ~B 中含有 0.6 ~mol 中子, 含有 0.6 ~Nₐ 个中子，故 A 正确;","B":"错误。本题不应选 B；原题对照：没有告诉 pH=1 的 H₃ PO₄ 溶液的体积, 无法计算溶液中含有氢离子的物质的 量就数目， 故 B 错误;","C":"错误。本题不应选 C；原题对照：标准状况下苯不是气体，不能使用标况下的气体摩尔体积计算, 故 C 错误;","D":"错误。本题不应选 D；原题对照：PCl₃ 与 Cl₂ 生成 PCl₅ 的反应为可逆反应，则生成 PCl₅ 的物质的量小于 1 ~mol, 增加的 P-Cl 键小于 2 ~Nₐ ， 故 D 错误; 故选: A。"},"analysis":"A . ¹¹ ~B 中含有中子数 =11-5=6,0.1 ~mol 的 ¹¹ ~B 中含有 0.6 ~mol 中子, 含有 0.6 ~Nₐ 个中子，故 A 正确; B. 没有告诉 pH=1 的 H₃ PO₄ 溶液的体积, 无法计算溶液中含有氢离子的物质的 量就数目， 故 B 错误; C. 标准状况下苯不是气体，不能使用标况下的气体摩尔体积计算, 故 C 错误; D. PCl₃ 与 Cl₂ 生成 PCl₅ 的反应为可逆反应，则生成 PCl₅ 的物质的量小于 1 应颜色变化的是（）","options":[{"key":"A","text":"向 CuSO₄ 溶液中加人足量 Zn 粉，溶液蓝色消失 Zn+CuSO₄=Cu+ZnSO₄"},{"key":"B","text":"澄清的石灰水久置后出现白色固体 Ca(OH) ₂+CO₂=CaCO₃ ↓+H₂ O"},{"key":"C","text":"Na₂ O₂ 在空气中放置后由淡黄色变为白色 2 Na₂ O₂=2 Na₂ O+O₂ ↑"},{"key":"D","text":"向 Mg(OH)₂ 悬浊液中滴加足量 FeCl₃ 溶液出现红褐色沉淀 3 Mg(OH)₂+2 FeCl₃= 2 Fe(OH)₃+3 MgCl₂"}],"answer":"C","optionNotes":{"A":"错误。本题不应选 A；原题对照：向 CuSO₄ 溶液中加人足量 Zn 粉, 反应生成硫酸锌和 Cu, 溶液蓝色消 失, 发生反应为: Zn+CuSO₄=Cu+ZnSO₄ ，故 A 正确;","B":"错误。本题不应选 B；原题对照：澄清的石灰水久置后生成碳酸钲沉淀, 发生反应为: Ca(OH)₂+CO₂=CaCO₃ ↓+H₂ O, 故 B 正确;","C":"正确。本题应选 C；原题对照：过氧化钠在空气中与二氧化碳反应生成碳酸钠, 由淡黄色变为白色, 发生反应: 2 Na₂ O₂+2 CO₂=2 Na₂ CO₃+O₂, 故 C 错误;","D":"错误。本题不应选 D；原题对照：向 Mg(OH)₂ 悬浊液中滴加足量 FeCl₃ 溶液, 氢氧化锌转化成更难溶的氢氧化铁沉 淀，发生反应为: 3 Mg(OH)₂+2 FeCl₃=2 Fe(OH)₃+3 MgCl₂ ，故 D 正确; 故选：C。"},"analysis":"A. 向 CuSO₄ 溶液中加人足量 Zn 粉, 反应生成硫酸锌和 Cu, 溶液蓝色消 失, 发生反应为: Zn+CuSO₄=Cu+ZnSO₄ ，故 A 正确; B. 澄清的石灰水久置后生成碳酸钲沉淀, 发生反应为: Ca(OH)₂+CO₂=CaCO₃ ↓+H₂ O, 故 B 正确; C. 过氧化钠在空气中与二氧化碳反应生成碳酸钠, 由淡黄色变为白色, 发生反应: 2 Na₂ O₂+2 CO₂=2 Na₂ CO₃+O₂, 故 C 错误; D. 向 Mg(OH)₂ 悬浊液中滴加足量 FeCl₃ 溶液, 氢氧化锌转化成更难溶的氢氧化铁沉 淀，发生反应为: 3 Mg(OH)₂+2 FeCl₃=2 Fe(OH)₃+3 MgCl₂ ，故 D 正确; 故选：C。","steps":["先圈出题干中的限定条件、实验现象和设问方向。","逐项核对学科规律、守恒关系或结构功能关系，排除条件不符的结论。","公开答案选择 C，再回看完整解析确认判断链条。"],"tip":"真题的难点常在条件组合：先排除绝对化表述，再验证正确项能否解释全部现象。","examSource":{"title":"2019 （新课标ⅱ） 高考选择题","year":"2019","region":"全国","examType":"高考选择题","url":"https://github.com/OpenLMLab/GAOKAO-Bench","dataset":"GAOKAO-Bench","license":"Apache-2.0"}},{"id":"bench-chemistry-2019-098","subject":"chemistry","topicId":"chem-mole","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2019 · （新课标ⅲ） · 高考真题","stem":"设 Nₐ 为阿伏加德罗常数值。关于常温下 pH=2 的 H₃ PO₄ 溶液, 下列说法正确的 是 ( )","options":[{"key":"A","text":"每升溶液中的 H⁺数目为 0.02 ~Nₐ"},{"key":"B","text":"c(H⁺)=c(H₂ PO₄⁻)+2 c(HPO₄ ⁻⁻)+3 c(PO₄ ³⁻)+c(OH⁻)"},{"key":"C","text":"加水稀释使电离度增大, 溶液 pH 减小"},{"key":"D","text":"加人 NaH₂ PO₄ 固体，溶液酸性增强"}],"answer":"B","optionNotes":{"A":"错误。本题不应选 A；原题对照：常温下 pH=2 的 H₃ PO₄ 溶液中 c(H⁺)=0.01 ~mol / L, 1 ~L 该溶液中含有 的 n(H⁺)=0.01 ~mol / L × 1 ~L=0.01 ~mol, 含有 H⁺数目为 0.01 ~Nₐ, 故 A 错误;","B":"正确。本题应选 B；原题对照：根据 H₃ PO₄ 溶液中的电荷守恒可知: c(H⁺)=c(H₂ PO₄ ⁻)+2 c(HPO₄ ²⁻)+3 c(PO₄ ³. )+c(OH⁻)，故 B 正确;","C":"错误。本题不应选 C；原题对照：加水稀释 H₃ PO₄ 的浓度减小, 其电离度增大, 但溶液中氢离子浓度减小, 溶液 pH 增 大，故 C 错误；","D":"错误。本题不应选 D；原题对照：加人 NaH₂ PO₄ 固体后, 抑制了 H₃ PO₄ 的电离, 溶液中氢离子浓度减小, 溶液酸性减 弱，故 D 错误; 故选：B。"},"analysis":"A. 常温下 pH=2 的 H₃ PO₄ 溶液中 c(H⁺)=0.01 ~mol / L, 1 ~L 该溶液中含有 的 n(H⁺)=0.01 ~mol / L × 1 ~L=0.01 ~mol, 含有 H⁺数目为 0.01 ~Nₐ, 故 A 错误; B. 根据 H₃ PO₄ 溶液中的电荷守恒可知: c(H⁺)=c(H₂ PO₄ ⁻)+2 c(HPO₄ ²⁻)+3 c(PO₄ ³. )+c(OH⁻)，故 B 正确; C. 加水稀释 H₃ PO₄ 的浓度减小, 其电离度增大, 但溶液中氢离子浓度减小, 溶液 pH 增 大，故 C 错误； D. 加人 NaH₂ PO₄ 固体后, 抑制了 H₃ PO₄ 的电离, 溶液中氢离子浓度减小, 溶液酸性减 弱，故 D 错误; 故选：B。","steps":["先圈出题干中的限定条件、实验现象和设问方向。","逐项核对学科规律、守恒关系或结构功能关系，排除条件不符的结论。","公开答案选择 B，再回看完整解析确认判断链条。"],"tip":"真题的难点常在条件组合：先排除绝对化表述，再验证正确项能否解释全部现象。","examSource":{"title":"2019 （新课标ⅲ） 高考选择题","year":"2019","region":"全国","examType":"高考选择题","url":"https://github.com/OpenLMLab/GAOKAO-Bench","dataset":"GAOKAO-Bench","license":"Apache-2.0"}},{"id":"bench-chemistry-2020-103","subject":"chemistry","topicId":"chem-atom","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2020 · （新课标ⅰ） · 高考真题","stem":"1934 年约里奥 - 居里夫妇在核反应中用a粒子 ( 即氦核 ₂⁴ He ) 轰击金属原子 ZW X, 得到核素 _Z+2³⁰ Y, 开创了人造放射性核素的先河: _Z X+ ₂⁴ He arrow Z+230 Y+ ₀¹ n 其中元素 X 、 Y 的 最外层电子数之和为 8 . 下列叙述正确的是 ( )","options":[{"key":"A","text":"_Z^Z X 的相对原子质量为 26"},{"key":"B","text":"X 、 Y 均可形成三氯化物"},{"key":"C","text":"X 的原子半径小于 Y 的"},{"key":"D","text":"Y 仅有一种含氧酸"}],"answer":"B","optionNotes":{"A":"错误。本题不应选 A；原题对照：W 为 27, X 原子的相对原子质量为 27 , 故 A 错误;","B":"正确。本题应选 B；原题对照：X 、 Y 可形成三氯化物分别为 AlCl₃ 、 PCl₃ ，故 B 正确;","C":"错误。本题不应选 C；原题对照：同周期从左向右原子半径减小，则 X 的原子半径大于 Y 的半径, 故 C 错误;","D":"错误。本题不应选 D；原题对照：Y 的含氧酸有磷酸、偏磷酸等，故 D 错误； 故选：B。"},"analysis":"由上述分析可知 X 为 Al 、 Y 为 P, A. W 为 27, X 原子的相对原子质量为 27 , 故 A 错误; B. X 、 Y 可形成三氯化物分别为 AlCl₃ 、 PCl₃ ，故 B 正确; C. 同周期从左向右原子半径减小，则 X 的原子半径大于 Y 的半径, 故 C 错误; D. Y 的含氧酸有磷酸、偏磷酸等，故 D 错误； 故选：B。","steps":["先圈出题干中的限定条件、实验现象和设问方向。","逐项核对学科规律、守恒关系或结构功能关系，排除条件不符的结论。","公开答案选择 B，再回看完整解析确认
