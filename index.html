,"错误。改正：Na₂O₂与酸反应还会放出O₂，且其阴离子不是O²⁻，属于过氧化物。","错误。改正：BaSO₄虽难溶，但溶解的少量部分可电离，熔融时也能导电，属于强电解质。","正确。Al₂O₃与酸、强碱都能反应生成盐和水，是典型的两性氧化物。"],analysis:"分类必须满足定义的充分条件。氧化物要看产物和阴离子类型；电解质看水溶液或熔融状态能否导电，不能只看溶解度。",steps:["逐项写出可能发生的反应及产物。","检查Na₂O₂和BaSO₄是否满足定义的全部条件。","用两性氧化物的标准核对Al₂O₃。"],tip:"“难溶”与“非电解质”不是同义词。"}),Ot({id:"premium-chem-c1-03",subject:"chemistry",topicId:"chem-classification",difficulty:5,examStyle:"物质转化推断 · 条件控制",stem:"甲、乙、丙为常见含钠或含碳物质。甲受热分解生成乙、CO₂和H₂O；乙溶液与过量CO₂反应生成丙；丙受热又生成乙。下列说法正确的是",options:["甲的焰色反应呈紫色","乙、丙都能与盐酸反应生成CO₂","丙只能与酸反应，不能与碱反应","乙与少量CO₂反应的产物不是丙"],answer:1,notes:["错误。改正：甲应为NaHCO₃，含钠元素的焰色反应呈黄色，不是紫色。","正确。乙为Na₂CO₃、丙为NaHCO₃，二者均能与盐酸反应生成CO₂。","错误。改正：NaHCO₃还能与NaOH反应生成Na₂CO₃和H₂O。","错误。改正：Na₂CO₃与少量CO₂反应会生成NaHCO₃；这里“乙与少量CO₂”仍可得到丙，故该说法错误。"],analysis:"由“受热生成CO₂和H₂O”锁定NaHCO₃；NaHCO₃分解产生Na₂CO₃。Na₂CO₃溶液吸收过量CO₂生成NaHCO₃，而NaHCO₃受热又分解，形成闭环。",steps:["先由受热产物识别NaHCO₃。","确定乙为Na₂CO₃、丙为NaHCO₃。","核对Na₂CO₃和NaHCO₃与酸、碱的反应。"],tip:"转化推断必须逐条回代，不能只确认首尾两步。"}),Ot({id:"premium-chem-c2-01",subject:"chemistry",topicId:"chem-ion",difficulty:4,examStyle:"离子共存 · 隐蔽氧化还原",stem:"常温下，下列各组离子在指定溶液中能大量共存的是",options:["无色透明溶液：MnO₄⁻、K⁺、Cl⁻、SO₄²⁻","c(H⁺)=0.1 mol·L⁻¹：Fe²⁺、NO₃⁻、Na⁺、SO₄²⁻","含大量Ba²⁺的溶液：Na⁺、Cl⁻、SO₄²⁻、NO₃⁻","c(OH⁻)=0.1 mol·L⁻¹：Na⁺、K⁺、Cl⁻、NO₃⁻"],answer:3,notes:["错误。改正：MnO₄⁻呈紫红色，不符合“无色”；酸性条件下还可能氧化Cl⁻。","错误。改正：酸性条件下NO₃⁻具有氧化性，会把Fe²⁺氧化为Fe³⁺。","错误。改正：Ba²⁺与SO₄²⁻生成难溶的BaSO₄，不能大量共存。","正确。四种离子均无色，彼此不生成沉淀、气体或弱电解质，且都能在碱性溶液中稳定存在。"],analysis:"离子共存题先按题干限定条件筛选。酸性硝酸根与Fe²⁺、Ba²⁺与SO₄²⁻是高频组合，不能只检查离子颜色。",steps:["圈出无色、酸性或碱性等限制。","检查沉淀、气体、弱电解质。","最后检查氧化还原共存。"],tip:"看见NO₃⁻和H⁺同时出现，就要想到氧化性。"}),Ot({id:"premium-chem-c2-02",subject:"chemistry",topicId:"chem-ion",difficulty:4,examStyle:"定量离子方程式 · 顺序与配比",stem:"向Ba(OH)₂溶液中逐滴加入NaHSO₄溶液，当沉淀的物质的量达到最大值时，溶液中大量存在的离子是",options:["Ba²⁺、Na⁺、OH⁻","Na⁺、OH⁻、SO₄²⁻","Ba²⁺、Na⁺、SO₄²⁻","Na⁺、SO₄²⁻、H⁺"],answer:1,notes:["错误。改正：沉淀最大时Ba²⁺与加入的SO₄²⁻恰好完全反应，Ba²⁺不能大量存在。","正确。此时1 mol Ba²⁺对应加入1 mol SO₄²⁻和1 mol H⁺，原溶液中的2 mol OH⁻只剩1 mol；Na⁺不参与反应。","错误。改正：SO₄²⁻已与Ba²⁺生成BaSO₄沉淀，不能与Ba²⁺同时大量存在。","错误。改正：Ba(OH)₂中的OH⁻过量，加入的H⁺会被中和，不能大量共存。"],analysis:"沉淀最大时，每1 mol Ba²⁺需加入1 mol SO₄²⁻；同浓度NaHSO₄同时提供等量Na⁺和H⁺。原溶液有2 mol OH⁻，只被中和1 mol，因此剩余Na⁺和OH⁻。",steps:["设Ba(OH)₂为1 mol，则Ba²⁺为1 mol、OH⁻为2 mol。","加入1 mol NaHSO₄时SO₄²⁻恰好完全沉淀。","同时引入1 mol Na⁺和1 mol H⁺，H⁺中和1 mol OH⁻。"],tip:"“沉淀最大”与“溶液中性”不是同一个时刻。"}),Ot({id:"premium-chem-c2-03",subject:"chemistry",topicId:"chem-ion",difficulty:5,examStyle:"离子定量推断 · 电荷守恒",stem:"某100 mL无色溶液可能含Na⁺、Mg²⁺、Cl⁻、NO₃⁻、SO₄²⁻。测得c(Na⁺)=0.30 mol·L⁻¹；加入足量BaCl₂得到2.33 g沉淀；另取同体积溶液加入足量NaOH得到0.58 g沉淀。下列判断正确的是",options:["原溶液中c(Mg²⁺)=0.20 mol·L⁻¹","原溶液中n(SO₄²⁻)=0.020 mol","Cl⁻一定存在，NO₃⁻一定不存在","Cl⁻与NO₃⁻的总物质的量为0.030 mol"],answer:3,notes:["错误。改正：0.58 g Mg(OH)₂为0.010 mol，所以c(Mg²⁺)=0.010÷0.100=0.10 mol·L⁻¹。","错误。改正：2.33 g BaSO₄只有0.010 mol，因此原溶液中SO₄²⁻为0.010 mol，不是0.020 mol。","错误。改正：Cl⁻和NO₃⁻的总量可确定，但二者各自含量无法由现有数据区分，不能作“一定”判断。","正确。阳离子电荷总量为0.030+0.010×2=0.050 mol，SO₄²⁻负电荷为0.020 mol，剩余0.030 mol需由Cl⁻、NO₃⁻共同平衡。"],analysis:"先把沉淀质量换算成物质的量，再比较阳、阴离子总电荷。100 mL中Na⁺为0.030 mol、Mg²⁺为0.010 mol、SO₄²⁻为0.010 mol。阳离子所带正电荷0.050 mol，SO₄²⁻所带负电荷0.020 mol，因此一价阴离子Cl⁻与NO₃⁻总量为0.030 mol。",steps:["n(Na⁺)=cV=0.030 mol。","n(Mg²⁺)=n[Mg(OH)₂]=0.010 mol。","n(SO₄²⁻)=n(BaSO₄)=0.010 mol。","按电荷守恒求n(Cl⁻)+n(NO₃⁻)。"],tip:"离子推断只对数据能唯一确定的结论负责。"}),Ot({id:"premium-chem-c3-01",subject:"chemistry",topicId:"chem-redox",difficulty:4,examStyle:"歧化反应 · 电子转移",stem:"反应3Cl₂+6KOH(热、浓)→5KCl+KClO₃+3H₂O中，每生成1 mol KClO₃，转移电子的物质的量为",options:["1 mol","3 mol","5 mol","6 mol"],answer:2,notes:["错误。改正：KClO₃中Cl由0价升到+5价，生成1 mol KClO₃至少失去5 mol电子。","错误。改正：3 mol氯气中含有6 mol Cl原子，其中1 mol变为+5价、5 mol变为-1价，不能只看KClO₃系数。","正确。1 mol Cl由0价升到+5价失去5 mol电子；同时5 mol Cl由0价降到-1价得到5 mol电子，转移电子为5 mol。","错误。改正：6 mol是参与反应的Cl原子总数；被氧化的只有生成KClO₃的那1 mol Cl。"],analysis:"这是Cl₂在热、浓碱中的歧化反应。电子转移量只取单方向：生成1 mol KClO₃时，Cl失去5 mol电子；另5 mol Cl共得到5 mol电子。",steps:["标出所有Cl原子的价态变化。","找出被氧化的Cl为+5价产物。","按1 mol产物计算单方向转移电子数。"],tip:"不要把参加反应的原子总数当成电子转移数。",diagram:"redox"}),Ot({id:"premium-chem-c3-02",subject:"chemistry",topicId:"chem-redox",difficulty:4,examStyle:"氧化还原 · 双元素变价",stem:"在NH₄NO₃受热分解反应中，部分氮元素被氧化、部分氮元素被还原。下列说法正确的是",options:["NH₄⁺中的N只可能被还原","NO₃⁻中的N只可能被氧化","产物中N₂既是氧化产物又是还原产物","该反应中得失电子总数可以不相等"],answer:2,notes:["错误。改正：NH₄⁺中N为-3价，最高可升到0价，因此可能被氧化。","错误。改正：NO₃⁻中N为+5价，最低可降到0价，因此可能被还原。","正确。某些分解反应可同时生成N₂和含氮氧化物，N₂可由-3价和+5价氮共同形成，既含氧化产物也含还原产物。","错误。改正：任何氧化还原反应中，失电子总数与得电子总数必须相等。"],analysis:"NH₄NO₃同时含-3价N和+5价N，具有发生分子内氧化还原的条件。若两者都变为0价N₂，则-3价N被氧化、+5价N被还原，N₂同时具有氧化产物和还原产物身份。",steps:["分别标出NH₄⁺与NO₃⁻中N的化合价。","判断最高价和最低价对应的变化方向。","用产物N₂的来源解释其双重身份。"],tip:"同一物质中的不同元素或不同价态可能分别发生氧化和还原。",diagram:"redox"}),Ot({id:"premium-chem-c3-03",subject:"chemistry",topicId:"chem-redox",difficulty:5,examStyle:"氧化性排序 · 证据链",stem:"已知：①2Fe³⁺+Cu→2Fe²⁺+Cu²⁺；②Cu²⁺+Fe→Fe²⁺+Cu；③2I⁻+2Fe³⁺→I₂+2Fe²⁺。下列由这些反应能够直接推出的是",options:["氧化性：Fe³⁺>Cu²⁺>Fe²⁺，且Fe³⁺>I₂","氧化性：Cu²⁺>Fe³⁺>I₂","氧化性：I₂>Fe³⁺>Cu²⁺","还原性：Cu>Fe>I⁻"],answer:0,notes:["正确。由①得Fe³⁺>Cu²⁺，由②得Cu²⁺>Fe²⁺，由③得Fe³⁺>I₂；这些都是三条反应直接支持的关系。","错误。改正：①说明Fe³⁺能氧化Cu，因此氧化性Fe³⁺>Cu²⁺，不是Cu²⁺>Fe³⁺。","错误。改正：③说明Fe³⁺能氧化I⁻，因此Fe³⁺>I₂，方向写反。","错误。改正：②只能推出Fe的还原性大于Cu；不能把I⁻与金属还原剂的完整强弱顺序由题干三条反应直接推出。"],analysis:"氧化还原反应中，氧化剂把还原剂氧化。①给出Fe³⁺>Cu²⁺，②给出Cu²⁺>Fe²⁺，③给出Fe³⁺>I₂。题干只能直接确定这些关系，不能凭空补出Fe²⁺与I₂的强弱。",steps:["在每条反应中标出氧化剂和对应还原产物。","用“强氧化剂生成弱氧化剂”建立不等关系。","只选择题干证据能够直接支持的排序。"],tip:"比较氧化性时要区分“可推出”与“按记忆补全”。"}),Ot({id:"premium-chem-c4-01",subject:"chemistry",topicId:"chem-sodium",difficulty:3,examStyle:"过氧化钠 · 气体体积",stem:"标准状况下，7.8 g Na₂O₂与足量水完全反应，生成O₂的体积约为",options:["1.12 L","2.24 L","4.48 L","7.80 L"],answer:0,notes:["正确。n(Na₂O₂)=7.8÷78=0.10 mol，由2Na₂O₂→O₂可知n(O₂)=0.05 mol，V=0.05×22.4=1.12 L。","错误。改正：2.24 L对应0.10 mol O₂，错误地把Na₂O₂与O₂按1:1转换。","错误。改正：4.48 L对应0.20 mol O₂，超过由0.10 mol Na₂O₂能够生成的上限。","错误。改正：7.80 L没有按标准状况气体摩尔体积和方程式系数换算。"],analysis:"先由质量求物质的量，再按反应2Na₂O₂+2H₂O→4NaOH+O₂↑的系数比求氧气，最后在标准状况下换算体积。",steps:["M(Na₂O₂)=78 g·mol⁻¹，n=7.8/78=0.10 mol。","n(O₂)=0.10/2=0.05 mol。","V=0.05×22.4=1.12 L。"],tip:"Na₂O₂与O₂的系数比是2:1。",diagram:"gas"}),Ot({id:"premium-chem-c4-02",subject:"chemistry",topicId:"chem-sodium",difficulty:4,examStyle:"碳酸盐 · 图像型定量",stem:"向100 mL Na₂CO₃和NaHCO₃的混合溶液中逐滴加入1.00 mol·L⁻¹盐酸，依次发生两步反应。若第一、第二阶段消耗盐酸的体积比为1:2，则原溶液中n(Na₂CO₃):n(NaHCO₃)为",options:["1:1","1:2","2:1","3:1"],answer:0,notes:["正确。第一阶段消耗的H⁺等于n(Na₂CO₃)；第二阶段消耗的H⁺等于n(Na₂CO₃)+n(NaHCO₃)。两阶段之比为1:2，可推出两者物质的量相等。","错误。改正：若为1:2，设Na₂CO₃为a、NaHCO₃为b，则第二阶段耗酸a+b=2a，得b=a，不能是1:2。","错误。改正：2:1会使第二阶段耗酸a+b=0.5a，不符合第二阶段反而更多的题设。","错误。改正：3:1会使第二阶段耗酸只有第一阶段的1/3，与题设顺序相反。"],analysis:"设原Na₂CO₃为a mol、NaHCO₃为b mol。第一阶段只消耗a mol H⁺；第二阶段先消耗a mol把新生成的HCO₃⁻反应完，再消耗b mol与原NaHCO₃反应，故第二阶段为a+b mol。由(a+b):a=2:1得b=a，因此原比例为1:1。",steps:["写出两阶段离子方程式。","第一阶段耗酸a mol，第二阶段耗酸a+b mol。","按1:2联立，得到a=b。"],tip:"第二阶段还要消耗第一步新生成的HCO₃⁻。"}),Ot({id:"premium-chem-c4-03",subject:"chemistry",topicId:"chem-sodium",difficulty:5,examStyle:"过氧化钠 · 平均组成",stem:"标准状况下，2.24 L CO₂和H₂O(g)的混合气体通过足量Na₂O₂，固体质量增加1.5 g。原混合气体中CO₂的体积分数为",options:["25%","50%","75%","无法确定"],answer:1,notes:["错误。改正：25%时总物质的量为0.10 mol，CO₂为0.025 mol，按净增重28x+2(0.10-x)计算，增重约2.70 g。","正确。总物质的量0.10 mol。设CO₂为x mol，则28x+2(0.10-x)=1.5，得x=0.05 mol，体积分数50%。","错误。改正：75%时CO₂为0.075 mol，计算出的固体增重不是1.5 g。","错误。改正：总物质的量、总增重均已给出，可建立一元一次方程，因此能唯一确定组成。"],analysis:"CO₂与Na₂O₂反应，每1 mol CO₂使固体净增重28 g；H₂O(g)反应每1 mol净增重2 g。总气体为0.10 mol，利用总增重列方程即可求CO₂。",steps:["n(总)=2.24/22.4=0.10 mol。","28x+2(0.10-x)=1.5。","解得x=0.05 mol，体积分数为50%。"],tip:"净增重要按反应前后固体质量差计算，不能直接使用气体总质量。",diagram:"gas"}),Ot({id:"premium-chem-c5-01",subject:"chemistry",topicId:"chem-chlorine",difficulty:3,examStyle:"氯水微粒 · 现象对应",stem:"新制氯水中存在多种微粒。下列实验现象与微粒对应正确的是",options:["滴加紫色石蕊溶液先变红后褪色，只说明含HClO","加入AgNO₃产生白色沉淀，说明含Cl⁻","加入NaHCO₃产生气体，说明含Cl₂","干燥有色布条放入干燥氯气中褪色，说明Cl₂有漂白性"],answer:1,notes:["错误。改正：先变红主要说明含H⁺，后褪色主要说明含HClO，不能只归因于一种微粒。","正确。Cl⁻与Ag⁺生成白色AgCl沉淀。","错误。改正：HCO₃⁻与H⁺反应放出CO₂，气体现象主要对应H⁺。","错误。改正：干燥氯气不能提供HClO，不能使干燥有色布条褪色。"],analysis:"新制氯水中包含Cl₂、H₂O、HClO、H⁺、Cl⁻和ClO⁻等。解释现象时必须找真正起作用的微粒，尤其不能把漂白性直接归于Cl₂。",steps:["先列出氯水中的主要微粒。","把颜色、沉淀和气体现象分别对应到H⁺、Cl⁻、HClO。","用“干燥氯气”条件检验漂白性结论。"],tip:"氯气与氯水不是同一概念，漂白微粒是HClO。"}),Ot({id:"premium-chem-c5-02",subject:"chemistry",topicId:"chem-chlorine",difficulty:4,examStyle:"氯碱反应 · 温度条件",stem:"下列有关氯气与碱溶液反应的说法正确的是",options:["Cl₂与冷、稀NaOH溶液生成NaClO₃","Cl₂与热、浓NaOH溶液只生成NaCl","两种条件下Cl₂都只作氧化剂","温度不同可导致Cl₂歧化的产物不同"],answer:3,notes:["错误。改正：冷、稀碱中主要生成NaClO，NaClO₃主要出现在热、浓碱条件。","错误。改正：热、浓碱中生成NaCl、NaClO₃和水，不是只生成NaCl。","错误。改正：Cl₂中Cl由0价同时升到+1或+5价、降到-1价，既被氧化又被还原。","正确。Cl₂+2OH⁻→Cl⁻+ClO⁻+H₂O在冷、稀条件下更明显；加热、浓碱时可生成ClO₃⁻，产物随条件改变。"],analysis:"氯气与碱反应本质是Cl的歧化。产物既受碱的浓度影响，也受温度影响：冷稀条件偏ClO⁻，热浓条件可进一步变为ClO₃⁻。",steps:["写出冷、稀条件下的主要方程式。","比较热、浓条件下的高价产物。","用Cl的价态变化判断氧化剂、还原剂身份。"],tip:"同一反应物在不同温度、浓度下可能得到不同产物。",diagram:"redox"}),Ot({id:"premium-chem-c5-03",subject:"chemistry",topicId:"chem-chlorine",difficulty:5,examStyle:"漂白液 · 氧化还原定量",stem:"向漂白液中加入足量KI并酸化，ClO⁻被还原为Cl⁻，I⁻被氧化为I₂。若反应中生成0.10 mol I₂，则被还原的ClO⁻为",options:["0.05 mol","0.10 mol","0.20 mol","0.40 mol"],answer:1,notes:["错误。改正：ClO⁻中Cl为+1价，降为-1价得到2个电子，不能按1个电子计算。","正确。生成0.10 mol I₂时I⁻共失去0.20 mol电子；每个ClO⁻得到2 mol电子，因此n(ClO⁻)=0.20/2=0.10 mol。","错误。改正：0.20 mol是没有除以2的结果，错把电子物质的量直接当成ClO⁻物质的量。","错误。改正：0.40 mol会使得电子总数达到0.80 mol，明显超过I⁻实际失去的0.20 mol。"],analysis:"I⁻→I₂中每个I由-1变为0，生成1 mol I₂失去2 mol电子；ClO⁻→Cl⁻中每个Cl由+1降为-1，得到2 mol电子。生成0.10 mol I₂时，失电子0.20 mol，因此ClO⁻应为0.10 mol。",steps:["2I⁻→I₂+2e⁻。","ClO⁻+2e⁻+2H⁺→Cl⁻+H₂O。","n(I₂)=0.10 mol对应n(e⁻)=0.20 mol，n(ClO⁻)=0.10 mol。"],tip:"先写半反应，再用电子守恒换算。",diagram:"redox"}),Ot({id:"premium-chem-c6-01",subject:"chemistry",topicId:"chem-mole",difficulty:3,examStyle:"阿伏加德罗常数 · 离子数",stem:"设Nₐ为阿伏加德罗常数的值。1 mol Na₂O₂中所含离子的总物质的量为",options:["1 mol","2 mol","3 mol","4 mol"],answer:2,notes:["错误。改正：Na₂O₂由2 mol Na⁺和1 mol O₂²⁻组成，不能只数一种离子。","错误。改正：2 mol只数了Na⁺，遗漏了过氧根离子。","正确。1 mol Na₂O₂含2 mol Na⁺和1 mol O₂²⁻，总离子数为3 mol。","错误。改正：Na₂O₂中不存在2个独立的O²⁻，氧元素以O₂²⁻整体存在。"],analysis:"Na₂O₂是离子化合物，但阴离子不是O²⁻，而是过氧根离子O₂²⁻。因此1个化学式单位对应3个离子。",steps:["写出Na₂O₂的离子组成。","确认过氧根是一个整体阴离子。","按2 mol Na⁺+1 mol O₂²⁻求和。"],tip:"不要把Na₂O₂看成Na₂O加一个O原子。"}),Ot({id:"premium-chem-c6-02",subject:"chemistry",topicId:"chem-mole",difficulty:4,examStyle:"等质量气体 · 微粒数",stem:"相同质量的O₂和O₃中，下列物理量一定相等的是",options:["分子数","氧原子数","物质的量","标准状况下体积"],answer:1,notes:["错误。改正：等质量时分子数之比与摩尔质量成反比，O₂分子数多于O₃。","正确。两种物质均只由氧原子组成，质量相同即氧原子的总质量相同，因此氧原子数相等。","错误。改正：n=m/M，质量相同而摩尔质量不同，物质的量不同。","错误。改正：气体体积取决于物质的量，O₂与O₃分子数不同，体积也不同。"],analysis:"O₂与O₃都由氧元素组成。等质量意味着氧原子总质量相同，故氧原子数必相等；分子数、物质的量和体积还取决于单个分子的质量。",steps:["把O₂、O₃都拆成氧原子来比较。","等质量→等原子总质量→等原子数。","排除取决于摩尔质量的物理量。"],tip:"同素异形体等质量问题，先从共同组成元素入手。"}),Ot({id:"premium-chem-c6-03",subject:"chemistry",topicId:"chem-mole",difficulty:5,examStyle:"溶液组成 · 符号陷阱",stem:"0.1 mol·L⁻¹ Na₂SO₄溶液100 mL中，下列说法正确的是",options:["含Na⁺的数目约为1.204×10²²","含SO₄²⁻的物质的量为0.02 mol","含Na₂SO₄的物质的量为0.1 mol","稀释至1 L后，c(Na⁺)=0.1 mol·L⁻¹"],answer:0,notes:["正确。n(Na₂SO₄)=0.1×0.100=0.010 mol，n(Na⁺)=0.020 mol，离子数约为1.204×10²²。","错误。改正：SO₄²⁻与Na₂SO₄的物质的量之比为1:1，应为0.010 mol。","错误。改正：n=cV=0.1×0.100=0.010 mol，不是0.1 mol。","错误。改正：稀释10倍后c(Na₂SO₄)=0.010 mol·L⁻¹，因此c(Na⁺)=0.020 mol·L⁻¹。"],analysis:"溶液计算分三步：n(溶质)=cV，再按化学式求离子数，最后按稀释前后溶质物质的量守恒求新浓度。100 mL是0.100 L，不能把0.1 mol·L⁻¹直接当作物质的量。",steps:["n(Na₂SO₄)=0.1×0.1=0.01 mol。","n(Na⁺)=2×0.01=0.02 mol。","稀释后体积变10倍，浓度变为原来的1/10。"],tip:"浓度乘体积时先统一为升。"}),Ot({id:"premium-chem-c7-01",subject:"chemistry",topicId:"chem-gas",difficulty:3,examStyle:"气体摩尔体积 · 条件陷阱",stem:"下列物质中，在标准状况下体积约为22.4 L的是",options:["1 mol H₂O","1 mol NaCl","1 mol CO₂","1 mol Fe"],answer:2,notes:["错误。改正：标准状况下水不是气体，不能用22.4 L·mol⁻¹。","错误。改正：NaCl是固体，体积由其密度决定，不能用气体摩尔体积。","正确。标准状况下CO₂为气体，1 mol体积约为22.4 L。","错误。改正：铁是固体，不能用22.4 L·mol⁻¹换算。"],analysis:"22.4 L·mol⁻¹只适用于标准状况下的气体。判断时必须同时满足温度和压强、物质状态两个条件。",steps:["确认条件是否标准状况。","确认研究对象在标准状况下是否为气体。","只有CO₂满足两条件。"],tip:"不要求“理想气体”，但必须是实际状态下的气体。",diagram:"gas"}),Ot({id:"premium-chem-c7-02",subject:"chemistry",topicId:"chem-gas",difficulty:4,examStyle:"阿伏加德罗定律 · 密度比较",stem:"同温同压下，体积相同的N₂和O₃具有相同的",options:["质量","密度","分子数","原子数"],answer:2,notes:["错误。改正：同体积同条件下物质的量相同，但N₂与O₃摩尔质量不同，质量不同。","错误。改正：密度=m/V，二者质量不同而体积相同，因此密度不同。","正确。同温同压、同体积的气体含有相同物质的量，因此分子数相同。","错误。改正：N₂和O₃分子数相同，但每个分子所含原子数不同，因此原子总数不同。"],analysis:"同温同压下同体积气体分子数相同，这是阿伏加德罗定律的直接结论。质量、密度和原子总数还取决于摩尔质量及单个分子的组成。",steps:["由阿伏加德罗定律得n(N₂)=n(O₃)。","分子数与物质的量成正比，所以分子数相同。","N₂为双原子分子、O₃为三原子分子，因此原子总数不同。"],tip:"相同分子数不一定有相同原子数。",diagram:"gas"}),Ot({id:"premium-chem-c7-03",subject:"chemistry",topicId:"chem-gas",difficulty:5,examStyle:"混合气体 · 平均摩尔质量",stem:"标准状况下，5.6 L CO和CO₂的混合气体质量为9.0 g。混合气体中CO与CO₂的物质的量之比为",options:["1:1","1:2","2:1","3:2"],answer:0,notes:["正确。总物质的量=5.6/22.4=0.25 mol；设CO为x mol，则28x+44(0.25-x)=9.0，解得x=0.125 mol，两者各0.125 mol，比为1:1。","错误。改正：1:2时总质量约为9.67 g，不符合9.0 g。","错误。改正：2:1时总质量约为8.33 g，不符合9.0 g。","错误。改正：3:2时总质量约为8.4 g，不符合9.0 g。"],analysis:"混合气体题通常需要两个方程：总物质的量由标准状况体积求出，总质量由题给条件列出。设CO为x，则CO₂为0.25-x，代入质量和求x。",steps:["n(总)=5.6/22.4=0.25 mol。","28x+44(0.25-x)=9.0。","解得x=0.125 mol，n(CO₂)=0.125 mol。"],tip:"CO与CO₂摩尔质量分别为28和44 g·mol⁻¹。",diagram:"gas"}),Ot({id:"premium-bio-b1-01",subject:"biology",topicId:"bio-cell-intro",difficulty:3,examStyle:"显微镜 · 放大与视野",stem:"使用显微镜观察细胞时，由低倍镜换成高倍镜后，下列变化正确的是",options:["视野范围变大","观察到的细胞数目变多","视野亮度通常变暗","应先用粗准焦螺旋大幅调焦"],answer:2,notes:["错误。改正：放大倍数越大，视野范围越小。","错误。改正：放大倍数增大后，同一视野内看到的细胞数目通常会减少。","正确。高倍镜进光量相对减少，视野通常变暗，可适当调大光圈或使用凹面镜。","错误。改正：高倍镜工作距离小，应使用细准焦螺旋，避免压坏装片或镜头。"],analysis:"显微镜总放大倍数约为目镜倍数×物镜倍数。放大倍数增大，物像变大但视野变小、细胞数目减少、亮度降低。高倍镜调焦必须细调。",steps:["先判断放大倍数是否增大。","由放大倍数与视野范围的反向关系排除A、B。","结合高倍镜使用规范判断C、D。"],tip:"高倍镜不是“看得更多”，而是“看得更大”。"}),Ot({id:"premium-bio-b1-02",subject:"biology",topicId:"bio-cell-intro",difficulty:4,examStyle:"原核与真核 · 共同结构",stem:"下列关于原核细胞与真核细胞的比较，正确的是",options:["原核细胞没有核糖体","真核细胞都有叶绿体","原核细胞与真核细胞都有细胞膜和核糖体","原核细胞的遗传物质不是DNA"],answer:2,notes:["错误。改正：原核细胞虽然没有核膜包被的细胞核，但具有核糖体。","错误。改正：动物细胞等真核细胞通常没有叶绿体，叶绿体不是真核细胞的共有结构。","正确。细胞膜控制物质进出，核糖体合成蛋白质，是原核、真核细胞的共同结构。","错误。改正：原核细胞的遗传物质也是DNA，只是主要分布在拟核中。"],analysis:"比较原核与真核细胞要先看共有结构，再看差异。二者都有细胞膜、细胞质、核糖体和DNA；核心差异是真核细胞有核膜包被的细胞核。",steps:["先排除把“没有核膜”扩大成“没有细胞核糖体”的说法。","确认细胞膜与核糖体的普遍性。","再比较遗传物质和膜性细胞器。"],tip:"原核与真核的共同点常比差异更容易被忽略。"}),Ot({id:"premium-bio-b1-03",subject:"biology",topicId:"bio-cell-intro",difficulty:5,examStyle:"病毒与生命活动 · 概念边界",stem:"下列关于病毒和细胞生命活动的叙述，正确的是",options:["病毒含核酸和蛋白质，因此属于原核生物","病毒可在营养丰富的培养基中独立增殖","病毒必须依赖宿主活细胞的代谢系统完成增殖","所有生命活动都可以脱离细胞完成"],answer:2,notes:["错误。改正：病毒没有细胞结构，不是原核生物；有无核酸和蛋白质不能决定其属于原核生物。","错误。改正：病毒缺少独立的代谢和蛋白质合成系统，普通培养基不能使其增殖，必须进入宿主活细胞。","正确。病毒只能利用宿主细胞的原料、能量和酶系统复制核酸并合成蛋白质。","错误。改正：细胞是生命活动的基本单位，病毒也不能脱离活细胞独立完成增殖。"],analysis:"病毒由核酸和蛋白质等组成，但没有细胞结构，也没有完整代谢系统。它只能在宿主活细胞内复制，因此不能归入原核或真核细胞生物。",steps:["先确认病毒无细胞结构。","判断它是否具备独立代谢能力。","用宿主依赖性解释其增殖方式。"],tip:"有遗传物质不等于有细胞结构。"}),Ot({id:"premium-bio-b2-01",subject:"biology",topicId:"bio-elements",difficulty:3,examStyle:"蛋白质 · 脱水缩合",stem:"由100个氨基酸形成一条含2个二硫键的多肽链，若不考虑其他化学键，该多肽链中的肽键数为",options:["98个","99个","100个","102个"],answer:1,notes:["错误。改正：98个是将二硫键误当作肽键扣除了，二硫键不改变肽键数。","正确。一条肽链中肽键数=氨基酸数-1=100-1=99。","错误。改正：100个氨基酸形成一条肽链，不是形成环状多肽，不能等于氨基酸数。","错误。改正：102个没有依据；形成肽键时每个缩合位点形成一个肽键。"],analysis:"脱水缩合时，100个氨基酸首尾相连形成一条链，共形成99个肽键并脱去99个水分子。二硫键是肽链内或链间的额外连接，不计入肽键。",steps:["确认发生的是线性肽链，不是环肽。","肽键数=n(氨基酸)-1。","二硫键只影响空间结构，不改变肽键数。"],tip:"二硫键会把答案“额外减2”吗？不会。"}),Ot({id:"premium-bio-b2-02",subject:"biology",topicId:"bio-elements",difficulty:4,examStyle:"细胞中的水 · 抗逆性",stem:"某植物在干旱条件下，细胞内自由水与结合水的比值下降。下列解释最合理的是",options:["细胞代谢强度一定增强","细胞的抗逆性可能增强","细胞内已经没有自由水","结合水不再参与细胞结构组成"],answer:1,notes:["错误。改正：自由水比例下降通常使代谢强度降低，不能推出代谢一定增强。","正确。结合水比例相对增加有助于维持细胞结构稳定，提高对干旱等不良环境的耐受性。","错误。改正：比值下降只说明相对比例变化，不代表自由水完全消失。","错误。改正：结合水是细胞结构的重要组成部分，始终参与结构组成。"],analysis:"自由水多时细胞代谢通常旺盛；结合水比例较高时，细胞结构更稳定、抗逆性更强。题干只给出比值下降，不能把相对比例等同于绝对含量。",steps:["区分自由水与结合水的功能。","由比值变化判断相对趋势，而非绝对为零。","用“可能”而非“一定”表述生物学结论。"],tip:"生物题干中的“比值下降”不等于某种物质消失。"}),Ot({id:"premium-bio-b2-03",subject:"biology",topicId:"bio-elements",difficulty:5,examStyle:"有机物检测 · 试剂条件",stem:"下列生物组织中有机物检测方案与预期结果匹配的是",options:["苹果汁+斐林试剂，常温静置，出现砖红色沉淀","豆浆+双缩脲试剂，水浴加热，出现紫色","花生子叶切片+苏丹Ⅲ，染色后镜检可见橘黄色颗粒","马铃薯匀浆+碘液，水浴加热后出现蓝色"],answer:2,notes:["错误。改正：斐林试剂检测还原糖需要水浴加热，常温静置不能得到稳定的砖红色沉淀。","错误。改正：双缩脲反应通常不需水浴加热，蛋白质检测应直接观察紫色。","正确。花生子叶富含脂肪，苏丹Ⅲ可将脂肪染成橘黄色，镜检可见颗粒。","错误。改正：淀粉遇碘变蓝是常温显色，不需要水浴加热。"],analysis:"检测实验要同时掌握检测对象、试剂、颜色和条件。还原糖检测需水浴加热；蛋白质双缩脲反应不需加热；脂肪用苏丹Ⅲ镜检；淀粉遇碘蓝染。",steps:["先判断待检有机物类别。","匹配试剂与特征颜色。","核对是否需要水浴或镜检。"],tip:"“有没有颜色反应”与“是否需要加热”要分开记忆。"}),Ot({id:"premium-bio-b3-01",subject:"biology",topicId:"bio-organelles",difficulty:3,examStyle:"分泌蛋白 · 同位素追踪",stem:"用放射性同位素标记氨基酸，追踪胰岛B细胞分泌胰岛素的过程，放射性依次出现的结构是",options:["核糖体→内质网→高尔基体→细胞膜","内质网→核糖体→高尔基体→线粒体","高尔基体→核糖体→内质网→细胞膜","核糖体→线粒体→高尔基体→细胞膜"],answer:0,notes:["正确。分泌蛋白先在核糖体合成，进入内质网初步加工，再由高尔基体加工包装，最后经囊泡运至细胞膜分泌。","错误。改正：合成的起点是核糖体，不应从内质网开始；线粒体主要供能，不是分泌路径末端。","错误。改正：高尔基体负责后期加工包装，不可能先于核糖体和内质网出现放射性。","错误。改正：线粒体提供能量，通常不是分泌蛋白经过的加工和运输结构。"],analysis:"分泌蛋白的合成运输路径为核糖体→内质网→高尔基体→细胞膜。线粒体可通过供能影响过程，但不是蛋白质依次经过的结构。",steps:["从合成场所核糖体起步。","确认内质网和高尔基体的加工先后。","把线粒体作为供能结构而非运输节点。"],tip:"“经过”与“需要能量供应”不是同一含义。"}),Ot({id:"premium-bio-b3-02",subject:"biology",topicId:"bio-organelles",difficulty:4,examStyle:"膜结构 · 分类比较",stem:"下列细胞结构中，均不含磷脂分子的组合是",options:["线粒体、叶绿体","核糖体、中心体","高尔基体、内质网","细胞核、溶酶体"],answer:1,notes:["错误。改正：线粒体和叶绿体均有双层膜，膜结构含磷脂。","正确。核糖体和中心体都是无膜细胞器，不含磷脂构成的生物膜。","错误。改正：高尔基体和内质网都有单层膜，含磷脂。","错误。改正：细胞核有双层核膜，溶酶体有单层膜，均含磷脂。"],analysis:"磷脂是生物膜的基本骨架成分之一。有膜结构即含磷脂，无膜细胞器则不含磷脂。线粒体、叶绿体、细胞核为双层膜，内质网、高尔基体、溶酶体为单层膜。",steps:["先判断每个结构有无膜。","排除内膜结构。","确认核糖体、中心体均为无膜结构。"],tip:"核糖体没有膜，却有蛋白质合成功能。"}),Ot({id:"premium-bio-b3-03",subject:"biology",topicId:"bio-organelles",difficulty:5,examStyle:"抑制剂实验 · 膜蛋白功能",stem:"某细胞吸收物质甲的速率随甲浓度梯度增大而增加，但加入ATP合成抑制剂后显著下降。下列判断最合理的是",options:["甲只能通过自由扩散进入细胞","甲的运输一定不需要膜蛋白","甲可能通过主动运输或需要能量的载体运输方式进入","温度不会影响甲的运输速率"],answer:2,notes:["错误。改正：自由扩散不需要能量，若仅自由扩散，抑制ATP合成通常不会造成显著下降。","错误。改正：小分子跨膜也可能通过载体或通道，不能据“可跨膜”推断不需要膜蛋白。","正确。运输依赖能量，说明可能为需要ATP的主动运输；若同时表现为趋势饱和，还可能与载体有关。","错误。改正：温度会影响膜流动性和酶促/载体相关过程，通常可能影响运输速率。"],analysis:"ATP抑制剂显著降低吸收，说明能量供应是必要条件之一。可据此排除单纯自由扩散，并支持主动运输等耗能过程；仅凭此不能进一步证明一定使用某种具体载体。",steps:["先看能量依赖性：抑制ATP后速率下降。","排除不耗能的自由扩散。","保留“可能”表述，区分运输方式与具体蛋白。"],tip:"实验证据只能支持结论范围，不能过度外推。"}),Ot({id:"premium-bio-b4-01",subject:"biology",topicId:"bio-nucleus",difficulty:3,examStyle:"核孔 · 选择性运输",stem:"下列物质或结构通常可以通过核孔实现核质交换的是",options:["DNA和染色体","mRNA和某些蛋白质","核糖体和全部细胞器","磷脂双分子层"],answer:1,notes:["错误。改正：核内DNA通常不通过核孔进入细胞质；染色体是DNA和蛋白质的组装结构，也不通过核孔运输。","正确。mRNA可从核内运到细胞质，核内合成的某些蛋白质可从细胞质运入核内。","错误。改正：核孔具有选择性，不允许核糖体和全部细胞器自由通过。","错误。改正：磷脂双分子层是膜结构成分，不是通过核孔进行核质交换的运输对象。"],analysis:"核孔是核质之间物质交换和信息交流的通道，但具有选择性。mRNA和某些蛋白质可通过；DNA和染色体等大型结构通常不通过。",steps:["核孔是受限通道，不是自由孔洞。","判断mRNA与蛋白质的核质运输方向。","排除DNA、染色体和整个细胞器的直接通过。"],tip:"“核孔”不等于“所有物质都能自由通过”。"}),Ot({id:"premium-bio-b4-02",subject:"biology",topicId:"bio-nucleus",difficulty:4,examStyle:"核移植/去核实验 · 控制中心",stem:"将某真核细胞的细胞核除去后，细胞代谢迅速减弱；重新植入同种细胞的细胞核后，代谢逐步恢复。下列结论最严谨的是",options:["细胞核能独立完成全部生命活动","细胞核是细胞代谢的控制中心","细胞质完全不参与代谢控制","所有细胞的遗传信息都只存在于细胞核"],answer:1,notes:["错误。改正：实验只能说明核与代谢有关，不能证明细胞核能脱离细胞质独立生存。","正确。去核使代谢减弱、重新植入核后恢复，说明细胞核对细胞代谢具有控制作用。","错误。改正：细胞代谢由核与细胞质共同完成，实验不能否定细胞质的作用。","错误。改正：原核细胞没有核膜包被的细胞核，遗传物质位于拟核；该实验也不能推广为“所有细胞”。"],analysis:"对照实验证明细胞核对代谢状态有控制作用，但生命活动仍需要细胞质和完整细胞结构。结论应限制在实验对象与现象范围内。",steps:["比较去核前后代谢变化。","比较重新植入核后的恢复。","排除“独立完成生命活动”和“所有细胞”的过度推广。"],tip:"实验结论要区分“参与/控制”和“独立完成”。"}),Ot({id:"premium-bio-b4-03",subject:"biology",topicId:"bio-nucleus",difficulty:5,examStyle:"染色质与核仁 · 分期变化",stem:"下列关于细胞核结构和功能的叙述，正确的是",options:["核仁是双层膜细胞器，与蛋白质合成直接有关的场所","核膜由单层膜构成，允许所有大分子自由通过","染色质与染色体是同一物质在不同时期的两种形态","核内DNA可以直接与核糖体结合合成蛋白质"],answer:2,notes:["错误。改正：核仁不是细胞器，也没有双层膜，其功能与核糖体形成有关。","错误。改正：核膜是双层膜，核孔对物质运输具有选择性。","正确。染色质与染色体主要由DNA和蛋白质组成，是同一物质在细胞不同时期的两种形态。","错误。改正：蛋白质合成场所主要是细胞质中的核糖体，DNA通常不直接与核糖体结合。"],analysis:"细胞核具有核膜、核孔、核仁和染色质等结构。核膜双层且核孔有选择性；核仁参与核糖体形成；染色质和染色体是同一物质不同时期的形态。",steps:["区分核膜、核仁和染色质的基本属性。","核对双层膜和运输选择性。","确认蛋白质合成主要发生在核糖体。"],tip:"染色质与染色体不是两种不同物质。"})],B2=[{id:"chem-c1-01",subject:"chemistry",topicId:"chem-classification",difficulty:1,stem:"下列物质中，属于纯净物的是",options:[{key:"A",text:"漂白粉"},{key:"B",text:"液氯"},{key:"C",text:"盐酸"},{key:"D",text:"空气"}],answer:"B",analysis:"液氯是液态的氯气，只含 Cl₂ 一种物质，属于纯净物；漂白粉、盐酸和空气都含有多种物质。",steps:["先判断物质组成是否唯一。","液氯没有发生化学分解，成分仍只有 Cl₂。"],tip:"“液”只表示状态，不改变物质组成。"},{id:"chem-c1-02",subject:"chemistry",topicId:"chem-classification",difficulty:1,stem:"胶体区别于其他分散系的本质特征是",options:[{key:"A",text:"能产生丁达尔效应"},{key:"B",text:"外观均一、透明"},{key:"C",text:"分散质粒子直径在 1～100 nm"},{key:"D",text:"能透过滤纸"}],answer:"C",analysis:"丁达尔效应是鉴别方法，不是本质特征。三类分散系的本质区别是分散质粒子直径大小。",steps:["溶液：小于 1 nm。","胶体：1～100 nm。","浊液：大于 100 nm。"],tip:"“本质特征”与“鉴别方法”不要混淆。"},{id:"chem-c1-03",subject:"chemistry",topicId:"chem-classification",difficulty:2,stem:"用激光笔分别从侧面照射 CuSO₄ 溶液和 Fe(OH)₃ 胶体，最可能观察到的现象是",options:[{key:"A",text:"两者都出现明显光路"},{key:"B",text:"两者都不出现光路"},{key:"C",text:"胶体中出现光路，溶液中没有明显光路"},{key:"D",text:"溶液中出现光路，胶体中没有明显光路"}],answer:"C",analysis:"胶体粒子可使光发生散射，从侧面可看到一条光亮“通路”，这就是丁达尔效应；溶液没有明显现象。",steps:["Fe(OH)₃ 胶体的分散质粒子大小为 1～100 nm。","散射明显，因此产生丁达尔效应。"],tip:"胶体不是“会发光”，而是使光发生散射。"},{id:"chem-c1-04",subject:"chemistry",topicId:"chem-classification",difficulty:3,stem:"下列推理正确的是",options:[{key:"A",text:"NaHSO₄ 能电离出 H⁺，所以它是酸"},{key:"B",text:"Na₂O₂ 与酸反应有盐和水生成，所以它是碱性氧化物"},{key:"C",text:"CO₂ 能与碱反应生成盐和水，所以它是酸性氧化物"},{key:"D",text:"能导电的物质一定是电解质"}],answer:"C",analysis:"CO₂ 与碱反应只生成盐和水，符合酸性氧化物的定义。NaHSO₄ 属于酸式盐；Na₂O₂ 与酸反应还会生成 O₂，不是碱性氧化物；铜能导电但不是化合物，不是电解质。",steps:["酸性氧化物：与碱反应只生成盐和水。","排除组成或产物不符合定义的选项。"],tip:"分类不仅看“能反应”，还要看生成物和物质类别。"},{id:"chem-c2-01",subject:"chemistry",topicId:"chem-ion",difficulty:1,stem:"FeCl₃ 溶液与 KOH 溶液反应的离子方程式是",options:[{key:"A",text:"Fe³⁺ + 3OH⁻ → Fe(OH)₃↓"},{key:"B",text:"FeCl₃ + 3OH⁻ → Fe(OH)₃↓ + 3Cl⁻"},{key:"C",text:"Fe³⁺ + 3KOH → Fe(OH)₃↓ + 3K⁺"},{key:"D",text:"Fe³⁺ + OH⁻ → Fe(OH)₃↓"}],answer:"A",analysis:"K⁺、Cl⁻ 在反应前后没有变化，应删去；Fe(OH)₃ 是沉淀，保留化学式；电荷与原子数均已守恒。",steps:["先写分子方程式。","把强电解质中实际参加反应的离子拆开。","删除旁观离子并检查守恒。"],tip:"离子方程式左、右两边电荷总数必须相等。"},{id:"chem-c2-02",subject:"chemistry",topicId:"chem-ion",difficulty:1,stem:"在无色酸性溶液中，下列各组离子能大量共存的是",options:[{key:"A",text:"Na⁺、K⁺、NO₃⁻、SO₄²⁻"},{key:"B",text:"Cu²⁺、Na⁺、Cl⁻、NO₃⁻"},{key:"C",text:"HCO₃⁻、Na⁺、Cl⁻、K⁺"},{key:"D",text:"Ba²⁺、Na⁺、SO₄²⁻、Cl⁻"}],answer:"A",analysis:"A 组离子彼此不反应且均无色。B 中 Cu²⁺ 呈蓝色；C 中 HCO₃⁻ 会与 H⁺ 反应；D 中 Ba²⁺ 与 SO₄²⁻ 生成沉淀。",steps:["看颜色：排除有色离子。","看酸性：排除能与 H⁺ 反应的离子。","看离子间是否生成沉淀、气体或弱电解质。"],tip:"题干中的“无色”“酸性”都是过滤条件。"},{id:"chem-c2-03",subject:"chemistry",topicId:"chem-ion",difficulty:2,stem:"Ba(OH)₂ 稀溶液与稀硫酸反应的离子方程式正确的是",options:[{key:"A",text:"H⁺ + OH⁻ → H₂O"},{key:"B",text:"Ba²⁺ + SO₄²⁻ → BaSO₄↓"},{key:"C",text:"Ba²⁺ + 2OH⁻ + 2H⁺ + SO₄²⁻ → BaSO₄↓ + 2H₂O"},{key:"D",text:"Ba²⁺ + OH⁻ + H⁺ + SO₄²⁻ → BaSO₄↓ + H₂O"}],answer:"C",analysis:"该反应同时生成 BaSO₄ 沉淀和水，两项都不能省略；按 Ba(OH)₂ 与 H₂SO₄ 的组成关系配平。",steps:["1 mol Ba(OH)₂ 提供 1 mol Ba²⁺ 和 2 mol OH⁻。","1 mol H₂SO₄ 提供 2 mol H⁺ 和 1 mol SO₄²⁻。","综合沉淀与中和两个过程。"],tip:"生成两种难电离或难溶产物时，不能只写其中一个。"},{id:"chem-c2-04",subject:"chemistry",topicId:"chem-ion",difficulty:3,stem:"向 Na₂CO₃ 溶液中逐滴加入稀盐酸，开始时的主要离子反应是",options:[{key:"A",text:"CO₃²⁻ + 2H⁺ → CO₂↑ + H₂O"},{key:"B",text:"CO₃²⁻ + H⁺ → HCO₃⁻"},{key:"C",text:"HCO₃⁻ + H⁺ → CO₂↑ + H₂O"},{key:"D",text:"2H⁺ + 2Cl⁻ → 2HCl"}],answer:"B",analysis:"逐滴加入盐酸时，H⁺ 相对少量，先与 CO₃²⁻ 反应生成 HCO₃⁻；盐酸继续增加时，HCO₃⁻ 再与 H⁺ 反应放出 CO₂。",steps:["第一阶段：H⁺ + CO₃²⁻ → HCO₃⁻。","第二阶段：H⁺ + HCO₃⁻ → H₂O + CO₂↑。","结论取决于滴加顺序和相对量。"],tip:"“逐滴加入”是在提示你先考虑少量 H⁺ 的反应。"},{id:"chem-c3-01",subject:"chemistry",topicId:"chem-redox",difficulty:1,stem:"反应 Fe + CuSO₄ → FeSO₄ + Cu 中，还原剂是",options:[{key:"A",text:"Fe"},{key:"B",text:"CuSO₄"},{key:"C",text:"FeSO₄"},{key:"D",text:"Cu"}],answer:"A",analysis:"Fe 的化合价由 0 升至 +2，失电子，被氧化，作还原剂；Cu²⁺ 得电子，被还原。",steps:["标出变价元素：Fe 与 Cu。","升失氧：Fe 失电子。","失电子者作还原剂。"],tip:"口诀“升失氧作还原剂”可快速判断。"},{id:"chem-c3-02",subject:"chemistry",topicId:"chem-redox",difficulty:1,stem:"KClO₃ 中氯元素的化合价是",options:[{key:"A",text:"-1"},{key:"B",text:"+1"},{key:"C",text:"+5"},{key:"D",text:"+7"}],answer:"C",analysis:"设 Cl 的化合价为 x。K 为 +1，O 为 -2，则 (+1) + x + 3×(-2) = 0，解得 x = +5。",steps:["化合物中各元素化合价代数和为 0。","1 + x - 6 = 0。","x = +5。"],tip:"考试中先标固定价元素，再列式求未知价。"},{id:"chem-c3-03",subject:"chemistry",topicId:"chem-redox",difficulty:2,stem:"反应 Cl₂ + 2NaOH → NaCl + NaClO + H₂O 中，1 mol Cl₂ 完全反应时转移电子的物质的量为",options:[{key:"A",text:"0.5 mol"},{key:"B",text:"1 mol"},{key:"C",text:"2 mol"},{key:"D",text:"4 mol"}],answer:"B",analysis:"1 mol Cl₂ 中，1 mol Cl 由 0 价降到 -1 价，得到 1 mol 电子；另 1 mol Cl 由 0 价升到 +1 价，失去 1 mol 电子。因此转移电子为 1 mol。",steps:["标价：0 → -1；0 → +1。","转移电子数取单方向，不把得失电子相加。","1 mol Cl₂ 对应 1 mol e⁻ 转移。"],tip:"同一元素既升价又降价，属于歧化反应。"},{id:"chem-c3-04",subject:"chemistry",topicId:"chem-redox",difficulty:3,stem:"KClO₃ + 6HCl(浓) → KCl + 3Cl₂↑ + 3H₂O。若有 1 mol KClO₃ 完全反应，被氧化的 HCl 的物质的量为",options:[{key:"A",text:"1 mol"},{key:"B",text:"3 mol"},{key:"C",text:"5 mol"},{key:"D",text:"6 mol"}],answer:"C",analysis:"KClO₃ 中 +5 价 Cl 降到 0 价，需得到 5 mol 电子；共 6 mol HCl 中，5 mol Cl⁻ 被氧化为 0 价，另 1 mol 形成 KCl，未被氧化。",steps:["确定 KClO₃ 中 Cl：+5 → 0，得 5e⁻。","每个被氧化的 Cl⁻：-1 → 0，失去 1e⁻。","由得失电子守恒，被氧化的 HCl 为 5 mol。"],tip:"参加反应的 HCl 不一定全部被氧化。"},{id:"chem-c4-01",subject:"chemistry",topicId:"chem-sodium",difficulty:1,stem:"Na₂O₂ 与水反应的产物是",options:[{key:"A",text:"NaOH 和 H₂"},{key:"B",text:"NaOH 和 O₂"},{key:"C",text:"Na₂CO₃ 和 H₂"},{key:"D",text:"Na₂O 和 O₂"}],answer:"B",analysis:"反应为 2Na₂O₂ + 2H₂O → 4NaOH + O₂↑。过氧化钠中 -1 价氧同时发生氧化和还原。",steps:["Na₂O₂ 遇水生成 NaOH。","另一产物为 O₂，不是 H₂。"],tip:"Na₂O 与水只生成 NaOH，Na₂O₂ 则会放出 O₂。"},{id:"chem-c4-02",subject:"chemistry",topicId:"chem-sodium",difficulty:1,stem:"下列固体加热时，能产生使澄清石灰水变浑浊气体的是",options:[{key:"A",text:"Na₂CO₃"},{key:"B",text:"NaHCO₃"},{key:"C",text:"NaCl"},{key:"D",text:"NaOH"}],answer:"B",analysis:"NaHCO₃ 受热分解生成 Na₂CO₃、H₂O 和 CO₂；CO₂ 可使澄清石灰水变浑浊。",steps:["2NaHCO₃ → Na₂CO₃ + H₂O + CO₂↑。","Na₂CO₃ 对热稳定。"],tip:"碳酸氢钠受热分解是鉴别 Na₂CO₃ 与 NaHCO₃ 的常用依据。"},{id:"chem-c4-03",subject:"chemistry",topicId:"chem-sodium",difficulty:2,stem:"NaHCO₃ 溶液与稀盐酸反应的离子方程式是",options:[{key:"A",text:"CO₃²⁻ + 2H⁺ → CO₂↑ + H₂O"},{key:"B",text:"HCO₃⁻ + H⁺ → CO₂↑ + H₂O"},{key:"C",text:"Na⁺ + Cl⁻ → NaCl"},{key:"D",text:"NaHCO₃ + H⁺ → Na⁺ + CO₂↑ + H₂O"}],answer:"B",analysis:"NaHCO₃ 可拆为 Na⁺ 和 HCO₃⁻；Na⁺ 是旁观离子，HCO₃⁻ 与 H⁺ 反应生成 CO₂ 和 H₂O。",steps:["NaHCO₃ 可溶于水并完全电离。","HCO₃⁻ 不能拆成 H⁺ 和 CO₃²⁻。","删去旁观离子 Na⁺。"],tip:"HCO₃⁻ 是一个整体，不能随意拆开。"},{id:"chem-c4-04",subject:"chemistry",topicId:"chem-sodium",difficulty:3,stem:"2Na₂O₂ + 2CO₂ → 2Na₂CO₃ + O₂ 中，若 1 mol Na₂O₂ 完全反应，转移电子的物质的量为",options:[{key:"A",text:"0.5 mol"},{key:"B",text:"1 mol"},{key:"C",text:"2 mol"},{key:"D",text:"4 mol"}],answer:"B",analysis:"Na₂O₂ 中 O 为 -1 价。-1 价氧一半降到 -2 价，一半升到 0 价。2 mol Na₂O₂ 参与反应时转移 2 mol 电子，因此 1 mol Na₂O₂ 转移 1 mol 电子。",steps:["先标氧的化合价：Na₂O₂ 中为 -1。","生成 Na₂CO₃ 中 O 为 -2，O₂ 中为 0。","按比例折算为 1 mol Na₂O₂。"],tip:"计算电子转移时，别把得到和失去的电子重复相加。"},{id:"chem-c5-01",subject:"chemistry",topicId:"chem-chlorine",difficulty:1,stem:"氯水中具有漂白作用的微粒主要是",options:[{key:"A",text:"Cl₂"},{key:"B",text:"H⁺"},{key:"C",text:"Cl⁻"},{key:"D",text:"HClO"}],answer:"D",analysis:"Cl₂ 与水反应生成 HCl 和 HClO，其中 HClO 具有强氧化性，能漂白有色物质。",steps:["写出 Cl₂ + H₂O ⇌ HCl + HClO。","HCl 无漂白性，HClO 有漂白性。"],tip:"真正起漂白作用的是次氯酸，不是氯气本身。"},{id:"chem-c5-02",subject:"chemistry",topicId:"chem-chlorine",difficulty:1,stem:"将干燥的有色布条分别放入干燥氯气和湿润氯气中，现象是",options:[{key:"A",text:"两者都褪色"},{key:"B",text:"两者都不褪色"},{key:"C",text:"干燥氯气中褪色，湿润氯气中不褪色"},{key:"D",text:"干燥氯气中不褪色，湿润氯气中褪色"}],answer:"D",analysis:"干燥氯气不能直接提供 HClO；湿润氯气中的水与 Cl₂ 反应生成 HClO，因此有色布条褪色。",steps:["漂白微粒是 HClO。","HClO 的生成需要 Cl₂ 与水共同存在。"],tip:"“干燥氯气无漂白性”是常考结论。"},{id:"chem-c5-03",subject:"chemistry",topicId:"chem-chlorine",difficulty:2,stem:"工业上用氯气与氢氧化钠溶液制取漂白液，下列判断正确的是",options:[{key:"A",text:"反应中 Cl₂ 只被氧化"},{key:"B",text:"反应中 Cl₂ 只被还原"},{key:"C",text:"Cl₂ 既被氧化又被还原"},{key:"D",text:"该反应不是氧化还原反应"}],answer:"C",analysis:"Cl₂ + 2NaOH → NaCl + NaClO + H₂O。Cl 从 0 价分别变到 -1 价和 +1 价，因此既被还原又被氧化。",steps:["标出反应前后 Cl 的化合价。","一种元素同时升价、降价，属于歧化反应。"],tip:"漂白液的有效成分是 NaClO。"},{id:"chem-c5-04",subject:"chemistry",topicId:"chem-chlorine",difficulty:3,stem:"标准状况下，11.2 L Cl₂ 与足量铁反应，最多生成 FeCl₃ 的物质的量为",options:[{key:"A",text:"1/6 mol"},{key:"B",text:"1/3 mol"},{key:"C",text:"1/2 mol"},{key:"D",text:"2/3 mol"}],answer:"B",analysis:"n(Cl₂) = 11.2 L ÷ 22.4 L·mol⁻¹ = 0.5 mol。由 2Fe + 3Cl₂ → 2FeCl₃ 可知，3 mol Cl₂ 生成 2 mol FeCl₃，故 0.5 mol Cl₂ 生成 1/3 mol FeCl₃。",steps:["标准状况下先把体积换算成物质的量。","用方程式系数比：n(FeCl₃) = 2/3 × n(Cl₂)。","0.5 × 2/3 = 1/3 mol。"],tip:"跨章节题目先算 n，再按方程式比例。"},{id:"chem-c6-01",subject:"chemistry",topicId:"chem-mole",difficulty:1,stem:"1 mol O₂ 中含有的氧原子物质的量为",options:[{key:"A",text:"0.5 mol"},{key:"B",text:"1 mol"},{key:"C",text:"2 mol"},{key:"D",text:"4 mol"}],answer:"C",analysis:"每个 O₂ 分子含 2 个氧原子，所以 1 mol O₂ 含 2 mol 氧原子。",steps:["看清微粒种类：O₂ 分子还是 O 原子。","1 mol O₂ → 2 mol O。"],tip:"题目问原子、分子还是离子，结论可能不同。"},{id:"chem-c6-02",subject:"chemistry",topicId:"chem-mole",difficulty:1,stem:"18 g H₂O 的物质的量约为",options:[{key:"A",text:"0.5 mol"},{key:"B",text:"1 mol"},{key:"C",text:"2 mol"},{key:"D",text:"18 mol"}],answer:"B",analysis:"H₂O 的摩尔质量为 18 g·mol⁻¹，所以 n = m/M = 18 g ÷ 18 g·mol⁻¹ = 1 mol。",steps:["写出 M(H₂O) = 18 g·mol⁻¹。","使用 n = m/M。"],tip:"质量换算成物质的量时，单位要与摩尔质量匹配。"},{id:"chem-c6-03",subject:"chemistry",topicId:"chem-mole",difficulty:2,stem:"0.5 mol Na₂SO₄ 中含有的 Na⁺ 数目约为",options:[{key:"A",text:"3.01×10²³"},{key:"B",text:"6.02×10²³"},{key:"C",text:"1.204×10²⁴"},{key:"D",text:"2.408×10²⁴"}],answer:"B",analysis:"1 mol Na₂SO₄ 含 2 mol Na⁺，所以 0.5 mol Na₂SO₄ 含 1 mol Na⁺，约 6.02×10²³ 个。",steps:["从化学式判断微粒比例：Na₂SO₄ : Na⁺ = 1 : 2。","n(Na⁺) = 0.5 × 2 = 1 mol。","微粒数 = n × Nₐ。"],tip:"先找化学式中的下标，再乘以外面的物质的量。"},{id:"chem-c6-04",subject:"chemistry",topicId:"chem-mole",difficulty:3,stem:"若 a g O₂ 中含有 b 个 O₂ 分子，则 c g O₃ 中含有的 O₃ 分子数为",options:[{key:"A",text:"bc/a"},{key:"B",text:"2bc/(3a)"},{key:"C",text:"3bc/(2a)"},{key:"D",text:"ac/b"}],answer:"B",analysis:"b 个 O₂ 分子对应 a g 氧气，因此阿伏加德罗常数的表达式可消去。每个 O₃ 分子质量为 48/Nₐ，O₂ 分子质量为 32/Nₐ，两者比为 3:2，所以相同质量下 O₃ 的分子数是 O₂ 的 2/3。c g O₃ 的分子数为 2bc/(3a)。",steps:["先把“个数”转换成“质量与单个分子质量”的关系。","O₂ 与 O₃ 单个分子质量之比为 32:48 = 2:3。","同质量时分子数之比为 3:2，取 c/a 进行比例缩放。"],tip:"高难比例题先找相同量，再比较不同量。"},{id:"chem-c7-01",subject:"chemistry",topicId:"chem-gas",difficulty:1,stem:"在标准状况下，1 mol 任何气体所占的体积约为",options:[{key:"A",text:"1 L"},{key:"B",text:"22.4 L"},{key:"C",text:"24.5 L"},{key:"D",text:"无法确定"}],answer:"B",analysis:"标准状况下气体摩尔体积约为 22.4 L·mol⁻¹，因此 1 mol 气体体积约为 22.4 L。",steps:["条件：标准状况。","对象：气体。","V = nVₘ ≈ 1 × 22.4 = 22.4 L。"],tip:"使用 22.4 L·mol⁻¹ 前必须核对温度和压强。"},{id:"chem-c7-02",subject:"chemistry",topicId:"chem-gas",difficulty:1,stem:"标准状况下，11.2 L CO₂ 的质量约为",options:[{key:"A",text:"11 g"},{key:"B",text:"22 g"},{key:"C",text:"44 g"},{key:"D",text:"88 g"}],answer:"B",analysis:"n(CO₂) = 11.2 ÷ 22.4 = 0.5 mol；m = nM = 0.5 × 44 = 22 g。",steps:["体积 → 物质的量：n = V/22.4。","物质的量 → 质量：m = nM。","0.5 × 44 = 22 g。"],tip:"体积、物质的量、质量之间的换算链要完整。"},{id:"chem-c7-03",subject:"chemistry",topicId:"chem-gas",difficulty:2,stem:"同温同压下，体积相同的两种气体一定具有相同的",options:[{key:"A",text:"质量"},{key:"B",text:"摩尔质量"},{key:"C",text:"分子数"},{key:"D",text:"原子数"}],answer:"C",analysis:"同温同压下，气体摩尔体积相同。体积相同意味着物质的量相同，因此分子数相同；不同气体摩尔质量可不同，分子内原子数也可能不同。",steps:["由阿伏加德罗定律：同温同压、同体积 → 同物质的量。","物质的量相同 → 分子数相同。","质量与原子数还取决于摩尔质量和分子组成。"],tip:"“相同体积”优先对应“相同物质的量”，不要直接推断质量相同。"},{id:"chem-c7-04",subject:"chemistry",topicId:"chem-gas",difficulty:3,stem:"标准状况下，6.72 L H₂ 和 CO 的混合气体质量为 5.8 g，则混合气体中 H₂ 与 CO 的体积比为",options:[{key:"A",text:"1 : 1"},{key:"B",text:"1 : 2"},{key:"C",text:"2 : 1"},{key:"D",text:"3 : 2"}],answer:"B",analysis:"混合气体总物质的量为 6.72 ÷ 22.4 = 0.3 mol。设 CO 为 x mol，则 H₂ 为 (0.3-x) mol。由 28x + 2(0.3-x) = 5.8，得 x = 0.2 mol，H₂ 为 0.1 mol，因此体积比 H₂ : CO = 1 : 2。",steps:["先算总物质的量：0.3 mol。","设 CO 为 x mol，利用总质量列方程。","解得 n(H₂)=0.1 mol，n(CO)=0.2 mol。","同温同压下，体积比等于物质的量比。"],tip:"混合气体题先建立“总物质的量”和“总质量”两个方程。"},{id:"bio-b1-01",subject:"biology",topicId:"bio-cell-intro",difficulty:1,stem:"下列关于病毒的说法，正确的是",options:[{key:"A",text:"病毒具有细胞结构"},{key:"B",text:"病毒可以独立完成全部生命活动"},{key:"C",text:"病毒必须寄生在活细胞内才能增殖"},{key:"D",text:"病毒属于原核生物"}],answer:"C",analysis:"病毒没有细胞结构，不能独立进行代谢和增殖，必须依赖宿主活细胞；它既不属于原核生物，也不属于真核生物。",steps:["病毒由核酸和蛋白质等组成。","没有完整的酶系统和代谢机构。","只能在宿主活细胞中复制增殖。"],tip:"病毒不是原核生物，这是常错点。"},{id:"bio-b1-02",subject:"biology",topicId:"bio-cell-intro",difficulty:1,stem:"细胞学说建立的重要依据是",options:[{key:"A",text:"所有生物都由多个细胞构成"},{key:"B",text:"细胞通过分裂产生新细胞"},{key:"C",text:"所有细胞都有细胞核"},{key:"D",text:"细胞都能独立完成光合作用"}],answer:"B",analysis:"细胞学说认为细胞是一个相对独立的单位，新细胞可以由老细胞分裂产生。并非所有生物都是多细胞，原核细胞也没有核膜包被的细胞核。",steps:["细胞学说强调细胞是结构和功能单位。","关注“新细胞来自已存在的细胞”。"],tip:"“所有”类绝对表述要警惕。"},{id:"bio-b1-03",subject:"biology",topicId:"bio-cell-intro",difficulty:2,stem:"蓝细菌能够进行光合作用，其原因主要是",options:[{key:"A",text:"具有叶绿体"},{key:"B",text:"具有核膜"},{key:"C",text:"含有藻蓝素和叶绿素等光合色素"},{key:"D",text:"属于真核生物"}],answer:"C",analysis:"蓝细菌是原核生物，没有叶绿体，也没有核膜包被的细胞核，但含有藻蓝素和叶绿素，能进行光合作用。",steps:["蓝细菌属于原核生物。","原核细胞没有叶绿体等膜性细胞器。","光合作用依赖其含有的光合色素。"],tip:"“能光合作用”不等于“一定有叶绿体”。"},{id:"bio-b1-04",subject:"biology",topicId:"bio-cell-intro",difficulty:3,stem:"某池塘水样中观察到甲、乙两种单细胞生物：甲有成形的细胞核，乙有拟核和光合色素，但没有叶绿体。下列判断正确的是",options:[{key:"A",text:"甲一定是植物细胞"},{key:"B",text:"乙可能是蓝细菌"},{key:"C",text:"甲、乙都一定具有细胞壁"},{key:"D",text:"甲、乙都以染色体作为唯一遗传物质"}],answer:"B",analysis:"乙有拟核且没有叶绿体，却含有光合色素，符合蓝细菌的特征。甲有真正的细胞核，只能确定为真核细胞，不能仅凭这一点确定是植物细胞；动物细胞没有细胞壁，遗传物质是 DNA，不能说“染色体作为唯一遗传物质”。",steps:["先按“有无核膜包被的细胞核”区分真核细胞和原核细胞。","乙具拟核，可锁定为原核生物；再结合光合色素进一步判断为蓝细菌。","甲只确定为真核细胞，植物、动物、真菌都有可能。"],tip:"先定大类，再用结构特征缩小范围，避免一步跳到结论。"},{id:"bio-b2-01",subject:"biology",topicId:"bio-elements",difficulty:1,stem:"活细胞中含量最多的化合物是",options:[{key:"A",text:"蛋白质"},{key:"B",text:"水"},{key:"C",text:"糖类"},{key:"D",text:"核酸"}],answer:"B",analysis:"水是活细胞中含量最多的化合物；蛋白质通常是含量最多的有机物。",steps:["区分“无机物/有机物”。","含量最多的化合物是水，含量最多的有机物通常是蛋白质。"],tip:"注意题干问的是化合物还是有机物。"},{id:"bio-b2-02",subject:"biology",topicId:"bio-elements",difficulty:1,stem:"被称为“生命活动的主要能源物质”的是",options:[{key:"A",text:"糖类"},{key:"B",text:"蛋白质"},{key:"C",text:"脂质"},{key:"D",text:"核酸"}],answer:"A",analysis:"糖类是生命活动的主要能源物质。脂肪是重要的储能物质，蛋白质承担多种结构和功能。",steps:["糖类：主要能源物质。","脂肪：主要储能物质。","ATP：直接能源物质。"],tip:"“主要能源物质”“直接能源物质”表述不同。"},{id:"bio-b2-03",subject:"biology",topicId:"bio-elements",difficulty:2,stem:"蛋白质结构具有多样性的直接原因不包括",options:[{key:"A",text:"氨基酸的种类不同"},{key:"B",text:"氨基酸的数目不同"},{key:"C",text:"氨基酸的排列顺序不同"},{key:"D",text:"所有蛋白质都由相同数量的氨基酸组成"}],answer:"D",analysis:"蛋白质多样性来自氨基酸种类、数目、排列顺序以及肽链盘曲、折叠形成的空间结构。若所有蛋白质氨基酸数量都相同，会削弱多样性。",steps:["从一级结构看：种类、数目、顺序。","从高级结构看：肽链的数量和空间结构。"],tip:"题目问“不包括”，先圈出否定词。"},{id:"bio-b2-04",subject:"biology",topicId:"bio-elements",difficulty:3,stem:"某植物在干旱条件下细胞内结合水与自由水的比值升高。下列推断最合理的是",options:[{key:"A",text:"细胞代谢强度一定增强"},{key:"B",text:"细胞的抗逆性可能增强"},{key:"C",text:"细胞已经失去全部自由水"},{key:"D",text:"结合水不再参与细胞结构组成"}],answer:"B",analysis:"结合水比例升高通常有利于降低代谢、提高对不良环境的耐受性。它不表示自由水完全消失，也不能据此认定代谢一定增强。",steps:["自由水多通常代谢旺盛。","结合水比例增加通常抗逆性增强。","比值升高不等于自由水含量一定为零。"],tip:"高难题常把相关关系写成绝对因果关系，要谨慎。"},{id:"bio-b3-01",subject:"biology",topicId:"bio-organelles",difficulty:1,stem:"下列细胞器中，具有双层膜结构的是",options:[{key:"A",text:"核糖体"},{key:"B",text:"高尔基体"},{key:"C",text:"线粒体"},{key:"D",text:"内质网"}],answer:"C",analysis:"线粒体具有双层膜；核糖体无膜，高尔基体和内质网具有单层膜。",steps:["双层膜：线粒体、叶绿体、细胞核。","单层膜：内质网、高尔基体、溶酶体、液泡。"],tip:"细胞核不是细胞器，但具有双层膜结构。"},{id:"bio-b3-02",subject:"biology",topicId:"bio-organelles",difficulty:1,stem:"蛋白质合成的场所是",options:[{key:"A",text:"核糖体"},{key:"B",text:"中心体"},{key:"C",text:"溶酶体"},{key:"D",text:"细胞膜"}],answer:"A",analysis:"核糖体是蛋白质合成的场所，是无膜结构的细胞器。",steps:["核糖体由 rRNA 和蛋白质组成。","负责把氨基酸连接成肽链。"],tip:"核糖体无膜，却不是所有细胞都没有；原核细胞也有核糖体。"},{id:"bio-b3-03",subject:"biology",topicId:"bio-organelles",difficulty:2,stem:"分泌蛋白从合成到分泌到细胞外，经过的结构顺序是",options:[{key:"A",text:"核糖体 → 内质网 → 高尔基体 → 细胞膜"},{key:"B",text:"内质网 → 核糖体 → 高尔基体 → 细胞膜"},{key:"C",text:"高尔基体 → 内质网 → 核糖体 → 细胞膜"},{key:"D",text:"核糖体 → 高尔基体 → 线粒体 → 细胞膜"}],answer:"A",analysis:"分泌蛋白在附着于内质网的核糖体上合成，进入内质网加工，再由高尔基体进一步修饰、分类并通过囊泡运输至细胞膜。",steps:["合成：核糖体。","初步加工：内质网。","进一步加工与包装：高尔基体。","分泌：囊泡与细胞膜融合。"],tip:"线粒体供能，但不是分泌蛋白经过的结构。"},{id:"bio-b3-04",subject:"biology",topicId:"bio-organelles",difficulty:3,stem:"关于生物膜系统，下列说法正确的是",options:[{key:"A",text:"生物膜系统只包括细胞膜"},{key:"B",text:"不同生物膜上的蛋白质种类和数量可能不同"},{key:"C",text:"所有生物膜都以完全相同的方式排列磷脂"},{key:"D",text:"核糖体属于生物膜系统的一部分"}],answer:"B",analysis:"生物膜系统包括细胞膜、细胞器膜和核膜等。不同膜执行的功能不同，蛋白质种类和数量会有差异；核糖体没有膜，不属于生物膜系统。",steps:["生物膜系统强调膜结构之间的组成与联系。","蛋白质承担运输、识别、催化等功能，因此不同膜蛋白有差异。","排除无膜细胞器。"],tip:"“生物膜系统”不是“所有细胞器膜的总和”。"},{id:"bio-b4-01",subject:"biology",topicId:"bio-nucleus",difficulty:1,stem:"细胞核的主要功能是",options:[{key:"A",text:"合成全部蛋白质"},{key:"B",text:"进行有氧呼吸的主要场所"},{key:"C",text:"遗传信息库和细胞代谢、遗传的控制中心"},{key:"D",text:"控制物质进出细胞"}],answer:"C",analysis:"细胞核是遗传信息库，是细胞代谢和遗传的控制中心。蛋白质合成主要在核糖体，有氧呼吸主要在线粒体，控制物质进出是细胞膜的功能。",steps:["先区分细胞核、核糖体、线粒体、细胞膜的功能。","细胞核储存遗传信息，并调控代谢与遗传。"],tip:"细胞核是控制中心，不等于所有化学反应都在核内发生。"},{id:"bio-b4-02",subject:"biology",topicId:"bio-nucleus",difficulty:1,stem:"染色质的主要成分是",options:[{key:"A",text:"DNA 和蛋白质"},{key:"B",text:"RNA 和糖类"},{key:"C",text:"脂质和蛋白质"},{key:"D",text:"水和无机盐"}],answer:"A",analysis:"染色质主要由 DNA 和蛋白质组成；在细胞分裂期，染色质高度螺旋化、缩短变粗，成为染色体。",steps:["染色体和染色质是同一物质在不同时期的两种形态。","两者都主要由 DNA 和蛋白质组成。"],tip:"染色质与染色体不是两种不同物质。"},{id:"bio-b4-03",subject:"biology",topicId:"bio-nucleus",difficulty:3,stem:"下列关于细胞核结构的叙述，正确的是",options:[{key:"A",text:"核膜是单层膜，允许所有分子自由通过"},{key:"B",text:"核仁与核糖体的形成有关"},{key:"C",text:"核孔只允许 DNA 进出细胞核"},{key:"D",text:"染色质在细胞核外合成"}],answer:"B",analysis:"核仁与核糖体的形成有关。核膜为双层膜；核孔具有选择性，通常 DNA 不通过核孔进入细胞质；染色质存在于细胞核内。",steps:["核膜：双层膜。","核孔：选择性通道，mRNA 和蛋白质等可通过。","核仁：参与核糖体形成。"],tip:"“核孔是通道”不代表“什么都能自由通过”。"},{id:"cn-c1-01",type:"fill",subject:"chinese",topicId:"cn-poetry-early",difficulty:1,stem:"面对壮阔的秋景，毛泽东以设问收束上阕，发出对国家命运和时代主宰者的追问：____。",answer:"怅寥廓，问苍茫大地，谁主沉浮？",analysis:"“怅寥廓”点出面对宇宙万物时的深沉思索，“问苍茫大地，谁主沉浮”由写景转入对国家命运和时代主宰者的追问，是全词的关键设问。",steps:["题干关键词是“设问”和“谁主宰命运”。","对应《沁园春·长沙》上阕结尾。"],tip:"易错字：“寥廓”。"},{id:"cn-c1-02",type:"fill",subject:"chinese",topicId:"cn-poetry-early",difficulty:2,stem:"曹操用山海作比，并以周公自比，表达广纳贤才、统一天下的政治抱负：____。",answer:"山不厌高，海不厌深。周公吐哺，天下归心。",analysis:"“山不厌高，海不厌深”比喻招纳贤才唯恐不足；“周公吐哺”用周公礼贤下士的典故，表现作者希望天下归心的抱负。",steps:["先定位“山海作比”的两句。","再由“周公”典故定位最后两句。"],tip:"易错字：“哺”不要写成“辅”。"},{id:"cn-c1-03",type:"fill",subject:"chinese",topicId:"cn-poetry-early",difficulty:3,stem:"《归园田居（其一）》中，以飞鸟和池鱼作比，表达厌倦官场、渴望回归田园的诗句是：____。",answer:"羁鸟恋旧林，池鱼思故渊。",analysis:"诗人以“羁鸟”和“池鱼”自比，用“旧林”“故渊”象征自由田园，表达摆脱官场束缚、回归自然的强烈愿望。",steps:["题干给出两个核心意象：“飞鸟”“池鱼”。","把意象与“旧林”“故渊”对应起来。"],tip:"易错字：“羁”“渊”。"},{id:"cn-c2-01",type:"fill",subject:"chinese",topicId:"cn-tang",difficulty:1,stem:"杜甫《登高》中，从空间广阔和时间久远着笔，集中写漂泊异乡、年老多病的诗句是：____。",answer:"万里悲秋常作客，百年多病独登台。",analysis:"“万里”写漂泊空间之远，“百年”写人生晚境；“悲秋”“作客”“多病”“独登台”层层叠加，集中表现诗人的孤苦与身世之悲。",steps:["抓住“漂泊异乡”和“年老多病”两个提示。","对应颈联“万里悲秋常作客，百年多病独登台”。"],tip:"“作客”指客居他乡，不写作“做客”。"},{id:"cn-c2-02",type:"fill",subject:"chinese",topicId:"cn-tang",difficulty:2,stem:"《梦游天姥吟留别》结尾，李白直抒对权贵的蔑视和对人格自由的追求：____。",answer:"安能摧眉折腰事权贵，使我不得开心颜？",analysis:"“摧眉折腰”形象写出对权贵低声下气的屈辱姿态。诗人用反问坚决拒绝这种生活，突出对独立人格和精神自由的追求。",steps:["题干关键词是“蔑视权贵”“人格自由”。","定位全诗结尾的反问句。"],tip:"易错字：“摧眉”不是“催眉”。"},{id:"cn-c2-03",type:"fill",subject:"chinese",topicId:"cn-tang",difficulty:3,stem:"《琵琶行（并序）》中，诗人由琵琶女的身世联想到自己的贬谪处境，产生命运共鸣：____。",answer:"同是天涯沦落人，相逢何必曾相识！",analysis:"诗人与琵琶女身份、经历不同，却同样漂泊失意。“同是天涯沦落人”把两人的命运连在一起，构成全诗情感转折和共鸣的核心。",steps:["题干提示“命运共鸣”。","对应诗中由琵琶女身世转向诗人自述的过渡句。"],tip:"“沦落”指流落、失意，注意“沦”字。"},{id:"cn-c3-01",type:"fill",subject:"chinese",topicId:"cn-song",difficulty:1,stem:"苏轼《念奴娇·赤壁怀古》中，用夸张和比喻描绘赤壁险峻山势与汹涌波涛：____。",answer:"乱石穿空，惊涛拍岸，卷起千堆雪。",analysis:"“穿空”写山石高峻，“拍岸”写波涛冲击，“千堆雪”比喻浪花。三句从视觉和听觉写出赤壁景象的雄奇壮阔。",steps:["先找“夸张写山势”。","再找“比喻写浪花”，组成完整三句。"],tip:"“涛”不要写成“滔”。"},{id:"cn-c3-02",type:"fill",subject:"chinese",topicId:"cn-song",difficulty:2,stem:"辛弃疾《永遇乐·京口北固亭怀古》开篇，由眼前江山想到历史英雄孙权，表达英雄难觅的感慨：____。",answer:"千古江山，英雄无觅，孙仲谋处。",analysis:"词人登临北固亭，面对千古江山，寻找孙权那样的英雄却已无处可觅。开篇为全词怀古和现实感慨定下基调。",steps:["题干出现“开篇”和“孙权”。","孙权字仲谋，据此定位。"],tip:"“无觅”是寻找不到，注意“觅”字。"},{id:"cn-c3-03",type:"fill",subject:"chinese",topicId:"cn-song",difficulty:3,stem:"李清照《声声慢》开头连用七组叠字，从动作、环境一路写到凄苦心境：____。",answer:"寻寻觅觅，冷冷清清，凄凄惨惨戚戚。",analysis:"“寻寻觅觅”写若有所失的动作，“冷冷清清”写环境，“凄凄惨惨戚戚”写内心感受。叠字层层推进，节奏低沉，强化孤独凄凉。",steps:["七组叠字分为三层：动作、环境、心境。","逐字检查“凄”“惨”“戚”的字形。"],tip:"完整默写七组叠字，不要漏掉“戚戚”。"},{id:"cn-c4-01",type:"fill",subject:"chinese",topicId:"cn-prose",difficulty:1,stem:"《劝学》中，用木材和金属的变化作比，说明学习、自省能够使人智慧明达、行为无过：____。",answer:"故木受绳则直，金就砺则利，君子博学而日参省乎己，则知明而行无过矣。",analysis:"木材经墨线校正而直，金属在磨石上磨过而锋利。作者以此引出君子广泛学习、每日自省，才能智慧明达、少犯过错。",steps:["题干把“木材”“金属”“自省”连在一起。","按比喻、推论两层结构默写完整。"],tip:"“知明”中的“知”同“智”，不要误改为“智”。"},{id:"cn-c4-02",type:"fill",subject:"chinese",topicId:"cn-prose",difficulty:2,stem:"韩愈《师说》中提出从师标准，不论地位高低、年龄长少，道在哪里，老师就在哪里：____。",answer:"是故无贵无贱，无长无少，道之所存，师之所存也。",analysis:"这句话用排比和判断句式，把从师标准归结为“道之所存”，直接批判当时看重门第、年龄而不重从师学习的风气。",steps:["先写两组“无……”排除身份和年龄。","再落到“道”和“师”的对应关系。"],tip:"“无贵无贱”指不论贵贱，不是没有贵贱。"},{id:"cn-c4-03",type:"fill",subject:"chinese",topicId:"cn-prose",difficulty:3,stem:"《劝学》中，用骏马和劣马作对比，强调学习贵在坚持、不能半途而废：____。",answer:"骐骥一跃，不能十步；驽马十驾，功在不舍。",analysis:"骏马跳跃一次也不能达到十步，劣马拉车走十天却能走得很远，靠的是不停歇。作者借对比说明坚持的功效，论证学习必须积累。",steps:["骏马对应“骐骥”。“劣马”对应“驽马”。","找到对比后总结坚持的“不舍”。"],tip:"易错字：“骐骥”“驽马”。"},{id:"cn-c5-01",type:"fill",subject:"chinese",topicId:"cn-travel",difficulty:1,stem:"《赤壁赋》中，苏轼用蜉蝣和一粒粟米作比，感叹个人生命短暂、人在天地间渺小：____。",answer:"寄蜉蝣于天地，渺沧海之一粟。",analysis:"“蜉蝣”生命短暂，“一粟”极言渺小。两句写出个体相对于天地、沧海时的短暂与微不足道，也引出后文对变与不变的讨论。",steps:["由“蜉蝣”定位第一句。","由“粟米”和“沧海”定位第二句。"],tip:"易错字：“蜉蝣”“渺”“粟”。"},{id:"cn-c5-02",type:"fill",subject:"chinese",topicId:"cn-travel",difficulty:2,stem:"姚鼐《登泰山记》中，描写青山覆盖积雪、雪光照亮南面天空的景象：____。",answer:"苍山负雪，明烛天南。",analysis:"《登泰山记》写冬日泰山雪景：青山背负着积雪，雪光映照如烛，照亮南面天空。凝练的句子兼有色彩、力量和光感。",steps:["“青山覆盖积雪”对应“苍山负雪”。","“雪光照亮南面天空”对应“明烛天南”。"],tip:"“烛”在此是名词作动词，指像蜡烛一样照亮。"},{id:"cn-c5-03",type:"fill",subject:"chinese",topicId:"cn-travel",difficulty:3,stem:"《赤壁赋》中，苏轼从“变”与“不变”两个角度观察世界，说明事物和我都无穷无尽：____。",answer:"盖将自其变者而观之，则天地曾不能以一瞬；自其不变者而观之，则物与我皆无尽也，而又何羡乎！",analysis:"从变化角度看，天地万物瞬息万变；从不变角度看，物与我都可以延续无穷，因此不必羡慕长江的无穷。这里体现苏轼超越个体有限性的哲思。",steps:["先写“自其变者而观之”这一层。","再写“自其不变者而观之”这一层，注意结句“而又何羡乎”。"],tip:"长句按分号分成两个层次默写，特别注意“曾不能以一瞬”。"},{id:"cn-c6-01",type:"fill",subject:"chinese",topicId:"cn-recitation",difficulty:1,stem:"《静女》中，男子等待心上人，女子却故意躲藏，男子焦急徘徊：____。",answer:"爱而不见，搔首踟蹰。",analysis:"女子藏起来不肯露面，男子抓头徘徊，动作描写生动传神，写出等待中的焦急、笨拙和深情。",steps:["“故意躲藏”对应“爱而不见”。","“焦急徘徊”对应“搔首踟蹰”。"],tip:"“见”同“现”，这里仍按课文原字默写。"},{id:"cn-c6-02",type:"fill",subject:"chinese",topicId:"cn-recitation",difficulty:2,stem:"《涉江采芙蓉》中，写相爱的人却分居两地，只能在忧伤中度过一生：____。",answer:"同心而离居，忧伤以终老。",analysis:"“同心”说明彼此情深，“离居”点出分离现实，两者形成强烈反差，引出无法团聚的忧伤。",steps:["“相爱”对应“同心”。","“分居两地、忧伤终生”对应后一句。"],tip:"“离居”是分离而居，不是离开居所。"},{id:"cn-c6-03",type:"fill",subject:"chinese",topicId:"cn-recitation",difficulty:2,stem:"李煜《虞美人》中，以滔滔春水比喻无穷无尽的愁绪：____。",answer:"问君能有几多愁？恰似一江春水向东流。",analysis:"词人先用疑问把“愁”具体化，再以向东奔流的春水作比，把抽象愁绪写成绵延无穷、无法阻断的形象。",steps:["先定位“问君能有几多愁”的设问。","再写“一江春水”的比喻。"],tip:"“恰似”不要漏写；“向东流”不要写成“向东去”。"},{id:"cn-c6-04",type:"fill",subject:"chinese",topicId:"cn-recitation",difficulty:3,stem:"《鹊桥仙》中，秦观翻出爱情新境界，认为感情只要长久真挚，不必追求朝夕相守：____。",answer:"两情若是久长时，又岂在朝朝暮暮。",analysis:"这两句突破传统爱情词中对离别的哀怨，把真挚长久的感情放在朝夕相伴之上，境界开阔而积极。",steps:["“长久真挚”对应“久长时”。","“不必朝夕相守”对应反问“又岂在朝朝暮暮”。"],tip:"易错词：“久长时”“朝朝暮暮”。"}],R2={"chem-c1-03":{A:"错误。改正：溶液没有明显丁达尔效应，不会出现清晰光路。",B:"错误。改正：Fe(OH)₃胶体会使光发生明显散射，因此可出现光路。",C:"正确。胶体粒子直径在1～100 nm，可使光发生明显散射，形成丁达尔效应；溶液现象不明显。",D:"错误。改正：常见CuSO₄溶液不呈明显丁达尔效应，现象方向说反了。"},"chem-c1-04":{A:"错误。改正：NaHSO₄能电离出Na⁺、H⁺和SO₄²⁻，电离出的阳离子不全是H⁺，属于酸式盐。",B:"错误。改正：Na₂O₂与酸反应还会放出O₂，阴离子为O₂²⁻，属于过氧化物而非碱性氧化物。",C:"正确。CO₂与碱反应只生成盐和水，符合酸性氧化物的定义。",D:"错误。改正：铜能导电但属于单质，电解质首先必须是化合物。"},"chem-c2-03":{A:"错误。改正：该式遗漏了BaSO₄沉淀，不能表示Ba(OH)₂与H₂SO₄的完整反应。",B:"错误。改正：该式遗漏了H⁺与OH⁻生成水，仅写沉淀也不完整。",C:"正确。1 mol Ba²⁺、2 mol OH⁻分别与1 mol SO₄²⁻、2 mol H⁺反应，生成BaSO₄和2H₂O。",D:"错误。改正：离子数和电荷均未配平，1个Ba²⁺与2个OH⁻需对应2个H⁺和1个SO₄²⁻。"},"chem-c2-04":{A:"错误。改正：该式表示H⁺足量时的总反应，不是逐滴加入初期少量H⁺的主要反应。",B:"正确。开始时H⁺相对少量，先与CO₃²⁻反应生成HCO₃⁻。",C:"错误。改正：HCO₃⁻是第一阶段生成的中间物，随后才在H⁺继续增加时放出CO₂。",D:"错误。改正：H⁺和Cl⁻不是生成HCl，盐酸在此提供H⁺参与反应，Cl⁻是旁观离子。"},"chem-c3-03":{A:"错误。改正：1 mol Cl₂中发生1 mol Cl由0价降至-1价，转移1 mol电子，不是0.5 mol。",B:"正确。同一Cl₂中，一个Cl得1e⁻，另一个Cl失1e⁻，按单方向计为1 mol电子转移。",C:"错误。改正：2 mol是每个Cl价态变化绝对值之和，不能把得失电子重复相加。",D:"错误。改正：题干只有1 mol Cl₂，不可能转移4 mol电子。"},"chem-c3-04":{A:"错误。改正：KClO₃中+5价Cl降到0价需得到5 mol电子，不能只氧化1 mol HCl。",B:"错误。改正：3 mol只是产物Cl₂的物质的量，被氧化的HCl还需按电子守恒计算。",C:"正确。KClO₃中Cl得5e⁻，5 mol HCl中的Cl⁻失电子生成Cl₂，另1 mol HCl形成KCl未被氧化。",D:"错误。改正：6 mol是参加反应的HCl总量，其中只有5 mol被氧化。"},"chem-c4-03":{A:"错误。改正：NaHCO₃提供HCO₃⁻，不能拆成CO₃²⁻，该式对应碳酸盐与足量酸反应。",B:"正确。Na⁺为旁观离子，HCO₃⁻与H⁺反应生成CO₂和H₂O。",C:"错误。改正：Na⁺与Cl⁻没有生成难电离或难溶物质，不写成反应。",D:"错误。改正：NaHCO₃可溶，应拆为Na⁺和HCO₃⁻，不能保留整体化学式。"},"chem-c4-04":{A:"错误。改正：每个Na₂O₂中氧元素平均发生1个电子转移，1 mol Na₂O₂对应1 mol电子，不是0.5 mol。",B:"正确。2 mol Na₂O₂反应时转移2 mol电子，因此1 mol Na₂O₂转移1 mol电子。",C:"错误。改正：2 mol是把1 mol Na₂O₂中两分子氧都重复计算或未按反应系数折算。",D:"错误。改正：4 mol与题干物质的量和氧的价态变化均不匹配。"},"chem-c5-03":{A:"错误。改正：Cl₂中Cl由0价同时变为-1和+1价，不只被氧化。",B:"错误。改正：Cl₂同时被氧化、被还原，只被还原会遗漏ClO⁻的生成。",C:"正确。Cl₂中一部分Cl得电子生成NaCl，另一部分失电子生成NaClO，属于歧化反应。",D:"错误。改正：Cl元素化合价发生变化，该反应是氧化还原反应。"},"chem-c5-04":{A:"错误。改正：n(Cl₂)=0.5 mol，由2Fe+3Cl₂→2FeCl₃，n(FeCl₃)=0.5×2/3=1/3 mol。",B:"正确。Cl₂与FeCl₃的物质的量关系为3:2，0.5 mol Cl₂生成1/3 mol FeCl₃。",C:"错误。改正：0.5 mol是Cl₂的物质的量，不能直接当成FeCl₃的物质的量。",D:"错误。改正：2/3 mol没有按3 mol Cl₂对应2 mol FeCl₃的系数比缩放。"},"chem-c6-03":{A:"错误。改正：0.5 mol Na₂SO₄含1 mol Na⁺，约为6.02×10²³，不是3.01×10²³。",B:"正确。n(Na⁺)=0.5×2=1 mol，因此约含6.02×10²³个Na⁺。",C:"错误。改正：1.204×10²⁴对应2 mol Na⁺，是题干物质的量再次乘2后多算了一倍。",D:"错误。改正：2.408×10²⁴对应4 mol Na⁺，与Na₂SO₄组成不符。"},"chem-c6-04":{A:"错误。改正：O₂与O₃单个分子质量比为2:3，相同质量下分子数比应为3:2，不是直接bc/a。",B:"正确。O₂与O₃单个分子质量比为32:48=2:3，同质量时分子数比为3:2，因此c g O₃的分子数为2bc/(3a)。",C:"错误。改正：3bc/(2a)把O₂与O₃的分子数比写反。",D:"错误。改正：ac/b量纲和比例关系均不成立。"},"chem-c7-03":{A:"错误。改正：同温同压同体积只保证分子数相同，气体摩尔质量可能不同，质量不一定相同。",B:"错误。改正：不同气体的摩尔质量可以不同，题设不能保证摩尔质量相同。",C:"正确。由阿伏加德罗定律，同温同压同体积气体含有相同物质的量，因此分子数相同。",D:"错误。改正：分子数相同不代表分子内原子数相同，例如O₂和O₃的原子总数不同。"},"chem-c7-04":{A:"错误。改正：总物质的量为0.3 mol，若1:1则各0.15 mol，总质量为4.5 g，不是5.8 g。",B:"正确。n(H₂)=0.1 mol、n(CO)=0.2 mol，同温同压下体积比等于物质的量比1:2。",C:"错误。改正：2:1对应总质量约9.6 g，不符合5.8 g。",D:"错误。改正：3:2对应总质量约11.0 g，不符合题设。"},"bio-b1-03":{A:"错误。改正：蓝细菌是原核生物，没有叶绿体，不能把“能光合作用”等同于“有叶绿体”。",B:"错误。改正：蓝细菌没有核膜包被的细胞核，不能以此解释光合作用。",C:"正确。蓝细菌含藻蓝素和叶绿素等光合色素，可直接进行光合作用。",D:"错误。改正：蓝细菌属于原核生物，不是真核生物。"},"bio-b1-04":{A:"错误。改正：甲有成形细胞核只能确定为真核细胞，不能据此断定一定是植物细胞。",B:"正确。乙有拟核和光合色素、无叶绿体，符合蓝细菌特征。",C:"错误。改正：甲若是动物细胞则没有细胞壁，不能断言甲一定具有细胞壁。",D:"错误。改正：二者的遗传物质都是DNA，染色体不是遗传物质本身，且不能作“唯一遗传物质”表述。"},"bio-b2-03":{A:"错误。改正：氨基酸种类不同是蛋白质多样性的原因之一。",B:"错误。改正：氨基酸数目不同是蛋白质多样性的原因之一。",C:"错误。改正：氨基酸排列顺序不同是蛋白质多样性的原因之一。",D:"正确。若所有蛋白质都由相同数量氨基酸组成，会削弱多样性，不属于多样性原因。"},"bio-b2-04":{A:"错误。改正：结合水比例升高通常使代谢减弱，不能推出代谢一定增强。",B:"正确。结合水比例相对增加有利于维持结构稳定，提高抗逆性。",C:"错误。改正：比值升高不等于自由水完全消失。",D:"错误。改正：结合水是细胞结构的重要组成成分。"},"bio-b3-03":{A:"正确。附着在内质网上的核糖体先合成肽链，随后经内质网、高尔基体加工，再由囊泡运至细胞膜分泌。",B:"错误。改正：内质网不先于核糖体，蛋白质的合成起点是核糖体。",C:"错误。改正：该路径顺序完全颠倒，高尔基体应在内质网之后。",D:"错误。改正：线粒体主要供能，不是分泌蛋白加工运输依次经过的结构。"},"bio-b3-04":{A:"错误。改正：生物膜系统还包括细胞器膜和核膜，不只是细胞膜。",B:"正确。不同生物膜功能不同，蛋白质种类和数量可能有差异。",C:"错误。改正：不同生物膜的脂质组成、蛋白质和功能存在差异，不能断言完全相同。",D:"错误。改正：核糖体没有膜结构，不属于生物膜系统。"},"bio-b4-03":{A:"错误。改正：核膜是双层膜，且不是所有分子都能自由通过。",B:"正确。核仁与核糖体的形成有关。",C:"错误。改正：核孔具有选择性，通常不允许DNA自由进出，mRNA和某些蛋白质可通过。",D:"错误。改正：染色质在细胞核内，不是核外合成。"}},L0=[...B2.fil
