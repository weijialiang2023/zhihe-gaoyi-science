subject:"chemistry",topicId:"chem-ion",difficulty:4,examStyle:"离子共存 · 隐蔽氧化还原",stem:"常温下，下列各组离子在指定溶液中能大量共存的是",options:["无色透明溶液：MnO₄⁻、K⁺、Cl⁻、SO₄²⁻","c(H⁺)=0.1 mol·L⁻¹：Fe²⁺、NO₃⁻、Na⁺、SO₄²⁻","含大量Ba²⁺的溶液：Na⁺、Cl⁻、SO₄²⁻、NO₃⁻","c(OH⁻)=0.1 mol·L⁻¹：Na⁺、K⁺、Cl⁻、NO₃⁻"],answer:3,notes:["错误。改正：MnO₄⁻呈紫红色，不符合“无色”；酸性条件下还可能氧化Cl⁻。","错误。改正：酸性条件下NO₃⁻具有氧化性，会把Fe²⁺氧化为Fe³⁺。","错误。改正：Ba²⁺与SO₄²⁻生成难溶的BaSO₄，不能大量共存。","正确。四种离子均无色，彼此不生成沉淀、气体或弱电解质，且都能在碱性溶液中稳定存在。"],analysis:"离子共存题先按题干限定条件筛选。酸性硝酸根与Fe²⁺、Ba²⁺与SO₄²⁻是高频组合，不能只检查离子颜色。",steps:["圈出无色、酸性或碱性等限制。","检查沉淀、气体、弱电解质。","最后检查氧化还原共存。"],tip:"看见NO₃⁻和H⁺同时出现，就要想到氧化性。"}),ge({id:"premium-chem-c2-02",subject:"chemistry",topicId:"chem-ion",difficulty:4,examStyle:"定量离子方程式 · 顺序与配比",stem:"向Ba(OH)₂溶液中逐滴加入NaHSO₄溶液，当沉淀的物质的量达到最大值时，溶液中大量存在的离子是",options:["Ba²⁺、Na⁺、OH⁻","Na⁺、OH⁻、SO₄²⁻","Ba²⁺、Na⁺、SO₄²⁻","Na⁺、SO₄²⁻、H⁺"],answer:1,notes:["错误。改正：沉淀最大时Ba²⁺与加入的SO₄²⁻恰好完全反应，Ba²⁺不能大量存在。","正确。此时1 mol Ba²⁺对应加入1 mol SO₄²⁻和1 mol H⁺，原溶液中的2 mol OH⁻只剩1 mol；Na⁺不参与反应。","错误。改正：SO₄²⁻已与Ba²⁺生成BaSO₄沉淀，不能与Ba²⁺同时大量存在。","错误。改正：Ba(OH)₂中的OH⁻过量，加入的H⁺会被中和，不能大量共存。"],analysis:"沉淀最大时，每1 mol Ba²⁺需加入1 mol SO₄²⁻；同浓度NaHSO₄同时提供等量Na⁺和H⁺。原溶液有2 mol OH⁻，只被中和1 mol，因此剩余Na⁺和OH⁻。",steps:["设Ba(OH)₂为1 mol，则Ba²⁺为1 mol、OH⁻为2 mol。","加入1 mol NaHSO₄时SO₄²⁻恰好完全沉淀。","同时引入1 mol Na⁺和1 mol H⁺，H⁺中和1 mol OH⁻。"],tip:"“沉淀最大”与“溶液中性”不是同一个时刻。"}),ge({id:"premium-chem-c2-03",subject:"chemistry",topicId:"chem-ion",difficulty:5,examStyle:"离子定量推断 · 电荷守恒",stem:"某100 mL无色溶液可能含Na⁺、Mg²⁺、Cl⁻、NO₃⁻、SO₄²⁻。测得c(Na⁺)=0.30 mol·L⁻¹；加入足量BaCl₂得到2.33 g沉淀；另取同体积溶液加入足量NaOH得到0.58 g沉淀。下列判断正确的是",options:["原溶液中c(Mg²⁺)=0.20 mol·L⁻¹","原溶液中n(SO₄²⁻)=0.020 mol","Cl⁻一定存在，NO₃⁻一定不存在","Cl⁻与NO₃⁻的总物质的量为0.030 mol"],answer:3,notes:["错误。改正：0.58 g Mg(OH)₂为0.010 mol，所以c(Mg²⁺)=0.010÷0.100=0.10 mol·L⁻¹。","错误。改正：2.33 g BaSO₄只有0.010 mol，因此原溶液中SO₄²⁻为0.010 mol，不是0.020 mol。","错误。改正：Cl⁻和NO₃⁻的总量可确定，但二者各自含量无法由现有数据区分，不能作“一定”判断。","正确。阳离子电荷总量为0.030+0.010×2=0.050 mol，SO₄²⁻负电荷为0.020 mol，剩余0.030 mol需由Cl⁻、NO₃⁻共同平衡。"],analysis:"先把沉淀质量换算成物质的量，再比较阳、阴离子总电荷。100 mL中Na⁺为0.030 mol、Mg²⁺为0.010 mol、SO₄²⁻为0.010 mol。阳离子所带正电荷0.050 mol，SO₄²⁻所带负电荷0.020 mol，因此一价阴离子Cl⁻与NO₃⁻总量为0.030 mol。",steps:["n(Na⁺)=cV=0.030 mol。","n(Mg²⁺)=n[Mg(OH)₂]=0.010 mol。","n(SO₄²⁻)=n(BaSO₄)=0.010 mol。","按电荷守恒求n(Cl⁻)+n(NO₃⁻)。"],tip:"离子推断只对数据能唯一确定的结论负责。"}),ge({id:"premium-chem-c3-01",subject:"chemistry",topicId:"chem-redox",difficulty:4,examStyle:"歧化反应 · 电子转移",stem:"反应3Cl₂+6KOH(热、浓)→5KCl+KClO₃+3H₂O中，每生成1 mol KClO₃，转移电子的物质的量为",options:["1 mol","3 mol","5 mol","6 mol"],answer:2,notes:["错误。改正：KClO₃中Cl由0价升到+5价，生成1 mol KClO₃至少失去5 mol电子。","错误。改正：3 mol氯气中含有6 mol Cl原子，其中1 mol变为+5价、5 mol变为-1价，不能只看KClO₃系数。","正确。1 mol Cl由0价升到+5价失去5 mol电子；同时5 mol Cl由0价降到-1价得到5 mol电子，转移电子为5 mol。","错误。改正：6 mol是参与反应的Cl原子总数；被氧化的只有生成KClO₃的那1 mol Cl。"],analysis:"这是Cl₂在热、浓碱中的歧化反应。电子转移量只取单方向：生成1 mol KClO₃时，Cl失去5 mol电子；另5 mol Cl共得到5 mol电子。",steps:["标出所有Cl原子的价态变化。","找出被氧化的Cl为+5价产物。","按1 mol产物计算单方向转移电子数。"],tip:"不要把参加反应的原子总数当成电子转移数。",diagram:"redox"}),ge({id:"premium-chem-c3-02",subject:"chemistry",topicId:"chem-redox",difficulty:4,examStyle:"氧化还原 · 双元素变价",stem:"在NH₄NO₃受热分解反应中，部分氮元素被氧化、部分氮元素被还原。下列说法正确的是",options:["NH₄⁺中的N只可能被还原","NO₃⁻中的N只可能被氧化","产物中N₂既是氧化产物又是还原产物","该反应中得失电子总数可以不相等"],answer:2,notes:["错误。改正：NH₄⁺中N为-3价，最高可升到0价，因此可能被氧化。","错误。改正：NO₃⁻中N为+5价，最低可降到0价，因此可能被还原。","正确。某些分解反应可同时生成N₂和含氮氧化物，N₂可由-3价和+5价氮共同形成，既含氧化产物也含还原产物。","错误。改正：任何氧化还原反应中，失电子总数与得电子总数必须相等。"],analysis:"NH₄NO₃同时含-3价N和+5价N，具有发生分子内氧化还原的条件。若两者都变为0价N₂，则-3价N被氧化、+5价N被还原，N₂同时具有氧化产物和还原产物身份。",steps:["分别标出NH₄⁺与NO₃⁻中N的化合价。","判断最高价和最低价对应的变化方向。","用产物N₂的来源解释其双重身份。"],tip:"同一物质中的不同元素或不同价态可能分别发生氧化和还原。",diagram:"redox"}),ge({id:"premium-chem-c3-03",subject:"chemistry",topicId:"chem-redox",difficulty:5,examStyle:"氧化性排序 · 证据链",stem:"已知：①2Fe³⁺+Cu→2Fe²⁺+Cu²⁺；②Cu²⁺+Fe→Fe²⁺+Cu；③2I⁻+2Fe³⁺→I₂+2Fe²⁺。下列由这些反应能够直接推出的是",options:["氧化性：Fe³⁺>Cu²⁺>Fe²⁺，且Fe³⁺>I₂","氧化性：Cu²⁺>Fe³⁺>I₂","氧化性：I₂>Fe³⁺>Cu²⁺","还原性：Cu>Fe>I⁻"],answer:0,notes:["正确。由①得Fe³⁺>Cu²⁺，由②得Cu²⁺>Fe²⁺，由③得Fe³⁺>I₂；这些都是三条反应直接支持的关系。","错误。改正：①说明Fe³⁺能氧化Cu，因此氧化性Fe³⁺>Cu²⁺，不是Cu²⁺>Fe³⁺。","错误。改正：③说明Fe³⁺能氧化I⁻，因此Fe³⁺>I₂，方向写反。","错误。改正：②只能推出Fe的还原性大于Cu；不能把I⁻与金属还原剂的完整强弱顺序由题干三条反应直接推出。"],analysis:"氧化还原反应中，氧化剂把还原剂氧化。①给出Fe³⁺>Cu²⁺，②给出Cu²⁺>Fe²⁺，③给出Fe³⁺>I₂。题干只能直接确定这些关系，不能凭空补出Fe²⁺与I₂的强弱。",steps:["在每条反应中标出氧化剂和对应还原产物。","用“强氧化剂生成弱氧化剂”建立不等关系。","只选择题干证据能够直接支持的排序。"],tip:"比较氧化性时要区分“可推出”与“按记忆补全”。"}),ge({id:"premium-chem-c4-01",subject:"chemistry",topicId:"chem-sodium",difficulty:3,examStyle:"过氧化钠 · 气体体积",stem:"标准状况下，7.8 g Na₂O₂与足量水完全反应，生成O₂的体积约为",options:["1.12 L","2.24 L","4.48 L","7.80 L"],answer:0,notes:["正确。n(Na₂O₂)=7.8÷78=0.10 mol，由2Na₂O₂→O₂可知n(O₂)=0.05 mol，V=0.05×22.4=1.12 L。","错误。改正：2.24 L对应0.10 mol O₂，错误地把Na₂O₂与O₂按1:1转换。","错误。改正：4.48 L对应0.20 mol O₂，超过由0.10 mol Na₂O₂能够生成的上限。","错误。改正：7.80 L没有按标准状况气体摩尔体积和方程式系数换算。"],analysis:"先由质量求物质的量，再按反应2Na₂O₂+2H₂O→4NaOH+O₂↑的系数比求氧气，最后在标准状况下换算体积。",steps:["M(Na₂O₂)=78 g·mol⁻¹，n=7.8/78=0.10 mol。","n(O₂)=0.10/2=0.05 mol。","V=0.05×22.4=1.12 L。"],tip:"Na₂O₂与O₂的系数比是2:1。",diagram:"gas"}),ge({id:"premium-chem-c4-02",subject:"chemistry",topicId:"chem-sodium",difficulty:4,examStyle:"碳酸盐 · 图像型定量",stem:"向100 mL Na₂CO₃和NaHCO₃的混合溶液中逐滴加入1.00 mol·L⁻¹盐酸，依次发生两步反应。若第一、第二阶段消耗盐酸的体积比为1:2，则原溶液中n(Na₂CO₃):n(NaHCO₃)为",options:["1:1","1:2","2:1","3:1"],answer:0,notes:["正确。第一阶段消耗的H⁺等于n(Na₂CO₃)；第二阶段消耗的H⁺等于n(Na₂CO₃)+n(NaHCO₃)。两阶段之比为1:2，可推出两者物质的量相等。","错误。改正：若为1:2，设Na₂CO₃为a、NaHCO₃为b，则第二阶段耗酸a+b=2a，得b=a，不能是1:2。","错误。改正：2:1会使第二阶段耗酸a+b=0.5a，不符合第二阶段反而更多的题设。","错误。改正：3:1会使第二阶段耗酸只有第一阶段的1/3，与题设顺序相反。"],analysis:"设原Na₂CO₃为a mol、NaHCO₃为b mol。第一阶段只消耗a mol H⁺；第二阶段先消耗a mol把新生成的HCO₃⁻反应完，再消耗b mol与原NaHCO₃反应，故第二阶段为a+b mol。由(a+b):a=2:1得b=a，因此原比例为1:1。",steps:["写出两阶段离子方程式。","第一阶段耗酸a mol，第二阶段耗酸a+b mol。","按1:2联立，得到a=b。"],tip:"第二阶段还要消耗第一步新生成的HCO₃⁻。"}),ge({id:"premium-chem-c4-03",subject:"chemistry",topicId:"chem-sodium",difficulty:5,examStyle:"过氧化钠 · 平均组成",stem:"标准状况下，2.24 L CO₂和H₂O(g)的混合气体通过足量Na₂O₂，固体质量增加1.5 g。原混合气体中CO₂的体积分数为",options:["25%","50%","75%","无法确定"],answer:1,notes:["错误。改正：25%时总物质的量为0.10 mol，CO₂为0.025 mol，按净增重28x+2(0.10-x)计算，增重约2.70 g。","正确。总物质的量0.10 mol。设CO₂为x mol，则28x+2(0.10-x)=1.5，得x=0.05 mol，体积分数50%。","错误。改正：75%时CO₂为0.075 mol，计算出的固体增重不是1.5 g。","错误。改正：总物质的量、总增重均已给出，可建立一元一次方程，因此能唯一确定组成。"],analysis:"CO₂与Na₂O₂反应，每1 mol CO₂使固体净增重28 g；H₂O(g)反应每1 mol净增重2 g。总气体为0.10 mol，利用总增重列方程即可求CO₂。",steps:["n(总)=2.24/22.4=0.10 mol。","28x+2(0.10-x)=1.5。","解得x=0.05 mol，体积分数为50%。"],tip:"净增重要按反应前后固体质量差计算，不能直接使用气体总质量。",diagram:"gas"}),ge({id:"premium-chem-c5-01",subject:"chemistry",topicId:"chem-chlorine",difficulty:3,examStyle:"氯水微粒 · 现象对应",stem:"新制氯水中存在多种微粒。下列实验现象与微粒对应正确的是",options:["滴加紫色石蕊溶液先变红后褪色，只说明含HClO","加入AgNO₃产生白色沉淀，说明含Cl⁻","加入NaHCO₃产生气体，说明含Cl₂","干燥有色布条放入干燥氯气中褪色，说明Cl₂有漂白性"],answer:1,notes:["错误。改正：先变红主要说明含H⁺，后褪色主要说明含HClO，不能只归因于一种微粒。","正确。Cl⁻与Ag⁺生成白色AgCl沉淀。","错误。改正：HCO₃⁻与H⁺反应放出CO₂，气体现象主要对应H⁺。","错误。改正：干燥氯气不能提供HClO，不能使干燥有色布条褪色。"],analysis:"新制氯水中包含Cl₂、H₂O、HClO、H⁺、Cl⁻和ClO⁻等。解释现象时必须找真正起作用的微粒，尤其不能把漂白性直接归于Cl₂。",steps:["先列出氯水中的主要微粒。","把颜色、沉淀和气体现象分别对应到H⁺、Cl⁻、HClO。","用“干燥氯气”条件检验漂白性结论。"],tip:"氯气与氯水不是同一概念，漂白微粒是HClO。"}),ge({id:"premium-chem-c5-02",subject:"chemistry",topicId:"chem-chlorine",difficulty:4,examStyle:"氯碱反应 · 温度条件",stem:"下列有关氯气与碱溶液反应的说法正确的是",options:["Cl₂与冷、稀NaOH溶液生成NaClO₃","Cl₂与热、浓NaOH溶液只生成NaCl","两种条件下Cl₂都只作氧化剂","温度不同可导致Cl₂歧化的产物不同"],answer:3,notes:["错误。改正：冷、稀碱中主要生成NaClO，NaClO₃主要出现在热、浓碱条件。","错误。改正：热、浓碱中生成NaCl、NaClO₃和水，不是只生成NaCl。","错误。改正：Cl₂中Cl由0价同时升到+1或+5价、降到-1价，既被氧化又被还原。","正确。Cl₂+2OH⁻→Cl⁻+ClO⁻+H₂O在冷、稀条件下更明显；加热、浓碱时可生成ClO₃⁻，产物随条件改变。"],analysis:"氯气与碱反应本质是Cl的歧化。产物既受碱的浓度影响，也受温度影响：冷稀条件偏ClO⁻，热浓条件可进一步变为ClO₃⁻。",steps:["写出冷、稀条件下的主要方程式。","比较热、浓条件下的高价产物。","用Cl的价态变化判断氧化剂、还原剂身份。"],tip:"同一反应物在不同温度、浓度下可能得到不同产物。",diagram:"redox"}),ge({id:"premium-chem-c5-03",subject:"chemistry",topicId:"chem-chlorine",difficulty:5,examStyle:"漂白液 · 氧化还原定量",stem:"向漂白液中加入足量KI并酸化，ClO⁻被还原为Cl⁻，I⁻被氧化为I₂。若反应中生成0.10 mol I₂，则被还原的ClO⁻为",options:["0.05 mol","0.10 mol","0.20 mol","0.40 mol"],answer:1,notes:["错误。改正：ClO⁻中Cl为+1价，降为-1价得到2个电子，不能按1个电子计算。","正确。生成0.10 mol I₂时I⁻共失去0.20 mol电子；每个ClO⁻得到2 mol电子，因此n(ClO⁻)=0.20/2=0.10 mol。","错误。改正：0.20 mol是没有除以2的结果，错把电子物质的量直接当成ClO⁻物质的量。","错误。改正：0.40 mol会使得电子总数达到0.80 mol，明显超过I⁻实际失去的0.20 mol。"],analysis:"I⁻→I₂中每个I由-1变为0，生成1 mol I₂失去2 mol电子；ClO⁻→Cl⁻中每个Cl由+1降为-1，得到2 mol电子。生成0.10 mol I₂时，失电子0.20 mol，因此ClO⁻应为0.10 mol。",steps:["2I⁻→I₂+2e⁻。","ClO⁻+2e⁻+2H⁺→Cl⁻+H₂O。","n(I₂)=0.10 mol对应n(e⁻)=0.20 mol，n(ClO⁻)=0.10 mol。"],tip:"先写半反应，再用电子守恒换算。",diagram:"redox"}),ge({id:"premium-chem-c6-01",subject:"chemistry",topicId:"chem-mole",difficulty:3,examStyle:"阿伏加德罗常数 · 离子数",stem:"设Nₐ为阿伏加德罗常数的值。1 mol Na₂O₂中所含离子的总物质的量为",options:["1 mol","2 mol","3 mol","4 mol"],answer:2,notes:["错误。改正：Na₂O₂由2 mol Na⁺和1 mol O₂²⁻组成，不能只数一种离子。","错误。改正：2 mol只数了Na⁺，遗漏了过氧根离子。","正确。1 mol Na₂O₂含2 mol Na⁺和1 mol O₂²⁻，总离子数为3 mol。","错误。改正：Na₂O₂中不存在2个独立的O²⁻，氧元素以O₂²⁻整体存在。"],analysis:"Na₂O₂是离子化合物，但阴离子不是O²⁻，而是过氧根离子O₂²⁻。因此1个化学式单位对应3个离子。",steps:["写出Na₂O₂的离子组成。","确认过氧根是一个整体阴离子。","按2 mol Na⁺+1 mol O₂²⁻求和。"],tip:"不要把Na₂O₂看成Na₂O加一个O原子。"}),ge({id:"premium-chem-c6-02",subject:"chemistry",topicId:"chem-mole",difficulty:4,examStyle:"等质量气体 · 微粒数",stem:"相同质量的O₂和O₃中，下列物理量一定相等的是",options:["分子数","氧原子数","物质的量","标准状况下体积"],answer:1,notes:["错误。改正：等质量时分子数之比与摩尔质量成反比，O₂分子数多于O₃。","正确。两种物质均只由氧原子组成，质量相同即氧原子的总质量相同，因此氧原子数相等。","错误。改正：n=m/M，质量相同而摩尔质量不同，物质的量不同。","错误。改正：气体体积取决于物质的量，O₂与O₃分子数不同，体积也不同。"],analysis:"O₂与O₃都由氧元素组成。等质量意味着氧原子总质量相同，故氧原子数必相等；分子数、物质的量和体积还取决于单个分子的质量。",steps:["把O₂、O₃都拆成氧原子来比较。","等质量→等原子总质量→等原子数。","排除取决于摩尔质量的物理量。"],tip:"同素异形体等质量问题，先从共同组成元素入手。"}),ge({id:"premium-chem-c6-03",subject:"chemistry",topicId:"chem-mole",difficulty:5,examStyle:"溶液组成 · 符号陷阱",stem:"0.1 mol·L⁻¹ Na₂SO₄溶液100 mL中，下列说法正确的是",options:["含Na⁺的数目约为1.204×10²²","含SO₄²⁻的物质的量为0.02 mol","含Na₂SO₄的物质的量为0.1 mol","稀释至1 L后，c(Na⁺)=0.1 mol·L⁻¹"],answer:0,notes:["正确。n(Na₂SO₄)=0.1×0.100=0.010 mol，n(Na⁺)=0.020 mol，离子数约为1.204×10²²。","错误。改正：SO₄²⁻与Na₂SO₄的物质的量之比为1:1，应为0.010 mol。","错误。改正：n=cV=0.1×0.100=0.010 mol，不是0.1 mol。","错误。改正：稀释10倍后c(Na₂SO₄)=0.010 mol·L⁻¹，因此c(Na⁺)=0.020 mol·L⁻¹。"],analysis:"溶液计算分三步：n(溶质)=cV，再按化学式求离子数，最后按稀释前后溶质物质的量守恒求新浓度。100 mL是0.100 L，不能把0.1 mol·L⁻¹直接当作物质的量。",steps:["n(Na₂SO₄)=0.1×0.1=0.01 mol。","n(Na⁺)=2×0.01=0.02 mol。","稀释后体积变10倍，浓度变为原来的1/10。"],tip:"浓度乘体积时先统一为升。"}),ge({id:"premium-chem-c7-01",subject:"chemistry",topicId:"chem-gas",difficulty:3,examStyle:"气体摩尔体积 · 条件陷阱",stem:"下列物质中，在标准状况下体积约为22.4 L的是",options:["1 mol H₂O","1 mol NaCl","1 mol CO₂","1 mol Fe"],answer:2,notes:["错误。改正：标准状况下水不是气体，不能用22.4 L·mol⁻¹。","错误。改正：NaCl是固体，体积由其密度决定，不能用气体摩尔体积。","正确。标准状况下CO₂为气体，1 mol体积约为22.4 L。","错误。改正：铁是固体，不能用22.4 L·mol⁻¹换算。"],analysis:"22.4 L·mol⁻¹只适用于标准状况下的气体。判断时必须同时满足温度和压强、物质状态两个条件。",steps:["确认条件是否标准状况。","确认研究对象在标准状况下是否为气体。","只有CO₂满足两条件。"],tip:"不要求“理想气体”，但必须是实际状态下的气体。",diagram:"gas"}),ge({id:"premium-chem-c7-02",subject:"chemistry",topicId:"chem-gas",difficulty:4,examStyle:"阿伏加德罗定律 · 密度比较",stem:"同温同压下，体积相同的N₂和O₃具有相同的",options:["质量","密度","分子数","原子数"],answer:2,notes:["错误。改正：同体积同条件下物质的量相同，但N₂与O₃摩尔质量不同，质量不同。","错误。改正：密度=m/V，二者质量不同而体积相同，因此密度不同。","正确。同温同压、同体积的气体含有相同物质的量，因此分子数相同。","错误。改正：N₂和O₃分子数相同，但每个分子所含原子数不同，因此原子总数不同。"],analysis:"同温同压下同体积气体分子数相同，这是阿伏加德罗定律的直接结论。质量、密度和原子总数还取决于摩尔质量及单个分子的组成。",steps:["由阿伏加德罗定律得n(N₂)=n(O₃)。","分子数与物质的量成正比，所以分子数相同。","N₂为双原子分子、O₃为三原子分子，因此原子总数不同。"],tip:"相同分子数不一定有相同原子数。",diagram:"gas"}),ge({id:"premium-chem-c7-03",subject:"chemistry",topicId:"chem-gas",difficulty:5,examStyle:"混合气体 · 平均摩尔质量",stem:"标准状况下，5.6 L CO和CO₂的混合气体质量为9.0 g。混合气体中CO与CO₂的物质的量之比为",options:["1:1","1:2","2:1","3:2"],answer:0,notes:["正确。总物质的量=5.6/22.4=0.25 mol；设CO为x mol，则28x+44(0.25-x)=9.0，解得x=0.125 mol，两者各0.125 mol，比为1:1。","错误。改正：1:2时总质量约为9.67 g，不符合9.0 g。","错误。改正：2:1时总质量约为8.33 g，不符合9.0 g。","错误。改正：3:2时总质量约为8.4 g，不符合9.0 g。"],analysis:"混合气体题通常需要两个方程：总物质的量由标准状况体积求出，总质量由题给条件列出。设CO为x，则CO₂为0.25-x，代入质量和求x。",steps:["n(总)=5.6/22.4=0.25 mol。","28x+44(0.25-x)=9.0。","解得x=0.125 mol，n(CO₂)=0.125 mol。"],tip:"CO与CO₂摩尔质量分别为28和44 g·mol⁻¹。",diagram:"gas"}),ge({id:"premium-bio-b1-01",subject:"biology",topicId:"bio-cell-intro",difficulty:3,examStyle:"显微镜 · 放大与视野",stem:"使用显微镜观察细胞时，由低倍镜换成高倍镜后，下列变化正确的是",options:["视野范围变大","观察到的细胞数目变多","视野亮度通常变暗","应先用粗准焦螺旋大幅调焦"],answer:2,notes:["错误。改正：放大倍数越大，视野范围越小。","错误。改正：放大倍数增大后，同一视野内看到的细胞数目通常会减少。","正确。高倍镜进光量相对减少，视野通常变暗，可适当调大光圈或使用凹面镜。","错误。改正：高倍镜工作距离小，应使用细准焦螺旋，避免压坏装片或镜头。"],analysis:"显微镜总放大倍数约为目镜倍数×物镜倍数。放大倍数增大，物像变大但视野变小、细胞数目减少、亮度降低。高倍镜调焦必须细调。",steps:["先判断放大倍数是否增大。","由放大倍数与视野范围的反向关系排除A、B。","结合高倍镜使用规范判断C、D。"],tip:"高倍镜不是“看得更多”，而是“看得更大”。"}),ge({id:"premium-bio-b1-02",subject:"biology",topicId:"bio-cell-intro",difficulty:4,examStyle:"原核与真核 · 共同结构",stem:"下列关于原核细胞与真核细胞的比较，正确的是",options:["原核细胞没有核糖体","真核细胞都有叶绿体","原核细胞与真核细胞都有细胞膜和核糖体","原核细胞的遗传物质不是DNA"],answer:2,notes:["错误。改正：原核细胞虽然没有核膜包被的细胞核，但具有核糖体。","错误。改正：动物细胞等真核细胞通常没有叶绿体，叶绿体不是真核细胞的共有结构。","正确。细胞膜控制物质进出，核糖体合成蛋白质，是原核、真核细胞的共同结构。","错误。改正：原核细胞的遗传物质也是DNA，只是主要分布在拟核中。"],analysis:"比较原核与真核细胞要先看共有结构，再看差异。二者都有细胞膜、细胞质、核糖体和DNA；核心差异是真核细胞有核膜包被的细胞核。",steps:["先排除把“没有核膜”扩大成“没有细胞核糖体”的说法。","确认细胞膜与核糖体的普遍性。","再比较遗传物质和膜性细胞器。"],tip:"原核与真核的共同点常比差异更容易被忽略。"}),ge({id:"premium-bio-b1-03",subject:"biology",topicId:"bio-cell-intro",difficulty:5,examStyle:"病毒与生命活动 · 概念边界",stem:"下列关于病毒和细胞生命活动的叙述，正确的是",options:["病毒含核酸和蛋白质，因此属于原核生物","病毒可在营养丰富的培养基中独立增殖","病毒必须依赖宿主活细胞的代谢系统完成增殖","所有生命活动都可以脱离细胞完成"],answer:2,notes:["错误。改正：病毒没有细胞结构，不是原核生物；有无核酸和蛋白质不能决定其属于原核生物。","错误。改正：病毒缺少独立的代谢和蛋白质合成系统，普通培养基不能使其增殖，必须进入宿主活细胞。","正确。病毒只能利用宿主细胞的原料、能量和酶系统复制核酸并合成蛋白质。","错误。改正：细胞是生命活动的基本单位，病毒也不能脱离活细胞独立完成增殖。"],analysis:"病毒由核酸和蛋白质等组成，但没有细胞结构，也没有完整代谢系统。它只能在宿主活细胞内复制，因此不能归入原核或真核细胞生物。",steps:["先确认病毒无细胞结构。","判断它是否具备独立代谢能力。","用宿主依赖性解释其增殖方式。"],tip:"有遗传物质不等于有细胞结构。"}),ge({id:"premium-bio-b2-01",subject:"biology",topicId:"bio-elements",difficulty:3,examStyle:"蛋白质 · 脱水缩合",stem:"由100个氨基酸形成一条含2个二硫键的多肽链，若不考虑其他化学键，该多肽链中的肽键数为",options:["98个","99个","100个","102个"],answer:1,notes:["错误。改正：98个是将二硫键误当作肽键扣除了，二硫键不改变肽键数。","正确。一条肽链中肽键数=氨基酸数-1=100-1=99。","错误。改正：100个氨基酸形成一条肽链，不是形成环状多肽，不能等于氨基酸数。","错误。改正：102个没有依据；形成肽键时每个缩合位点形成一个肽键。"],analysis:"脱水缩合时，100个氨基酸首尾相连形成一条链，共形成99个肽键并脱去99个水分子。二硫键是肽链内或链间的额外连接，不计入肽键。",steps:["确认发生的是线性肽链，不是环肽。","肽键数=n(氨基酸)-1。","二硫键只影响空间结构，不改变肽键数。"],tip:"二硫键会把答案“额外减2”吗？不会。"}),ge({id:"premium-bio-b2-02",subject:"biology",topicId:"bio-elements",difficulty:4,examStyle:"细胞中的水 · 抗逆性",stem:"某植物在干旱条件下，细胞内自由水与结合水的比值下降。下列解释最合理的是",options:["细胞代谢强度一定增强","细胞的抗逆性可能增强","细胞内已经没有自由水","结合水不再参与细胞结构组成"],answer:1,notes:["错误。改正：自由水比例下降通常使代谢强度降低，不能推出代谢一定增强。","正确。结合水比例相对增加有助于维持细胞结构稳定，提高对干旱等不良环境的耐受性。","错误。改正：比值下降只说明相对比例变化，不代表自由水完全消失。","错误。改正：结合水是细胞结构的重要组成部分，始终参与结构组成。"],analysis:"自由水多时细胞代谢通常旺盛；结合水比例较高时，细胞结构更稳定、抗逆性更强。题干只给出比值下降，不能把相对比例等同于绝对含量。",steps:["区分自由水与结合水的功能。","由比值变化判断相对趋势，而非绝对为零。","用“可能”而非“一定”表述生物学结论。"],tip:"生物题干中的“比值下降”不等于某种物质消失。"}),ge({id:"premium-bio-b2-03",subject:"biology",topicId:"bio-elements",difficulty:5,examStyle:"有机物检测 · 试剂条件",stem:"下列生物组织中有机物检测方案与预期结果匹配的是",options:["苹果汁+斐林试剂，常温静置，出现砖红色沉淀","豆浆+双缩脲试剂，水浴加热，出现紫色","花生子叶切片+苏丹Ⅲ，染色后镜检可见橘黄色颗粒","马铃薯匀浆+碘液，水浴加热后出现蓝色"],answer:2,notes:["错误。改正：斐林试剂检测还原糖需要水浴加热，常温静置不能得到稳定的砖红色沉淀。","错误。改正：双缩脲反应通常不需水浴加热，蛋白质检测应直接观察紫色。","正确。花生子叶富含脂肪，苏丹Ⅲ可将脂肪染成橘黄色，镜检可见颗粒。","错误。改正：淀粉遇碘变蓝是常温显色，不需要水浴加热。"],analysis:"检测实验要同时掌握检测对象、试剂、颜色和条件。还原糖检测需水浴加热；蛋白质双缩脲反应不需加热；脂肪用苏丹Ⅲ镜检；淀粉遇碘蓝染。",steps:["先判断待检有机物类别。","匹配试剂与特征颜色。","核对是否需要水浴或镜检。"],tip:"“有没有颜色反应”与“是否需要加热”要分开记忆。"}),ge({id:"premium-bio-b3-01",subject:"biology",topicId:"bio-organelles",difficulty:3,examStyle:"分泌蛋白 · 同位素追踪",stem:"用放射性同位素标记氨基酸，追踪胰岛B细胞分泌胰岛素的过程，放射性依次出现的结构是",options:["核糖体→内质网→高尔基体→细胞膜","内质网→核糖体→高尔基体→线粒体","高尔基体→核糖体→内质网→细胞膜","核糖体→线粒体→高尔基体→细胞膜"],answer:0,notes:["正确。分泌蛋白先在核糖体合成，进入内质网初步加工，再由高尔基体加工包装，最后经囊泡运至细胞膜分泌。","错误。改正：合成的起点是核糖体，不应从内质网开始；线粒体主要供能，不是分泌路径末端。","错误。改正：高尔基体负责后期加工包装，不可能先于核糖体和内质网出现放射性。","错误。改正：线粒体提供能量，通常不是分泌蛋白经过的加工和运输结构。"],analysis:"分泌蛋白的合成运输路径为核糖体→内质网→高尔基体→细胞膜。线粒体可通过供能影响过程，但不是蛋白质依次经过的结构。",steps:["从合成场所核糖体起步。","确认内质网和高尔基体的加工先后。","把线粒体作为供能结构而非运输节点。"],tip:"“经过”与“需要能量供应”不是同一含义。"}),ge({id:"premium-bio-b3-02",subject:"biology",topicId:"bio-organelles",difficulty:4,examStyle:"膜结构 · 分类比较",stem:"下列细胞结构中，均不含磷脂分子的组合是",options:["线粒体、叶绿体","核糖体、中心体","高尔基体、内质网","细胞核、溶酶体"],answer:1,notes:["错误。改正：线粒体和叶绿体均有双层膜，膜结构含磷脂。","正确。核糖体和中心体都是无膜细胞器，不含磷脂构成的生物膜。","错误。改正：高尔基体和内质网都有单层膜，含磷脂。","错误。改正：细胞核有双层核膜，溶酶体有单层膜，均含磷脂。"],analysis:"磷脂是生物膜的基本骨架成分之一。有膜结构即含磷脂，无膜细胞器则不含磷脂。线粒体、叶绿体、细胞核为双层膜，内质网、高尔基体、溶酶体为单层膜。",steps:["先判断每个结构有无膜。","排除内膜结构。","确认核糖体、中心体均为无膜结构。"],tip:"核糖体没有膜，却有蛋白质合成功能。"}),ge({id:"premium-bio-b3-03",subject:"biology",topicId:"bio-organelles",difficulty:5,examStyle:"抑制剂实验 · 膜蛋白功能",stem:"某细胞吸收物质甲的速率随甲浓度梯度增大而增加，但加入ATP合成抑制剂后显著下降。下列判断最合理的是",options:["甲只能通过自由扩散进入细胞","甲的运输一定不需要膜蛋白","甲可能通过主动运输或需要能量的载体运输方式进入","温度不会影响甲的运输速率"],answer:2,notes:["错误。改正：自由扩散不需要能量，若仅自由扩散，抑制ATP合成通常不会造成显著下降。","错误。改正：小分子跨膜也可能通过载体或通道，不能据“可跨膜”推断不需要膜蛋白。","正确。运输依赖能量，说明可能为需要ATP的主动运输；若同时表现为趋势饱和，还可能与载体有关。","错误。改正：温度会影响膜流动性和酶促/载体相关过程，通常可能影响运输速率。"],analysis:"ATP抑制剂显著降低吸收，说明能量供应是必要条件之一。可据此排除单纯自由扩散，并支持主动运输等耗能过程；仅凭此不能进一步证明一定使用某种具体载体。",steps:["先看能量依赖性：抑制ATP后速率下降。","排除不耗能的自由扩散。","保留“可能”表述，区分运输方式与具体蛋白。"],tip:"实验证据只能支持结论范围，不能过度外推。"}),ge({id:"premium-bio-b4-01",subject:"biology",topicId:"bio-nucleus",difficulty:3,examStyle:"核孔 · 选择性运输",stem:"下列物质或结构通常可以通过核孔实现核质交换的是",options:["DNA和染色体","mRNA和某些蛋白质","核糖体和全部细胞器","磷脂双分子层"],answer:1,notes:["错误。改正：核内DNA通常不通过核孔进入细胞质；染色体是DNA和蛋白质的组装结构，也不通过核孔运输。","正确。mRNA可从核内运到细胞质，核内合成的某些蛋白质可从细胞质运入核内。","错误。改正：核孔具有选择性，不允许核糖体和全部细胞器自由通过。","错误。改正：磷脂双分子层是膜结构成分，不是通过核孔进行核质交换的运输对象。"],analysis:"核孔是核质之间物质交换和信息交流的通道，但具有选择性。mRNA和某些蛋白质可通过；DNA和染色体等大型结构通常不通过。",steps:["核孔是受限通道，不是自由孔洞。","判断mRNA与蛋白质的核质运输方向。","排除DNA、染色体和整个细胞器的直接通过。"],tip:"“核孔”不等于“所有物质都能自由通过”。"}),ge({id:"premium-bio-b4-02",subject:"biology",topicId:"bio-nucleus",difficulty:4,examStyle:"核移植/去核实验 · 控制中心",stem:"将某真核细胞的细胞核除去后，细胞代谢迅速减弱；重新植入同种细胞的细胞核后，代谢逐步恢复。下列结论最严谨的是",options:["细胞核能独立完成全部生命活动","细胞核是细胞代谢的控制中心","细胞质完全不参与代谢控制","所有细胞的遗传信息都只存在于细胞核"],answer:1,notes:["错误。改正：实验只能说明核与代谢有关，不能证明细胞核能脱离细胞质独立生存。","正确。去核使代谢减弱、重新植入核后恢复，说明细胞核对细胞代谢具有控制作用。","错误。改正：细胞代谢由核与细胞质共同完成，实验不能否定细胞质的作用。","错误。改正：原核细胞没有核膜包被的细胞核，遗传物质位于拟核；该实验也不能推广为“所有细胞”。"],analysis:"对照实验证明细胞核对代谢状态有控制作用，但生命活动仍需要细胞质和完整细胞结构。结论应限制在实验对象与现象范围内。",steps:["比较去核前后代谢变化。","比较重新植入核后的恢复。","排除“独立完成生命活动”和“所有细胞”的过度推广。"],tip:"实验结论要区分“参与/控制”和“独立完成”。"}),ge({id:"premium-bio-b4-03",subject:"biology",topicId:"bio-nucleus",difficulty:5,examStyle:"染色质与核仁 · 分期变化",stem:"下列关于细胞核结构和功能的叙述，正确的是",options:["核仁是双层膜细胞器，与蛋白质合成直接有关的场所","核膜由单层膜构成，允许所有大分子自由通过","染色质与染色体是同一物质在不同时期的两种形态","核内DNA可以直接与核糖体结合合成蛋白质"],answer:2,notes:["错误。改正：核仁不是细胞器，也没有双层膜，其功能与核糖体形成有关。","错误。改正：核膜是双层膜，核孔对物质运输具有选择性。","正确。染色质与染色体主要由DNA和蛋白质组成，是同一物质在细胞不同时期的两种形态。","错误。改正：蛋白质合成场所主要是细胞质中的核糖体，DNA通常不直接与核糖体结合。"],analysis:"细胞核具有核膜、核孔、核仁和染色质等结构。核膜双层且核孔有选择性；核仁参与核糖体形成；染色质和染色体是同一物质不同时期的形态。",steps:["区分核膜、核仁和染色质的基本属性。","核对双层膜和运输选择性。","确认蛋白质合成主要发生在核糖体。"],tip:"染色质与染色体不是两种不同物质。"})],qu=["A","B","C","D"],oe=({id:u,subject:C,topicId:p,difficulty:m,examStyle:A,stem:H,options:_,correct:k,notes:v,analysis:w,steps:B,tip:O})=>({id:u,subject:C,topicId:p,difficulty:m,type:"multi",qualityTier:"premium",examStyle:A,stem:H,options:_.map((j,Z)=>({key:qu[Z],text:j})),answer:k.map(j=>qu[j]),optionNotes:Object.fromEntries(v.map((j,Z)=>[qu[Z],j])),analysis:w,steps:B,tip:O}),W1=[oe({id:"multi-chem-classification-01",subject:"chemistry",topicId:"chem-classification",difficulty:5,examStyle:"高考多选题改编 · 分类证据链",stem:"下列推理能够成立的是（多选）",options:["Fe(OH)₃胶体可透过滤纸，但不能透过半透膜","能与碱反应生成盐和水的氧化物一定是酸性氧化物","NH₃的水溶液能导电，因此NH₃是电解质","BaSO₄难溶于水，但熔融时能导电"],correct:[0,3],notes:["正确。胶体粒子直径约1～100 nm，可透过滤纸但不能透过半透膜。","错误。改正：某些氧化物与碱反应还可能生成其他物质；酸性氧化物必须与碱反应只生成盐和水。","错误。改正：溶液导电主要来自NH₃·H₂O电离，NH₃本身不是电解质。","正确。BaSO₄虽难溶，但在熔融状态下可电离并导电，属于电解质。"],analysis:"本题同时考查分散系分离行为、氧化物定义和电解质定义。判断时必须检查定义中的全部条件，并区分“物质本身电离”与“反应后生成物电离”。",steps:["用粒子尺度解释胶体的过滤行为。","核对酸性氧化物的产物条件。","由熔融导电而非溶解度判断BaSO₄。"],tip:"多选题中“难溶”不能直接推出“非电解质”。"}),oe({id:"multi-chem-ion-01",subject:"chemistry",topicId:"chem-ion",difficulty:5,examStyle:"高考多选题改编 · 离子共存",stem:"在无色透明、c(H⁺)=0.1 mol·L⁻¹的溶液中，下列离子组能够大量共存的是（多选）",options:["Na⁺、K⁺、Cl⁻、NO₃⁻","Fe²⁺、NO₃⁻、SO₄²⁻、Na⁺","Ba²⁺、Cl⁻、NO₃⁻、K⁺","MnO₄⁻、K⁺、Cl⁻、SO₄²⁻"],correct:[0,2],notes:["正确。离子均无色，彼此不生成沉淀、气体或弱电解质，也不与H⁺发生氧化还原。","错误。改正：酸性条件下NO₃⁻会氧化Fe²⁺，二者不能稳定共存。","正确。四种离子均可大量共存，Ba²⁺在本组中不存在SO₄²⁻等沉淀剂。","错误。改正：MnO₄⁻呈紫红色，不符合“无色”条件。"],analysis:"离子共存题要依次过滤颜色、酸碱性、沉淀、气体、弱电解质和氧化还原。酸性环境中的NO₃⁻具有氧化性，是本组最隐蔽的限制条件。",steps:["先排除有色离子。","检查酸性条件下的氧化还原。","再核对沉淀与弱电解质。"],tip:"“无色”和“酸性”都是硬条件。"}),oe({id:"multi-chem-redox-01",subject:"chemistry",topicId:"chem-redox",difficulty:5,examStyle:"高考多选题改编 · 歧化与电子守恒",stem:"关于反应3Cl₂+6KOH→5KCl+KClO₃+3H₂O，下列判断正确的是（多选）",options:["Cl₂在该反应中既被氧化又被还原","生成1 mol KClO₃时转移5 mol电子","KOH在反应中作还原剂","被氧化与被还原的Cl原子数之比为1:5"],correct:[0,1,3],notes:["正确。Cl由0价同时变为-1价和+5价，发生歧化。","正确。1 mol Cl由0价升至+5价失去5 mol电子，转移电子为5 mol。","错误。改正：KOH中K、O、H的化合价没有变化，NaOH/KOH在此提供反应环境，不是还原剂。","正确。1个Cl被氧化为+5价，5个Cl被还原为-1价，参与氧化还原的Cl原子数之比为1:5。"],analysis:"该反应是Cl₂的歧化反应。电子转移只按单方向计算：生成1 mol KClO₃时Cl失去5 mol电子，等价于另5 mol Cl共得到5 mol电子。",steps:["标出所有变价Cl。","找出1:5的氧化、还原数量关系。","用单方向电子数计算转移量。"],tip:"同一种元素分别升价、降价时，氧化与还原产物可能来自同一反应物。"}),oe({id:"multi-chem-sodium-01",subject:"chemistry",topicId:"chem-sodium",difficulty:5,examStyle:"高考多选题改编 · Na₂O₂定量",stem:"将CO₂和H₂O(g)的混合气体通过足量Na₂O₂，下列判断正确的是（多选）",options:["每1 mol CO₂参与反应，固体净增重28 g","每1 mol H₂O(g)参与反应，固体净增重18 g","若混合气体完全反应，生成O₂的物质的量为混合气体物质的量的一半","反应后固体中只含Na₂CO₃"],correct:[0,2],notes:["正确。2Na₂O₂+2CO₂→2Na₂CO₃+O₂，2 mol CO₂对应固体增重56 g，即每mol净增28 g。","错误。改正：2Na₂O₂+2H₂O→4NaOH+O₂，2 mol水对应净增4 g，即每mol净增2 g。","正确。CO₂、H₂O与Na₂O₂反应时均按2 mol气体生成1 mol O₂。","错误。改正：若混合气体含水蒸气，固体中除Na₂CO₃外还会生成NaOH。"],analysis:"CO₂与H₂O分别与Na₂O₂反应，不能共用“增重等于吸收气体质量”的错误结论。质量增重应按反应前后固体组成差计算，气体与O₂的系数比均为2:1。",steps:["分别写出CO₂、H₂O与Na₂O₂的方程式。","按每摩尔气体计算固体净增重。","结合两反应判断产物和O₂总量。"],tip:"Na₂O₂与H₂O反应的固体产物是NaOH，不是Na₂CO₃。"}),oe({id:"multi-chem-chlorine-01",subject:"chemistry",topicId:"chem-chlorine",difficulty:5,examStyle:"高考多选题改编 · 氯水微粒",stem:"关于新制氯水，下列说法正确的是（多选）",options:["能使紫色石蕊溶液先变红后褪色","与AgNO₃溶液反应可生成白色沉淀","起漂白作用的主要微粒是Cl₂","久置后酸性增强、漂白性增强"],correct:[0,1],notes:["正确。H⁺使石蕊变红，HClO随后使红色褪去。","正确。氯水含Cl⁻，与Ag⁺生成白色AgCl沉淀。","错误。改正：主要漂白微粒是HClO，不是Cl₂本身。","错误。改正：HClO见光分解后漂白性减弱。"],analysis:"新制氯水含Cl₂、H₂O、HClO、H⁺、Cl⁻、ClO⁻等。颜色、沉淀、导电和漂白现象必须分别对应实际微粒。",steps:["列出氯水中的主要微粒。","把酸碱、沉淀和漂白现象分别归因。","考虑HClO见光分解后久置氯水的变化。"],tip:"氯水的漂白性不能直接归于Cl₂。"}),oe({id:"multi-chem-mole-01",subject:"chemistry",topicId:"chem-mole",difficulty:5,examStyle:"高考多选题改编 · 阿伏加德罗常数",stem:"设Nₐ为阿伏加德罗常数的值，下列判断正确的是（多选）",options:["18 g H₂O所含分子数约为Nₐ","1 mol Na₂O₂所含离子总数约为3Nₐ","0.5 mol Na₂SO₄所含Na⁺数约为Nₐ","22.4 L任意气体在任意条件下都含Nₐ个分子"],correct:[0,1,2],notes:["正确。M(H₂O)=18 g·mol⁻¹，18 g为1 mol。","正确。Na₂O₂由2 mol Na⁺和1 mol O₂²⁻构成，共3 mol离子。","正确。0.5 mol Na₂SO₄含1 mol Na⁺。","错误。改正：22.4 L仅在标准状况下的气体才近似含1 mol分子。"],analysis:"阿伏加德罗常数题必须核对物质的组成微粒、状态和条件。Na₂O₂中的阴离子是一个整体O₂²⁻，不能拆成两个O²⁻。",steps:["逐项判断物质的量和微粒种类。","核对Na₂O₂的离子组成。","检查22.4 L所依赖的温压和状态条件。"],tip:"“含有多少微粒”先问是什么微粒。"}),oe({id:"multi-chem-gas-01",subject:"chemistry",topicId:"chem-gas",difficulty:5,examStyle:"高考多选题改编 · 气体定律",stem:"同温同压下，下列判断正确的是（多选）",options:["体积相同的N₂和O₂含有相同分子数","体积相同的N₂和O₂质量相同","相同物质的量的CO和CO₂体积相同","同体积、同物质的量的两种气体密度一定相同"],correct:[0,2],notes:["正确。同温同压同体积气体含相同物质的量，因此分子数相同。","错误。改正：分子数相同但N₂与O₂摩尔质量不同，质量不同。","正确。同温同压下体积由气体物质的量决定。","错误。改正：同体积、同物质的量只说明条件相同，密度仍取决于摩尔质量。"],analysis:"阿伏加德罗定律只保证同温同压同体积气体具有相同分子数，不保证质量、密度或原子数相同。",steps:["先由气体定律确定物质的量关系。","再按摩尔质量判断质量。","最后区分分子数、原子数和密度。"],tip:"体积相同推出的是分子数相同，不是质量相同。"}),oe({id:"multi-chem-iron-01",subject:"chemistry",topicId:"chem-iron",difficulty:5,examStyle:"高考多选题改编 · 铁离子转化",stem:"关于Fe²⁺、Fe³⁺及其化合物，下列判断正确的是（多选）",options:["向FeCl₂溶液中通入Cl₂可生成FeCl₃","向FeCl₃溶液中加入过量铁粉最终可得到FeCl₂","Fe(OH)₂在空气中会由白色逐渐变为红褐色","Fe³⁺遇KSCN溶液产生蓝色沉淀"],correct:[0,1,2],notes:["正确。2Fe²⁺+Cl₂→2Fe³⁺+2Cl⁻。","正确。Fe³⁺被Fe还原为Fe²⁺，过量铁不会引入其他金属阳离子。","正确。Fe(OH)₂被氧气氧化，颜色由白色经灰绿色变为红褐色Fe(OH)₃。","错误。改正：Fe³⁺遇KSCN溶液使溶液呈红色，不是蓝色沉淀。"],analysis:"铁离子题围绕Fe²⁺的还原性和Fe³⁺的氧化性展开。检验Fe³⁺用KSCN红色，检验Fe²⁺还要结合氧化后显色或特征沉淀。",steps:["判断Fe²⁺、Fe³⁺的氧化还原性。","写出Cl₂和Fe粉分别引起的转化。","核对Fe(OH)₂氧化和Fe³⁺显色现象。"],tip:"Fe³⁺与KSCN是红色溶液，不是沉淀。"}),oe({id:"multi-chem-metals-01",subject:"chemistry",topicId:"chem-metals",difficulty:5,examStyle:"高考多选题改编 · 铝与合金",stem:"关于铝、氧化铝和合金，下列说法正确的是（多选）",options:["Al₂O₃既能与盐酸反应，也能与NaOH溶液反应","铝制容器可长期盛放强酸和强碱溶液","合金的硬度通常大于其成分金属","铝表面致密氧化膜可提高其耐腐蚀性"],correct:[0,2,3],notes:["正确。Al₂O₃是两性氧化物，可与强酸、强碱反应。","错误。改正：铝和氧化铝均能与强酸、强碱反应，不能长期盛放。","正确。合金通常比成分金属硬度更大、熔点更低。","正确。致密氧化膜隔绝内部金属与腐蚀介质，提高耐腐蚀性。"],analysis:"铝既具有金属活动性，又因表面致密氧化膜而耐腐蚀。氧化膜的 amphoteric 性质意味着铝制容器并不耐强酸、强碱。",steps:["判断Al₂O₃的两性。","结合膜的保护作用。","比较合金与纯金属的典型性质。"],tip:"铝耐腐蚀不等于铝不与酸、碱反应。"}),oe({id:"multi-chem-atom-01",subject:"chemistry",topicId:"chem-atom",difficulty:5,examStyle:"高考多选题改编 · 核素与电子结构",stem:"关于原子结构与核素，下列判断正确的是（多选）",options:["同位素的质子数相同、中子数不同","中性原子的核外电子数等于质子数","同种元素的不同核素化学性质完全不同","质量数等于质子数与中子数之和"],correct:[0,1,3],notes:["正确。同位素属于同一种元素，质子数相同而中子数不同。","正确。中性原子整体电中性，核电荷数等于核外电子数。","错误。改正：同位素核外电子排布通常相同，化学性质基本相同，物理性质可有差异。","正确。质量数A=质子数Z+中子数N。"],analysis:"核素由质子数、中子数共同确定，但元素种类只由质子数决定。同位素化学性质近似相同，不能把中子数差异扩大为化学反应性完全不同。",steps:["明确Z、N、A关系。","区分元素、核素和同位素。","判断化学性质与核外电子排布的关系。"],tip:"同位素首先是同一种元素。"}),oe({id:"multi-chem-periodic-01",subject:"chemistry",topicId:"chem-periodic",difficulty:5,examStyle:"高考多选题改编 · 周期律比较",stem:"对于同周期主族元素，从左到右的变化趋势正确的是（多选）",options:["原子半径总体减小","金属性总体减弱","最高正化合价均由+1递增到+7","非金属性总体增强"],correct:[0,1,3],notes:["正确。核电荷增加、电子层数相同，核对最外层电子吸引总体增强，半径减小。","正确。同周期从左到右失电子能力总体减弱。","错误。改正：O、F等元素通常不表现对应的最高正价，不能机械地说每个元素都由+1到+7。","正确。同周期从左到右得电子能力总体增强。"],analysis:"同周期从左到右，原子半径减小、金属性减弱、非金属性增强。化合价趋势有规律，但受F、O等特殊元素限制，不能绝对化。",steps:["先判断同一周期内电子层数相同。","比较核电荷对最外层电子的吸引。","核对化合价的例外元素。"],tip:"周期律是总体递变规律，不是无例外的机械公式。"}),oe({id:"multi-chem-bond-01",subject:"chemistry",topicId:"chem-bond",difficulty:5,examStyle:"高考多选题改编 · 化学键判断",stem:"关于离子键、共价键和物质组成，下列判断正确的是（多选）",options:["NaCl中含有离子键","CO₂分子中含有极性共价键","NH₄Cl中只含共价键","Na₂O₂中既含离子键又含共价键"],correct:[0,1,3],notes:["正确。活泼金属Na与活泼非金属Cl之间形成离子键。","正确。C与O电负性不同，CO₂中存在极性共价键。","错误。改正：NH₄⁺与Cl⁻之间存在离子键，NH₄⁺内部还存在共价键。","正确。Na⁺与O₂²⁻之间为离子键，O₂²⁻内部存在共价键。"],analysis:"判断化学键要先确定物质中的微粒：阴阳离子之间是离子键，原子之间通过共用电子对形成共价键。复杂离子内部与离子之间可同时存在不同键型。",steps:["先找物质中的阴阳离子。","再判断原子或离子内部是否共用电子。","不要用元素类型机械替代结构和电负性判断。"],tip:"同一物质中可能同时存在离子键和共价键。"}),oe({id:"multi-bio-cell-intro-01",subject:"biology",topicId:"bio-cell-intro",difficulty:5,examStyle:"高考多选题改编 · 细胞与病毒",stem:"关于细胞、原核生物和病毒，下列判断正确的是（多选）",options:["原核细胞有核糖体但没有核膜包被的细胞核","病毒能独立完成全部生命活动","蓝细菌含有光合色素但没有叶绿体","病毒与真核细胞的共同点是都含有完整的细胞结构"],correct:[0,2],notes:["正确。原核细胞无核膜包被的细胞核，但有核糖体。","错误。改正：病毒没有完整代谢系统，必须依赖宿主活细胞增殖。","正确。蓝细菌是原核生物，无叶绿体，但含藻蓝素和叶绿素等光合色素。","错误。改正：病毒没有细胞结构，该选项自相矛盾。"],analysis:"原核、真核细胞都以细胞膜、细胞质和核糖体等为共同结构基础；病毒没有细胞结构，不能独立完成生命活动。",steps:["先区分有没有细胞结构。","再比较原核与真核的核结构。","由光合色素判断蓝细菌而不必依赖叶绿体。"],tip:"“能光合作用”不等于“含叶绿体”。"}),oe({id:"multi-bio-elements-01",subject:"biology",topicId:"bio-elements",difficulty:5,examStyle:"高考多选题改编 · 水与无机盐",stem:"关于细胞中的水和无机盐，下列判断正确的是（多选）",options:["自由水可作为良好溶剂并参与物质运输","结合水比例升高通常有利于提高抗逆性","无机盐只能以化合物形式存在","自由水与结合水的比值下降可增强细胞代谢"],correct:[0,1],notes:["正确。自由水流动性强，是良好溶剂并参与运输和代谢。","正确。结合水比例较高时结构更稳定，抗逆性通常增强。","错误。改正：无机盐常以离子形式存在，也可参与构成化合物。","错误。改正：自由水比例下降通常使代谢减弱。"],analysis:"自由水比例高通常代谢旺盛，结合水比例高通常抗逆性增强。无机盐既可以是离子，也可参与构成复杂化合物。",steps:["分别说明自由水和结合水的功能。","比较代谢强度与抗逆性趋势。","核对无机盐的存在形式。"],tip:"自由水与结合水的比值下降不等于自由水为零。"}),oe({id:"multi-bio-organelles-01",subject:"biology",topicId:"bio-organelles",difficulty:5,examStyle:"高考多选题改编 · 膜系统与分泌蛋白",stem:"关于细胞膜、细胞器和生物膜系统，下列判断正确的是（多选）",options:["核糖体、内质网和高尔基体都参与分泌蛋白的形成与运输","线粒体和叶绿体都具有双层膜","核糖体有膜但不属于生物膜系统","不同生物膜上的蛋白质种类和数量可以不同"],correct:[0,1,3],notes:["正确。核糖体合成，内质网和高尔基体依次加工运输。","正确。线粒体、叶绿体均为双层膜细胞器。","错误。改正：核糖体没有膜结构，因此不属于生物膜系统。","正确。不同膜承担的功能不同，膜蛋白的种类和数量可不同。"],analysis:"生物膜系统由细胞膜、细胞器膜和核膜等构成；核糖体无膜。分泌蛋白路径和时间顺序是本章高频综合点。",steps:["区分有膜和无膜细胞器。","核对双层膜结构。","按分泌蛋白路径判断作用顺序。"],tip:"核糖体无膜，但参与蛋白质合成。"}),oe({id:"multi-bio-nucleus-01",subject:"biology",topicId:"bio-nucleus",difficulty:5,examStyle:"高考多选题改编 · 核结构与功能",stem:"关于细胞核，下列判断正确的是（多选）",options:["核膜是双层膜，核孔具有选择性","核仁与核糖体的形成有关","染色质和染色体是同一物质在不同时期的两种形态","DNA通常通过核孔大量进入细胞质"],correct:[0,1,2],notes:["正确。核膜为双层膜，核孔可控制部分大分子的核质运输。","正确。核仁参与rRNA和核糖体亚基形成。","正确。二者主要由DNA和蛋白质组成，包装程度不同。","错误。改正：核内DNA通常不通过核孔进入细胞质，mRNA等可被运输。"],analysis:"细胞核通过核膜、核孔、核仁和染色质完成遗传信息储存与核质交流。核孔不是无选择的自由通道。",steps:["区分核膜、核孔、核仁和染色质。","判断哪些大分子可通过核孔。","理解染色质与染色体的形态变化。"],tip:"核质交换主要运输RNA和蛋白质，不是整段DNA。"}),oe({id:"multi-bio-protein-01",subject:"biology",topicId:"bio-protein",difficulty:5,examStyle:"高考多选题改编 · 蛋白质与核酸",stem:"关于蛋白质和核酸，下列判断正确的是（多选）",options:["氨基酸脱水缩合形成肽键","蛋白质多样性与氨基酸种类、数目、排列顺序和空间结构有关","DNA与RNA都由核苷酸组成，且五碳糖完全相同","一条由n个氨基酸形成的线性肽链通常含n-1个肽键"],correct:[0,1,3],notes:["正确。相邻氨基酸通过肽键连接并脱去水。","正确。一级结构和空间结构均影响蛋白质多样性。","错误。改正：DNA含脱氧核糖，RNA含核糖，五碳糖不同。","正确。线性肽链中肽键数通常等于氨基酸数减1。"],analysis:"蛋白质结构层次和核酸组成是必考基础。线性肽链的肽键数要减1，但环肽或特殊连接需要另行判断。",steps:["由脱水缩合确定肽键数。","列举蛋白质多样性来源。","比较DNA和RNA的五碳糖。"],tip:"肽键数通常等于脱去水分子数。"}),oe({id:"multi-bio-transport-01",subject:"biology",topicId:"bio-transport",difficulty:5,examStyle:"高考多选题改编 · 跨膜运输",stem:"关于物质跨膜运输，下列判断正确的是（多选）",options:["自由扩散不需要载体蛋白，也不直接消耗ATP","协助扩散需要载体或通道，但不一定消耗ATP","主动运输通常逆浓度梯度进行并需要能量","胞吞和胞吐只运输离子，不运输大分子"],correct:[0,1,2],notes:["正确。自由扩散顺浓度梯度，不需要膜蛋白和能量。","正确。协助扩散顺浓度梯度，依赖膜蛋白但不直接消耗ATP。","正确。主动运输通常需要载体并消耗能量。","错误。改正：胞吞、胞吐主要运输大分子或颗粒物质。"],analysis:"判断运输方式要同时看浓度梯度、是否需膜蛋白和是否消耗能量。胞吞、胞吐依赖膜的流动性，不经过跨膜孔道。",steps:["判断顺浓度或逆浓度。","检查是否需要膜蛋白。","检查是否直接消耗能量。"],tip:"有膜蛋白不等于一定消耗ATP。"}),oe({id:"multi-bio-enzyme-01",subject:"biology",topicId:"bio-enzyme",difficulty:5,examStyle:"高考多选题改编 · 酶与ATP",stem:"关于酶和ATP，下列判断正确的是（多选）",options:["酶通过降低反应活化能提高反应速率","高温、过酸或过碱都可能使酶永久失活","ATP水解释放的能量可用于主动运输等生命活动","酶只能在细胞内发挥催化作用"],correct:[0,1,2],notes:["正确。酶降低活化能，但不改变反应平衡常数。","正确。极端条件可破坏酶的空间结构，使其难以恢复。","正确。ATP水解释放的能量可驱动多种吸能过程。","错误。改正：酶在适宜条件的细胞外也可发挥催化作用。"],analysis:"酶的作用是降低活化能，不是提供能量；ATP才是细胞中常见的直接能源物质。温度和pH通过影响酶结构影响反应速率。",steps:["区分降低活化能与提供能量。","判断极端条件对酶结构的影响。","核对ATP水解的用途。"],tip:"酶可以离开细胞后继续起作用。"}),oe({id:"multi-bio-respiration-01",subject:"biology",topicId:"bio-respiration",difficulty:5,examStyle:"高考多选题改编 · 细胞呼吸",stem:"关于细胞呼吸，下列判断正确的是（多选）",options:["有氧呼吸的第一阶段发生在细胞质基质","有氧呼吸的第三阶段产生大量ATP","人体骨骼肌无氧呼吸的主要产物是乙醇和CO₂","无氧呼吸全过程都在细胞质基质中完成"],correct:[0,1,3],notes:["正确。葡萄糖酵解阶段在细胞质基质中进行。","正确。第三阶段为线粒体内膜上的电子传递和氧化磷酸化，释放大量能量。","错误。改正：人体骨骼肌无氧呼吸主要产生乳酸，不产生乙醇和CO₂。","正确。无氧呼吸两个阶段均在细胞质基质中进行。"],analysis:"有氧呼吸三个阶段的位置、反应物和ATP产量必须对应清楚；无氧呼吸产物因生物种类不同而不同。",steps:["回忆有氧呼吸三阶段位置。","比较各阶段ATP产量。","区分不同生物的无氧呼吸产物。"],tip:"人体肌细胞无氧呼吸生成乳酸。"}),oe({id:"multi-bio-photosynthesis-01",subject:"biology",topicId:"bio-photosynthesis",difficulty:5,examStyle:"高考多选题改编 · 光反应与碳反应",stem:"关于光合作用，下列判断正确的是（多选）",options:["光反应发生在类囊体薄膜上","水的光解可产生O₂、NADPH和ATP","CO₂中的碳在暗反应中先被固定为糖类","光照突然减弱后，短期内C₃还原速率可能下降"],correct:[0,1,3],notes:["正确。叶绿体类囊体薄膜是光反应结构基础。","正确。水光解产生O₂，并为NADPH和ATP的形成提供电子和能量基础。","错误。改正：CO₂先被固定形成C₃等中间产物，再经还原生成糖类。","正确。光照减弱会减少ATP和NADPH供应，C₃还原相应受影响。"],analysis:"光反应与暗反应之间通过ATP和NADPH联系。CO₂固定和C₃还原是两个不同步骤。光照变化可在短时间内改变中间物含量。",steps:["明确两阶段的发生部位。","区分CO₂固定与C₃还原。","由ATP、NADPH供应变化判断短期影响。"],tip:"CO₂固定先形成含碳中间物，不直接生成糖。"}),oe({id:"multi-bio-cell-cycle-01",subject:"biology",topicId:"bio-cell-cycle",difficulty:5,examStyle:"高考多选题改编 · 有丝分裂",stem:"关于真核细胞有丝分裂，下列判断正确的是（多选）",options:["分裂间期完成DNA复制和有关蛋白质合成","着丝粒分裂后，姐妹染色单体成为两条子染色体","后期同一极的染色体数与母细胞通常相同","有丝分裂可保证亲子代细胞染色体数目恒定"],correct:[0,1,2,3],notes:["正确。间期包括G₁、S、G₂，S期完成DNA复制。","正确。着丝粒分裂后，姐妹染色单体各自形成子染色体。","正确。后期两极各形成一套与母细胞相同的染色体。","正确。核遗传物质复制并均分，保持子细胞染色体数目稳定。"],analysis:"有丝分裂的核心是复制一次、分裂一次，使两个子细胞各获得一套与母细胞相同数目的染色体。染色体数与着丝粒数一致。",steps:["按间期和前中后末分期。","跟踪染色体、染色单体和DNA数量。","核对子细胞染色体数。"],tip:"染色体数目看，不看染色单体数目。"}),oe({id:"multi-bio-differentiation-01",subject:"biology",topicId:"bio-differentiation",difficulty:5,examStyle:"高考多选题改编 · 分化与衰亡",stem:"关于细胞分化、衰老、凋亡和癌变，下列判断正确的是（多选）",options:["细胞分化的实质是基因的选择性表达","细胞凋亡是由基因控制的程序性死亡","癌细胞通常具有无限增殖和接触抑制丧失等特征","所有衰老细胞的细胞核体积都会明显缩小"],correct:[0,1,2],notes:["正确。同一生物不同细胞遗传物质通常相同，差异来自选择性表达。","正确。凋亡是受基因调控的程序性死亡。","正确。癌细胞可持续增殖并丧失正常接触抑制。","错误。改正：衰老细胞的细胞核通常体积增大、染色质收缩，不是所有细胞都缩小。"],analysis:"分化不是遗传物质丢失，而是表达差异；凋亡与坏死不同；癌细胞特征来自原癌基因和抑癌基因等共同改变。",steps:["区分细胞分化的遗传基础与表达差异。","比较细胞凋亡与细胞坏死。","核对癌细胞和衰老细胞的典型特征。"],tip:"分化细胞通常仍保留完整基因组。"}),oe({id:"multi-chem-atom-02",subject:"chemistry",topicId:"chem-atom",difficulty:5,examStyle:"高考多选题改编 · 原子组成",stem:"关于原子组成和核素，下列说法正确的是（多选）",options:["质子数决定元素种类","同位素的质量数一定相同","阴离子的核外电子数大于质子数","中性原子的中子数一定等于质子数"],correct:[0,2],notes:["正确。元素种类由质子数决定。","错误。改正：同位素中子数不同，质量数通常不同。","正确。阴离子得到电子，核外电子数大于质子数。","错误。改正：中性原子的中子数不一定等于质子数，只有部分核素恰好相等。"],analysis:"原子组成题要把质子数、中子数、核外电子数和电荷数分别计算。中性原子不带电，但离子会因得失电子改变电子数。",steps:["由电荷判断电子数与质子数关系。","由质量数求中子数。","区分元素种类与核素种类。"],tip:"同一元素可以有多种中子数不同的核素。"}),oe({id:"multi-chem-atom-03",subject:"chemistry",topicId:"chem-atom",difficulty:5,examStyle:"高考多选题改编 · 电子层结构",stem:"某短周期元素原子的最外层电子数等于其次外层电子数，下列判断可能正确的是（多选）",options:["该元素可能是Be","该元素可能是Ar","该元素原子可能有2个电子层","该元素一定是金属"],correct:[0,2],notes:["正确。Be电子排布为2、2，最外层等于次外层。","错误。改正：Ar为2、8、8，最外层不等于次外层。","正确。Be、Mg等满足条件时可能具有2个或3个电子层，其中具有2个电子层的情况成立。","错误。改正：满足条件的元素可为金属或非金属，需用完整电子排布判断。"],analysis:"电子层结构必须逐层核对。短周期元素中Be、Mg等可作为最外层与次外层电子数相等的候选，但还要结合元素推论。",steps:["写出短周期可能的电子层结构。","比较最外层和次外层电子数。","排除把可能性绝对化的选项。"],tip:"先写排布，再做性质判断。"}),oe({id:"multi-chem-bond-02",subject:"chemistry",topicId:"chem-bond",difficulty:5,examStyle:"高考多选题改编 · 键型与物质",stem:"下列物质中，既含离子键又含共价键的是（多选）",options:["NaOH","Na₂O₂","HCl","MgCl₂"],correct:[0,1],notes:["正确。Na⁺与OH⁻之间为离子键，OH⁻内部O-H为共价键。","正确。Na⁺与O₂²⁻之间为离子键，O₂²⁻内部O-O为共价键。","错误。改正：HCl中只存在共价键。","错误。改正：MgCl₂中主要为Mg²⁺与Cl⁻之间的离子键。"],analysis:"复杂离子化合物中常见“离子键+共价键”组合。判断时要先识别阴、阳离子，再看复杂离子内部。",steps:["判断是否由离子构成。","检查复杂离子内部的原子连接。","排除只含一种键型的物质。"],tip:"有复杂离子时，很可能同时存在两类化学键。"}),oe({id:"multi-chem-bond-03",subject:"chemistry",topicId:"chem-bond",difficulty:5,examStyle:"高考多选题改编 · 化学键形成",stem:"关于离子键和共价键的形成，下列说法正确的是（多选）",options:["离子键的本质是阴阳离子间的静电作用","共价键通常通过共用电子对形成","只要含有金属元素就一定只形成离子键","同种原子间形成的共价键通常为非极性键"],correct:[0,1,3],notes:["正确。阴阳离子静电作用形成离子键。","正确。原子间共用电子对可形成共价键。","错误。改正：含金属元素的化合物也可能含共价键，如NaOH、Na₂O₂。","正确。同种原子电负性相同，共用电子对通常不明显偏移。"],analysis:"键型由微粒结构和电子对偏移情况决定，不由元素类别机械决定。",steps:["先判断微粒类型。","再分析电子对是否共用和是否偏移。","注意复杂物质的混合键型。"],tip:"元素类别只是线索，不是唯一依据。"}),oe({id:"multi-chem-bond-04",subject:"chemistry",topicId:"chem-bond",difficulty:5,examStyle:"高考多选题改编 · 分子与离子化合物",stem:"关于物质的构成，下列说法正确的是（多选）",options:["NaCl固体中存在Na⁺和Cl⁻","CO₂由分子构成","熔融KCl能导电与其离子可移动有关","所有含共价键的物质都是共价化合物"],correct:[0,1,2],notes:["正确。NaCl是离子化合物，由钠离子和氯离子构成。","正确。CO₂通常以独立分子构成物质。","正确。熔融时离子可移动，因此可导电。","错误。改正：离子化合物中也可能含共价键，如NaOH含有共价键。"],analysis:"物质构成、键型与导电性需要分开判断。含共价键的化合物不一定是共价化合物。",steps:["识别构成微粒。","判断键型是否混合。","分析熔融状态离子能否迁移。"],tip:"离子化合物的复杂离子内部也可有共价键。"}),oe({id:"multi-bio-transport-02",subject:"biology",topicId:"bio-transport",difficulty:5,examStyle:"高考多选题改编 · 运输速率",stem:"在其他条件适宜时，下列关于跨膜运输的叙述正确的是（多选）",options:["自由扩散速率可随浓度差增大而增加","协助扩散达到一定速率后可能受膜蛋白数量限制","主动运输速率只由浓度差决定","温度可能影响膜流动性和膜蛋白构象"],correct:[0,1,3],notes:["正确。浓度差越大，自由扩散的净运输速率通常越大。","正确。载体或通道数量可使协助扩散出现饱和。","错误。改正：主动运输还依赖载体和能量供应。","正确。温度会影响膜流动性和蛋白质构象。"],analysis:"跨膜运输速率受浓度差、膜蛋白数量和活性、能量供应及温度共同影响。",steps:["先判断运输方式。","再找该方式的限制因素。","区分浓度差与膜蛋白饱和。"],tip:"载体数量不足时，浓度差再大也可能饱和。"}),oe({id:"multi-bio-enzyme-02",subject:"biology",topicId:"bio-enzyme",difficulty:5,examStyle:"高考多选题改编 · 酶的特性",stem:"关于酶的催化特性，下列说法正确的是（多选）",options:["酶具有高效性","酶通常具有专一性","酶只能在最适温度下才发挥作用","过酸或过碱可能破坏酶的空间结构"],correct:[0,1,3],notes:["正确。酶可显著降低活化能，催化效率高。","正确。一种酶通常只催化一种或一类反应。","错误。改正：酶在最适温度附近活性最高，不代表其他温度完全无效。","正确。极端pH可改变酶的空间结构并导致活性下降。"],analysis:"酶的主要特性包括高效性、专一性和作用条件较温和。最适温度只是活性峰值，不是唯一有效温度。",steps:["回顾酶的高效性与专一性。","比较最适条件与可用条件。","判断极端pH对结构的影响。"],tip:"最适条件不是唯一有效条件。"}),oe({id:"multi-bio-enzyme-03",subject:"biology",topicId:"bio-enzyme",difficulty:5,examStyle:"高考多选题改编 · ATP循环",stem:"关于ATP与ADP相互转化，下列说法正确的是（多选）",options:["ATP水解可释放能量","ATP合成通常需要能量输入","ATP与ADP的相互转化是可逆反应的简单倒放","ATP水解产生的能量可用于主动运输"],correct:[0,1,3],notes:["正确。ATP末端高能磷酸键水解释放能量。","正确。ADP与Pi重新结合形成ATP需要能量。","错误。改正：二者在酶、反应场所和能量来源上不同，不属于简单意义上的同一可逆反应。","正确。ATP水解释放的能量可驱动多种吸能过程。"],analysis:"ATP与ADP可以相互转化，但正、逆过程的酶和条件不同。ATP水解与合成分别承担供能和获能过程。",steps:["判断水解或合成的能量方向。","比较酶和场所。","核对ATP能量用途。"],tip:"物质可相互转化不等于反应完全可逆。"}),oe({id:"multi-bio-enzyme-04",subject:"biology",topicId:"bio-enzyme",difficulty:5,examStyle:"高考多选题改编 · 实验控制",stem:"探究温度对酶活性影响的实验中，下列操作合理的是（多选）",options:["底物与酶先分别保温到目标温度再混合","设置多个温度组进行对照","用同一支试管连续改变温度并立即比较","反应一段时间后同时检测产物量"],correct:[0,1,3],notes:["正确。先分别控温再混合可使反应从目标温度开始。","正确。多温度组可形成对照和梯度。","错误。改正：连续改变温度会使反应条件和时间混杂，难以比较。","正确。统一反应时间有助于比较不同温度下反应程度。"],analysis:"温度实验要控制变量：底物、酶和检测时间等尽量一致，且混合前分别保温到目标温度。",steps:["确定自变量为温度。","保持其他变量一致。","混合前完成目标温度控制。"],tip:"温度实验不能先混匀再慢慢控温比较。"}),oe({id:"multi-bio-photosynthesis-02",subject:"biology",topicId:"bio-photosynthesis",difficulty:5,examStyle:"高考多选题改编 · 光合与呼吸",stem:"下列关于植物光合作用和细胞呼吸的叙述正确的是（多选）",options:["叶绿体和线粒体都可能产生ATP","光合作用吸收的CO₂可来自细胞呼吸","光照下植物不进行细胞呼吸","净光合速率等于总光合速率减去呼吸速率"],correct:[0,1,3],notes:["正确。叶绿体光反应和线粒体氧化磷酸化都可产生ATP。","正确。细胞呼吸产生的CO₂可被叶绿体利用。","错误。改正：有光时细胞呼吸仍持续进行。","正确。净光合速率等于总光合速率与呼吸速率之差。"],analysis:"光合与呼吸可同时进行。净光合速率反映表观有机物积累，必须扣除呼吸消耗。",steps:["区分光反应与细胞呼吸的ATP来源。","确认光照不抑制细胞呼吸。","使用净光合=总光合-呼吸关系。"],tip:"光照不会让细胞呼吸停止。"}),oe({id:"multi-bio-photosynthesis-03",subject:"biology",topicId:"bio-photosynthesis",difficulty:5,examStyle:"高考多选题改编 · 色素的吸收",stem:"关于叶绿体色素与光反应，下列说法正确的是（多选）",options:["叶绿素主要吸收红光和蓝紫光","类胡萝卜素主要吸收蓝紫光","叶绿素a和叶绿素b在滤纸条上的位置相同","光反应吸收光能后可形成ATP和NADPH"],correct:[0,1,3],notes:["正确。叶绿素主要吸收红光和蓝紫光。","正确。类胡萝卜素主要吸收蓝紫光。","错误。改正：不同色素在层析液中的溶解度不同，滤纸条位置不同。","正确。光能转换形成活跃化学能储存在ATP和NADPH中。"],analysis:"色素吸收光谱和层析分离是两个不同实验。不同色素的吸收峰和层析速度不同。",steps:["区分叶绿素与类胡萝卜素吸收光。","比较层析位置。","联系光反应能量转换。"],tip:"吸收光谱不等于层析条带顺序。"}),oe({id:"multi-bio-cell-cycle-02",subject:"biology",topicId:"bio-cell-cycle",difficulty:5,examStyle:"高考多选题改编 · 染色体与DNA",stem:"关于有丝分裂过程中的数量变化，下列说法正确的是（多选）",options:["分裂间期DNA复制后，DNA分子数加倍","复制后、着丝粒分裂前，染色体数与复制前通常相同","着丝粒分裂时染色体数暂时加倍","分裂结束后每个子细胞的DNA数通常与母细胞相同"],correct:[0,1,2,3],notes:["正确。S期完成DNA复制，DNA数量增加。","正确。复制形成姐妹染色单体，但着丝粒尚未增加。","正确。着丝粒分裂后，姐妹染色单体分别成为独立染色体。","正确。有丝分裂将复制后的DNA均分给两个子细胞。"],analysis:"比较数量时固定三个指标：染色体数看着丝粒，染色单体数看姐妹染色单体，DNA数按复制和分配。",steps:["分期确定DNA复制与着丝粒分裂。","分别统计三个指标。","核对分裂结束后的均分结果。"],tip:"染色体数在着丝粒分裂时暂时加倍。"}),oe({id:"multi-bio-cell-cycle-03",subject:"biology",topicId:"bio-cell-cycle",difficulty:5,examStyle:"高考多选题改编 · 有丝分裂现象",stem:"关于植物细胞有丝分裂，下列说法正确的是（多选）",options:["前期染色质逐渐凝缩为染色体","中期着丝粒排列在赤道板上","后期纺锤丝牵引染色体移向两极","末期植物细胞主要通过缢裂形成两个子细胞"],correct:[0,1,2],notes:["正确。前期染色质高度螺旋化形成染色体。","正确。中期着丝粒排列在细胞中央赤道板附近。","正确。后期姐妹染色单体分开并由纺锤丝牵向两极。","错误。改正：植物细胞末期主要形成细胞板，进而形成细胞壁。"],analysis:"植物细胞与动物细胞有丝分裂的差异主要在前期纺锤体形成和末期胞质分裂方式。",steps:["按分期判断典型结构变化。","比较植物与动物细胞差异。","注意细胞板和缢裂的区别。"],tip:"植物细胞末期是细胞板，不是缢裂。"}),oe({id:"multi-bio-differentiation-02",subject:"biology",topicId:"bio-differentiation",difficulty:5,examStyle:"高考多选题改编 · 衰老细胞",stem:"关于衰老细胞的特征，下列说法正确的是（多选）",options:["多种酶的活性可能降低","细胞膜通透性可能改变","细胞核体积可能增大","衰老细胞一定会立即发生细胞坏死"],correct:[0,1,2],notes:["正确。衰老细胞代谢和部分酶活性往往下降。","正确。膜结构和功能可发生改变。","正确。衰老细胞常有核体积增大、染色质收缩等变化。","错误。改正：衰老不等于立即坏死，细胞可继续存活。"],analysis:"细胞衰老是复杂过程，特征包括代谢减慢、膜通透性改变和细胞核结构变化等，不能等同于细胞死亡。",steps:["列举衰老细胞的结构与代谢特征。","区分衰老和坏死。","避免把“可能”扩大为“必然”。"],tip:"衰老细胞不是必然立即死亡。"}),oe({id:"multi-bio-differentiation-03",subject:"biology",topicId:"bio-differentiation",difficulty:5,examStyle:"高考多选题改编 · 细胞全能性",stem:"关于细胞全能性，下列说法正确的是（多选）",options:["已分化的植物细胞在适宜条件下可表现全能性","受精卵通常具有较高的全能性","全能性表达需要适宜的营养和外界条件","所有动物体细胞都能直接发育成完整个体"],correct:[0,1,2],notes:["正确。植物组织培养可证明分化细胞具有全能性。","正确。受精卵是发育起点，全能性高。","正确。潜能存在不等于自动表达，需要培养条件。","错误。改正：多数动物体细胞难以直接发育为完整个体。"],analysis:"细胞全能性指含有完整基因组的细胞具有发育成完整个体的潜能。潜能和实际表达不是同一概念。",steps:["区分全能性潜能与表达条件。","比较植物与动物细胞。","排除“所有动物体细胞”绝对化表述。"],tip:"具有全能性不代表任何条件下都能实现。"}),oe({id:"multi-bio-differentiation-04",subject:"biology",topicId:"bio-differentiation",difficulty:5,examStyle:"高考多选题改编 · 凋亡与坏死",stem:"比较细胞凋亡和细胞坏死，下列说法正确的是（多选）",options:["凋亡通常由基因调控","坏死常伴随细胞内容物外泄和炎症反应","凋亡在正常发育中具有作用","二者都是完全相同的死亡过程"],correct:[0,1,2],notes:["正确。凋亡受基因程序调控。","正确。坏死常使膜完整性丧失并引发炎症。","正确。凋亡参与器官塑造和组织更新。","错误。改正：凋亡与坏死的机制、形态变化和生理意义不同。"],analysis:"凋亡是程序性死亡，坏死多由强烈损伤引起。两者的形态学表现和对周围组织的影响不同。",steps:["判断是否受基因程序控制。","比较膜完整性。","联系发育和炎症结果。"],tip:"凋亡是有意义的主动死亡过程。"}),oe({id:"multi-chem-bond-05",subject:"chemistry",topicId:"chem-bond",difficulty:5,examStyle:"高考多选题改编 · 电解质与键型",stem:"关于物质的化学键与电离，下列说法正确的是（多选）",options:["NaCl溶于水时离子键被破坏","HCl溶于水电离出H⁺和Cl⁻","共价化合物溶于水一定不能导电","NaOH熔化时破坏离子键"],correct:[0,1,3],notes:["正确。NaCl溶于水后Na⁺和Cl⁻被水分子分散，离子键被破坏。","正确。HCl是共价化合物，溶于水可电离。","错误。改正：HCl等共价化合物溶于水后可因电离而导电。","正确。NaOH熔化时Na⁺与OH⁻之间的离子键被破坏，OH⁻内部共价键通常保留。"],analysis:"键型和溶于水后的行为要分开判断。共价化合物不一定不导电，离子化合物熔化时离子可迁移。",steps:["判断原物质主要键型。","分析溶解或熔化时破坏哪种作用。","由自由移动离子判断导电性。"],tip:"共价化合物也可能在水中电离。"}),oe({id:"multi-bio-differentiation-05",subject:"biology",topicId:"bio-differentiation",difficulty:5,examStyle:"高考多选题改编 · 基因与细胞命运",stem:"关于细胞分化、癌变和干细胞，下列说法正确的是（多选）",options:["细胞分化通常不改变细胞的核遗传物质","原癌基因和抑癌基因突变可能与癌变有关","干细胞可能具有分裂和分化能力","癌细胞的分化程度一定高于正常细胞"],correct:[0,1,2],notes:["正确。分化细胞的遗传物质通常保持稳定，差异主要来自选择性表达。","正确。原癌基因激活或抑癌基因功能丧失可促进癌变。","正确。干细胞通常可增殖并分化为特定细胞类型。","错误。改正：癌细胞常表现为分化异常或分化程度降低。"],analysis:"分化、癌变和干细胞都与基因表达和细胞命运有关。分化通常不丢失基因组，癌变常伴随增殖调控异常。",steps:["区分遗传物质改变与表达改变。","联系原癌基因和抑癌基因。","判断癌细胞的分化状态。"],tip:"癌细胞通常不是分化更成熟，而是调控失常。"})],$1=JSON.parse('[{"id":"exam-d7a3a6e1dda3feb9341d2fb9","subject":"chemistry","topicId":"chem-classification","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2016 · 全国 · （新课标ⅱ）","stem":"下列关于燃料的说法错误的是（）","options":[{"key":"A","text":"燃料燃烧产物 CO₂ 是温室气体之一"},{"key":"B","text":"化石燃料完全燃烧不会造成大气污染"},{"key":"C","text":"以液化石油气代替燃油可减少大气污染"},{"key":"D","text":"燃料不完全燃烧排放的 C O 是大气污染物之一"}],"answer":"B","optionNotes":{"A":"错误。改正：形成温室效应的气体主要是二氧化碳的大量排放, 故 A 正确;","B":"正确。化石燃料含有硫等因素, 完全燃烧会生成二氧化硫会形成酸雨, 会造成大气 污染，故 B 错误;","C":"错误。改正：液化石油气含有杂质少, 燃烧更充分, 燃烧时产生的一氧化碳少, 对空气污 染小，减少大气污染, 故 C 正确;","D":"错误。改正：燃料不完全燃烧排放的 CO 有毒, 是大气污染物之一, 故 D 正确; 故选: B。"},"analysis":"解: A. 形成温室效应的气体主要是二氧化碳的大量排放, 故 A 正确; B. 化石燃料含有硫等因素, 完全燃烧会生成二氧化硫会形成酸雨, 会造成大气 污染，故 B 错误; C. 液化石油气含有杂质少, 燃烧更充分, 燃烧时产生的一氧化碳少, 对空气污 染小，减少大气污染, 故 C 正确; D. 燃料不完全燃烧排放的 CO 有毒, 是大气污染物之一, 故 D 正确; 故选: B。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 B。"],"tip":"真题来源：bench-化学-2016-新课标","examSource":{"title":"bench-化学-2016-新课标","year":2016,"region":"全国","examType":"（新课标ⅱ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-9b8c2e6643431c6f477a53a0","subject":"chemistry","topicId":"chem-redox","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2016 · 全国 · （新课标ⅰ）","stem":"设 Nₐ 为阿伏加德罗常数值. 下列有关叙述正确的是（）","options":[{"key":"A","text":"14 ~g 乙烯和丙烯混合气体中的氢原子数为 2 ~N_A"},{"key":"B","text":"1 ~mol ~N₂ 与 4 ~mol H₂ 反应生成的 NH₃ 分子数为 2 ~N_A"},{"key":"C","text":"1 ~mol Fe 溶于过量硝酸, 电子转移数为 2 ~N_A"},{"key":"D","text":"标准状况下, 2.24 ~L CCl₄ 含有的共价键数为 0.4 ~N_A"}],"answer":"A","optionNotes":{"A":"正确。14g 乙烯和丙烯混合气体中含 CH₂ 物质的量 = 14 ~g14 ~g / mol=1 ~mol, 含 氢原子数为 2 ~N_A, 故 A 正确;","B":"错误。改正：1mol N₂ 与 4 ~mol H₂ 反应生成的 NH₃, 反应为可逆反应 1 ~mol 氮气不能全部反应 生成氨气, 生成氨气分子数小于 2 ~N_A, 故 B 错误;","C":"错误。改正：1mol Fe 溶于过量硝酸生成硝酸铁, 电子转移为 3 ~mol, 电子转移数为 3 ~N_A, 故 C 错误;","D":"错误。改正：标准状况下, 四氯化碳不是气体, 2.24 ~L CCl₄ 含物质的量不是 0.1 ~mol, 故 D 错 误； 故选: A。"},"analysis":"解: A.14g 乙烯和丙烯混合气体中含 CH₂ 物质的量 = 14 ~g14 ~g / mol=1 ~mol, 含 氢原子数为
