）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-a1bb96d53cb8d1526365f1f2","subject":"chemistry","topicId":"chem-periodic","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2016 · 全国 · （新课标ⅱ）","stem":"a 、 b 、 c 、 d 为短周期元素, a 的原子中只有 1 个电子, b²⁻ 和 c⁺的电 子层结构相同， d 与 b 同族. 下列叙述错误的是（）","options":[{"key":"A","text":"a 与其他三种元素形成的二元化合物中其化合价均为 +1"},{"key":"B","text":"b 与其他三种元素均可形成至少两种二元化合物"},{"key":"C","text":"c 的原子半径是这些元素中最大的"},{"key":"D","text":"d 与 a 形成的化合物的溶液呈弱酸性"}],"answer":"A","optionNotes":{"A":"正确。H 元素与 Na 形成化合物 NaH, H 元素为 -1 价, 故 A 错误;","B":"错误。改正：O 元素与 H 元素形成 H₂ O 、 H₂ O₂, 与 Na 元素形成 Na₂ O 、 Na₂ O₂, 与 S 元素形 成 SO₂ 、 SO₃, 故 B 正确;","C":"错误。改正：同周期自左而右原子半径减小, 同主族自上而下原子半径增大, 所有元素中 H 原子半径最小, Na 的原子半径最大, 故 C 正确;","D":"错误。改正：d 与 a 形成的化合物为 H₂ ~S, H₂ ~S 的溶液呈弱酸性, 故 D 正确。 故选: A 。"},"analysis":"解: a 、 b 、 c 、 d 为短周期元素, a 的原子中只有 1 个电子, 则 a 为 H 元 素; b²⁻ 和 c⁺的电子层结构相同, 结合离子所得电荷可知 b 为 O 元素, c 为 Na ; d 与 b 同族, 则 d 为 S 元素。 A. H 元素与 Na 形成化合物 NaH, H 元素为 -1 价, 故 A 错误; B. O 元素与 H 元素形成 H₂ O 、 H₂ O₂, 与 Na 元素形成 Na₂ O 、 Na₂ O₂, 与 S 元素形 成 SO₂ 、 SO₃, 故 B 正确; C. 同周期自左而右原子半径减小, 同主族自上而下原子半径增大, 所有元素中 H 原子半径最小, Na 的原子半径最大, 故 C 正确; D. d 与 a 形成的化合物为 H₂ ~S, H₂ ~S 的溶液呈弱酸性, 故 D 正确。 故选: A 。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 A。"],"tip":"真题来源：bench-化学-2016-新课标","examSource":{"title":"bench-化学-2016-新课标","year":2016,"region":"全国","examType":"（新课标ⅱ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-7a110cb053d290c9878d8e43","subject":"chemistry","topicId":"chem-chlorine","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2016 · 全国 · （新课标ⅰ）","stem":"下列实验操作能达到实验目的是（）","options":[{"key":"A","text":"用长颈漏斗分离出乙酸与乙醇反应的产物"},{"key":"B","text":"用向上排空气法收集铜粉与稀硝酸反应产生的 NO"},{"key":"C","text":"配制氯化铁溶液时, 将氯化铁溶解在较浓的盐酸中再加水稀释"},{"key":"D","text":"将 Cl₂ 与 HCl 混合气体通过饱和食盐水可得到纯净的 Cl₂"}],"answer":"C","optionNotes":{"A":"错误。改正：长颈漏斗不能用作分离操作, 互不相溶的液体采用分液漏斗分 离, 乙酸、乙醇、乙酸乙酯互溶, 不能采取分液法分离, 应该采用蒸馏方法 分离提纯，故 A 错误;","B":"错误。改正：N O 易和空气中 O₂ 反应生成 NO₂, 所以不能用排空气法收集, NO 不易溶于水 ，应该用排水法收集，故 B 错误;","C":"正确。FeCl₃ 属于强酸弱碱盐, Fe³⁺ 易水解生成 Fe(OH)₃ 而产生浑浊, 为了防止氯 化铁水解, 应该将氯化铁溶解在较浓的盐酸中再加水稀释, 故 C 正确;","D":"错误。改正：将 Cl₂ 与 HCl 混合气体通过饱和食盐水会带出部分水蒸气, 所以得不到纯净的 氯气, 应该将饱和食盐水出来的气体再用浓硫酸干燥, 故 D 错误; 故选: C。"},"analysis":"解： A. 长颈漏斗不能用作分离操作, 互不相溶的液体采用分液漏斗分 离, 乙酸、乙醇、乙酸乙酯互溶, 不能采取分液法分离, 应该采用蒸馏方法 分离提纯，故 A 错误; B. N O 易和空气中 O₂ 反应生成 NO₂, 所以不能用排空气法收集, NO 不易溶于水 ，应该用排水法收集，故 B 错误; C. FeCl₃ 属于强酸弱碱盐, Fe³⁺ 易水解生成 Fe(OH)₃ 而产生浑浊, 为了防止氯 化铁水解, 应该将氯化铁溶解在较浓的盐酸中再加水稀释, 故 C 正确; D. 将 Cl₂ 与 HCl 混合气体通过饱和食盐水会带出部分水蒸气, 所以得不到纯净的 氯气, 应该将饱和食盐水出来的气体再用浓硫酸干燥, 故 D 错误; 故选: C。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 C。"],"tip":"真题来源：bench-化学-2016-新课标","examSource":{"title":"bench-化学-2016-新课标","year":2016,"region":"全国","examType":"（新课标ⅰ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-7e5ef4b5920e1aab1f6f40f8","subject":"chemistry","topicId":"chem-chlorine","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2016 · 全国 · （新课标ⅱ）","stem":"分子式为 C₄ H₈ Cl₂ 的有机物共有（不含立体异构）（）","options":[{"key":"A","text":"7 种"},{"key":"B","text":"8 种"},{"key":"C","text":"9 种"},{"key":"D","text":"10 种"}],"answer":"C","optionNotes":{"A":"错误。改正：本题标准答案为 C，“9 种”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：本题标准答案为 C，“9 种”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","C":"正确。本题标准答案为 C，该表述符合真题结论。完整依据见上方解析。","D":"错误。改正：本题标准答案为 C，“9 种”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。"},"analysis":"解: C₄ H₈ Cl₂ 可以看作为 C₄ H₁₀ 中 2 个 H 原子被 2 个 Cl 原子取代, C₄ H₁₀ 有 CH₃ CH₂ CH₂ CH₃ 、 CH₃ C (CH₃ )₂ 两种, CH₃ CH₂ CH₂ CH₃ 中, 当两个 Cl 原子取代同一个 C 原子上的 H 时, 有 2 种, 当两个 Cl 原子取代不同 C 原子上的 H 时，有 1、2，1、3，1、4，2、3 四种情况, 有故 该情况有 6 种, CH₃ CH (CH₃ )₂ 中, 当两个 Cl 原子取代同一个 C 原子上的 H 时, 有 1 种, 当两个 Cl 原子取代不同 C 原子上的 H 时, 有 2 种, 故该情况有 3 种, 故共有 9 种, 故选: C。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 C。"],"tip":"真题来源：bench-化学-2016-新课标","examSource":{"title":"bench-化学-2016-新课标","year":2016,"region":"全国","examType":"（新课标ⅱ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-a227a1567f43bfd7017a1a65","subject":"chemistry","topicId":"chem-chlorine","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2016 · 全国 · （新课标ⅱ）","stem":"Mg-AgCl 电池是一种以海水为电解质溶液的水激活电池。下列叙述 错误的是 ( )","options":[{"key":"A","text":"负极反应式为 Mg-2 e⁻=Mg²⁺"},{"key":"B","text":"正极反应式为 Ag⁺+e⁻=Ag"},{"key":"C","text":"电池放电时 Cl⁻由正极向负极迁移"},{"key":"D","text":"负极会发生副反应 Mg+2 H₂ O=Mg(OH)₂+H₂"}],"answer":"B","optionNotes":{"A":"错误。改正：本题标准答案为 B，“正极反应式为 Ag⁺+e⁻=Ag”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"正确。AgCl 是难溶物, 其电极反应式为: 2 AgCl⁺ 2 e⁻=2 Cl⁻+2 Ag, 故 B 错误;","C":"错误。改正：原电池放电时, 阴离子向负极移动, 则 Cl⁻在正极产生由正极向负极迁移, 故 C 正确;","D":"错误。改正：镁是活泼金属与水反应, 即 Mg+2 H₂ O=Mg(OH) ₂+H₂ , 故 D 正确; 故选: B。"},"analysis":"解：A. 活泼金属镁作负极, 失电子发生氧化反应, 反应式为: Mg-2 e⁻=Mg²⁺, 故 A 正确; B. AgCl 是难溶物, 其电极反应式为: 2 AgCl⁺ 2 e⁻=2 Cl⁻+2 Ag, 故 B 错误; C. 原电池放电时, 阴离子向负极移动, 则 Cl⁻在正极产生由正极向负极迁移, 故 C 正确; D. 镁是活泼金属与水反应, 即 Mg+2 H₂ O=Mg(OH) ₂+H₂ , 故 D 正确; 故选: B。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 B。"],"tip":"真题来源：bench-化学-2016-新课标","examSource":{"title":"bench-化学-2016-新课标","year":2016,"region":"全国","examType":"（新课标ⅱ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-641faf13911ba172284bca74","subject":"chemistry","topicId":"chem-gas","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2016 · 全国 · （新课标ⅲ）","stem":"锌 - 空气燃料电池可用作电动车动力电源, 电池的电解质溶液为 KOH 溶液, 反应为 2 Zn+O₂+4 OH⁻+2 H₂ O=2 Zn(OH) 4²⁻. 下列说法正确的是","options":[{"key":"A","text":"充电时, 电解质溶液中 K⁺向阳极移动"},{"key":"B","text":"充电时, 电解质溶液中 c (OH⁻ )逐渐减小"},{"key":"C","text":"放电时, 负极反应为: Zn+4 OH⁻-2 e⁻=Zn(OH) 4²⁻"},{"key":"D","text":"放电时, 电路中通过 2 ~mol 电子, 消耗氧气 22.4 ~L (标准状况)"}],"answer":"C","optionNotes":{"A":"错误。改正：充电时阳离子向阴极移动, 故 A 错误;","B":"错误。改正：充电时, 电池反应为 Zn(OH) 4²⁻+2 e⁻=Zn+4 OH⁻, 电解质溶液中 C(OH -) 逐渐增大，故 B 错误;","C":"正确。放电时, 负极反应式为 Zn+4 OH⁻-2 e⁻=Zn(OH) 4²⁻, 故 C 正确;","D":"错误。改正：放电时, 每消耗标况下 22.4 ~L 氧气, 转移电子 4 ~mol, 故 D 错误。 故选: C。"},"analysis":"【解答】解: A. 充电时阳离子向阴极移动, 故 A 错误; B. 充电时, 电池反应为 Zn(OH) 4²⁻+2 e⁻=Zn+4 OH⁻, 电解质溶液中 C(OH -) 逐渐增大，故 B 错误; C. 放电时, 负极反应式为 Zn+4 OH⁻-2 e⁻=Zn(OH) 4²⁻, 故 C 正确; D. 放电时, 每消耗标况下 22.4 ~L 氧气, 转移电子 4 ~mol, 故 D 错误。 故选: C。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 C。"],"tip":"真题来源：bench-化学-2016-新课标","examSource":{"title":"bench-化学-2016-新课标","year":2016,"region":"全国","examType":"（新课标ⅲ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-1ea44b4474ac44fe1a09282a","subject":"chemistry","topicId":"chem-sodium","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2016 · 全国 · （新课标ⅱ）","stem":"某白色粉末由两种物质组成, 为鉴别其成分进行如下实验: (1)取少量样品加入足量水仍有部分固体末溶解: 再加入足量稀盐酸, 有气泡产生 ，固体全部溶解; (2)取少量样品加入足量稀硫酸有气泡产生, 振荡后仍有固体存在. 该白色粉末可能为（ )","options":[{"key":"A","text":"NaHCO₃ 、 Al(OH)₃"},{"key":"B","text":"AgCl 、 NaHCO₃"},{"key":"C","text":"Na₂ SO₃ 、 BaCO₃"},{"key":"D","text":"Na₂ CO₃ 、 CuSO₄"}],"answer":"C","optionNotes":{"A":"错误。改正：本题标准答案为 C，“Na₂ SO₃ 、 BaCO₃”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：碳酸氢钠与盐酸反应生成气体, AgCl 不溶于盐酸, 故 B 错误;","C":"正确。BaCO₃ 不溶于水, 二者都与盐酸反应, 且生成气体, 若加入足量稀硫酸, 有 气泡产生, 且 BaCO₃, 能和 H₂ SO₄ 反应生成 BaSO₄ 沉淀, 故 C 正确;","D":"错误。改正：加入过量硫酸, 生成二氧化碳气体, 但没有固体剩余, 故 D 错误。 故选: C。"},"analysis":"解: A . NaHCO₃ 、 Al(OH)₃ 都与盐酸反应, 硫酸足量时没有固体剩余, 故 A 错误; B. 碳酸氢钠与盐酸反应生成气体, AgCl 不溶于盐酸, 故 B 错误; C. BaCO₃ 不溶于水, 二者都与盐酸反应, 且生成气体, 若加入足量稀硫酸, 有 气泡产生, 且 BaCO₃, 能和 H₂ SO₄ 反应生成 BaSO₄ 沉淀, 故 C 正确; D. 加入过量硫酸, 生成二氧化碳气体, 但没有固体剩余, 故 D 错误。 故选: C。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 C。"],"tip":"真题来源：bench-化学-2016-新课标","examSource":{"title":"bench-化学-2016-新课标","year":2016,"region":"全国","examType":"（新课标ⅱ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-965c13a49994f806e2241ce7","subject":"chemistry","topicId":"chem-sodium","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2016 · 全国 · （新课标ⅲ）","stem":"四种短周期主族元素 W 、 X 、 Y 、 Z 的原子序数依次增大, W 、 X 的简 单离子具有相同电子层结构, X 的原子半径是短周期主族元素原子中最大的, W 与 Y 同族, Z 与 X 形成的离子化合物的水溶液呈中性. 下列说法正确的是","options":[{"key":"A","text":"W 与 X 形成的化合物溶于水后溶液呈碱性"},{"key":"B","text":"简单离子半径: W<X<Z"},{"key":"C","text":"气态氢化物的热稳定性: W<Y"},{"key":"D","text":"最高价氧化物的水化物的酸性: Y>Z"}],"answer":"A","optionNotes":{"A":"正确。W 可能是氮或氧, 与钠形成的化合物可能是氮化钠, 氧化钠, 过氧化钠, 它 们与水反应都能生成氢氧化钠使溶液呈碱性, 故 A 正确;","B":"错误。改正：X 离子 (Na⁺ ) 、 ~W 离子的电子层为 2 层, Z 离子 (Cl⁻ )电子层为 3 层, 电 子层结构相同, 核电荷数越大离子半径越小, 离子电子层越多离子半径越大, 故简单离子半径大小顺序是: X<W<Z, 故 B 错误;","C":"错误。改正：W 与 Y 处于同于主族, 从上到下非金属性逐渐减弱, 气态氢化物的热稳定性: W>Y, 故 C 错误;","D":"错误。改正：Y 与 Z 处于同同期, 从左到右非金属性逐渐增强, 最高价氧化物的水化物的 酸性: Z > Y, 故 D 错误。 故选: A。"},"analysis":"【解答】解：四种短周期主族元素 W、X、Y、Z 的原子序数依次增大, X 的原 子半径是短周期主族元素原子中最大的, 则 X 为 Na. 由原子序数可知, Y 、 Z 处于第三周期, 而 Z 与 X (钠) 形成的离子化合物的水溶液呈中性, 则 Z 为 Cl . W 、 X 的简单离子具有相同电子层结构, 且 W 与 Y 同族, W 在第二周 期且是非金属元素， W 可能是氮（或）氧，则对应的 Y 为磷（或硫）。 A. W 可能是氮或氧, 与钠形成的化合物可能是氮化钠, 氧化钠, 过氧化钠, 它 们与水反应都能生成氢氧化钠使溶液呈碱性, 故 A 正确; B. X 离子 (Na⁺ ) 、 ~W 离子的电子层为 2 层, Z 离子 (Cl⁻ )电子层为 3 层, 电 子层结构相同, 核电荷数越大离子半径越小, 离子电子层越多离子半径越大, 故简单离子半径大小顺序是: X<W<Z, 故 B 错误; C. W 与 Y 处于同于主族, 从上到下非金属性逐渐减弱, 气态氢化物的热稳定性: W>Y, 故 C 错误; D. Y 与 Z 处于同同期, 从左到右非金属性逐渐增强, 最高价氧化物的水化物的 酸性: Z > Y, 故 D 错误。 故选: A。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 A。"],"tip":"真题来源：bench-化学-2016-新课标","examSource":{"title":"bench-化学-2016-新课标","year":2016,"region":"全国","examType":"（新课标ⅲ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-effb2a741da55fd104033e61","subject":"chemistry","topicId":"chem-classification","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2017 · 全国 · （新课标ⅰ）","stem":"下列生活用品中主要由合成纤维制造的是（）","options":[{"key":"A","text":"尼龙绳"},{"key":"B","text":"宣纸"},{"key":"C","text":"羊绒衫"},{"key":"D","text":"棉祇衣"}],"answer":"A","optionNotes":{"A":"正确。尼龙绳的主要成分是聚酯类合成纤维, 满足条件, 故 A 正确;","B":"错误。改正：宣纸的主要成分为天然纤维素，不属于合成纤维，故 B 错误;","C":"错误。改正：羊绒衫的主要成分是蛋白质, 不属于合成纤维, 故 C 错误;","D":"错误。改正：棉衬衣的主要成分为天然纤维素, 不是合成纤维, 故 D 错误; 故选: A。"},"analysis":"解： A.尼龙绳的主要成分是聚酯类合成纤维, 满足条件, 故 A 正确; B. 宣纸的主要成分为天然纤维素，不属于合成纤维，故 B 错误; C. 羊绒衫的主要成分是蛋白质, 不属于合成纤维, 故 C 错误; D. 棉衬衣的主要成分为天然纤维素, 不是合成纤维, 故 D 错误; 故选: A。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 A。"],"tip":"真题来源：bench-化学-2017-新课标","examSource":{"title":"bench-化学-2017-新课标","year":2017,"region":"全国","examType":"（新课标ⅰ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-eb10bdea5e4edf0a751bf40c","subject":"chemistry","topicId":"chem-classification","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2017 · 全国 · （新课标ⅱ）","stem":"下列说法错误的是（）","options":[{"key":"A","text":"糖类化合物也可称为碳水化合物"},{"key":"B","text":"维生素 D 可促进人体对䥻的吸收"},{"key":"C","text":"蛋白质是仅由碳、氢、氧元素组成的物质"},{"key":"D","text":"硒是人体必需的微量元素，但不宜摄入过多"}],"answer":"C","optionNotes":{"A":"错误。改正：糖类化合物符合通式 C_n (H₂ O )_m, 故称为碳水化合物, 故 A 正确;","B":"错误。改正：维生素 D 可促进人体对钲的吸收，故 B 正确;","C":"正确。蛋白质的基本组成元素是 C 、 H 、 O 、 ~N 四中元素, 故仅由碳、氢、氧元素不 正确, 故 C 错误;","D":"错误。改正：硒是人体必需的微量元素, 但不宜摄入过多, 故 D 正确, 故选: C 。"},"analysis":"解: A. 糖类化合物符合通式 C_n (H₂ O )_m, 故称为碳水化合物, 故 A 正确; B. 维生素 D 可促进人体对钲的吸收，故 B 正确; C. 蛋白质的基本组成元素是 C 、 H 、 O 、 ~N 四中元素, 故仅由碳、氢、氧元素不 正确, 故 C 错误; D. 硒是人体必需的微量元素, 但不宜摄入过多, 故 D 正确, 故选: C 。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 C。"],"tip":"真题来源：bench-化学-2017-新课标","examSource":{"title":"bench-化学-2017-新课标","year":2017,"region":"全国","examType":"（新课标ⅱ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-9b47d4588e9a9e02734956e3","subject":"chemistry","topicId":"chem-classification","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2017 · 全国 · （新课标ⅲ）","stem":"化学与生活密切相关。下列说法错误的是（）","options":[{"key":"A","text":"PM2.5 是指粒径不大于 2.5 m 的可吸人悬浮颗粒物"},{"key":"B","text":"绿色化学要求从源头上消除或减少生产活动对环境的污染"},{"key":"C","text":"燃煤中加人 CaO 可以减少酸雨的形成及温室气体的排放"},{"key":"D","text":"天然气和液化石油气是我国目前推广使用的清洁燃料"}],"answer":"C","optionNotes":{"A":"错误。改正：本题标准答案为 C，“燃煤中加人 CaO 可以减少酸雨的形成及温室气体的排放”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：绿色化学的核心是利用化学原理从源头上消除或减少生产生活对环境的污 染，而不能污染后再治理，故 B 正确;","C":"正确。加人氧化钘可与煤燃烧生成的二氧化硫在氧气中发生反应生成硫酸铂, 二氧 化硫排放量减少, 但在高温下反应仍然生成二氧化碳, 即燃煤中加人 CaO 后 可减少酸雨的发生, 但不能减少温室气体的排放量, 故 C 错误;","D":"错误。改正：天然气 (CNG) 主要成分是甲烷, 液化石油气 (LPG) 的成分是丙烷、丁烷 等，这些碳氢化合物完全燃烧生成二氧化碳和水，则这两类燃料是清洁燃料, 故 D 正确; 故选:C。"},"analysis":"【解答】解：A. PM2.5 是指空气中直径等于或小于 2.5 m 的悬浮颗粒物, 它能 较长时间悬浮于空气中, 其在空气中含量浓度越高, 就代表空气污染越严重, 故 A 正确; B. 绿色化学的核心是利用化学原理从源头上消除或减少生产生活对环境的污 染，而不能污染后再治理，故 B 正确; C. 加人氧化钘可与煤燃烧生成的二氧化硫在氧气中发生反应生成硫酸铂, 二氧 化硫排放量减少, 但在高温下反应仍然生成二氧化碳, 即燃煤中加人 CaO 后 可减少酸雨的发生, 但不能减少温室气体的排放量, 故 C 错误; D. 天然气 (CNG) 主要成分是甲烷, 液化石油气 (LPG) 的成分是丙烷、丁烷 等，这些碳氢化合物完全燃烧生成二氧化碳和水，则这两类燃料是清洁燃料, 故 D 正确; 故选:C。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 C。"],"tip":"真题来源：bench-化学-2017-新课标","examSource":{"title":"bench-化学-2017-新课标","year":2017,"region":"全国","examType":"（新课标ⅲ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-bb8cb8cf28af075c051014db","subject":"chemistry","topicId":"chem-classification","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2017 · 全国 · （新课标ⅰ）","stem":"《本草衍义》中对精制砒霜过程有如下叙述: “取砒之法, 将生砒就 置火上, 以器覆之, 令砒烟上飞着覆器, 遂凝结累然下垂如乳, 尖长者为胜, 平短者次之。”文中涉及的操作方法是（）","options":[{"key":"A","text":"蒸馏"},{"key":"B","text":"升华"},{"key":"C","text":"干馏"},{"key":"D","text":"萃取"}],"answer":"B","optionNotes":{"A":"错误。改正：本题标准答案为 B，“升华”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"正确。本题标准答案为 B，该表述符合真题结论。完整依据见上方解析。","C":"错误。改正：本题标准答案为 B，“升华”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","D":"错误。改正：本题标准答案为 B，“升华”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。"},"analysis":"解: “取砒之法, 将生砒就置火上, 以器覆之, 令砒烟上飞着覆器, 遂 凝结累然下垂如乳”, 涉及用到加热的方法, 将被提纯物质气化、冷凝为固体 的过程, 为升华操作, 没有隔绝空气强热, 不是干馏, 萃取无需加热。 故选: B。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 B。"],"tip":"真题来源：bench-化学-2017-新课标","examSource":{"title":"bench-化学-2017-新课标","year":2017,"region":"全国","examType":"（新课标ⅰ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-6b5a3f43d723921845fb6219","subject":"chemistry","topicId":"chem-gas","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2017 · 全国 · （新课标ⅱ）","stem":"阿伏加德罗常数的值为 Nₐ. 下列说法正确的是（）","options":[{"key":"A","text":"1 ~L 0.1 ~mol L⁻¹ NH₄ Cl 溶液中, NH₄ ⁺的数量为 0.1 ~N_A"},{"key":"B","text":"2.4 gMg 与 H₂ SO₄ 完全反应, 转移的电子数为 0.1 ~N_A"},{"key":"C","text":"标准状况下, 2.24 LN₂ 和 O₂ 的混合气体中分子数为 0.2 ~N_A"},{"key":"D","text":"0.1 ~mol H₂ 和 0.1 ~mol I 于密闭容器中充分反应后, 其分子总数为 0.2 ~N_A"}],"answer":"D","optionNotes":{"A":"错误。改正：铵根易水解, 所含 NH₄ ⁺数小于 0.1 ~N_A, 故 A 错误;","B":"错误。改正：n(Mg)= 2.4 ~g24 ~g / mol=0.1 ~mol, Mg 与 H₂ SO₄ 反应生成 Mg²⁺, 则 1 molMg 参与 反应转移 2 ~mol 电子, 故 0.1 molMg 参与反应转移 0.2 ~mol 电子, 即 0.2 ~N_A, 故 B 错误;","C":"错误。改正：标准状况下, 22.4 ~L 任何气体所含的分子数为 1 ~mol, 故 2.24 LN₂ 和 O₂ 的混合 气体中分子数为 0.1 ~mol, 即 0.1 ~N_A, 故 C 错误;","D":"正确。H₂+I₂ 2 HI 是可逆反应, 不过是 1+1=2 的反应, 即这是一个反应前后分子物 质的量不变的反应, 故反应后分子总数仍为 0.2 NA, 故选 D 。"},"analysis":"解: A. 铵根易水解, 所含 NH₄ ⁺数小于 0.1 ~N_A, 故 A 错误; B. n(Mg)= 2.4 ~g24 ~g / mol=0.1 ~mol, Mg 与 H₂ SO₄ 反应生成 Mg²⁺, 则 1 molMg 参与 反应转移 2 ~mol 电子, 故 0.1 molMg 参与反应转移 0.2 ~mol 电子, 即 0.2 ~N_A, 故 B 错误; C. 标准状况下, 22.4 ~L 任何气体所含的分子数为 1 ~mol, 故 2.24 LN₂ 和 O₂ 的混合 气体中分子数为 0.1 ~mol, 即 0.1 ~N_A, 故 C 错误; D. H₂+I₂ 2 HI 是可逆反应, 不过是 1+1=2 的反应, 即这是一个反应前后分子物 质的量不变的反应, 故反应后分子总数仍为 0.2 NA, 故选 D 。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 D。"],"tip":"真题来源：bench-化学-2017-新课标","examSource":{"title":"bench-化学-2017-新课标","year":2017,"region":"全国","examType":"（新课标ⅱ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-282fc48d19bd3e2892e477c0","subject":"chemistry","topicId":"chem-classification","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2017 · 全国 · （新课标ⅲ）","stem":"下列说法正确的是（）","options":[{"key":"A","text":"植物油氢化过程中发生了加成反应"},{"key":"B","text":"淀粉和纤维素互为同分异构体"},{"key":"C","text":"环己烷与苯可用酸性 KMnO₄ 溶液鉴别"},{"key":"D","text":"水可以用来分离溴苯和苯的混合物"}],"answer":"A","optionNotes":{"A":"正确。植物油氢化过程为与氢气发生加成反应的过程, 由不饱和烃基 变为饱和烃基，故 A 正确;","B":"错误。改正：淀粉和纤维素都为高分子化合物, 聚合度介于较大范围之间, 没有具体的值, 则二者的分子式不同，不是同分异构体，故 B 错误;","C":"错误。改正：环己烷为饱和烃, 苯性质稳定, 二者与高锰酸钾都不反应, 不能鉴别, 故 C 错误;","D":"错误。改正：溴苯和苯混溶, 且二者都不溶于水, 不能用水分离, 故 D 错误。 故选: A。"},"analysis":"【解答】解: A. 植物油氢化过程为与氢气发生加成反应的过程, 由不饱和烃基 变为饱和烃基，故 A 正确; B. 淀粉和纤维素都为高分子化合物, 聚合度介于较大范围之间, 没有具体的值, 则二者的分子式不同，不是同分异构体，故 B 错误; C. 环己烷为饱和烃, 苯性质稳定, 二者与高锰酸钾都不反应, 不能鉴别, 故 C 错误; D. 溴苯和苯混溶, 且二者都不溶于水, 不能用水分离, 故 D 错误。 故选: A。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 A。"],"tip":"真题来源：bench-化学-2017-新课标","examSource":{"title":"bench-化学-2017-新课标","year":2017,"region":"全国","examType":"（新课标ⅲ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-12f0e17ce7bfe03add574ad6","subject":"chemistry","topicId":"chem-classification","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2017 · 全国 · （新课标ⅰ）","stem":"已知 (b) (d) 的分子式均为 C₆ H₆, 下列说法正确的是（ )","options":[{"key":"A","text":"b 的同分异构体只有 d 和 p 两种"},{"key":"B","text":"它们的二氯代物均只有三种"},{"key":"C","text":"它们均可与酸性高锰酸钾溶液反应"},{"key":"D","text":"只有 b 的所有原子处于同一平面"}],"answer":"D","optionNotes":{"A":"错误。改正：b 为苯, 对应的同分异构体可为环状烃, 也可为链状烃, 如 HC C-CH=CH-CH=CH₂, 则同分异构体不仅仅 d 和 p 两种, 故 A 错误;","B":"错误。改正：d 编号如图 4 , 对应的二氯代物中，两个氯原子可分别位于 1 、 2 ， 1 、 3 ，1、4, 2、3，2、5，3、6 等位置，故 B 错误;","C":"错误。改正：p 为饱和烃, 与高锰酸钾不反应, 且 b 也不反应, 故 C 错误;","D":"正确。d 、 p 都含有饱和碳原子, 具有甲烷的结构特点, 则 d, p 所有原子不可能处 于同一平面, 只有 b 为平面形结构, 故 D 正确。 故选: D。"},"analysis":"解: A. b 为苯, 对应的同分异构体可为环状烃, 也可为链状烃, 如 HC C-CH=CH-CH=CH₂, 则同分异构体不仅仅 d 和 p 两种, 故 A 错误; B. d 编号如图 4 , 对应的二氯代物中，两个氯原子可分别位于 1 、 2 ， 1 、 3 ，1、4, 2、3，2、5，3、6 等位置，故 B 错误; C. p 为饱和烃, 与高锰酸钾不反应, 且 b 也不反应, 故 C 错误; D. d 、 p 都含有饱和碳原子, 具有甲烷的结构特点, 则 d, p 所有原子不可能处 于同一平面, 只有 b 为平面形结构, 故 D 正确。 故选: D。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 D。"],"tip":"真题来源：bench-化学-2017-新课标","examSource":{"title":"bench-化学-2017-新课标","year":2017,"region":"全国","examType":"（新课标ⅰ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-2fd8c0bea930a9a899af9024","subject":"chemistry","topicId":"chem-metals","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2017 · 全国 · （新课标ⅱ）","stem":"a 、 b 、 c 、 d 为原子序数依次增大的短周期主族元素, a 原子核外电子 总数与 b 原子次外层的电子数相同; c 所在周期数与族数相同; d 与 a 同族, 下列叙述正确的是（）","options":[{"key":"A","text":"原子半径: d>c>b>a"},{"key":"B","text":"4 种元素中 b 的金属性最强"},{"key":"C","text":"c 的氧化物的水化物是强碱"},{"key":"D","text":"d 单质的氧化性比 a 单质的氧化性强"}],"answer":"B","optionNotes":{"A":"错误。改正：同周期元素从左到右原子半径逐渐减小, 应为 b>c>d, a 为 O, 原子半径最 小，故 A 错误;","B":"正确。同周期元素从左到右元素的金属性逐渐降低, 则金属性 b>c, a 、 ~d 为非金属 , 金属性较弱, 则 4 种元素中 b 的金属性最强, 故 B 正确;","C":"错误。改正：c 为 Al, 对应的氧化物的水化物为氢氧化铝, 为弱碱, 故 C 错误;","D":"错误。改正：一般来说, 元素的非金属性越强, 对应的单质的氧化性越强, 应为 a 的单质 的氧化性强, 故 D 错误。 故选: B。"},"analysis":"解: 由以上分析可知 a 为 O 元素、 b 可能为 Na 或 Mg 、 c 为 Al 、 ~d 为 S 元素。 A. 同周期元素从左到右原子半径逐渐减小, 应为 b>c>d, a 为 O, 原子半径最 小，故 A 错误; B. 同周期元素从左到右元素的金属性逐渐降低, 则金属性 b>c, a 、 ~d 为非金属 , 金属性较弱, 则 4 种元素中 b 的金属性最强, 故 B 正确; C. c 为 Al, 对应的氧化物的水化物为氢氧化铝, 为弱碱, 故 C 错误; D. 一般来说, 元素的非金属性越强, 对应的单质的氧化性越强, 应为 a 的单质 的氧化性强, 故 D 错误。 故选: B。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 B。"],"tip":"真题来源：bench-化学-2017-新课标","examSource":{"title":"bench-化学-2017-新课标","year":2017,"region":"全国","examType":"（新课标ⅱ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-911b68a541a388acb597eeee","subject":"chemistry","topicId":"chem-ion","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2017 · 全国 · （新课标ⅲ）","stem":"Nₐ 为阿伏加德罗常数的值. 下列说法正确的是 （）","options":[{"key":"A","text":"0.1 ~mol 的 ¹¹ ~B 中, 含有 0.6 ~N_A 个中子"},{"key":"B","text":"pH=1 的 H₃ PO₄ 溶液中, 今含有 0.1 ~N_A 个 H⁺"},{"key":"C","text":"2.24 ~L (标准状况) 苯在 O₂ 中完全燃烧, 得到 0.6 ~N_A 个 CO₂ 分子"},{"key":"D","text":"密闭容器中 1 ~mol PCl₃ 与 1 ~mol Cl₂ 反应制备 PCl₅(~g) ， 增加 2 ~N_A 个 P- Cl 键"}],"answer":"A","optionNotes":{"A":"正确。本题标准答案为 A，该表述符合真题结论。完整依据见上方解析。","B":"错误。改正：没有告诉 pH=1 的 H₃ PO₄ 溶液的体积, 无法计算溶液中含有氢离子的物质的 量就数目， 故 B 错误;","C":"错误。改正：标准状况下苯不是气体，不能使用标况下的气体摩尔体积计算, 故 C 错误;","D":"错误。改正：PCl₃ 与 Cl₂ 生成 PCl₅ 的反应为可逆反应，则生成 PCl₅ 的物质的量小于 1 ~mol, 增加的 P-Cl 键小于 2 ~N_A ， 故 D 错误; 故选: A。"},"analysis":"【解答】解: A . ¹¹ ~B 中含有中子数 =11-5=6,0.1 ~mol 的 ¹¹ ~B 中含有 0.6 ~mol 中子, 含有 0.6 ~N_A 个中子，故 A 正确; B. 没有告诉 pH=1 的 H₃ PO₄ 溶液的体积, 无法计算溶液中含有氢离子的物质的 量就数目， 故 B 错误; C. 标准状况下苯不是气体，不能使用标况下的气体摩尔体积计算, 故 C 错误; D. PCl₃ 与 Cl₂ 生成 PCl₅ 的反应为可逆反应，则生成 PCl₅ 的物质的量小于 1 ~mol, 增加的 P-Cl 键小于 2 ~N_A ， 故 D 错误; 故选: A。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 A。"],"tip":"真题来源：bench-化学-2017-新课标","examSource":{"title":"bench-化学-2017-新课标","year":2017,"region":"全国","examType":"（新课标ⅲ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-7e98e2e361f27968b88d8ee3","subject":"chemistry","topicId":"chem-periodic","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2017 · 全国 · （新课标ⅰ）","stem":"短周期主族元素 W 、 X 、 Y 、 Z 的原子序数依次增大， W 的简单氢化 物可用作制冷剂, Y 的原子半径是所有短周期主族元素中最大的。由 X 、 Y 和 Z 三种元素形成的一种盐溶于水后, 加入稀盐酸, 有黄色沉淀析出, 同时 有刺激性气体产生。下列说法不正确的是（）","options":[{"key":"A","text":"X 的简单氢化物的热稳定性比 W 强"},{"key":"B","text":"Y 与 X 的简单离子的具有相同的电子层结构"},{"key":"C","text":"Y 与 Z 形成的化合物的水溶液可使蓝色石芯试纸变红"},{"key":"D","text":"Z 与 X 属于同一主族, 与 Y 属于同一周期"}],"answer":"C","optionNotes":{"A":"错误。改正：非金属性 O>N, 元素的非金属性越强, 对应的氢化物越稳定, 故 A 正确;","B":"错误。改正：Y 为 Na 元素, X 为 O 元素, 对应的简单离子核外都有 10 个电子, 与 Ne 的 核外电子排布相同, 故 B 正确;","C":"正确。Y 与 Z 形成的化合物为 Na₂ ~S, 为强碱弱酸盐, 水解呈碱性, 则可使红色石䓌心 试液变蓝色, 蓝色石䓌试纸不变色, 故 C 错误;","D":"错误。改正：Z 为 S 元素, 与 O 同主族, 与 Na 同周期, 故 D 正确。 故选: C。"},"analysis":"解: 由以上分析可知 W 为 N 元素, X 为 O 元素, Y 为 Na 元素, Z 为 S 元素。 A. 非金属性 O>N, 元素的非金属性越强, 对应的氢化物越稳定, 故 A 正确; B. Y 为 Na 元素, X 为 O 元素, 对应的简单离子核外都有 10 个电子, 与 Ne 的 核外电子排布相同, 故 B 正确; C. Y 与 Z 形成的化合物为 Na₂ ~S, 为强碱弱酸盐, 水解呈碱性, 则可使红色石䓌心 试液变蓝色, 蓝色石䓌试纸不变色, 故 C 错误; D. Z 为 S 元素, 与 O 同主族, 与 Na 同周期, 故 D 正确。 故选: C。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 C。"],"tip":"真题来源：bench-化学-2017-新课标","examSource":{"title":"bench-化学-2017-新课标","year":2017,"region":"全国","examType":"（新课标ⅰ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-6c4c323bf8af437d82d92eab","subject":"chemistry","topicId":"chem-iron","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2018 · 全国 · （新课标ⅰ）","stem":"磷酸亚铁锂 (LiFePO₄ ) 电池是新能源汽车的动力电池之一, 采用湿 法冶金工艺回收废旧磷酸亚铁锂电池正极片中的金属, 其流程如下: 下列叙述错误的是（ )","options":[{"key":"A","text":"合理处理废旧电池有利于保护环境和资源再利用"},{"key":"B","text":"从“正极片”中可回收的金属元素有 Al 、 Fe 、 Li"},{"key":"C","text":"“沉淀”反应的金属离子为 Fe³⁺"},{"key":"D","text":"上述流程中可用硫酸钠代替碳酸钠"}],"answer":"D","optionNotes":{"A":"错误。改正：合理处理废旧电池, 可减少污染性废水的排放, 且回收含有 Al 、 Fe 等金属, 可再利用, 故 A 正确;","B":"错误。改正：由以上分析可知从“正极片”中可回收的金属元素有 Al、Fe、Li 等, 故 B 正确","C":"错误。改正：硝酸具有强氧化性, 可氧化亚铁离子生成铁离子, 则“沉淀”反应的金属离子 为 Fe³⁺, 故 C 正确;","D":"正确。加入硫酸钠, 不能生成含 Li 沉淀, 故 D 错误。 故选: D。"},"analysis":"解: A. 合理处理废旧电池, 可减少污染性废水的排放, 且回收含有 Al 、 Fe 等金属, 可再利用, 故 A 正确; B. 由以上分析可知从“正极片”中可回收的金属元素有 Al、Fe、Li 等, 故 B 正确 C. 硝酸具有强氧化性, 可氧化亚铁离子生成铁离子, 则“沉淀”反应的金属离子 为 Fe³⁺, 故 C 正确; D. 加入硫酸钠, 不能生成含 Li 沉淀, 故 D 错误。 故选: D。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 D。"],"tip":"真题来源：bench-化学-2018-新课标","examSource":{"title":"bench-化学-2018-新课标","year":2018,"region":"全国","examType":"（新课标ⅰ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-9b7541b5a5095da7ddc917f1","subject":"chemistry","topicId":"chem-classification","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2018 · 全国 · （新课标ⅰ）","stem":"下列说法错误的是（）","options":[{"key":"A","text":"蔗糖、果糖和麦芽糖均为双糖"},{"key":"B","text":"酶是一类具有高选择催化性能的蛋白质"},{"key":"C","text":"植物油含不饱和脂肪酸酯, 能使 Br₂ / CCl₄ 褪色"},{"key":"D","text":"淀粉和纤维素水解的最终产物均为葡萄糖"}],"answer":"A","optionNotes":{"A":"正确。蔗糖和麦芽糖均为双糖, 果糖为单糖, 故 A 错误;","B":"错误。改正：绝大多数酶是蛋白质, 少数具有生物催化功能的分子不是蛋白质, 如复合酶, 故 B 错误;","C":"错误。改正：植物油为液态油脂, 分子的烃基中含不饱和碳碳双键, 这种脂肪酸酯, 能使 Br₂ / CCl₄ 褪色, 发生加成反应, 故 C 正确;","D":"错误。改正：淀粉和纤维素为多糖, 一定条件下水解的最终产物均为葡萄糖, 故 D 正确; 故选： A B 。"},"analysis":"解: A. 蔗糖和麦芽糖均为双糖, 果糖为单糖, 故 A 错误; B. 绝大多数酶是蛋白质, 少数具有生物催化功能的分子不是蛋白质, 如复合酶, 故 B 错误; C. 植物油为液态油脂, 分子的烃基中含不饱和碳碳双键, 这种脂肪酸酯, 能使 Br₂ / CCl₄ 褪色, 发生加成反应, 故 C 正确; D. 淀粉和纤维素为多糖, 一定条件下水解的最终产物均为葡萄糖, 故 D 正确; 故选： A B 。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 A。"],"tip":"真题来源：bench-化学-2018-新课标","examSource":{"title":"bench-化学-2018-新课标","year":2018,"region":"全国","examType":"（新课标ⅰ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-f24e0370cd945b61bc805a48","subject":"chemistry","topicId":"chem-metals","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2018 · 全国 · （新课标ⅲ）","stem":"下列叙述正确的是 ( )","options":[{"key":"A","text":"24 ~g 镁与 27 ~g 铝中, 含有相同的质子数"},{"key":"B","text":"同等质量的氧气和臭氧中, 电子数相同"},{"key":"C","text":"1 ~mol 重水与 1 ~mol 水中, 中子数比为 2: 1"},{"key":"D","text":"1 ~mol 乙烷和 1 ~mol 乙烯中, 化学键数相同"}],"answer":"B","optionNotes":{"A":"错误。改正：24 ~g 镁与 27 ~g 铝的物质的量均为 1 ~mol, 1 molMg 含有 12 ~mol 质子, 1 molAl 含有 13 ~mol 质子，二者不含有相同的质子数，故 A 错误;","B":"正确。氧气和臭氧均只含有氧原子, 同等质量的氧气和臭氧中, 相当于同等质量的 氧原子, 所含电子数相同, 故 B 正确;","C":"错误。改正：质量数= 质子数+中子数, H 无中子, D 含有 1 个中子, O 含有 8 个中子, 所 以 1 ~mol 重水与 1 ~mol 水中, 中子数比为 10: 8=5: 4, 故 C 错误;","D":"错误。改正：1 ~mol 乙烷含有 7 ~mol 共价键, 1 ~mol 乙烯含有 6 ~mol 共价键, 二者化学键数不相 同，故 D 错误, 故选: B。"},"analysis":"【解答】解: A. 24 ~g 镁与 27 ~g 铝的物质的量均为 1 ~mol, 1 molMg 含有 12 ~mol 质子, 1 molAl 含有 13 ~mol 质子，二者不含有相同的质子数，故 A 错误; B. 氧气和臭氧均只含有氧原子, 同等质量的氧气和臭氧中, 相当于同等质量的 氧原子, 所含电子数相同, 故 B 正确; C. 质量数= 质子数+中子数, H 无中子, D 含有 1 个中子, O 含有 8 个中子, 所 以 1 ~mol 重水与 1 ~mol 水中, 中子数比为 10: 8=5: 4, 故 C 错误; D. 1 ~mol 乙烷含有 7 ~mol 共价键, 1 ~mol 乙烯含有 6 ~mol 共价键, 二者化学键数不相 同，故 D 错误, 故选: B。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 B。"],"tip":"真题来源：bench-化学-2018-新课标","examSource":{"title":"bench-化学-2018-新课标","year":2018,"region":"全国","examType":"（新课标ⅲ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-0a139d4a9a1614dba73ef024","subject":"chemistry","topicId":"chem-chlorine","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2018 · 全国 · （新课标ⅰ）","stem":"Nₐ 是阿伏加德罗常数的值, 下列说法正确的是（ ）","options":[{"key":"A","text":"16.25 gFeCl₃, 水解形成的 Fe(OH)₃ 为胶体粒子数为 0.1 ~N_A"},{"key":"B","text":"22.4 ~L (标准状况) 氩气含有的质子数为 18 ~N_A"},{"key":"C","text":"92.0 ~g 甘油 (丙三醇) 中含有羟基数为 1.0 ~N_A"},{"key":"D","text":"1.0 molCH₄ 与 Cl₂ 在光照下生成 CH₃ Cl 的分子数为 1.0 ~N_A"}],"answer":"B","optionNotes":{"A":"错误。改正：胶体粒子是一个聚合体, 16.25 gFeCl₃ 的物质的量为 16.25 ~g162.5 ~g / mol=0.1 ~mol, 水解形成 Fe(OH)₃ 胶体时, 多个 Fe(OH)₃ 聚合为一 个胶体粒子, 所以形成的胶体粒子数小于 0.1 ~mol, 即 0.1 ~N_A, 故 A 错误;","B":"正确。22.4L 标准状况的氩气的物质的量为 1 ~mol, 氩气是单原子气体, 所以含有 18 molAr ，即含有 18 ~mol 质子，即 18 ~N_A 个质子，故 B 正确;","C":"错误。改正：92.0g 甘油 (丙三醇) 的物质的量为 92 ~g92 ~g / mol=1 ~mol, 1 ~mol 丙三醇含有 3 ~mol 羟 基, 即含有嵯基数为 3 N_A, 故 C 错误;","D":"错误。改正：CH₄ 与 Cl₂ 的在光照下发生的取代反应产物是混合物, 不是完全生成 CH₃ Cl^ , , 所以生成 CH₃ Cl 的分子数不是 1.0 ~N_A, 故 D 错误, 故选: B。"},"analysis":"解： A. 胶体粒子是一个聚合体, 16.25 gFeCl₃ 的物质的量为 16.25 ~g162.5 ~g / mol=0.1 ~mol, 水解形成 Fe(OH)₃ 胶体时, 多个 Fe(OH)₃ 聚合为一 个胶体粒子, 所以形成的胶体粒子数小于 0.1 ~mol, 即 0.1 ~N_A, 故 A 错误; B.22.4L 标准状况的氩气的物质的量为 1 ~mol, 氩气是单原子气体, 所以含有 18 molAr ，即含有 18 ~mol 质子，即 18 ~N_A 个质子，故 B 正确; C.92.0g 甘油 (丙三醇) 的物质的量为 92 ~g92 ~g / mol=1 ~mol, 1 ~mol 丙三醇含有 3 ~mol 羟 基, 即含有嵯基数为 3 N_A, 故 C 错误; D. CH₄ 与 Cl₂ 的在光照下发生的取代反应产物是混合物, 不是完全生成 CH₃ Cl^ , , 所以生成 CH₃ Cl 的分子数不是 1.0 ~N_A, 故 D 错误, 故选: B。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 B。"],"tip":"真题来源：bench-化学-2018-新课标","examSource":{"title":"bench-化学-2018-新课标","year":2018,"region":"全国","examType":"（新课标ⅰ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-08e0403bb058b6ebdebd0909","subject":"chemistry","topicId":"chem-ion","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2018 · 全国 · （新课标ⅲ）","stem":"下列实验操作不当的是 ( )","options":[{"key":"A","text":"用稀硫酸和锌粒制取 H₂ 时, 加几滴 CuSO₄ 溶液以加快反应速率"},{"key":"B","text":"用标准 HCl 溶液滴定 NaHCO₃ 溶液来测定其浓度，选择酚唒为指示剂"},{"key":"C","text":"用铂丝蘸取某碱金属的盐溶液灼烧, 火焰呈黄色, 证明其中含有 Na⁺"},{"key":"D","text":"常压蒸馏时, 加人液体的体积不超过圆底烧瓶容积的三分之二"}],"answer":"B","optionNotes":{"A":"错误。改正：Zn 能置换出硫酸铜溶液中的 Cu, Zn 、 Cu 和稀硫酸构成原电池, 加快 Zn 的腐蚀, 从而加快化学反应速率, 故 A 不选;","B":"正确。强酸与强碱的滴定可以采用酚䣭或甲基橙; 弱酸与强碱的滴定用酚䣭, 因为 弱酸与强碱恰好反应时溶液显碱性（生成强碱弱酸盐, 水解显碱性）, 酚唒 在碱性范围变色; 反之强酸与弱碱的滴定用甲基橙可以减少误差, 碳酸氢钠 呈弱碱性，所以应该选取甲基橙作指示剂，故 B 选;","C":"错误。改正：钠元素的焰色反应呈黄色, 该实验蘸取的溶液为盐溶液, 焰色反应呈黄色, 说明溶液中含有钠离子，故 C 不选;","D":"错误。改正：超过容积的 23 时液体沸腾后, 可能会有液体从支管口处溅出, 易产生安全事 故，故 D 不选; 故选: B。"},"analysis":"【解答】解: A. Zn 能置换出硫酸铜溶液中的 Cu, Zn 、 Cu 和稀硫酸构成原电池, 加快 Zn 的腐蚀, 从而加快化学反应速率, 故 A 不选; B. 强酸与强碱的滴定可以采用酚䣭或甲基橙; 弱酸与强碱的滴定用酚䣭, 因为 弱酸与强碱恰好反应时溶液显碱性（生成强碱弱酸盐, 水解显碱性）, 酚唒 在碱性范围变色; 反之强酸与弱碱的滴定用甲基橙可以减少误差, 碳酸氢钠 呈弱碱性，所以应该选取甲基橙作指示剂，故 B 选; C. 钠元素的焰色反应呈黄色, 该实验蘸取的溶液为盐溶液, 焰色反应呈黄色, 说明溶液中含有钠离子，故 C 不选; D. 超过容积的 23 时液体沸腾后, 可能会有液体从支管口处溅出, 易产生安全事 故，故 D 不选; 故选: B。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 B。"],"tip":"真题来源：bench-化学-2018-新课标","examSource":{"title":"bench-化学-2018-新课标","year":2018,"region":"全国","examType":"（新课标ⅲ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-cc91c0a6e350990eb445f009","subject":"chemistry","topicId":"chem-classification","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2018 · 全国 · （新课标ⅰ）","stem":"环之间共用一个碳原子的化合物称为螺环化合物, 螺 (2,2 ） 戊烷（ D ) 是最简单的一种, 下列关于该化合物的说法错误的是（）","options":[{"key":"A","text":"与环戊烯互为同分异构体"},{"key":"B","text":"二氯化物超过两种"},{"key":"C","text":"所有碳原子均处同一平面"},{"key":"D","text":"生成 1 molC₅ H₁₂, 至少需要 2 molH₂"}],"answer":"C","optionNotes":{"A":"错误。改正：螺 ( 2,2 ） 戊烷、环戊烯的分子式都为 C₅ H₈, 环戊烯结构简式 为 分异构体，故 A 正确;","B":"错误。改正：螺 (2,2）戊烷2 可能位于 1 号和 2 号碳原子上、可能位于 1 号和 3 号碳原子上、可能位于 1 号和 4 号 C 原子上, 所以其二氯化物超过 2 种, 故 B 正确;","C":"正确。该分子中中间的碳原子上具有甲烷结构特点, 甲烷为正四面体结构, 所以该 分子中所有 C 原子不可能共平面, 故 C 错误;","D":"错误。改正：每个 C₅ H₁₂ 比螺 (2,2) 戊烷多 4 个氢原子, 相当于 2 个 H₂, 所以生成 1 molC₅ H₁₂ ，至少需要 2 molH₂ ，故 D 正确; 故选: C。"},"analysis":"解： A. 螺 ( 2,2 ） 戊烷、环戊烯的分子式都为 C₅ H₈, 环戊烯结构简式 为 分异构体，故 A 正确; B. 螺 (2,2）戊烷2 可能位于 1 号和 2 号碳原子上、可能位于 1 号和 3 号碳原子上、可能位于 1 号和 4 号 C 原子上, 所以其二氯化物超过 2 种, 故 B 正确; C. 该分子中中间的碳原子上具有甲烷结构特点, 甲烷为正四面体结构, 所以该 分子中所有 C 原子不可能共平面, 故 C 错误; D. 每个 C₅ H₁₂ 比螺 (2,2) 戊烷多 4 个氢原子, 相当于 2 个 H₂, 所以生成 1 molC₅ H₁₂ ，至少需要 2 molH₂ ，故 D 正确; 故选: C。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 C。"],"tip":"真题来源：bench-化学-2018-新课标","examSource":{"title":"bench-化学-2018-新课标","year":2018,"region":"全国","examType":"（新课标ⅰ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-846ea929294417280076e71a","subject":"chemistry","topicId":"chem-iron","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2018 · 全国 · （新课标ⅱ）","stem":"Nₐ 代表阿伏加德罗常数的值, 下列说法正确的是（）","options":[{"key":"A","text":"常温常压下, 124 gP₄ 中所含 P-P 键数目为 4 ~N_A"},{"key":"B","text":"100 ~mL 1 ~mol L⁻¹ FeCl₃ 溶液中所含 Fe³⁺ 的数目为 0.1 ~N_A"},{"key":"C","text":"标准状况下, 11.2 ~L 甲烷和乙烯混合物中含氢原子数目为 2 ~N_A"},{"key":"D","text":"密闭容器中, 2 ~mol SO₂ 和 1 molO₂ 催化反应后分子总数为 2 ~N_A"}],"answer":"C","optionNotes":{"A":"错误。改正：本题标准答案为 C，“标准状况下, 11.2 ~L 甲烷和乙烯混合物中含氢原子数目为 2 ~N_A”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：FeCl₃ 溶液中存在 Fe³⁺ 的水解, 所以 100 ~mL 1 ~mol L⁻¹ FeCl₃ 溶液中所含 Fe³⁺ 的 数目小于 0.1 ~mol, 即小于 0.1 ~N_A ，故 B 错误;","C":"正确。1 ~mol 甲烷含有 4 molH, 1 ~mol 乙烯含有 4 molH, 二者无论按何种比例, 相当于 1 ~mol 混合气体含有 4 molH, 则标准状况下, 11.2 ~L 甲烷和乙烯混合物中含 H 有 11.2 ~L22.4 ~L / mol 4=2 ~mol, 即含氢原子数目为 2 ~N_A, 故 C 正确;","D":"错误。改正：SO₂ 和 O₂ 的催化反应为可逆反应, 反应不可能完全进行, 存在一个化学平衡 , 所以密闭容器中, 2 ~mol SO₂ 和 1 molO₂ 催化反应后分子总数不一定为 2 ~mol, 即不一定为 2 ~N_A, 故 D 错误， 故选: C。"},"analysis":"解: A .124 gP₄ 的物质的量为 124 ~g31 4 ~g / mol=1 ~mol, 根据 P₄ 的结构式, 1 molP₄ 含有 6 molP-P 键, 即含有 P-P 键数目为 6 ~N_A, 故 A 错误; B. FeCl₃ 溶液中存在 Fe³⁺ 的水解, 所以 100 ~mL 1 ~mol L⁻¹ FeCl₃ 溶液中所含 Fe³⁺ 的 数目小于 0.1 ~mol, 即小于 0.1 ~N_A ，故 B 错误; C. 1 ~mol 甲烷含有 4 molH, 1 ~mol 乙烯含有 4 molH, 二者无论按何种比例, 相当于 1 ~mol 混合气体含有 4 molH, 则标准状况下, 11.2 ~L 甲烷和乙烯混合物中含 H 有 11.2 ~L22.4 ~L / mol 4=2 ~mol, 即含氢原子数目为 2 ~N_A, 故 C 正确; D. SO₂ 和 O₂ 的催化反应为可逆反应, 反应不可能完全进行, 存在一个化学平衡 , 所以密闭容器中, 2 ~mol SO₂ 和 1 molO₂ 催化反应后分子总数不一定为 2 ~mol, 即不一定为 2 ~N_A, 故 D 错误， 故选: C。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 C。"],"tip":"真题来源：bench-化学-2018-新课标","examSource":{"title":"bench-化学-2018-新课标","year":2018,"region":"全国","examType":"（新课标ⅱ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-802a900e4546d5ac6ba5f8a4","subject":"chemistry","topicId":"chem-redox","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2018 · 全国 · （新课标ⅰ）","stem":"主族元素 W 、 X 、 Y 、 Z 的原子序数依次增加, 且均不大于 20. W、X 、 Z 最外层电子数之和为 10 ; W 与 Y 同族; W 与 Z 形成的化合物可与浓硫酸 反应，其生成物可腐蚀玻璃。下列说法正确的是（ ）","options":[{"key":"A","text":"常温常压下 X 的单质为气态"},{"key":"B","text":"Z 的氢化物为离子化合物"},{"key":"C","text":"Y 和 Z 形成的化合物的水溶液呈碱性"},{"key":"D","text":"W 与 Y 具有相同的最高化合价"}],"answer":"B","optionNotes":{"A":"错误。改正：常温下 Na 或 Mg 单质都是固态, 故 A 错误;","B":"正确。Z 的氢化物是 KH 或 CaH₂, 二者都是离子化合物, 故 B 正确;","C":"错误。改正：Y 、 Z 形成的化合物是 KCl 或 CaCl₂, 为强酸强碱盐, 其水溶液呈中性, 故 C 错 误；","D":"错误。改正：W 、 Y 的最高价分别是 0 、+7 价, F 元素非金属性最强, 没有正化合价, 故 D 错误; 故选: B。"},"analysis":"解: W 与 Z 形成的化合物可与浓硫酸反应, 其生成物可腐蚀玻璃, 能腐 蚀玻璃的是 HF, W 原子序数小于 Z, 则 W 为 F 元素, W 与 Y 同族且原子序数 都不大于 20 , 则 Y 为 Cl 元素, W 、 X 、 Z 最外层电子数之和为 10 , 主族元素 W 、 X 、 Y 、 Z 的原子序数依次增加, 且均不大于 20 , 则 X 为 Na 元素、 Z 为 Ca 元素，或者 X 为 M g 元素、 Z 为 K 元素; A. 常温下 Na 或 Mg 单质都是固态, 故 A 错误; B. Z 的氢化物是 KH 或 CaH₂, 二者都是离子化合物, 故 B 正确; C. Y 、 Z 形成的化合物是 KCl 或 CaCl₂, 为强酸强碱盐, 其水溶液呈中性, 故 C 错 误； D. W 、 Y 的最高价分别是 0 、+7 价, F 元素非金属性最强, 没有正化合价, 故 D 错误; 故选: B。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 B。"],"tip":"真题来源：bench-化学-2018-新课标","examSource":{"title":"bench-化学-2018-新课标","year":2018,"region":"全国","examType":"（新课标ⅰ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-89553888ad4ff0fba2a5fa18","subject":"chemistry","topicId":"chem-ion","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2018 · 全国 · （新课标ⅱ）","stem":"我国科学家研发了一种室温下“可呼吸”的 Na-CO₂ 二次电池, 将 NaClO₄ 溶于有机溶剂作为电解液。钠和负载碳纳米管的铂网分别作为电极材 料, 电池的总反应为: 3 CO₂+4 Na 2 Na₂ CO₃+C, 下列说法错误的是（ ）","options":[{"key":"A","text":"放电时, ClO₄⁻向负极移动"},{"key":"B","text":"充电时释放 CO₂, 放电时吸收 CO₂"},{"key":"C","text":"放电时, 正极反应为: 3 CO₂+4 e⁻=2 CO₃ ²⁻+C"},{"key":"D","text":"充电时, 正极反应为: Na⁺+e⁻=Na"}],"answer":"D","optionNotes":{"A":"错误。改正：放电时, Na 失电子作负极、 Ni 作正极, 电解质溶液中阴离子 向负极移动, 所以 ClO₄⁻向负极移动, 故 A 正确;","B":"错误。改正：放电时 Na 作负极、 Ni 作正极, 充电时 Ni 作阳极、 Na 作阴极, 则放电电池 反应式为 3 CO₂+4 Na 2 Na₂ CO₃+C 、充电电池反应式为 2 Na₂ CO₃+C 3 CO₂+4 Na , 所以充电时释放 CO₂, 放电时吸收 CO₂, 故 B 正确;","C":"错误。改正：放电时负极反应式为 Na⁻ e⁻=Na⁺、正极反应式为 3 CO₂+4 e⁻=2 CO₃ ²⁻+C, 故 C 正确;","D":"正确。充电时, 原来的正极 Ni 作电解池的阳极, Na 作电解池阴极, 则正极发生的 反应为原来正极反应式的逆反应, 即 2 CO₃²⁻+C⁻-4 e⁻⁻=3 CO₂, 负极发生的反 应为 Na⁺+e⁻=Na, 故 D 错误; 故选: D。"},"analysis":"解： A. 放电时, Na 失电子作负极、 Ni 作正极, 电解质溶液中阴离子 向负极移动, 所以 ClO₄⁻向负极移动, 故 A 正确; B. 放电时 Na 作负极、 Ni 作正极, 充电时 Ni 作阳极、 Na 作阴极, 则放电电池 反应式为 3 CO₂+4 Na 2 Na₂ CO₃+C 、充电电池反应式为 2 Na₂ CO₃+C 3 CO₂+4 Na , 所以充电时释放 CO₂, 放电时吸收 CO₂, 故 B 正确; C. 放电时负极反应式为 Na⁻ e⁻=Na⁺、正极反应式为 3 CO₂+4 e⁻=2 CO₃ ²⁻+C, 故 C 正确; D. 充电时, 原来的正极 Ni 作电解池的阳极, Na 作电解池阴极, 则正极发生的 反应为原来正极反应式的逆反应, 即 2 CO₃²⁻+C⁻-4 e⁻⁻=3 CO₂, 负极发生的反 应为 Na⁺+e⁻=Na, 故 D 错误; 故选: D。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 D。"],"tip":"真题来源：bench-化学-2018-新课标","examSource":{"title":"bench-化学-2018-新课标","year":2018,"region":"全国","examType":"（新课标ⅱ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-e00c30e7082b1e1b98a8a235","subject":"chemistry","topicId":"chem-chlorine","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2018 · 全国 · （新课标ⅲ）","stem":"W 、 X 、 Y 、 Z 均为短周期元素且原子序数依次增大, 元素 X 和 Z 同 族。盐 YZW 与浓盐酸反应, 有黄绿色气体产生, 此气体同冷烧碱溶液作用, 可得到含 Y Z W 的溶液。下列说法正确的是（）","options":[{"key":"A","text":"原子半径大小为 W<X<Y<Z"},{"key":"B","text":"X 的氢化物水溶液酸性强于 Z 的"},{"key":"C","text":"Y₂ ~W₂ 与 ZW₂ 均含有非极性共价键"},{"key":"D","text":"标准状况下 W 的单质状态与 X 的相同"}],"answer":"D","optionNotes":{"A":"错误。改正：原子电子层数越多其原子半径越大, 同一周期元素, 其原子半径随着原子序 数增大而减小, 原子半径大小顺序是 F<O<Cl<Na, 即 X<W<Z<Y, 故 A 错误;","B":"错误。改正：X 的氢化物为 HF 、 Z 的氢化物为 HCl ，氢氟酸是弱酸、盐酸是强酸, 所以其 氢化物的水溶液酸性 X 弱于 Z，故 B 错误;","C":"错误。改正：Y₂ ~W₂ 、 ZW 2 分别是 Na₂ O₂ 、 ClO₂, 同一种非金属元素之间易形成非极性键, 前者含有非极性键，后者不含非极性键，故 C 错误;","D":"正确。标况下, 氟气、氧气都是气态, 所以标况下 W 和 X 的单质状态相同, 故 D 正确; 故选: D。"},"analysis":"【解答】解： W 、 X 、 Y 、 Z 均为短周期元素且原子序数依次增大, 元素 X 和 Z 同族, 盐 YZW 与浓盐酸反应, 有黄绿色气体产生, 该气体是 Cl₂, 此气体同 冷烧碱溶液作用, 可得到含 YZW 的溶液, 氯气和 NaOH 反应生成 NaCl 和 NaClO, YZW 应该是 NaClO, 则 Y 是 Na 、 Z 是 Cl 、 ~W 是 O 元素, X 和 Z 同 一族且为短周期元素, 则 X 为 F 元素; A. 原子电子层数越多其原子半径越大, 同一周期元素, 其原子半径随着原子序 数增大而减小, 原子半径大小顺序是 F<O<Cl<Na, 即 X<W<Z<Y, 故 A 错误; B. X 的氢化物为 HF 、 Z 的氢化物为 HCl ，氢氟酸是弱酸、盐酸是强酸, 所以其 氢化物的水溶液酸性 X 弱于 Z，故 B 错误; C. Y₂ ~W₂ 、 ZW 2 分别是 Na₂ O₂ 、 ClO₂, 同一种非金属元素之间易形成非极性键, 前者含有非极性键，后者不含非极性键，故 C 错误; D. 标况下, 氟气、氧气都是气态, 所以标况下 W 和 X 的单质状态相同, 故 D 正确; 故选: D。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 D。"],"tip":"真题来源：bench-化学-2018-新课标","examSource":{"title":"bench-化学-2018-新课标","year":2018,"region":"全国","examType":"（新课标ⅲ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-ee24ad7063aa75977ec2af5f","subject":"chemistry","topicId":"chem-iron","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2019 · 全国 · （新课标ⅰ）","stem":"陶瓷是火与土的结晶, 是中华文明的象征之一, 其形成、性质与化学有着密切的 关系。下列说法错误的是（）","options":[{"key":"A","text":"“雨过天晴云破处”所描述的瓷器青色，来自氧化铁"},{"key":"B","text":"闻名世界的秦兵马俑是陶制品，由黏土经高温烧结而成"},{"key":"C","text":"陶瓷是应用较早的人造材料，主要化学成分是硅酸盐"},{"key":"D","text":"陶瓷化学性质稳定，具有耐酸碱侵蚀、抗氧化等优点"}],"answer":"A","optionNotes":{"A":"正确。瓷器着色如雨过天晴, 为青色, 瓷器的原料高岭矿或高岭土中普遍含有 铁元素, 青瓷的烧制过程就是将含有红棕色氧化铁的色釉在火里烧, 再经过还原行成为 青色，此时铁不再是三价铁，而是二价铁，故 A 错误;","B":"错误。改正：陶瓷的传统概念是指所有以黏土等无机非金属矿物为原材料, 经过高温烧制而成的产 品，闻名世界的秦兵马俑是陶制品，由黏土经高温烧结而成，故 B 正确;","C":"错误。改正：以含硅元素物质为原料通过高温加热发生复杂的物理、化学变化制得硅酸盐产品, 传 统硅酸盐产品包括：普通玻璃、陶瓷、水泥，陶瓷，是用物理化学方法制造出来的最早 的人造材料, 一万多年以前, 它的诞生使人类由旧石器时代进人了新石器时代, 故 C 正 确;","D":"错误。改正：陶瓷有：日用陶瓷、卫生陶瓷、建筑陶瓷、化工陶瓷和电瓷、压电陶瓷等, 共性为具 有抗氧化、抗酸碱腐蚀、耐高温、绝缘、易成型等优点，故 D 正确; 故选: A。"},"analysis":"【解答】解: A. 瓷器着色如雨过天晴, 为青色, 瓷器的原料高岭矿或高岭土中普遍含有 铁元素, 青瓷的烧制过程就是将含有红棕色氧化铁的色釉在火里烧, 再经过还原行成为 青色，此时铁不再是三价铁，而是二价铁，故 A 错误; B. 陶瓷的传统概念是指所有以黏土等无机非金属矿物为原材料, 经过高温烧制而成的产 品，闻名世界的秦兵马俑是陶制品，由黏土经高温烧结而成，故 B 正确; C. 以含硅元素物质为原料通过高温加热发生复杂的物理、化学变化制得硅酸盐产品, 传 统硅酸盐产品包括：普通玻璃、陶瓷、水泥，陶瓷，是用物理化学方法制造出来的最早 的人造材料, 一万多年以前, 它的诞生使人类由旧石器时代进人了新石器时代, 故 C 正 确; D. 陶瓷有：日用陶瓷、卫生陶瓷、建筑陶瓷、化工陶瓷和电瓷、压电陶瓷等, 共性为具 有抗氧化、抗酸碱腐蚀、耐高温、绝缘、易成型等优点，故 D 正确; 故选: A。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 A。"],"tip":"真题来源：bench-化学-2019-新课标","examSource":{"title":"bench-化学-2019-新课标","year":2019,"region":"全国","examType":"（新课标ⅰ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-b82f07e4f4f0494bd7f70cce","subject":"chemistry","topicId":"chem-classification","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2019 · 全国 · （新课标ⅱ）","stem":"“春蚕到死丝方尽, 蜡炬成灰泪始干” 是唐代诗人李商隐的著名诗句。下列关于 该诗句中所涉及物质的说法错误的是（）","options":[{"key":"A","text":"蚕丝的主要成分是蛋白质"},{"key":"B","text":"蚕丝属于天然高分子材料"},{"key":"C","text":"“蜡炬成灰”过程中发生了氧化反应"},{"key":"D","text":"古代的蜡是高级脂肪酸脂，属于高分子聚合物"}],"answer":"D","optionNotes":{"A":"错误。改正：本题标准答案为 D，“古代的蜡是高级脂肪酸脂，属于高分子聚合物”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：蚕丝是天然蛋白质，属于天然高分子材料，故 B 正确;","C":"错误。改正：“蜡炬成灰”过程中是石蜡燃烧发生了氧化反应，故 C 正确;","D":"正确。古代的蜡是高级脂肪酸脂, 是一种酯类物质, 不属于高分子聚合物, 故 D 错误; 故选：D。"},"analysis":"【解答】解：A. 蚕丝的主要成分是蛋白质，故 A 正确; B. 蚕丝是天然蛋白质，属于天然高分子材料，故 B 正确; C. “蜡炬成灰”过程中是石蜡燃烧发生了氧化反应，故 C 正确; D. 古代的蜡是高级脂肪酸脂, 是一种酯类物质, 不属于高分子聚合物, 故 D 错误; 故选：D。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 D。"],"tip":"真题来源：bench-化学-2019-新课标","examSource":{"title":"bench-化学-2019-新课标","year":2019,"region":"全国","examType":"（新课标ⅱ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-53e4f23c13d1075c33172612","subject":"chemistry","topicId":"chem-metals","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2019 · 全国 · （新课标ⅲ）","stem":"化学与生活密切相关。下列叙述错误的是（）","options":[{"key":"A","text":"高纯硅可用于制作光感电池"},{"key":"B","text":"铝合金大量用于高铁建设"},{"key":"C","text":"活性炭具有除异味和杀䒩作用"},{"key":"D","text":"碘酒可用于皮肤外用消毒"}],"answer":"C","optionNotes":{"A":"错误。改正：本题标准答案为 C，“活性炭具有除异味和杀䒩作用”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：铝合金在生活中用途最广泛，大量用于高铁建设, 故 B 正确;","C":"正确。活性炭具有吸附性, 没有强氧化性, 所以活性炭能去除异味, 但是不能杀菌消毒, 故 C 错误;","D":"错误。改正：碘酒能使蛋白质变性而杀菌消毒，所以碘酒可用于皮肤外用消毒，故 D 正确； 故选: C₀"},"analysis":"【解答】解: A . Si 为半导体材料, 能作光感电池, 故 A 正确; B. 铝合金在生活中用途最广泛，大量用于高铁建设, 故 B 正确; C. 活性炭具有吸附性, 没有强氧化性, 所以活性炭能去除异味, 但是不能杀菌消毒, 故 C 错误; D. 碘酒能使蛋白质变性而杀菌消毒，所以碘酒可用于皮肤外用消毒，故 D 正确； 故选: C₀","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 C。"],"tip":"真题来源：bench-化学-2019-新课标","examSource":{"title":"bench-化学-2019-新课标","year":2019,"region":"全国","examType":"（新课标ⅲ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-37dc39ee824a3b04391efa30","subject":"chemistry","topicId":"chem-classification","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2019 · 全国 · （新课标ⅰ）","stem":"关于化合物 2 - 苯基丙烯 ( ) 下列说法正确的是 ( )","options":[{"key":"A","text":"不能使稀高锰酸钾溶液褪色"},{"key":"B","text":"可以发生加成聚合反应"},{"key":"C","text":"分子中所有原子共平面"},{"key":"D","text":"易溶于水及甲苯"}],"answer":"B","optionNotes":{"A":"错误。改正：含有碳碳双键, 所以具有烯烃性质, 能被酸性高锰酸钾溶液氧化而使酸 性高锰酸钾溶液褪色，故 A 错误;","B":"正确。含有碳碳双键，所以能发生加聚反应生成高分子化合物，故 B 正确;","C":"错误。改正：苯分子中所有原子共平面、乙烯分子中所有原子共平面, 甲烷分子为正四面体结构, 有 3 个原子共平面, 该分子中甲基具有甲烷结构特点, 所以该分子中所有原子不能共平 面，故 C 错误；","D":"错误。改正：该物质为有机物，没有亲水基，不易溶于水，易溶于甲苯，故 D 错误; 故选：B。"},"analysis":"【解答】解: A. 含有碳碳双键, 所以具有烯烃性质, 能被酸性高锰酸钾溶液氧化而使酸 性高锰酸钾溶液褪色，故 A 错误; B. 含有碳碳双键，所以能发生加聚反应生成高分子化合物，故 B 正确; C. 苯分子中所有原子共平面、乙烯分子中所有原子共平面, 甲烷分子为正四面体结构, 有 3 个原子共平面, 该分子中甲基具有甲烷结构特点, 所以该分子中所有原子不能共平 面，故 C 错误； D. 该物质为有机物，没有亲水基，不易溶于水，易溶于甲苯，故 D 错误; 故选：B。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 B。"],"tip":"真题来源：bench-化学-2019-新课标","examSource":{"title":"bench-化学-2019-新课标","year":2019,"region":"全国","examType":"（新课标ⅰ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-129d3d464f114679017e9eed","subject":"chemistry","topicId":"chem-atom","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2019 · 全国 · （新课标ⅱ）","stem":"已知 Nₐ 是阿伏加德罗常数的值，下列说法错误的是（）","options":[{"key":"A","text":"3 ~g³ He 含有的中子数为 1 ~N_A"},{"key":"B","text":"1 ~L 0.1 ~mol L⁻¹ 磷酸钠溶液含有的 PO₄ ⁻数目为 0.1 ~N_A"},{"key":"C","text":"1 molK₂ Cr₂ O₇ 被还原为 Cr³⁺ 转移的电子数为 6 ~N_A"},{"key":"D","text":"48 ~g 正丁烷和 10 ~g 异丁烷的混合物中共价键数目为 13 ~N_A"}],"answer":"B","optionNotes":{"A":"错误。改正：本题标准答案为 B，“1 ~L 0.1 ~mol L⁻¹ 磷酸钠溶液含有的 PO₄ ⁻数目为 0.1 ~N_A”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"正确。本题标准答案为 B，该表述符合真题结论。完整依据见上方解析。","C":"错误。改正：K₂ Cr₂ O₇ 中铬由 +6 价变成 +3 价, 所以 1 ~mol ~K₂ Cr₂ O₇ 被还原为 Cr³⁺ 转移的电子数为 6 ~N_A ，故 C 正确;","D":"错误。改正：正丁烷和异丁烷只是碳架不同, 含有的共价键数均为 13 条, 所以 48 ~g 正丁烷和 10 ~g 异丁烷, 即混合物的物质的量为 48 ~g+10 ~g58 ~g / mol=1 ~mol, 所以 48 ~g 正丁烷和 10 ~g 异丁烷的混合 物中共价键数目为 13 ~N_A ，故 D 正确; 故选：B。"},"analysis":"【解答】解: A 、 3 ~g³ He 的物质的量为 1 ~mol, 而 1 ~mol³ He 中子的物质的量为 1 ~mol, 所以 3 ~g³ He 含有的中子数为 1 ~N_A, 故 A 正确; B 、磷酸钠是强碱弱酸盐, 弱离子磷酸根离子会发生水解, 所以 1 ~L 0.1 ~mol ⁻¹ ~L 磷酸钠溶 液含有的 PO₄ ³⁻ 数目小于 0.1 ~N_A ，故 B 错误; C、 K₂ Cr₂ O₇ 中铬由 +6 价变成 +3 价, 所以 1 ~mol ~K₂ Cr₂ O₇ 被还原为 Cr³⁺ 转移的电子数为 6 ~N_A ，故 C 正确; D、正丁烷和异丁烷只是碳架不同, 含有的共价键数均为 13 条, 所以 48 ~g 正丁烷和 10 ~g 异丁烷, 即混合物的物质的量为 48 ~g+10 ~g58 ~g / mol=1 ~mol, 所以 48 ~g 正丁烷和 10 ~g 异丁烷的混合 物中共价键数目为 13 ~N_A ，故 D 正确; 故选：B。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 B。"],"tip":"真题来源：bench-化学-2019-新课标","examSource":{"title":"bench-化学-2019-新课标","year":2019,"region":"全国","examType":"（新课标ⅱ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-c13ddeaa77078c5418c06e55","subject":"chemistry","topicId":"chem-classification","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2019 · 全国 · （新课标ⅲ）","stem":"下列化合物的分子中，所有原子可能共平面的是（）","options":[{"key":"A","text":"甲苯"},{"key":"B","text":"乙烷"},{"key":"C","text":"丙炔"},{"key":"D","text":"1，3-丁二烯"}],"answer":"D","optionNotes":{"A":"错误。改正：甲苯甲基上的 C 原子采用 sp³ 杂化，则该分子中所有原子一定不共平面， 故 A 错误;","B":"错误。改正：乙烷中两个 C 原子都采用 sp³ 杂化, 所以该分子中所有原子一定不共平面, 故 B 错误;","C":"错误。改正：丙炔中甲基上的 C 原子采用 sp³ 杂化, 则该分子中所有原子一定不共平面, 故 C 错误;","D":"正确。1，3 - 丁二烯结构简式为 CH₂=CHCH=CH₂, 所有原子都采用 sp² 杂化, CH₂=CH- 具有乙烯结构特点且共价单键可以旋转, 所以该分子中所有原子可能共平面, 故 D 正确; 故选：D。"},"analysis":"【解答】解： A. 甲苯甲基上的 C 原子采用 sp³ 杂化，则该分子中所有原子一定不共平面， 故 A 错误; B. 乙烷中两个 C 原子都采用 sp³ 杂化, 所以该分子中所有原子一定不共平面, 故 B 错误; C. 丙炔中甲基上的 C 原子采用 sp³ 杂化, 则该分子中所有原子一定不共平面, 故 C 错误; D.1，3 - 丁二烯结构简式为 CH₂=CHCH=CH₂, 所有原子都采用 sp² 杂化, CH₂=CH- 具有乙烯结构特点且共价单键可以旋转, 所以该分子中所有原子可能共平面, 故 D 正确; 故选：D。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 D。"],"tip":"真题来源：bench-化学-2019-新课标","examSource":{"title":"bench-化学-2019-新课标","year":2019,"region":"全国","examType":"（新课标ⅲ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-115874597ae58b4313e5ece7","subject":"chemistry","topicId":"chem-periodic","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2019 · 全国 · （新课标ⅲ）","stem":"X 、 Y 、 Z 均为短周期主族元素, 它们原子的最外层电子数之和是 10. X 与 Z 同 族, Y 最外层电子数等于 X 次外层电子数, 且 Y 原子半径大于 Z. 下列叙述正确的是 ( )","options":[{"key":"A","text":"熔点: X 的氧化物比 Y 的氧化物高"},{"key":"B","text":"热稳定性： X 的氢化物大于 Z 的氢化物"},{"key":"C","text":"X 与 Z 可形成离子化合物 ZX"},{"key":"D","text":"Y 的单质与 Z 的单质均能溶于浓硝酸"}],"answer":"B","optionNotes":{"A":"错误。改正：X 的氧化物是碳的氧化物, 为分子晶体; Y 的氧化物为 MgO, 为离子晶体, 熔沸点: 离子晶体 > 分子晶体, 所以熔点: MgO>CO 和 CO₂, 所以熔点: X 的氧化物低于 Y 的 氧化物，故 A 错误;","B":"正确。元素的非金属性越强, 其氢化物的稳定性越强, 非金属性 X>Z, 则热稳定性: X 的 氢化物大于 Z 的氢化物，故 B 正确;","C":"错误。改正：X 、 Z 为非金属元素，二者通过共用电子对形成共价化合物 SiC ，故 C 错误;","D":"错误。改正：Z 的单质为 Si, Si 和浓硝酸不反应，但是能溶于强碱溶液，故 D 错误; 故选：B。"},"analysis":"【解答】解：通过以上分析知, X、Y、Z 分别是 C、Mg、Si 元素; A. X 的氧化物是碳的氧化物, 为分子晶体; Y 的氧化物为 MgO, 为离子晶体, 熔沸点: 离子晶体 > 分子晶体, 所以熔点: MgO>CO 和 CO₂, 所以熔点: X 的氧化物低于 Y 的 氧化物，故 A 错误; B. 元素的非金属性越强, 其氢化物的稳定性越强, 非金属性 X>Z, 则热稳定性: X 的 氢化物大于 Z 的氢化物，故 B 正确; C. X 、 Z 为非金属元素，二者通过共用电子对形成共价化合物 SiC ，故 C 错误; D. Z 的单质为 Si, Si 和浓硝酸不反应，但是能溶于强碱溶液，故 D 错误; 故选：B。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 B。"],"tip":"真题来源：bench-化学-2019-新课标","examSource":{"title":"bench-化学-2019-新课标","year":2019,"region":"全国","examType":"（新课标ⅲ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-32571af5a08db1984ee7f1f0","subject":"chemistry","topicId":"chem-sodium","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2019 · 全国 · （新课标ⅱ）","stem":"下列化学方程式中, 不能正确表达反应颜色变化的是（）","options":[{"key":"A","text":"向 CuSO₄ 溶液中加人足量 Zn 粉，溶液蓝色消失 Zn+CuSO₄=Cu+ZnSO₄"},{"key":"B","text":"澄清的石灰水久置后出现白色固体 Ca(OH) ₂+CO₂=CaCO₃ +H₂ O"},{"key":"C","text":"Na₂ O₂ 在空气中放置后由淡黄色变为白色 2 Na₂ O₂=2 Na₂ O+O₂"},{"key":"D","text":"向 Mg(OH)₂ 悬浊液中滴加足量 FeCl₃ 溶液出现红褐色沉淀 3 Mg(OH)₂+2 FeCl₃= 2 Fe(OH)₃+3 MgCl₂"}],"answer":"C","optionNotes":{"A":"错误。改正：向 CuSO₄ 溶液中加人足量 Zn 粉, 反应生成硫酸锌和 Cu, 溶液蓝色消 失, 发生反应为: Zn+CuSO₄=Cu+ZnSO₄ ，故 A 正确;","B":"错误。改正：澄清的石灰水久置后生成碳酸钲沉淀, 发生反应为: Ca(OH)₂+CO₂=CaCO₃ +H₂ O, 故 B 正确;","C":"正确。过氧化钠在空气中与二氧化碳反应生成碳酸钠, 由淡黄色变为白色, 发生反应: 2 Na₂ O₂+2 CO₂=2 Na₂ CO₃+O₂, 故 C 错误;","D":"错误。改正：向 Mg(OH)₂ 悬浊液中滴加足量 FeCl₃ 溶液, 氢氧化锌转化成更难溶的氢氧化铁沉 淀，发生反应为: 3 Mg(OH)₂+2 FeCl₃=2 Fe(OH)₃+3 MgCl₂ ，故 D 正确; 故选：C。"},"analysis":"【解答】解: A. 向 CuSO₄ 溶液中加人足量 Zn 粉, 反应生成硫酸锌和 Cu, 溶液蓝色消 失, 发生反应为: Zn+CuSO₄=Cu+ZnSO₄ ，故 A 正确; B. 澄清的石灰水久置后生成碳酸钲沉淀, 发生反应为: Ca(OH)₂+CO₂=CaCO₃ +H₂ O, 故 B 正确; C. 过氧化钠在空气中与二氧化碳反应生成碳酸钠, 由淡黄色变为白色, 发生反应: 2 Na₂ O₂+2 CO₂=2 Na₂ CO₃+O₂, 故 C 错误; D. 向 Mg(OH)₂ 悬浊液中滴加足量 FeCl₃ 溶液, 氢氧化锌转化成更难溶的氢氧化铁沉 淀，发生反应为: 3 Mg(OH)₂+2 FeCl₃=2 Fe(OH)₃+3 MgCl₂ ，故 D 正确; 故选：C。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 C。"],"tip":"真题来源：bench-化学-2019-新课标","examSource":{"title":"bench-化学-2019-新课标","year":2019,"region":"全国","examType":"（新课标ⅱ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-2c924b33a82269bf9d890379","subject":"chemistry","topicId":"chem-ion","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2019 · 全国 · （新课标ⅲ）","stem":"设 Nₐ 为阿伏加德罗常数值。关于常温下 pH=2 的 H₃ PO₄ 溶液, 下列说法正确的 是 ( )","options":[{"key":"A","text":"每升溶液中的 H⁺数目为 0.02 ~N_A"},{"key":"B","text":"c (H⁺ )=c (H₂ PO₄⁻ )+2 c (HPO₄ ⁻⁻ )+3 c (PO₄ ³⁻ )+c (OH⁻ )"},{"key":"C","text":"加水稀释使电离度增大, 溶液 pH 减小"},{"key":"D","text":"加人 NaH₂ PO₄ 固体，溶液酸性增强"}],"answer":"B","optionNotes":{"A":"错误。改正：常温下 pH=2 的 H₃ PO₄ 溶液中 c (H⁺ )=0.01 ~mol / L, 1 ~L 该溶液中含有 的 n (H⁺ )=0.01 ~mol / L 1 ~L=0.01 ~mol, 含有 H⁺数目为 0.01 ~N_A, 故 A 错误;","B":"正确。根据 H₃ PO₄ 溶液中的电荷守恒可知: c (H⁺ )=c (H₂ PO₄ ⁻ )+2 c (HPO₄ ²⁻ )+3 c (PO₄ ³ . )+c (OH⁻ )，故 B 正确;","C":"错误。改正：加水稀释 H₃ PO₄ 的浓度减小, 其电离度增大, 但溶液中氢离子浓度减小, 溶液 pH 增 大，故 C 错误；","D":"错误。改正：加人 NaH₂ PO₄ 固体后, 抑制了 H₃ PO₄ 的电离, 溶液中氢离子浓度减小, 溶液酸性减 弱，故 D 错误; 故选：B。"},"analysis":"【解答】解: A. 常温下 pH=2 的 H₃ PO₄ 溶液中 c (H⁺ )=0.01 ~mol / L, 1 ~L 该溶液中含有 的 n (H⁺ )=0.01 ~mol / L 1 ~L=0.01 ~mol, 含有 H⁺数目为 0.01 ~N_A, 故 A 错误; B. 根据 H₃ PO₄ 溶液中的电荷守恒可知: c (H⁺ )=c (H₂ PO₄ ⁻ )+2 c (HPO₄ ²⁻ )+3 c (PO₄ ³ . )+c (OH⁻ )，故 B 正确; C. 加水稀释 H₃ PO₄ 的浓度减小, 其电离度增大, 但溶液中氢离子浓度减小, 溶液 pH 增 大，故 C 错误； D. 加人 NaH₂ PO₄ 固体后, 抑制了 H₃ PO₄ 的电离, 溶液中氢离子浓度减小, 溶液酸性减 弱，故 D 错误; 故选：B。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 B。"],"tip":"真题来源：bench-化学-2019-新课标","examSource":{"title":"bench-化学-2019-新课标","year":2019,"region":"全国","examType":"（新课标ⅲ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-aecc97defb661417e40631b1","subject":"chemistry","topicId":"chem-classification","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2020 · 全国 · （新课标ⅱ）","stem":"北宋沈括《梦溪笔谈》中记载: “信州铅山有苦泉, 流以为涧。挹其水熬之则成 胆矾，享胆矾则成铜。熬胆矾铁釜, 久之亦化为铜”。下列有关叙述错误的是（）","options":[{"key":"A","text":"胆矾的化学式为 CuSO₄"},{"key":"B","text":"胆矾可作为湿法冶铜的原料"},{"key":"C","text":"“焦之则成胆矾” 是浓缩结晶过程"},{"key":"D","text":"“熬胆矶铁釜，久之亦化为铜”是发生了置换反应"}],"answer":"A","optionNotes":{"A":"正确。胆矾是硫酸铜晶体, “胆矾” 化学式为 CuSO₄ 5 H₂ O, 故 A 错误;","B":"错误。改正：胆矾是硫酸铜晶体, 敖胆矾铁釜, 久之亦化为铜, 是发生了: Fe+CuSO₄=Cu+FeSO₄, 则胆矾可作为湿法冶铜的原料，故 B 正确;","C":"错误。改正：挹其水敖之则成胆矾, 硫酸铜溶液蒸发得到硫酸铜晶体, 是浓缩结晶过程, 故 C 正 确;","D":"错误。改正：䚺胆矾铁釜, 久之亦化为铜, 是发生了: Fe+CuSO₄=Cu+FeSO₄, 硫酸铜与 Fe 置换 反应生成 Cu ，属于置换反应，故 D 正确; 故选: A。 【点评 本题为信息题, 明确题目中所给的信息以及 Cu 及其化合物的性质是解本题关键, 试题侧重基础知识的考查, 有利于提高学生获取信息利用信息解答问题能力。"},"analysis":"【解答】解: A. 胆矾是硫酸铜晶体, “胆矾” 化学式为 CuSO₄ 5 H₂ O, 故 A 错误; B. 胆矾是硫酸铜晶体, 敖胆矾铁釜, 久之亦化为铜, 是发生了: Fe+CuSO₄=Cu+FeSO₄, 则胆矾可作为湿法冶铜的原料，故 B 正确; C. 挹其水敖之则成胆矾, 硫酸铜溶液蒸发得到硫酸铜晶体, 是浓缩结晶过程, 故 C 正 确; D. 䚺胆矾铁釜, 久之亦化为铜, 是发生了: Fe+CuSO₄=Cu+FeSO₄, 硫酸铜与 Fe 置换 反应生成 Cu ，属于置换反应，故 D 正确; 故选: A。 【点评 本题为信息题, 明确题目中所给的信息以及 Cu 及其化合物的性质是解本题关键, 试题侧重基础知识的考查, 有利于提高学生获取信息利用信息解答问题能力。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 A。"],"tip":"真题来源：bench-化学-2020-新课标","examSource":{"title":"bench-化学-2020-新课标","year":2020,"region":"全国","examType":"（新课标ⅱ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-c7e9d3b5653d2963eb87d013","subject":"chemistry","topicId":"chem-classification","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2020 · 全国 · （新课标ⅰ）","stem":"紫花前胡醇 ( 提高人体免疫力。有关该化合物, 下列叙述错误的是（）","options":[{"key":"A","text":"分子式为 C₁₄ H₁₄ O₄"},{"key":"B","text":"不能使酸性重铬酸钾溶液变色"},{"key":"C","text":"能够发生水解反应"},{"key":"D","text":"能够发生消去反应生成双键"}],"answer":"B","optionNotes":{"A":"错误。改正：本题标准答案为 B，“不能使酸性重铬酸钾溶液变色”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"正确。本题标准答案为 B，该表述符合真题结论。完整依据见上方解析。","C":"错误。改正：分子中含有能发生水解酯基，则紫花前胡醇能水解，故 C 正确; D 、与 -OH 相连的 C 的邻位 C 上有一种 H 可发生消去反应，生成双键，故 D 正确; 故选：B。","D":"错误。改正：本题标准答案为 B，“不能使酸性重铬酸钾溶液变色”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。"},"analysis":"【解答】解: A 、分子的不饱和度为 8 , 则氢原子个数为: 14 2+2-8 2=14, 四个氧 原子，所以分子式为: C₁₄ H₁₄ O₄ ，故 A 正确; B 、分子中含有碳碳双键和羟基直接相连碳上有氢原子, 所以能使酸性重铬酸钾溶液变色, 故 B 错误； C、分子中含有能发生水解酯基，则紫花前胡醇能水解，故 C 正确; D 、与 -OH 相连的 C 的邻位 C 上有一种 H 可发生消去反应，生成双键，故 D 正确; 故选：B。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 B。"],"tip":"真题来源：bench-化学-2020-新课标","examSource":{"title":"bench-化学-2020-新课标","year":2020,"region":"全国","examType":"（新课标ⅰ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-daba51aa86c2ce664a5f1eb1","subject":"chemistry","topicId":"chem-classification","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2020 · 全国 · （新课标ⅱ）","stem":"某白色固体混合物由 NaCl 、 KCl 、 MgS 少量 Cl₂: 3 SO₃ ⁻+Cl₂+H₂ O=2 HSO₃ ⁻+2 Cl⁻+SO₄ ²"},{"key":"B","text":"向 CaCl₂ 溶液中通人 CO₂: Ca²⁺+H₂ O+CO₂=CaCO₃ +2 H⁺"},{"key":"C","text":"向 H₂ O₂ 溶液中滴加少量 FeCl₃: 2 Fe³⁺+H₂ O₂=O₂ +2 H⁺+2 Fe²⁺"},{"key":"D","text":"同浓度同体积 NH₄ HSO₄ 溶液与 NaOH 溶液混合: NH₄ ⁺+OH⁻=NH₃ H₂ O"}],"answer":"A","optionNotes":{"A":"正确。用 Na₂ SO₃ 溶液吸收少量 Cl₂: 3 SO₃ ²⁻+Cl₂+H₂ O=2 HSO₃ ⁻+2 Cl⁻+SO₄ ⁻⁻, 符合电荷守恒，物料守恒，强制弱规律，故 A 正确;","B":"错误。改正：弱酸不能制强酸，向 CaCl₂ 溶液中通人 CO₂ 不反应，故 B 错误;","C":"错误。改正：向 H₂ O₂ 溶液中滴加少量 FeCl₃, FeCl₃ 做催化剂, 促进双氧水的分解, 氧气的氧化性 大于三价铁离子，弱氧化剂不能制强氧化剂，故 C 错误;","D":"错误。改正：不符合客观事实, 氢氧根优先与酸性更强的氢离子反应, 正确的离子方程式: H⁺+OH =H₂ O ，故 D 错误； 故选：A。"},"analysis":"【解答】解: A. 用 Na₂ SO₃ 溶液吸收少量 Cl₂: 3 SO₃ ²⁻+Cl₂+H₂ O=2 HSO₃ ⁻+2 Cl⁻+SO₄ ⁻⁻, 符合电荷守恒，物料守恒，强制弱规律，故 A 正确; B. 弱酸不能制强酸，向 CaCl₂ 溶液中通人 CO₂ 不反应，故 B 错误; C. 向 H₂ O₂ 溶液中滴加少量 FeCl₃, FeCl₃ 做催化剂, 促进双氧水的分解, 氧气的氧化性 大于三价铁离子，弱氧化剂不能制强氧化剂，故 C 错误; D. 不符合客观事实, 氢氧根优先与酸性更强的氢离子反应, 正确的离子方程式: H⁺+OH =H₂ O ，故 D 错误； 故选：A。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 A。"],"tip":"真题来源：bench-化学-2020-新课标","examSource":{"title":"bench-化学-2020-新课标","year":2020,"region":"全国","examType":"（新课标ⅲ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-4abcc7703b6219dfc89a62b5","subject":"chemistry","topicId":"chem-periodic","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2020 · 全国 · （新课标ⅲ）","stem":"W 、 X 、 Y 、 Z 为原子序数依次增大的短周期元素, 四种元素的核外电子总数满足 X+Y=W+Z; 化合物 XW₃ 与 WZ 相遇会产生白烟。下列叙述正确的是（）","options":[{"key":"A","text":"非金属性: W>X>Y>Z"},{"key":"B","text":"原子半径: Z>Y>X>W"},{"key":"C","text":"元素 X 的含氧酸均为强酸"},{"key":"D","text":"Y 的氧化物水化物为强碱"}],"answer":"D","optionNotes":{"A":"错误。改正：根据最高价氧化物对应水化物的酸性强弱, 非金属性 Cl>N>H>Na, 故 A 错误；","B":"错误。改正：同周期元素从左向右原子半径依次减小, 同主族元素自上而下原子半径依次增大, 原 子半径: Na>Cl>N>H, 故 B 错误;","C":"错误。改正：元素 X 的含氧酸有硝酸和亚硝酸，亚硝酸是弱酸，故 C 错误;","D":"正确。Y 的氧化物水化物为氢氧化钠, 氢氧化钠是强碱, 故 D 正确; 故选：D。"},"analysis":"【解答】解: A. 根据最高价氧化物对应水化物的酸性强弱, 非金属性 Cl>N>H>Na, 故 A 错误； B. 同周期元素从左向右原子半径依次减小, 同主族元素自上而下原子半径依次增大, 原 子半径: Na>Cl>N>H, 故 B 错误; C. 元素 X 的含氧酸有硝酸和亚硝酸，亚硝酸是弱酸，故 C 错误; D. Y 的氧化物水化物为氢氧化钠, 氢氧化钠是强碱, 故 D 正确; 故选：D。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 D。"],"tip":"真题来源：bench-化学-2020-新课标","examSource":{"title":"bench-化学-2020-新课标","year":2020,"region":"全国","examType":"（新课标ⅲ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-9f3b75fe1665ac3eb00592d6","subject":"chemistry","topicId":"chem-classification","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2021 · 全国 · （新课标ⅰ）","stem":"我国提出争取在 2030 年前实现碳达峰, 2060 年实现碳中和, 这对于改善环境, 实现绿 色发展至关重要。碳中和是指 CO₂ 的排放总量和减少总量相当。下列措施中能促进碳中和 最直接有效的是","options":[{"key":"A","text":"将重质油裂解为轻质油作为燃料"},{"key":"B","text":"大规模开采可燃冰作为清洁燃料"},{"key":"C","text":"通过清洁煤技术减少煤燃烧污染"},{"key":"D","text":"研发催化剂将 CO₂ 还原为甲醇"}],"answer":"D","optionNotes":{"A":"错误。改正：本题标准答案为 D，“研发催化剂将 CO₂ 还原为甲醇”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：大规模开采可燃冰做为清洁燃料, 会增大二氧化碳的排放量, 不符合碳中和的要求, 故 B 不符合题意;","C":"错误。改正：通过清洁煤技术减少煤燃烧污染, 不能减少二氧化碳的排放量, 达不到碳中和的目的, 故 C 不符合题意;","D":"正确。研发催化剂将二氧化碳还原为甲醇, 可以减少二氧化碳的排放量, 达到碳中和的目的, 故 D 符合题意; 故选 D。"},"analysis":"【详解】A. 将重质油裂解为轻质油并不能减少二氧化碳的排放量, 达不到碳中和的目的, 故 A 不符合题意; B. 大规模开采可燃冰做为清洁燃料, 会增大二氧化碳的排放量, 不符合碳中和的要求, 故 B 不符合题意; C. 通过清洁煤技术减少煤燃烧污染, 不能减少二氧化碳的排放量, 达不到碳中和的目的, 故 C 不符合题意; D. 研发催化剂将二氧化碳还原为甲醇, 可以减少二氧化碳的排放量, 达到碳中和的目的, 故 D 符合题意; 故选 D。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 D。"],"tip":"真题来源：bench-化学-2021-新课标","examSource":{"title":"bench-化学-2021-新课标","year":2021,"region":"全国","examType":"（新课标ⅰ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-bfa90d163fb456f71a2d2fe5","subject":"chemistry","topicId":"chem-ion","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2021 · 全国 · （新课标ⅰ）","stem":"下列过程中的化学反应, 相应的离子方程式正确的是","options":[{"key":"A","text":"用碳酸钠溶液处理水垢中的硫酸铂: CO₃²⁻+CaSO₄=CaCO₃+SO₄²⁻"},{"key":"B","text":"过量铁粉加人稀硝酸中: Fe+4 H⁺+NO₃⁻=Fe³⁺+NO +2 H₂ O"},{"key":"C","text":"硫酸铝溶液中滴加少量氢氧化钾溶液: Al³⁺+4 OH⁻=AlO₂⁻+2 H₂ O"},{"key":"D","text":"氯化铜溶液中通人硫化氢: Cu²⁺+S²⁻=CuS"}],"answer":"A","optionNotes":{"A":"正确。本题标准答案为 A，该表述符合真题结论。完整依据见上方解析。","B":"错误。改正：过量的铁粉与稀硝酸反应生成硝酸亚铁、一氧化氮和水, 离子方程式应为: 3 Fe+8 H⁺+2 NO₃⁻=3 Fe²⁺+2 NO +4 H₂ O, 故 B 错误;","C":"错误。改正：硫酸铝溶液与少量氢氧化钾溶液反应生成氢氧化铝沉淀和硫酸钾, 离子方程式应为: Al³⁺+3 OH⁻=Al(OH)₃ , 故 C 错误;","D":"错误。改正：硫化氢为弱电解质, 书写离子方程式时不能拆, 离子方程式应为: Cu²⁺+H₂ ~S=CuS +2 H⁺, 故 D 错误; 答案选 A。"},"analysis":"【详解】A. 硫酸钘微溶, 用碳酸钠溶液处理水垢中的硫酸锠转化为难溶的碳酸钘, 离子方程 式为: CO₃²⁻+CaSO₄=CaCO₃+SO₄²⁻ ，故 A 正确; B. 过量的铁粉与稀硝酸反应生成硝酸亚铁、一氧化氮和水, 离子方程式应为: 3 Fe+8 H⁺+2 NO₃⁻=3 Fe²⁺+2 NO +4 H₂ O, 故 B 错误; C. 硫酸铝溶液与少量氢氧化钾溶液反应生成氢氧化铝沉淀和硫酸钾, 离子方程式应为: Al³⁺+3 OH⁻=Al(OH)₃ , 故 C 错误; D. 硫化氢为弱电解质, 书写离子方程式时不能拆, 离子方程式应为: Cu²⁺+H₂ ~S=CuS +2 H⁺, 故 D 错误; 答案选 A。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 A。"],"tip":"真题来源：bench-化学-2021-新课标","examSource":{"title":"bench-化学-2021-新课标","year":2021,"region":"全国","examType":"（新课标ⅰ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-8dae8d124ae81e5025b50e09","subject":"chemistry","topicId":"chem-metals","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2021 · 全国 · （新课标ⅰ）","stem":"我国嫦娥五号探测器带回 1.731 ~kg 的月球土壤, 经分析发现其构成与地球士壤类似土壤 中含有的短周期元素 W 、 X 、 Y 、 Z, 原子序数依次增大, 最外层电子数之和为 15, X 、 Y 、 Z 为同周期相邻元素, 且均不与 W 同族, 下列结论正确的是","options":[{"key":"A","text":"原子半径大小顺序为 W>X>Y>Z"},{"key":"B","text":"化合物 XW 中的化学键为离子键"},{"key":"C","text":"Y 单质的导电性能弱于 Z 单质的"},{"key":"D","text":"Z 的氧化物的水化物的酸性强于碳酸"}],"answer":"B","optionNotes":{"A":"错误。改正：本题标准答案为 B，“化合物 XW 中的化学键为离子键”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"正确。化合物 XW 即 MgO 为离子化合物, 其中的化学键为离子键, B 正确;","C":"错误。改正：Y 单质为铝单质, 铝属于导体, 导电性很强, Z 单质为硅, 为半导体, 半导体导电性介 于导体和绝缘体之间, 故 Y 单质的导电性能强于 Z 单质的, C 错误;","D":"错误。改正：Z 的氧化物的水化物为硅酸, 硅酸酸性弱于碳酸, D 错误; 故选 B。"},"analysis":"【详解】A. O 原子有两层, Mg 、 Al 、 Si 均有三层且原子序数依次增大, 故原子半径大小 顺序为 Mg>Al>Si>O ， 即 X>Y>Z>W ， ~A 错误; B. 化合物 XW 即 MgO 为离子化合物, 其中的化学键为离子键, B 正确; C. Y 单质为铝单质, 铝属于导体, 导电性很强, Z 单质为硅, 为半导体, 半导体导电性介 于导体和绝缘体之间, 故 Y 单质的导电性能强于 Z 单质的, C 错误; D. Z 的氧化物的水化物为硅酸, 硅酸酸性弱于碳酸, D 错误; 故选 B。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 B。"],"tip":"真题来源：bench-化学-2021-新课标","examSource":{"title":"bench-化学-2021-新课标","year":2021,"region":"全国","examType":"（新课标ⅰ）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-6afb92eab08dedadb510b3e0","subject":"chemistry","topicId":"chem-classification","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2021 · 全国 · （解析版）","stem":"化学与人体健康及环境保护息息相关。下列叙述正确的是","options":[{"key":"A","text":"食品加工时不可添加任何防腐剂"},{"key":"B","text":"掩埋废旧电池不会造成环境污染"},{"key":"C","text":"天然气不完全燃烧会产生有毒气体"},{"key":"D","text":"使用含磷洗涤剂不会造成水体污染"}],"answer":"C","optionNotes":{"A":"错误。改正：本题标准答案为 C，“天然气不完全燃烧会产生有毒气体”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：废旧电池中含有重金属等金属离子，会造成土壤污染，水体污染等, 故 B 错误;","C":"正确。天然气主要成分为甲烷, 不完全燃烧会产生一氧化碳等有毒气体，故 C 正确;","D":"错误。改正：含磷洗涤剂的排放, 使水中磷过多, 造成水中藻类疯长, 消耗水中溶解的氧, 水体变浑浊, 故 D 错误; 故选 C。"},"analysis":"【详解】A. 食品加工时, 可适当添加食品添加剂和防腐剂等, 如苯甲酸钠, 故 A 错误; B. 废旧电池中含有重金属等金属离子，会造成土壤污染，水体污染等, 故 B 错误; C. 天然气主要成分为甲烷, 不完全燃烧会产生一氧化碳等有毒气体，故 C 正确; D. 含磷洗涤剂的排放, 使水中磷过多, 造成水中藻类疯长, 消耗水中溶解的氧, 水体变浑浊, 故 D 错误; 故选 C。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 C。"],"tip":"真题来源：bench-化学-2021-解析版","examSource":{"title":"bench-化学-2021-解析版","year":2021,"region":"全国","examType":"（解析版）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-524dbb920c6defc466a2307c","subject":"chemistry","topicId":"chem-periodic","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2021 · 全国 · （解析版）","stem":"W 、 X 、 Y 、 Z 为原子序数依次增大的短周期主族元素, Z 的最外层电子数是 W 和 X 的最外层电子数之和, 也是 Y 的最外层电子数的 2 倍。 W 和 X 的单质常温下均为气体。下列叙述正确的是","options":[{"key":"A","text":"原子半径: Z>Y>X>W"},{"key":"B","text":"W 与 X 只能形成一种化合物"},{"key":"C","text":"Y 的氧化物为碱性氧化物, 不与强碱反应"},{"key":"D","text":"W 、 X 和 Z 可形成既含有离子键又含有共价键的化合物"}],"answer":"D","optionNotes":{"A":"错误。改正：电子层数越多的元素原子半径越大, 同周期元素原子半径依次减弱, 则原子半径: Y(A l)>Z(S)>X(N) >W(H) ， ~A 错误;","B":"错误。改正：W 为 H 元素, X 为 N 元素, 两者可形成 NH₃ 和 N₂ H₄, ~B 错误;","C":"错误。改正：Y 为 Al 元素，其氧化物为两性氧化物，可与强酸、强碱反应， C 错误;","D":"正确。W 、 X 和 Z 可形成 (NH₄ )₂ ~S 、 NH₄ HS, 两者既含有离子键又含有共价键, D 正确。 故选 D。"},"analysis":"【详解】根据上述分析可知, W 为 H 元素, X 为 N 元素, Y 为 Al 元素, Z 为 S 元素, 则 A. 电子层数越多的元素原子半径越大, 同周期元素原子半径依次减弱, 则原子半径: Y(A l)>Z(S)>X(N) >W(H) ， ~A 错误; B. W 为 H 元素, X 为 N 元素, 两者可形成 NH₃ 和 N₂ H₄, ~B 错误; C. Y 为 Al 元素，其氧化物为两性氧化物，可与强酸、强碱反应， C 错误; D. W 、 X 和 Z 可形成 (NH₄ )₂ ~S 、 NH₄ HS, 两者既含有离子键又含有共价键, D 正确。 故选 D。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 D。"],"tip":"真题来源：bench-化学-2021-解析版","examSource":{"title":"bench-化学-2021-解析版","year":2021,"region":"全国","examType":"（解析版）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-e45af76a96f963934bec1733","subject":"chemistry","topicId":"chem-sodium","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2022 · 全国 · （全国乙卷）","stem":"生活中处处有化学, 下列叙述正确的是","options":[{"key":"A","text":"HB 铅笔芯的成分为二氧化铅"},{"key":"B","text":"碳酸氢钠可做食品膨松剂"},{"key":"C","text":"青铜和黄铜是不同结构的单质铜"},{"key":"D","text":"焰火中红色来源于钠盐灼烧"}],"answer":"B","optionNotes":{"A":"错误。改正：本题标准答案为 B，“碳酸氢钠可做食品膨松剂”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"正确。碳酸氢钠不稳定, 受热易分解产生二氧化碳, 能使面团松软, 可做食品膨松剂, B 正确;","C":"错误。改正：青铜是在纯铜(紫铜)中加人锡或铅的合金, 黄铜为是由铜和锌所组成的合金, 两者均属 于混合物，不是铜单质， C 错误;","D":"错误。改正：钠元素灼烧显黄色，D 错误; 故选 B。"},"analysis":"【详解】A. 铅笔芯的主要成分为石墨，不含二氧化铅，A 错误; B. 碳酸氢钠不稳定, 受热易分解产生二氧化碳, 能使面团松软, 可做食品膨松剂, B 正确; C. 青铜是在纯铜(紫铜)中加人锡或铅的合金, 黄铜为是由铜和锌所组成的合金, 两者均属 于混合物，不是铜单质， C 错误; D. 钠元素灼烧显黄色，D 错误; 故选 B。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 B。"],"tip":"真题来源：bench-化学-2022-全国乙卷","examSource":{"title":"bench-化学-2022-全国乙卷","year":2022,"region":"全国","examType":"（全国乙卷）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-5c8ef773d22b742aa1f9da75","subject":"chemistry","topicId":"chem-redox","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2022 · 全国 · （全国甲卷）","stem":"化学与生活密切相关。下列叙述正确的是","options":[{"key":"A","text":"漂白粉与盐酸可混合使用以提高消毒效果"},{"key":"B","text":"温室气体是形成酸雨的主要物质"},{"key":"C","text":"棉花、麻和蚕丝均为碳水化合物"},{"key":"D","text":"干冰可用在舞台上制造“云雾”"}],"answer":"D","optionNotes":{"A":"错误。改正：本题标准答案为 D，“干冰可用在舞台上制造“云雾””与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：温室气体主要是指二氧化碳, 二氧化碳不是形成酸雨的主要物质, 形成酸雨的主要物质是硫氧化物、氮 氧化物等，B 错误;","C":"错误。改正：棉花、麻来源于植物, 主要成分均是纤维素, 为碳水化合物, 但蚕丝来源于动物, 主要成分是蛋白质, 蛋白质不是碳水化合物，C 错误;","D":"正确。干冰是固态的二氧化碳, 干冰升华时, 吸收大量的热, 使周围温度降低, 大量的水蒸气凝结成了小液滴, 形成 “云雾”效果，D 正确; 答案选 D。"},"analysis":"【详解】A. 漂白粉的有效成分次氯酸鿏与盐酸混合, 会发生氧化还原反应生成有毒的氯气, 两者不能混合 使用，A 错误; B. 温室气体主要是指二氧化碳, 二氧化碳不是形成酸雨的主要物质, 形成酸雨的主要物质是硫氧化物、氮 氧化物等，B 错误; C. 棉花、麻来源于植物, 主要成分均是纤维素, 为碳水化合物, 但蚕丝来源于动物, 主要成分是蛋白质, 蛋白质不是碳水化合物，C 错误; D. 干冰是固态的二氧化碳, 干冰升华时, 吸收大量的热, 使周围温度降低, 大量的水蒸气凝结成了小液滴, 形成 “云雾”效果，D 正确; 答案选 D。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 D。"],"tip":"真题来源：bench-化学-2022-全国甲卷","examSource":{"title":"bench-化学-2022-全国甲卷","year":2022,"region":"全国","examType":"（全国甲卷）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-f9e03d1e0af4b74a17f444f9","subject":"chemistry","topicId":"chem-ion","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2022 · 全国 · （全国甲卷）","stem":"能正确表示下列反应的离子方程式为 Ba²⁺+2 OH⁻+2 H⁺+SO₄²⁻=BaSO₄ +2 H₂ O","options":[{"key":"A","text":"硫化钠溶液和硝酸混合: S²⁻⁺+2 H⁺=H₂ ~S"},{"key":"B","text":"明矾溶液与过量氨水湿合: Al³⁺+4 NH₃+2 H₂ O=AlO₂⁻+4 NH₄⁺"},{"key":"C","text":"硅酸钠溶液中通人二氧化碳: SiO₃²⁻+CO₂+H₂ O=HSiO₃⁻+HCO₃⁻"},{"key":"D","text":"将等物质的量浓度的 Ba(OH)₂ 和 NH₄ HSO₄ 溶液以体积比 1: 2 混合:"}],"answer":"D","optionNotes":{"A":"错误。改正：本题标准答案为 D，“将等物质的量浓度的 Ba(OH)₂ 和 NH₄ HSO₄ 溶液以体积比 1: 2 混合:”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：明矾在水中可以电离出 Al³⁺, 可以与氨水中电离出的 OH⁻发生反应生成 Al(OH)₃, 但由于氨水的碱性较 弱，生成的 Al(OH)₃ 不能继续与弱碱发生反应，故反应的离子方程式为 Al³⁺+3 NH₃ H₂ O=Al(OH)₃ +3 NH₄⁺, B 错误;","C":"错误。改正：硅酸的酸性小于碳酸, 向硅酸钠溶液中通人二氧化碳时, 生成硅酸沉淀, 二氧化碳则根据其通人的量的 多少反应为碳酸根或碳酸氢根, 反应的离子方程式为 SiO₃²⁻+H₂ O+CO₂=H₂ SiO₃ +CO₃²⁻ (CO₂ . 少量) 或 SiO₃²⁻+2 H₂ O+2 CO₂=H₂ SiO₃ +2 HCO₃⁻ (CO₂ . 过量 ), C 错误;","D":"正确。将等物质的量浓度的 Ba(OH)₂ 与 NH₄ HSO₄ 溶液以体积比 1: 2 混合, Ba(OH)₂ 电离出的 OH⁻与 NH₄ HSO₄ 电离出的 H+ 反应生成水, Ba(OH)₂ 电离出的 Ba²⁺ 与 NH₄ HSO₄ 电离出的 SO₄²⁻ 反应生成 BaSO₄ 沉淀, 反应的 离子方程为为 Ba²⁺+2 OH⁻+2 H⁺+SO₄²⁻=BaSO₄ +2 H₂ O, D 正确; 故答案选 D。"},"analysis":"【详解】A. 硝酸具有强氧化性, 可以将 S²⁻ 氧化为 S 单质, 自身根据其浓度大小还原为 NO 或 NO₂, 反应 的离子方程式为 4 H⁺+2 NO₃⁻+S²⁻=S +2 NO₂ +2 H₂ O (浓)或 8 H⁺+2 NO₃⁻+3 ~S²⁻=3 ~S +2 NO+4 H₂ O (稀), A 错误; B. 明矾在水中可以电离出 Al³⁺, 可以与氨水中电离出的 OH⁻发生反应生成 Al(OH)₃, 但由于氨水的碱性较 弱，生成的 Al(OH)₃ 不能继续与弱碱发生反应，故反应的离子方程式为 Al³⁺+3 NH₃ H₂ O=Al(OH)₃ +3 NH₄⁺, B 错误; C. 硅酸的酸性小于碳酸, 向硅酸钠溶液中通人二氧化碳时, 生成硅酸沉淀, 二氧化碳则根据其通人的量的 多少反应为碳酸根或碳酸氢根, 反应的离子方程式为 SiO₃²⁻+H₂ O+CO₂=H₂ SiO₃ +CO₃²⁻ (CO₂ . 少量) 或 SiO₃²⁻+2 H₂ O+2 CO₂=H₂ SiO₃ +2 HCO₃⁻ (CO₂ . 过量 ), C 错误; D. 将等物质的量浓度的 Ba(OH)₂ 与 NH₄ HSO₄ 溶液以体积比 1: 2 混合, Ba(OH)₂ 电离出的 OH⁻与 NH₄ HSO₄ 电离出的 H+ 反应生成水, Ba(OH)₂ 电离出的 Ba²⁺ 与 NH₄ HSO₄ 电离出的 SO₄²⁻ 反应生成 BaSO₄ 沉淀, 反应的 离子方程为为 Ba²⁺+2 OH⁻+2 H⁺+SO₄²⁻=BaSO₄ +2 H₂ O, D 正确; 故答案选 D。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 D。"],"tip":"真题来源：bench-化学-2022-全国甲卷","examSource":{"title":"bench-化学-2022-全国甲卷","year":2022,"region":"全国","examType":"（全国甲卷）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-08d6296930a8e280dc6d7113","subject":"chemistry","topicId":"chem-chlorine","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2022 · 全国 · （全国甲卷）","stem":"Nₐ 为阿伏加德罗常数的值, 下列说法正确的是","options":[{"key":"A","text":"25^ C, 101 kPa 下, 28 ~L 氢气中质子的数目为 2.5 ~N_A"},{"key":"B","text":"2.0 ~L 1.0 ~mol L⁻¹ AlCl₃ 溶液中, Al³⁺ 的数目为 2.0 ~N_A"},{"key":"C","text":"0.20 ~mol 苯甲酸完全燃烧, 生成 CO₂ 的数目为 1.4 ~N_A"},{"key":"D","text":"电解熔融 CuCl₂, 阴极增重 6.4 ~g, 外电路中通过电子的数目为 0.10 ~N_A"}],"answer":"C","optionNotes":{"A":"错误。改正：25^ C 、 101 kPa 不是标准状况, 不能用标况下的气体摩尔体积计算氢气的物质的量, 故 A 错误;","B":"错误。改正：Al³⁺ 在溶液中会发生水解生成 Al(OH)₃, 因此 2.0 ~L 1.0 ~mol / L 的 AlCl₃ 溶液中 Al³⁺ 数目小于 2.0 ~N_A, 故 B 错误;","C":"正确。苯甲酸燃烧的化学方程式为 C₆ H₅ COOH+ 152 O₂ 点燃 = 7 CO₂+3 H₂ O, 1 ~mol 苯甲酸燃烧生成 7 molCO₂, 则 0.2 ~mol 苯甲酸完全燃烧生成 1.4 molCO₂, 数目为 1.4 ~N_A, 故 C 正确;","D":"错误。改正：电解熔融 CuCl₂ 时, 阳极反应为 2 Cl⁻-2 e⁻=Cl₂ , 阴极反应为 Cu²⁺+2 e⁻=Cu, 阴极增加的重量为 Cu 的质量, 6.4 gCu 的物质的量为 0.1 ~mol, 根据阴极反应可知, 外电路中通过电子的物质的量为 0.2 ~mol, 数目 为 0.2 ~N_A, 故 D 错误; 答案选 C。"},"analysis":"【详解】 A. 25^ C 、 101 kPa 不是标准状况, 不能用标况下的气体摩尔体积计算氢气的物质的量, 故 A 错误; B. Al³⁺ 在溶液中会发生水解生成 Al(OH)₃, 因此 2.0 ~L 1.0 ~mol / L 的 AlCl₃ 溶液中 Al³⁺ 数目小于 2.0 ~N_A, 故 B 错误; C. 苯甲酸燃烧的化学方程式为 C₆ H₅ COOH+ 152 O₂ 点燃 = 7 CO₂+3 H₂ O, 1 ~mol 苯甲酸燃烧生成 7 molCO₂, 则 0.2 ~mol 苯甲酸完全燃烧生成 1.4 molCO₂, 数目为 1.4 ~N_A, 故 C 正确; D. 电解熔融 CuCl₂ 时, 阳极反应为 2 Cl⁻-2 e⁻=Cl₂ , 阴极反应为 Cu²⁺+2 e⁻=Cu, 阴极增加的重量为 Cu 的质量, 6.4 gCu 的物质的量为 0.1 ~mol, 根据阴极反应可知, 外电路中通过电子的物质的量为 0.2 ~mol, 数目 为 0.2 ~N_A, 故 D 错误; 答案选 C。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 C。"],"tip":"真题来源：bench-化学-2022-全国甲卷","examSource":{"title":"bench-化学-2022-全国甲卷","year":2022,"region":"全国","examType":"（全国甲卷）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-754b5dff6c42bf6f2f7d8b92","subject":"chemistry","topicId":"chem-periodic","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2022 · 全国 · （全国甲卷）","stem":"Q 、 X 、 Y 、 Z 是原子序数依次增大的短周期主族元素, 其最外层电子数之和为 19 。 Q X 、 Y 、 Z 位于不 同周期, X 、 Y 相邻, Y 原子最外层电子数是 Q 原子内层电子数的 2 倍。下列说法正确的是","options":[{"key":"A","text":"非金属性: X>Q"},{"key":"B","text":"单质的熔点: X>Y"},{"key":"C","text":"简单氢化物的佛点: Z>Q"},{"key":"D","text":"最高价含氧酸的酸性: Z>Y"}],"answer":"D","optionNotes":{"A":"错误。改正：本题标准答案为 D，“最高价含氧酸的酸性: Z>Y”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：由分析可知, X 为 Al 属于金属晶体, Y 为 Si 属于原子晶体或共价晶体, 故单质熔点 Si>Al, 即 Y>X, B 错误;","C":"错误。改正：含有氢键的物质沸点升高, 由分析可知 Q 为 N 或 O 或 F, 其简单氢化物为 H₂ O 或 NH₃ 或 HF, Z 为 Cl 或 S 或 P, 其简单氢化物为 HCl 或 H₂ ~S 或 PH₃, 由于前者物质中存在分子间氢键, 而后者物质中不存在, 故沸点 Q>Z, C 错误;","D":"正确。元素的非金属性越强, 其最高价含氧酸的酸性越强, P 、 ~S 、 Cl 的非金属性均强于 Si, 因此最高价含氧 酸酸性: Z>Y ， D 正确; 故答案为: D 。"},"analysis":"【详解】 A . X 为 Al, Q 为 N 或 O 或 F, 同一周期从左往右元素非金属性依次增强, 同一主族从上往下依 次减弱，故非金属性: Q>X, A 错误; B. 由分析可知, X 为 Al 属于金属晶体, Y 为 Si 属于原子晶体或共价晶体, 故单质熔点 Si>Al, 即 Y>X, B 错误; C. 含有氢键的物质沸点升高, 由分析可知 Q 为 N 或 O 或 F, 其简单氢化物为 H₂ O 或 NH₃ 或 HF, Z 为 Cl 或 S 或 P, 其简单氢化物为 HCl 或 H₂ ~S 或 PH₃, 由于前者物质中存在分子间氢键, 而后者物质中不存在, 故沸点 Q>Z, C 错误; D. 元素的非金属性越强, 其最高价含氧酸的酸性越强, P 、 ~S 、 Cl 的非金属性均强于 Si, 因此最高价含氧 酸酸性: Z>Y ， D 正确; 故答案为: D 。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 D。"],"tip":"真题来源：bench-化学-2022-全国甲卷","examSource":{"title":"bench-化学-2022-全国甲卷","year":2022,"region":"全国","examType":"（全国甲卷）","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-21a15efe438f8e4af6f05954","subject":"chemistry","topicId":"chem-redox","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2023 · 全国 · 全国乙卷","stem":"下列应用中涉及到氧化还原反应的是","options":[{"key":"A","text":"使用明矾对水进行净化"},{"key":"B","text":"雪天道路上撒盐融雪"},{"key":"C","text":"暖贴中的铁粉遇空气放热"},{"key":"D","text":"荧光指示牌被照发光"}],"answer":"C","optionNotes":{"A":"错误。改正：本题标准答案为 C，“暖贴中的铁粉遇空气放热”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：雪天道路上撒盐融雪，是因为雪遇到盐而使其熔点降低并熔化，该过程中没有任何一种元素的化合价发生变化，因此没有涉及到氧化还原反应，B不符合题意；","C":"正确。暖贴中的铁粉遇空气放热，是因为暖贴中含有的铁粉、碳粉、氯化钠、水等物质，形成当这些物质遇到空气后形成无数微小原电池并开始工作，化学能转化为电能，无数微小原电池堆积在一起使得电能又转化为热能，该过程中铁元素和氧元素的化合价发生变化，因此，该过程涉及到氧化还原反应，C符合题意；","D":"错误。改正：荧光指示牌被照发光，是因为光被指示牌生了反射，该过程中没有任何一种元素的化合价发生变化，因此没有涉及到氧化还原反应，D不符合题意； 综上所述，本题选C。"},"analysis":"【详解】A．使用明矾对水进行净化过程中，明矾电离出的铝离子发生水解生成氢氧化铝胶体，氢氧化铝胶体粒子吸附水中的悬浮颗粒并沉降下来而水变得澄清，该过程中没有任何一种元素的化合价发生变化，因此没有涉及到氧化还原反应，A不符合题意； B．雪天道路上撒盐融雪，是因为雪遇到盐而使其熔点降低并熔化，该过程中没有任何一种元素的化合价发生变化，因此没有涉及到氧化还原反应，B不符合题意； C．暖贴中的铁粉遇空气放热，是因为暖贴中含有的铁粉、碳粉、氯化钠、水等物质，形成当这些物质遇到空气后形成无数微小原电池并开始工作，化学能转化为电能，无数微小原电池堆积在一起使得电能又转化为热能，该过程中铁元素和氧元素的化合价发生变化，因此，该过程涉及到氧化还原反应，C符合题意； D．荧光指示牌被照发光，是因为光被指示牌生了反射，该过程中没有任何一种元素的化合价发生变化，因此没有涉及到氧化还原反应，D不符合题意； 综上所述，本题选C。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 C。"],"tip":"真题来源：bench-化学-2023-全国乙卷","examSource":{"title":"bench-化学-2023-全国乙卷","year":2023,"region":"全国","examType":"全国乙卷","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-976fdcdf2a3cf5e00192a226","subject":"chemistry","topicId":"chem-periodic","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2023 · 全国 · 全国乙卷","stem":"一种矿物由短周期元素 W 、 X 、 Y 组成, 溶于稀盐酸有无色无味气体生成。 W 、 X 、 Y 原子序数依次增大。简单离子 X²⁻ 与 Y²⁺ 具有相同的电子结构。下列叙述正确的是","options":[{"key":"A","text":"X 的常见化合价有 -1 、-2"},{"key":"B","text":"原子半径大小为 Y>X>W"},{"key":"C","text":"Y X 的水合物具有两性"},{"key":"D","text":"W 单质只有 4 种同素异形体"}],"answer":"A","optionNotes":{"A":"正确。本题标准答案为 A，该表述符合真题结论。完整依据见上方解析。","B":"错误。改正：W 为 C, X 为 O, Y 为 Mg, 同主族时电子层数越多, 原子半径越大, 电子层数相同时, 原子序数越小,原子半径越大, 所以原子半径大小为: Y>W>X, B 错误;","C":"错误。改正：Y 为 Mg, X 为 O, 他们可形成 MgO, 水合物为 Mg(OH)₂, Mg(OH)₂ 只能与酸反应生成盐和水, 不能与碱反应, 所以 YX 的水合物没有两性, C 错误;","D":"错误。改正：W 为 C, 碳的同素异形体有: 金刚石、石墨、石墨烯、富勒烯、碳纳米管等, 种类不止四种, D 错误;故选 A"},"analysis":"【详解】A. X 为 O, 氧的常见价态有 -1 价和 -2 价, 如 H₂ O₂ 和 H₂ O, A 正确; B. W 为 C, X 为 O, Y 为 Mg, 同主族时电子层数越多, 原子半径越大, 电子层数相同时, 原子序数越小,原子半径越大, 所以原子半径大小为: Y>W>X, B 错误; C. Y 为 Mg, X 为 O, 他们可形成 MgO, 水合物为 Mg(OH)₂, Mg(OH)₂ 只能与酸反应生成盐和水, 不能与碱反应, 所以 YX 的水合物没有两性, C 错误; D. W 为 C, 碳的同素异形体有: 金刚石、石墨、石墨烯、富勒烯、碳纳米管等, 种类不止四种, D 错误;故选 A","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 A。"],"tip":"真题来源：bench-化学-2023-全国乙卷","examSource":{"title":"bench-化学-2023-全国乙卷","year":2023,"region":"全国","examType":"全国乙卷","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-75afcf6161c2b8db18b6736a","subject":"chemistry","topicId":"chem-redox","difficulty":4,"type":"single","qualityTier":"exam","examStyle":"2023 · 全国 · 全国甲卷","stem":"化学与生活密切相关, 下列说法正确的是()","options":[{"key":"A","text":"苯甲酸钠可作为食品防腐剂是由于其具有酸性"},{"key":"B","text":"豆浆能产生丁达尔效应是由于胶体粒子对光线的散射"},{"key":"C","text":"SO₂ 可用于丝织品漂白 由于其能氧化丝织品中有色成分"},{"key":"D","text":"维生素 C 可用作水果罐头的抗氧化剂是由于其难以被氧化"}],"answer":"B","optionNotes":{"A":"错误。改正：本题标准答案为 B，“豆浆能产生丁达尔效应是由于胶体粒子对光线的散射”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"正确。胶体具有丁达尔效应, 是因为胶体粒子对光线发生了散射; 豆浆属于胶体, 因此, 其能产生丁达尔效应是由于胶体粒子对光线的散射, B 说法正确;","C":"错误。改正：SO₂ 可用于丝织品漂白是由于其能与丝织品中有色成分化合为不稳定的无色物质, C 说法不正确;","D":"错误。改正：维生素 C 具有很强的还原性, 因此, 其可用作水果罐头的抗氧化剂是由于其容易被氧气氧化, 从而防止水果被氧化, D 说法不正确; 综上所述, 本题选 B。"},"analysis":"【详解】A. 苯甲酸钠属于强碱弱酸盐, 其水溶液呈碱性, 因此, 其可作为食品防腐剂不是由于其具有酸性, A 说法不正确; B. 胶体具有丁达尔效应, 是因为胶体粒子对光线发生了散射; 豆浆属于胶体, 因此, 其能产生丁达尔效应是由于胶体粒子对光线的散射, B 说法正确; C. SO₂ 可用于丝织品漂白是由于其能与丝织品中有色成分化合为不稳定的无色物质, C 说法不正确; D. 维生素 C 具有很强的还原性, 因此, 其可用作水果罐头的抗氧化剂是由于其容易被氧气氧化, 从而防止水果被氧化, D 说法不正确; 综上所述, 本题选 B。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 B。"],"tip":"真题来源：bench-化学-2023-全国甲卷","examSource":{"title":"bench-化学-2023-全国甲卷","year":2023,"region":"全国","examType":"全国甲卷","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-85860669c872a7d5c22df6f7","subject":"chemistry","topicId":"chem-sodium","difficulty":5,"type":"single","qualityTier":"exam","examStyle":"2023 · 全国 · 全国甲卷","stem":"实验室将粗盐提纯并配制 0.1000 ~mol L⁻¹ 的 NaCl 溶液。下列仪器中, 本实验必须用到的有() (1)天平. (2)温度计 (3)坩埚 (4)分液漏斗 (5)容量瓶 (6)烧杯 (7) 滴定管 (8)酒精灯","options":[{"key":"A","text":"(1)(2)(4)(6)"},{"key":"B","text":"(1)(4) (5) (6)"},{"key":"C","text":"(2)(3)(7)(8)"},{"key":"D","text":"(1)(5)(6) (8)"}],"answer":"D","optionNotes":{"A":"错误。改正：本题标准答案为 D，“(1)(5)(6) (8)”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","B":"错误。改正：本题标准答案为 D，“(1)(5)(6) (8)”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","C":"错误。改正：本题标准答案为 D，“(1)(5)(6) (8)”与题干条件和真题结论一致，该项不符合。完整依据见上方解析。","D":"正确。本题标准答案为 D，该表述符合真题结论。完整依据见上方解析。"},"analysis":"【详解】实验室将粗盐提纯时, 需要将其溶于一定量的水中, 然后将其中的硫酸根离子、钙离子、镁离子依次用稍过量的氯化钡溶液、碳酸钠溶液和氢氧化钠溶液除去, 该过程中有过滤操作, 需要用到烧杯、漏斗和玻璃棒; 将所得滤液加适量盐酸酸化后蒸发结晶得到较纯的食盐, 该过程要用到蒸发血和酒精灯; 用提纯后得到的精盐配制溶液的基本步骤有称量、溶解、转移、洗涤、定容、摇匀等操作, 需要用到天平、容量瓶、烧杯、玻璃棒、胶头滴管等。综上所述, 本实验必须用到的有(1)天平、(5)容量瓶、(6)烧杯、(8)酒精灯, 因此本题选 D。","steps":["先圈出题干中的限制条件、现象和“正确/不正确”等设问方向。","逐项对照物质性质、守恒关系或实验证据，排除绝对化和条件不符的结论。","原题标准答案为 D。"],"tip":"真题来源：bench-化学-2023-全国甲卷","examSource":{"title":"bench-化学-2023-全国甲卷","year":2023,"region":"全国","examType":"全国甲卷","url":"","dataset":"GaokaoCoach Full Question Bank","license":"CC BY 4.0"}},{"id":"exam-e1059cb22ac2034d838a87c4","subject":"che
